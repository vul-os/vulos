name: E2E

# Real-browser (Playwright/chromium) end-to-end tests for the Vulos OS shell.
# The suite serves the production build via `vite preview` and mocks the entire
# backend at the browser network layer (page.route('**/api/**')) — no Go server
# or database is needed, so this job is self-contained on a standard runner.

on:
  # Manual re-run. CI and E2E trigger only on branch pushes, so when a push
  # event is lost (a GitHub queue stall dropped both for one commit) there was
  # no way to re-run the gates without an empty commit.
  workflow_dispatch:
  push:
    branches:
      - main
      - "staging/**"
  pull_request:
    branches:
      - main
      - "staging/**"

jobs:
  e2e:
    name: Playwright E2E (chromium)
    runs-on: ubuntu-latest
    # The web tier lives in frontend/; every npm/npx step runs there.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Sibling packages referenced via file: in package.json (same as the CI
      # frontend-build job): @vulos/relay-client and @vulos/office-client.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Action inputs resolve from the repo root — defaults.run does not apply.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Install the chromium browser + its OS libraries.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js's webServer runs `npm run build && vite preview`,
      # so this single command builds, serves, and tests.
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
