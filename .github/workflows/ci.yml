name: CI

on:
  # Manual re-run. CI and E2E trigger only on branch pushes, so when a push
  # event is lost (a GitHub queue stall dropped both for one commit) there was
  # no way to re-run the gates without an empty commit.
  workflow_dispatch:
  push:
    branches:
      - main
      - "staging/**"
  pull_request:
    branches:
      - main
      - "staging/**"

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    # The web tier lives in frontend/ (alongside backend/ and clients/), so every
    # npm step runs there rather than at the repo root.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # setup-node resolves this from the repo root; defaults.run does not
          # apply to action inputs.
          cache-dependency-path: frontend/package-lock.json

      # src/types/wire.ts is generated from Go declarations by scripts/wiregen,
      # so checking it for drift needs a Go toolchain as well as Node.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # WIRE-01: frontend/src/types/wire.ts is generated from the Go wire types
      # (see its header). The generator and this --check mode already existed,
      # but ran in no workflow, no Makefile target and no hook — so a change to
      # a Go response struct would silently leave the TypeScript view stale, and
      # every other gate would stay green because a stale-but-valid .ts file
      # typechecks, lints and builds perfectly well.
      #
      # Verified to have teeth rather than assumed: renaming a single generated
      # interface makes this step print "is stale" and exit 1.
      - name: Check generated wire types are not stale (WIRE-01)
        run: npm run gen:wire-types:check

      # Foundation for the JS -> TS migration: checkJs is off in tsconfig.json
      # so this only checks .ts/.tsx files (src/lib/ is converted), and is
      # noEmit-only — Vite/esbuild still does all transpilation.
      # A regression here means a converted/new TS file broke type-safety.
      - name: Typecheck
        run: npm run typecheck

      # The Vitest suite (unit + RTL/MSW integration) is the frontend security
      # contract described in README § Frontend test layers — it asserts the
      # UI-level security invariants, so a regression here must break the build,
      # not be discovered later. Fully mocked backend: no Go server or DB needed.
      # Machine facts, recorded because two rounds of guessing about them were
      # wrong. The step below was killed abruptly (exit 137, under two seconds
      # after the previous package printed, no Go timeout reached), and the size
      # of the box it happened on was never in the log.
      - name: Runner size
        run: |
          nproc
          free -h
          df -h /

      - name: Test (Vitest — frontend security contract)
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend Build, Vet & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

      # `-p 2` bounds how many PACKAGES compile/run at once.
      #
      # Unbounded, this step was KILLED on the runner — exit 137, partway through
      # the package list, with no test having failed. go test defaults -p to
      # GOMAXPROCS and runs that many package binaries concurrently, each with
      # its own SQLite databases and temp trees; on a 2-core/7GB hosted runner
      # that is enough live state to be OOM-killed. A killed step reads as "the
      # backend is broken" and is nothing of the kind, which is the worst
      # possible failure mode for the gate everything else depends on.
      - name: Test
        # -p 1 and -timeout 120s. One package at a time: the kill happens within
        # two seconds of the previous package finishing, which is the signature
        # of an abrupt OOM rather than the hang the orphaned sync.test suggested,
        # and serialising is the only lever available here that bounds peak
        # memory. The timeout stays because it costs nothing and turns any real
        # hang into a stack instead of a signal.
        #
        # This step failed with exit 137 and no explanation: the runner's
        # "Complete job" phase reported `Terminate orphan process: pid (sync.test)`,
        # i.e. one package's test binary hung and was killed. Ten packages never
        # reported at all, because go test prints results in package order and
        # everything after the hung one stays buffered — so the log ends at an
        # unrelated package and reads like a crash there.
        #
        # Go's own default timeout is 10 MINUTES per package, longer than this
        # job survives, so the hang was always killed before Go could dump
        # goroutines. A bounded timeout turns an uninformative SIGKILL into a
        # panic with a full stack, which names the test and the line it is
        # blocked on.
        # A memory sampler alongside the tests, because three rounds of reasoning
        # about this failure produced three wrong answers: parallelism (-p 2 did
        # not fix it), a hung test (a 120s per-package timeout never fires), and
        # a full suite that passes in a 6GB container on this laptop.
        #
        # exit 137 is SIGKILL and the runner's cleanup names `go` and `link` as
        # orphans, so the kill lands mid-compile. Whether that is the OOM killer
        # is a question the log has never answered — nobody has looked at memory
        # while it happens. This prints used/available every ten seconds, so the
        # next failure either shows the ceiling being approached or rules memory
        # out for good.
        run: |
          cd backend
          ( while :; do
              free -m | awk '/^Mem:/{printf "[mem] host_used=%sMB host_avail=%sMB", $3, $7}'
              # CGROUP memory too. free(1) reports the HOST, and a job runs inside
              # a cgroup with its own cap — a cgroup OOM kill is a SIGKILL while
              # the host still shows gigabytes free, which is exactly the shape
              # this failure has. Five other explanations have been measured and
              # disproven; this is the one the previous instrument could not see.
              for f in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
                [ -r "$f" ] && printf " %s=%s" "$(basename $f)" "$(cat $f)"
              done
              printf "\n"
              sleep 10
            done ) &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT
          go test -p 1 -timeout 120s ./...
        # Whatever the outcome, say whether the kernel killed anything and
        # whether the cgroup recorded an OOM. memory.events counts oom and
        # oom_kill events for this job's cgroup; dmesg names the victim. Neither
        # has ever been in this log.
        timeout-minutes: 25

      - name: Why did it die (kernel + cgroup)
        if: always()
        run: |
          # RESOLVE the cgroup rather than assume /sys/fs/cgroup is it. The first
          # version of this step read the root paths and printed "(unreadable)"
          # twice — a diagnostic that produced no data, which is the same
          # failure mode as the thing it was diagnosing.
          echo "--- /proc/self/cgroup:"; cat /proc/self/cgroup 2>/dev/null || true
          CG=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup 2>/dev/null | head -1)
          echo "--- resolved cgroup path: ${CG:-<none>}"
          for base in "/sys/fs/cgroup${CG}" /sys/fs/cgroup /sys/fs/cgroup/memory; do
            for f in memory.events memory.peak memory.max memory.limit_in_bytes memory.failcnt; do
              [ -r "$base/$f" ] && { echo "== $base/$f"; cat "$base/$f"; }
            done
          done
          echo "--- (nothing above means the runner exposes no readable memory cgroup)"
          echo "--- kernel ring buffer, last 40 lines:"
          dmesg 2>/dev/null | tail -40 || echo "  (dmesg not permitted)"

      # E2E: drives the REAL compiled cmd/server binary over real HTTP — see
      # backend/e2e/realserver_test.go's package doc for what this proves that
      # every other "e2e" in the repo does not (no mocks, no in-process mux,
      # real on-disk stores, real middleware order). It is `//go:build e2e`,
      # so the `go test ./...` step above silently excludes it — this step is
      # the only thing in CI that has ever run it. It is what caught a real
      # production bug: an account replicated to a second box could not be
      # logged into there.
      #
      # Kept in this job rather than a separate one: it needs the identical
      # checkout + Go toolchain already set up above, and its own TestMain
      # builds cmd/server itself (`go build -o <tmp> ./cmd/server`, ~60-120s
      # locally) — there is no artifact from the Build step above to hand it,
      # so a separate job would just repeat the same checkout/setup-go for no
      # benefit. Timed out explicitly (both `go test -timeout` and the step's
      # own `timeout-minutes`) so a hung server process fails the job instead
      # of running out the clock silently.
      - name: Test (e2e — real server binary over real HTTP)
        run: cd backend && go test -tags e2e ./e2e/ -count=1 -timeout=5m
        timeout-minutes: 8

      # A SECOND `//go:build e2e` package, in a different directory, which the
      # path above does not match. It had never run anywhere and all three of
      # its failing tests were asserting on paths the product does not use —
      # including a negative assertion ("no storage.json after a bad
      # passphrase") that was checking a directory nothing writes, so it would
      # have passed however badly the product behaved.
      #
      # Listed explicitly rather than folded into a wildcard: `-tags e2e ./...`
      # would also re-run every ordinary package, and the point here is that a
      # tagged package is easy to miss precisely because it looks like it is
      # already covered.
      - name: Test (e2e — first-boot wizard, join, OTA staging)
        run: cd backend && go test -tags e2e ./firstboot/e2e/ -count=1 -timeout=5m
        timeout-minutes: 8

  clients-core:
    name: clients/core Build, Vet & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # clients/core is its own Go module (shared security core consumed by
      # desktop/android/ios — see clients/core/doc.go), so it gets its own
      # go-version-file/cache-dependency-path rather than backend's.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum

      - name: Build
        run: cd clients/core && go build ./...

      - name: Vet
        run: cd clients/core && go vet ./...

      # Includes the pinning mutation-coverage suite: correct-pin connects,
      # wrong-pin is rejected, an unpaired box cannot obtain a TLSConfig, and
      # a tampered pairing payload fails to pair — see clients/core/pinning_test.go.
      - name: Test
        run: cd clients/core && go test ./... -count=1

  gofmt:
    name: gofmt Check
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend/ clients/core/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files have gofmt drift:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run: gofmt -w backend/ clients/core/"
            exit 1
          fi

  image-packages:
    name: PKGSET — The Dockerfile and build.sh package lists match their manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This gate existed for months and NOTHING RAN IT — not CI, not the
      # Makefile — which is how build.sh's deploy list sat truncated (avahi,
      # dhcpcd5, wpasupplicant and openssh-server passed to `flatpak` instead of
      # apt) without anyone noticing. Runs in about a second and needs no Docker.
      - name: Check pinned apt package sets
        run: scripts/check-image-packages.sh

  licenses:
    name: LICENCES — THIRD_PARTY_NOTICES.md matches the dependency graph
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # gen-notices reads the Go module cache AND node_modules, so this job needs
      # both toolchains and both dependency trees resolved — mirroring the
      # frontend + backend jobs' clone/setup.

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve dependencies (populates the licence sources)
        run: |
          cd frontend && npm ci && cd ..
          cd backend && go mod download

      # Fails if a dependency was added/removed/bumped without regenerating the
      # notices — i.e. if we would ship an attribution file that no longer matches
      # what is actually in the image. Fix: node scripts/licensing/gen-notices.mjs
      - name: Check notices are up to date
        run: node scripts/licensing/gen-notices.mjs --check

  registry-signatures:
    name: REGISTRY-SIGN — Every registry.json entry is signed
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # VERIFY-ONLY. CI holds NO private key — not the root key, not the release
      # key. Signing is a human operation on an offline machine and the signatures
      # are committed to the repo (docs/KEY-CEREMONY.md § Custody). This job proves
      # that what was committed actually verifies against the anchor we ship.
      #
      # It fails if any entry is unsigned, tampered with, signed by a key the
      # anchor never certified, or added without running `make sign-registry`.
      - name: Verify registry signatures against the shipped trust anchor
        run: make verify-registry

      # A private key must never reach a CI runner. If one is ever committed, this
      # is where we find out — not after it has been published in a release.
      - name: Assert no private key is committed
        run: |
          if git ls-files | grep -E '\.(priv\.json|key|pem)$'; then
            echo "::error::A private key is tracked in git. Remove it and rotate the key."
            exit 1
          fi
          echo "OK — no private key material tracked in git."

  smoke-peering:
    name: SMOKE-01 — Peering Route Regression
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run peering smoke test (SMOKE-01)
        # scripts/smoke-peering.sh builds the server binary, starts it, waits
        # for /health, then probes every registered peering route and fails if
        # any returns HTTP 501 (not implemented / not wired).
        # Exits 0 when go is absent (tool-guarded) so the job never fails on a
        # misconfigured runner — it will fail loudly only on a real regression.
        run: sh scripts/smoke-peering.sh

  # SMOKE-02 (live-USB QEMU boot) was REMOVED here on 2026-08-07, and this note
  # is deliberately left in its place.
  #
  # It ran `smoke-liveusb.sh --no-build --skip-if-unavailable` and was green on
  # every single run for one reason: GitHub's runners have no QEMU, so it printed
  # an itemised skip and exited 0. The skip was well built — it named every
  # assertion it had not checked, far better than `|| true`. But the net effect
  # was a permanently-passing job, so "CI green" never meant "the image boots".
  # Two releases shipped images that did not run at all while this job was green.
  #
  # Boot coverage now lives where it actually bites: BOOT-01 in release.yml
  # installs QEMU, boots the exact .img.gz about to be published, and asserts it
  # serves /api/setup/status AND that LAN HTTPS is bound to the box's routable
  # address rather than loopback. It does NOT skip when QEMU is absent, and it
  # runs before both publish steps — a non-booting image cannot be released.
  #
  # Not reinstated per-push on purpose: a full image build is ~75 minutes per
  # architecture, a poor trade on every main push for coverage that already gates
  # the artifact at release. Run it locally when touching the boot chain:
  #   bash scripts/smoke-liveusb.sh      # live image
  #   bash scripts/baremetal-smoke.sh    # installed-to-disk image

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend, gofmt, smoke-peering, registry-signatures]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      # Clone sibling packages required by go.mod replace + npm file: deps.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pre-build frontend (frontend/dist/ is COPY'd into the Docker image)
        run: npm ci && npm run build
        working-directory: frontend

      # ── Backend: build Go binary on the runner, COPY into the Docker image ───
      # Mirroring the frontend pattern: compile on the runner, COPY the prebuilt
      # binary into the image (avoids widening the Docker build context).
      # Binaries land at bin/${GOOS}_${GOARCH}/ so the Dockerfile's
      # COPY bin/${TARGETOS}_${TARGETARCH}/ / picks up the right arch automatically.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
        env:
          GOTOOLCHAIN: auto

      - name: Pre-build Go backend (${{ matrix.platform }})
        run: |
          PLATFORM="${{ matrix.platform }}"
          GOOS="${PLATFORM%%/*}"
          GOARCH="${PLATFORM##*/}"
          # Each matrix job builds for exactly one platform, so a flat bin/ dir
          # is sufficient — the Dockerfile's backend-prebuilt stage does COPY bin/ /
          # without any per-arch subdirectory lookup.
          mkdir -p bin
          cd backend
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
            -ldflags "-s -w -X main.Version=dev" \
            -o "../bin/vulos-server" ./cmd/server
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
            -ldflags "-s -w" \
            -o "../bin/vulos-init" ./cmd/init
        env:
          GOTOOLCHAIN: auto

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # BINARY_SOURCE=prebuilt (default): the Dockerfile's backend-prebuilt stage
      # COPY's bin/${TARGETOS}_${TARGETARCH}/ — no go build inside Docker.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
