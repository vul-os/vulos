name: CI

on:
  # Manual re-run. CI and E2E trigger only on branch pushes, so when a push
  # event is lost (a GitHub queue stall dropped both for one commit) there was
  # no way to re-run the gates without an empty commit.
  workflow_dispatch:
  push:
    branches:
      - main
      - "staging/**"
      # feature/** too. Every gate in this file ran on main and staging only,
      # so the branch where the work actually happens was ungated: a full day's
      # commits went in without CI seeing any of them, and the failures that
      # were eventually found — gofmt drift, a licence file that could not be
      # generated identically on two machines, a test asserting the absence of a
      # browser on a runner that ships one — were all found by dispatching runs
      # by hand.
      #
      # The cost is one run per push on a feature branch. The alternative is
      # what just happened: discovering a day later that the branch has been red
      # the whole time.
      - "feature/**"
  pull_request:
    branches:
      - main
      - "staging/**"

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    # The web tier lives in frontend/ (alongside backend/ and clients/), so every
    # npm step runs there rather than at the repo root.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # setup-node resolves this from the repo root; defaults.run does not
          # apply to action inputs.
          cache-dependency-path: frontend/package-lock.json

      # src/types/wire.ts is generated from Go declarations by scripts/wiregen,
      # so checking it for drift needs a Go toolchain as well as Node.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # WIRE-01: frontend/src/types/wire.ts is generated from the Go wire types
      # (see its header). The generator and this --check mode already existed,
      # but ran in no workflow, no Makefile target and no hook — so a change to
      # a Go response struct would silently leave the TypeScript view stale, and
      # every other gate would stay green because a stale-but-valid .ts file
      # typechecks, lints and builds perfectly well.
      #
      # Verified to have teeth rather than assumed: renaming a single generated
      # interface makes this step print "is stale" and exit 1.
      - name: Check generated wire types are not stale (WIRE-01)
        run: npm run gen:wire-types:check

      # Foundation for the JS -> TS migration: checkJs is off in tsconfig.json
      # so this only checks .ts/.tsx files (src/lib/ is converted), and is
      # noEmit-only — Vite/esbuild still does all transpilation.
      # A regression here means a converted/new TS file broke type-safety.
      - name: Typecheck
        run: npm run typecheck

      # The Vitest suite (unit + RTL/MSW integration) is the frontend security
      # contract described in README § Frontend test layers — it asserts the
      # UI-level security invariants, so a regression here must break the build,
      # not be discovered later. Fully mocked backend: no Go server or DB needed.
      # Machine facts, recorded because two rounds of guessing about them were
      # wrong. The step below was killed abruptly (exit 137, under two seconds
      # after the previous package printed, no Go timeout reached), and the size
      # of the box it happened on was never in the log.
      - name: Runner size
        run: |
          nproc
          free -h
          df -h /

      # INTERMITTENT, and a green run does not mean solved.
      #
      # This step failed with exit 137 on every run for most of a day, then
      # passed on 2026-08-12 with NO functional change to backend/, build.sh or
      # this file since the previous failure — the only commits between were a
      # docs-citation test and a design note. Same code, different outcome.
      #
      # Confirmed within the hour: the very next run — the first triggered
      # automatically by a push, on the commit that added feature/** below —
      # failed again with the identical signature. All 118 packages reported ok,
      # then exit 137, with `go` and `link` as the only orphans. Two runs of the
      # same code minutes apart, one green and one red, so this is not a
      # regression anyone introduced and not something a bisect will find.
      #
      # Real defects were fixed while chasing it and are worth keeping: thirteen
      # process-group kills that could signal a recycled pid (internal/procgroup),
      # and two tests that leaked an Xvfb into every package that ran after them
      # (services/stream). The Xvfb orphan did disappear from the job summary
      # after those. But the final failing run had no Xvfb orphan and died
      # anyway, so whether any of it addressed THIS is unproven.
      #
      # What was ruled out by measurement, so nobody repeats it: memory (the
      # job's cgroup reported oom 0 / oom_kill 0 / oom_group_kill 0 with peak
      # 4.5GB against no limit), package parallelism (-p 2 and -p 1 both failed),
      # a hung test (a 120s per-package timeout never fired), and the packages at
      # the kill point (all pass on amd64 with xvfb, pulseaudio and chromium
      # installed).
      #
      # CORRECTION, 2026-08-12. I repeatedly wrote that "all packages report and
      # pass". They do not. Comparing the reported set against `go list ./...`
      # on a failing run leaves NINE never reported, and it is the same
      # alphabetic tail every time: services/upload, vault, webbrowser,
      # webhooks, webhost, webproxy, wifi, wine, wltoplevel. The count looked
      # complete because 118 of 121 is close enough to miscount as all of them.
      #
      # So the kill is POSITIONAL, not random — it lands after roughly 110
      # packages, in the u/v/w range — and go test is still running when it
      # happens. The added exit-code echo never printed on the failing run,
      # which proves go had not returned. The live `link` orphan fits: go was
      # linking one of the remaining packages.
      #
      # ALL NINE now run individually on amd64 with xvfb, pulseaudio and chromium
      # installed, and all nine pass. So no single package in the tail is at
      # fault, and the failure is CUMULATIVE — something the ~110 packages before
      # it leave behind, which trips when go reaches that point.
      #
      # BOTH resources are now excluded by measurement, not argument. Memory: the
      # job's cgroup reports oom 0 / oom_kill 0 / oom_group_kill 0 with peak
      # 4.5GB against no limit, and free showed ~1GB used of 15GB throughout.
      # Disk, measured at the moment a failing run ended: 85G available, 42%
      # used, with the go build cache at 802MB and the module cache at 1018MB.
      # Nothing is running out of anything.
      #
      # What remains, and it is a narrow set: the failure is inside go test (the
      # exit-code echo never printed), positional (the same nine packages never
      # report), cumulative (all nine pass individually on amd64), and leaves
      # `go` and `link` alive. No individual package, no resource limit, no
      # regression anyone introduced — it passes and fails on identical code.
      #
      # The next thing to look at is what `go` itself is doing at that point in a
      # 121-package run, not what the tests are doing.
      - name: Test (Vitest — frontend security contract)
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend Build, Vet & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

      # `-p 2` bounds how many PACKAGES compile/run at once.
      #
      # Unbounded, this step was KILLED on the runner — exit 137, partway through
      # the package list, with no test having failed. go test defaults -p to
      # GOMAXPROCS and runs that many package binaries concurrently, each with
      # its own SQLite databases and temp trees; on a 2-core/7GB hosted runner
      # that is enough live state to be OOM-killed. A killed step reads as "the
      # backend is broken" and is nothing of the kind, which is the worst
      # possible failure mode for the gate everything else depends on.
      - name: Test
        # -p 1 and -timeout 120s. One package at a time: the kill happens within
        # two seconds of the previous package finishing, which is the signature
        # of an abrupt OOM rather than the hang the orphaned sync.test suggested,
        # and serialising is the only lever available here that bounds peak
        # memory. The timeout stays because it costs nothing and turns any real
        # hang into a stack instead of a signal.
        #
        # This step failed with exit 137 and no explanation: the runner's
        # "Complete job" phase reported `Terminate orphan process: pid (sync.test)`,
        # i.e. one package's test binary hung and was killed. Ten packages never
        # reported at all, because go test prints results in package order and
        # everything after the hung one stays buffered — so the log ends at an
        # unrelated package and reads like a crash there.
        #
        # Go's own default timeout is 10 MINUTES per package, longer than this
        # job survives, so the hang was always killed before Go could dump
        # goroutines. A bounded timeout turns an uninformative SIGKILL into a
        # panic with a full stack, which names the test and the line it is
        # blocked on.
        # The memory question is settled, so the sampler is gone.
        #
        # It answered what it was for — the job's cgroup reported oom 0,
        # oom_kill 0, oom_group_kill 0 with peak 4.5GB against no limit, so
        # nothing here was ever OOM-killed. Then it became a problem of its own:
        # a background loop writing to the step's stdout keeps that pipe open
        # after go test returns, and a step whose output never closes is killed.
        # With the process-group guards in place all 119 packages now report,
        # where earlier runs stopped around 105 — so the tests finish and the
        # only thing left holding the step open was the instrument.
        # Capture go test's OWN exit code, separately from the step's.
        #
        # Every failing run shows all 118 packages reporting ok and then exit
        # 137, with the Go linker still alive among the orphans. Nobody has
        # established whether `go test` itself succeeded — if it prints exit=0
        # and the step still fails, then go finished and something else killed
        # the shell, which rules out the test run entirely and points at the
        # step's teardown. If it prints 137, the signal reached go itself.
        #
        # The explicit exit preserves failure semantics: the step still fails
        # when go does.
        run: |
          cd backend
          set +e
          # RESULT of the two-invocation experiment (previous commit): it did
          # NOT stop the kill, but it localised it far more precisely than
          # intended. Across five runs after the split, the ./services/...
          # invocation ALONE (85 packages, not 121) still dies, every time, at
          # the same boundary the unsplit run always died at: services/telephony
          # reports ok, services/upload never does. `go list ./services/...`
          # puts telephony at position 76 of 85 and upload at 77 — i.e. this is
          # NOT about a process living across 121 packages, it reproduces inside
          # 85. Two runs from just before the split (5f1d9df9, d6b3ee3a) died one
          # package earlier still, at telemetry (74) rather than telephony (76)
          # — off by one or two, not exact, which reads as a kill arriving
          # WHILE the current package's test binary runs rather than cleanly
          # between packages, i.e. jitter around a threshold rather than a
          # razor-exact boundary.
          #
          # Wall-clock time to death does NOT match that precision: 130s,
          # 214s, 217s, 218s, 222s across the same five runs — no shared
          # value, so this is not a step-silence or wall-clock timeout (those
          # would land at a constant elapsed time regardless of which package
          # is running). Time-to-death tracks nothing; PACKAGE COUNT does.
          #
          # services/upload itself is unremarkable (1172 lines, stdlib +
          # internal/ulid only, no cgo, no subprocess) and passes individually,
          # so nothing about compiling or linking IT explains a kill. Two
          # theories are left, and they make different predictions under
          # reordering:
          #   (a) COUNT: something accumulates inside the single `go` process
          #       driving this list and trips near position ~76, regardless of
          #       which packages sit there.
          #   (b) PACKAGE: something about upload..wltoplevel specifically (or
          #       about services/telephony, the one before them, which shells
          #       out to a faked `mmcli` via os/exec in its tests) triggers the
          #       kill wherever in the list it lands.
          #
          # Reversed order is the experiment that tells them apart: under (a)
          # the kill should still land ~76 packages in — now near the END of
          # this reversed list, killing packages that have always passed
          # before (e.g. signing, snapshot) while upload..wltoplevel, now near
          # the START, report fine. Under (b) upload..wltoplevel (and/or
          # telephony) fail again regardless of their new position near the
          # start. THIS IS A DIAGNOSTIC CHANGE, not a fix — it is expected to
          # still fail; what matters is reading back WHICH packages are the
          # ones that don't report.
          # RESULT of the reversal (this commit's predecessor): decisive, and it
          # rules out both remaining theories at once. Four runs on the reversed
          # ./services/... order all failed, but NOT on upload..wltoplevel —
          # those nine ran first (their original tail position) and all
          # reported ok. The kill instead landed at a different, unrelated
          # alphabetically-adjacent pair: services/signing ok, services/sandbox
          # never reports — position 20 of 85, not ~76. So it is not "the same
          # nine packages" (proven: they passed when moved) and not "a fixed
          # package count" either (77 in forward order vs 20 reversed — not
          # close). Elapsed time to death was ~31s reversed vs ~130-222s
          # forward, so not time-based either, confirming the earlier reading.
          #
          # What both orderings share: the kill always lands between two
          # packages that are ALPHABETICALLY ADJACENT IN THE ORDER GIVEN (no
          # package ever scheduled between them), right as `go` moves from a
          # package that just finished to compiling/linking/running the next
          # one. That is consistent with some OS-level resource — not memory,
          # not disk, both already excluded by measurement — accumulating at a
          # rate that depends on WHICH packages ran, not how many or how long,
          # and tripping a SIGKILL once a threshold is crossed. Candidates
          # nobody has measured yet: open file descriptors, process/thread
          # count (cgroup pids.current vs pids.max), or a system-wide (not
          # this-cgroup) memory squeeze that the job's own oom counters cannot
          # see because memory.max is "max" here — a cgroup with no ceiling
          # cannot self-report an OOM it structurally cannot trigger, but the
          # ROOT cgroup / whole VM can still be reclaimed under, and a global
          # OOM kill would land on this job's processes without showing up in
          # ITS oom_kill counter.
          #
          # A background sampler was tried once before and became a failure of
          # its own — it wrote to the STEP's own stdout, so its file
          # descriptor kept that pipe's write end open after go test returned,
          # and a step whose output never closes is itself killed. This one
          # writes ONLY to a file the step never reads from, so it cannot hold
          # the step open the same way; a later `if: always()` step reads the
          # file back, which also survives a SIGKILL of this step since the
          # file itself isn't touched by that signal.
          mkdir -p /tmp/ci-diag
          : > /tmp/ci-diag/sampler.log
          (
            while true; do
              {
                echo "== $(date -u +%H:%M:%S.%N) =="
                cat /sys/fs/cgroup/pids.current 2>/dev/null | sed 's/^/pids.current=/'
                cat /sys/fs/cgroup/pids.max 2>/dev/null | sed 's/^/pids.max=/'
                free -m | sed -n '2p' | awk '{print "mem_used_mb="$3" mem_free_mb="$4" mem_avail_mb="$7}'
                echo "nproc_procs=$(ps -e --no-headers | wc -l)"
              } >> /tmp/ci-diag/sampler.log 2>&1
              sleep 1
            done
          ) < /dev/null > /dev/null 2>&1 &
          SAMPLER_PID=$!
          disown "$SAMPLER_PID" || true

          # Trap what CAN be trapped. SIGKILL cannot be caught, but if whatever
          # ends this step sends SIGTERM/SIGINT/SIGHUP first — as an orderly
          # supervisor would — these fire and name it. Silence here means the
          # step was SIGKILLed with no warning at all, which is itself a strong
          # signal about the sender.
          trap 'echo "::warning::SIGTERM received by the test step at $(date -u +%T)"' TERM
          trap 'echo "::warning::SIGINT received by the test step at $(date -u +%T)"' INT
          trap 'echo "::warning::SIGHUP received by the test step at $(date -u +%T)"' HUP
          echo "test step pid $$ starting at $(date -u +%T)"
          go test -p 1 -timeout 120s $(go list ./services/... | tac) 2>&1 | tee /tmp/gotest-services.log
          rc1=$?
          # Everything EXCEPT services, computed rather than enumerated: an
          # enumerated list silently drops a package added at the repo root, and
          # this run is only meaningful if it covers what ./... covered.
          go test -p 1 -timeout 120s $(go list ./... | grep -v '^vulos/backend/services') 2>&1 | tee /tmp/gotest-rest.log
          rc2=$?

          kill "$SAMPLER_PID" 2>/dev/null || true
          set -e
          echo "::notice::go test exited services=${rc1} rest=${rc2}"
          [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]
        timeout-minutes: 25

      # ALWAYS, because the run that matters is the one that got SIGKILLed —
      # the sampler.log file survives that signal even though the step didn't,
      # since it was written to disk by a background process, not to the
      # step's own stdout. Tail rather than the whole file: the file grows at
      # 1 sample/sec and only the seconds right before death are informative.
      - name: Diagnostics after tests (pids/mem sampler tail, ulimits)
        if: always()
        run: |
          echo "---- ulimits ----"
          ulimit -a || true
          echo "---- last 40 sampler lines (1/sec) before step end ----"
          tail -n 200 /tmp/ci-diag/sampler.log 2>/dev/null || echo "no sampler log"

      # Disk at the moment the Test step ends, pass or fail.
      #
      # if: always() because the only numbers that matter are a failing run's. A
      # separate step rather than a background sampler: the previous sampler held
      # the step's stdout open and became a failure of its own.
      - name: Disk after tests
        if: always()
        run: |
          df -h /
          du -sh ~/.cache/go-build ~/go/pkg/mod 2>/dev/null || true

      # Did the KERNEL kill it? This is the hypothesis the earlier "memory is
      # excluded" conclusion never actually tested.
      #
      # That conclusion rested on the job's CGROUP reporting oom 0 / oom_kill 0
      # / oom_group_kill 0 with no limit set. Correct, and not the whole
      # question: a cgroup with no limit cannot report a limit breach, but the
      # runner VM still has finite physical RAM, and a system-wide OOM kill is
      # a different event from a cgroup-limit kill. Peak usage was measured at
      # 4.5 GB, which is comfortable against "no limit" and much less so
      # against a 7 GB VM that is also running the OS and the runner agent.
      #
      # dmesg settles it either way. The kernel OOM killer always logs its
      # victim ("Out of memory: Killed process ... (go)"), so a hit here names
      # the process outright, and an empty result removes the last memory
      # explanation for good instead of leaving it half-excluded.
      #
      # A separate step rather than a sampler, for the reason recorded above:
      # the previous background sampler held the step's stdout open and became
      # a failure of its own.
      # ── RESULT 2026-08-12: NOT a fixed clock. Order restored to reversed.
      #
      #   reversed:  32.17s and 32.21s, ~20 services packages reported
      #   forward:   166.88s,           most of the 85 reported
      #
      # Elapsed time depends on the work, so the fixed-timer reading is dead and
      # the "positional" reading is not rescued either: forward dies after
      # roughly 77 of 85 services packages, reversed after 20. Neither a fixed
      # time, nor a fixed count, nor a fixed package.
      #
      # What DOES fit both: something CUMULATIVE that the heavy packages consume
      # faster. Reversed order front-loads the expensive services (w/v/u —
      # webbrowser, wine, wltoplevel and friends) and dies in 32s after 20 of
      # them; forward order runs the cheap ones first and survives 167s and most
      # of the list. A per-package resource would die at the same COUNT; a clock
      # at the same TIME; a leak proportional to work does neither.
      #
      # And that reopens something recorded as closed. "Memory excluded" rests
      # partly on MemAvailable being 15 GB of 16 — but that step runs AFTER the
      # kill, once the dead process has released everything. It measures the
      # aftermath, not the moment. The dmesg check (no OOM records) is the
      # stronger half and still stands; the MemAvailable figure should not be
      # quoted as evidence of no pressure at the time of death.
      #
      # Next: sample memory DURING the run, not after. Not with a background
      # sampler holding the step's stdout — that failure is recorded above — but
      # by having the test command itself write /proc/meminfo to a file between
      # package groups, and reading that file in the existing if:always() step.
      #
      # ── EXPERIMENT RUNNING 2026-08-12: services in FORWARD order.
      #
      # The `| tac` is removed for this run only. It is the experiment named in
      # the note below, and its precondition is met: the current instrumentation
      # has now been read twice in the reversed configuration, at 32.17s and
      # 32.21s.
      #
      # Read the `Finished process ... elapsed time` figure from the runner
      # diagnostic step:
      #   ~32s again  → a fixed clock kills the step regardless of what it is
      #                 doing. Package identity is irrelevant, services/sandbox
      #                 was a coincidence of pace, and the "positional" reading
      #                 is retired along with it.
      #   clearly different → the elapsed time depends on the work, so the
      #                 timer reading is wrong and package order genuinely
      #                 matters.
      #
      # Either answer eliminates one of the two live readings, which is why this
      # is worth a deliberate order change after having argued against making
      # one casually.
      #
      # ── REREAD 2026-08-12: "positional, not package-specific" may ALSO rest
      #    on the bad ~110s measurement. A fixed 32.2s clock explains both runs.
      #
      # The reversal experiment concluded the kill follows POSITION because
      # forward order lost the last ~11 of 121 packages while reversed order
      # lost everything after ~20. That was read as "the same place in the run".
      #
      # A pure 32.2-second timer explains it at least as well, and more simply.
      # Forward order runs the fast non-services packages first and can get
      # through ~110 of them in 32 seconds; reversed order front-loads the slow
      # services packages and only manages ~20 in the same 32 seconds. Same
      # clock, different package counts — no positional rule needed.
      #
      # If that reading is right, services/sandbox being package 21 is a
      # COINCIDENCE of pace, and the note above pointing at its startup window
      # is chasing an artefact. Both readings are recorded because the evidence
      # does not yet separate them.
      #
      # The experiment that separates them is cheap and specific: get the
      # `Finished process ... elapsed time` figure for a FORWARD-order failing
      # run. If it is also ~32s, the timer explanation wins outright and package
      # identity stops mattering. That figure comes from the runner's _diag
      # Worker log, which only started being captured a few commits ago — so it
      # needs one forward-order run with the current instrumentation, not an
      # archived one.
      #
      # Recorded rather than acted on because acting on it means changing the
      # package order again, and the previous order change is exactly what
      # produced the conclusion now in doubt.
      #
      # ── POSITION CONFIRMED 2026-08-12: package 21 in the reversed list IS
      #    services/sandbox, and the kill coincides with it STARTING.
      #
      #     go list ./services/... | reversed → 18 sshkey, 19 snapshot,
      #     20 signing, 21 sandbox
      #
      # Exactly 20 packages report, through signing. So sandbox is the package
      # go test moves to at the instant the shell dies — and since the whole
      # step lives 32.2s and sandbox alone takes 10.5s when run by itself, it
      # cannot have got far. This is sandbox STARTING UP, not sandbox running
      # its tests, which narrows the window to compilation/link of sandbox.test
      # plus its first moments of execution.
      #
      # Checked while here: services/sandbox contains no pkill, pgrep, killall
      # or Getppid, and its only kill path (s.kill) targets scripts it tracks
      # itself, through the guarded procgroup.Signal. Nothing in it obviously
      # reaches outside its own children.
      #
      # Portability note for anyone reproducing locally: `tac` does not exist on
      # macOS. The workflow uses it and that is fine on ubuntu, but a local
      # reproduction needs `tail -r` or the ordering silently differs — which
      # would move the kill point and look like a failure to reproduce.
      #
      # ── DETERMINISTIC 2026-08-12: the kill lands at 32.2s, twice, to 40ms.
      #
      #     Finished process 11980 ... elapsed time 00:00:32.1700540
      #     Finished process 12613 ... elapsed time 00:00:32.2112690
      #
      # Same 20 packages reported, same orphans (go, tee, sandbox.test), on two
      # different commits.
      #
      # This kills the pid-recycling theory committed one step earlier. A
      # SIGKILL landing on a recycled pid is a race and would scatter across
      # runs; it would not repeat to within 40 milliseconds. The four unguarded
      # Process.Kill() sites found under that theory are still a genuine defect
      # and the fix stands on its own merits — but they are not this.
      #
      # A clock this precise means the run is deterministic up to the moment it
      # dies, and 20 packages in 32 seconds is a normal pace rather than a
      # stall. So the trigger is REACHING a particular point, not spending time.
      # services/sandbox is the package in flight at that point, every time.
      #
      # sandbox itself only signals through the guarded procgroup.Signal, so it
      # is not obviously the killer — but it is reproducibly what the run is
      # doing when the shell dies, and that is now the narrowest fact available.
      #
      # Worth trying next, in order of cost: run the reversed services list
      # locally but STOP after the 20th package and compare which package is
      # 21st; and have the step log `ps -o pid,ppid,pgid,comm` immediately
      # before and after the sandbox package to see what exists at that moment.
      #
      # ── RUNNER'S OWN LOG 2026-08-12: it did not kill the step, and the step
      #    lived 32 SECONDS, not the ~110 repeated throughout these notes.
      #
      # From Worker_20260812-184034-utc.log:
      #     Finished process 11980 with exit code 137, and elapsed time 00:00:32.17
      #     Force kill process on cancellation: 'False'
      # with no cancel message received.
      #
      # Two things follow, and one of them is a correction.
      #
      # 1. The runner OBSERVED the exit. Its ProcessInvoker reports a child that
      #    ended with 137; it did not initiate a kill, was not cancelling, and
      #    force-kill-on-cancellation is off. So this is not a workflow or
      #    runner configuration problem. Something else on the machine SIGKILLed
      #    the step's shell.
      #
      # 2. THE ~110s FIGURE WAS WRONG. It came from the first and last log-line
      #    timestamps of lines matching the job name, which also swept in other
      #    steps. The step's own process lived 32 seconds. That number was
      #    repeated across several of these notes and was the entire basis for
      #    the "it lands at Go's 120s -timeout" theory — a theory that was
      #    already dead on other evidence, which is the only reason the bad
      #    measurement did not cost more than it did.
      #
      # Anything reasoning from ~110s in the notes below is reasoning from a
      # measurement that does not hold. The package counts stand (20 reported),
      # and 20 packages in 32 seconds is unremarkable rather than a stall.
      #
      # ── SIGNATURE 2026-08-12: the step's SHELL is SIGKILLed; its children live
      #
      # With traps installed on TERM/INT/HUP, a failing run fires NONE of them.
      # Nothing negotiated. The step was SIGKILLed outright.
      #
      # And the cleanup list names what survived it:
      #     Terminate orphan process: pid (11935) (go)
      #     Terminate orphan process: pid (11936) (tee)
      #     Terminate orphan process: pid (16284) (sandbox.test)
      # against "test step pid 11928 starting at 18:11:00".
      #
      # So pid 11928 — the bash running this step — was killed, while the
      # processes it started kept running. Not the process group; the parent
      # alone. The job then continued into the following steps normally, so the
      # runner itself was healthy and only this step's shell died.
      #
      # That is a much narrower signature than "something kills the toolchain".
      # It rules out anything that would take the whole tree down (a cgroup
      # group-kill, a job cancellation, the VM going away) and it rules out an
      # orderly supervisor, which would have sent SIGTERM first. Combined with
      # the earlier exclusions — no OOM records, 15 GB free of 16, 85 GB disk
      # free, no Go timeout, no concurrency block — what remains is a targeted
      # SIGKILL at the step's shell from something that does not announce
      # itself.
      #
      # Worth trying next: `ps -o pid,ppid,stat,etime,comm` snapshots around the
      # kill window, and checking whether the runner's own diagnostic logs
      # (Runner_*.log under the runner's _diag directory, exposed via
      # ACTIONS_STEP_DEBUG) record a step teardown at that timestamp.
      #
      # ── CORRECTION 2026-08-12: it is NOT Go's -timeout. Measured, not argued.
      #
      # With go test's output teed to a file that survives the kill, a failing
      # run shows: /tmp/gotest-services.log holds 20 lines, and the count of
      # "test timed out" in it is ZERO. Go's per-binary timeout never fired.
      # /tmp/gotest-rest.log is absent entirely, so the second invocation never
      # started and the kill lands inside the first.
      #
      # So the step is killed EXTERNALLY at ~110s while go test is healthy and
      # mid-run, and the closeness of 109-118s to the 120s -timeout was
      # coincidence. That number should stop steering this investigation; it
      # sent me toward "sandbox has a hanging test", which the local
      # reproduction had already contradicted by passing the entire reversed
      # services order with EXIT=0.
      #
      # The note below is kept because its OTHER findings stand — sandbox is
      # the binary in flight, it never reports, and the kill is positional
      # rather than package-specific. Only its conclusion was wrong.
      #
      # ── 2026-08-12: the kill lands at Go's OWN -timeout, on services/sandbox
      #
      # Three consecutive failing runs measured end-to-end on the Test step:
      #   31618922430  109s      31616598278  112s      31615886755  118s
      # This step runs `go test -p 1 -timeout 120s`. The step dies just under
      # that figure every time, which is not a coincidence to be explained away.
      #
      # The cleanup list names the process still alive: sandbox.test. And
      # services/sandbox is NOT in the reported package list of those runs — it
      # never printed ok or FAIL. So sandbox.test is the binary IN FLIGHT when
      # the kill lands, not a leak that survived its own tests.
      #
      # That reverses the causality this investigation ran on for a long time.
      # It was read as "something kills the toolchain and leaves orphans". It
      # is better read as "services/sandbox hangs for two minutes, and
      # everything else follows from that". The orphaned `go` is simply the
      # parent of a binary that would not exit.
      #
      # It also explains the property that made this look mysterious: the kill
      # is POSITIONAL rather than tied to particular packages, because position
      # is just where the clock runs out. Reversing the package order moved the
      # kill from ~110 packages in to ~20, and the wall time barely changed.
      #
      # What is NOT yet explained: why the step reports exit 137 (SIGKILL)
      # rather than go test's ordinary timeout panic and exit 1. The timeout
      # normally prints a full goroutine dump, which would name the hang
      # outright — and that output is never seen here.
      #
      # MEASURED since: services/sandbox alone on linux/amd64 with python3
      # present (Python 3.13.5) passes in 10.5s, exit 0. It does NOT hang on its
      # own. So whatever stalls it is CONTEXTUAL — state left behind by packages
      # that ran before it in the same invocation, not anything intrinsic to
      # the package. That is consistent with all nine tail packages having
      # passed individually earlier, and it rules out the simplest reading of
      # the timeout theory rather than confirming it.
      #
      # Candidate ELIMINATED: services/stream. Running stream then sandbox in
      # one invocation on linux/amd64 gives ok 4.339s and ok 10.468s, exit 0.
      # sandbox's time is unchanged from its solo run (10.503s), so stream
      # leaves nothing behind that touches it — despite stream being the
      # obvious suspect, having leaked an Xvfb into later packages before.
      #
      # So the stall needs either a different predecessor or more of the run
      # than two packages. Note the arithmetic that constrains this: sandbox
      # takes ~10.5s normally and the kill lands at ~110s after roughly 20
      # packages, so sandbox is not merely slow in CI — it is stopped. A
      # reproduction has to produce an actual stall, not a slowdown.
      #
      # Superseded next step: run services/sandbox alone on amd64
      # with the runner's python3 present and a short -timeout, and read the
      # goroutine dump. Only ONE test in that package skips when python3 is
      # missing; GitHub runners HAVE python3, so the rest of it really executes
      # and really spawns processes.
      #
      # Excluded by measurement, so do not re-litigate: physical memory (15 GB
      # free of 16 GB at failure, no kernel OOM records), cgroup memory, disk
      # (85 GB free), the 25-minute step budget, and every individual package
      # run on its own.
      # Survive the kill. When the step is SIGKILLed the runner's captured
      # output ends wherever it ended, and anything go test wrote in its final
      # moments is simply gone. Writing to a file as well means the last words
      # are still on disk for an if:always() step to read.
      #
      # This settles a question the local reproduction sharpened. The full
      # reversed services order passes on linux/amd64 with EXIT=0, so the stall
      # needs the runner. And if Go's own -timeout were firing, it would print
      # "panic: test timed out after 2m0s" plus a full goroutine dump naming
      # what is blocked. That output has never been seen — which means EITHER
      # something external kills the step at ~110s and the closeness to the
      # 120s -timeout is coincidence, OR Go did print the dump and it died with
      # the pipe. Those are different problems and the log file tells them
      # apart.
      # Ask the RUNNER what it thinks happened. The agent writes a Worker log
      # per job under _diag, and it records step lifecycle — including a
      # teardown or a cancellation, with timestamps. If the runner killed this
      # step, that file says so and names why; if the file shows the step
      # running normally right up to the kill, the runner did NOT do it and the
      # sender is something else on the machine.
      #
      # This is the cheapest way to split those two cases, and they point in
      # completely different directions: one is a workflow/runner
      # configuration problem, the other is a process on the VM.
      - name: Runner diagnostic log around the kill
        if: always()
        run: |
          # _diag lives beside the RUNNER INSTALL, not the work tree. The first
          # version searched under $RUNNER_TEMP/.. (/home/runner/work/_temp/..)
          # and correctly reported UNKNOWN with the path it had searched — which
          # is the only reason this was a two-minute fix rather than a silent
          # "nothing found" that read as evidence of absence.
          d=""
          for cand in /home/runner/runners/*/_diag "$RUNNER_TEMP/../../_diag" \
                      "$AGENT_TOOLSDIRECTORY/../_diag" /opt/actions-runner/_diag; do
            [ -d "$cand" ] && { d="$cand"; break; }
          done
          if [ -z "$d" ]; then
            d=$(find /home/runner /opt -maxdepth 4 -type d -name _diag 2>/dev/null | head -1)
          fi
          if [ -z "$d" ]; then
            echo "UNKNOWN: no _diag directory found. Searched /home/runner/runners/*/_diag,"
            echo "  \$RUNNER_TEMP/../../_diag, \$AGENT_TOOLSDIRECTORY/../_diag,"
            echo "  /opt/actions-runner/_diag, then a find under /home/runner and /opt."
            echo "--- what IS under /home/runner (depth 1) ---"
            ls -la /home/runner 2>/dev/null | head -20
            exit 0
          fi
          echo "found _diag at $d"
          f=$(ls -t "$d"/Worker_*.log 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "UNKNOWN: _diag exists at $d but holds no Worker_*.log"
            ls -la "$d" | head -20
            exit 0
          fi
          echo "=== $f ($(wc -l < "$f") lines) ==="
          echo "--- lines mentioning kill / cancel / timeout / teardown ---"
          hits=$(grep -inE 'kill|cancel|timeout|terminat|teardown|SIGKILL|exit code' "$f" | tail -40)
          if [ -n "$hits" ]; then printf '%s\n' "$hits"; else echo "NONE matched"; fi
          echo "--- final 40 lines ---"
          tail -40 "$f"

      - name: Last words from go test (survives a killed step)
        if: always()
        run: |
          for f in /tmp/gotest-services.log /tmp/gotest-rest.log; do
            if [ -f "$f" ]; then
              echo "=== tail of $f ($(wc -l < "$f") lines) ==="
              tail -40 "$f"
              echo "=== timeout panic present in $f? ==="
              grep -c 'test timed out' "$f" || echo 0
            else
              echo "=== $f absent — the step died before that invocation began ==="
            fi
          done

      - name: Kernel log after tests (OOM killer?)
        if: always()
        run: |
          echo "--- MemAvailable / MemTotal now ---"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo || true
          echo "--- kernel OOM / kill records ---"
          # Distinguish "dmesg says nothing" from "dmesg could not be read".
          # The first version of this ended in `| tail -20 || echo ...`, and a
          # pipeline exits with TAIL's status — zero even when grep matched
          # nothing — so the fallback could never fire and an empty section
          # meant either answer. That is the same shape as a guard reporting
          # success without examining its subject, which is the defect this
          # repository keeps finding; it is not acceptable in the instrument
          # being used to rule a cause out.
          if ! raw=$(sudo dmesg 2>/dev/null); then
            echo "UNKNOWN: dmesg could not be read on this runner"
          else
            hits=$(printf '%s\n' "$raw" | grep -iE 'out of memory|oom-kill|killed process|oom_reaper' | tail -20)
            if [ -n "$hits" ]; then
              echo "OOM RECORDS FOUND:"
              printf '%s\n' "$hits"
            else
              echo "NONE: dmesg readable, no OOM records ($(printf '%s\n' "$raw" | wc -l) lines scanned)"
            fi
          fi

      - name: Test (e2e — real server binary over real HTTP)
        run: cd backend && go test -tags e2e ./e2e/ -count=1 -timeout=5m
        timeout-minutes: 8

      # A SECOND `//go:build e2e` package, in a different directory, which the
      # path above does not match. It had never run anywhere and all three of
      # its failing tests were asserting on paths the product does not use —
      # including a negative assertion ("no storage.json after a bad
      # passphrase") that was checking a directory nothing writes, so it would
      # have passed however badly the product behaved.
      #
      # Listed explicitly rather than folded into a wildcard: `-tags e2e ./...`
      # would also re-run every ordinary package, and the point here is that a
      # tagged package is easy to miss precisely because it looks like it is
      # already covered.
      - name: Test (e2e — first-boot wizard, join, OTA staging)
        run: cd backend && go test -tags e2e ./firstboot/e2e/ -count=1 -timeout=5m
        timeout-minutes: 8

  clients-core:
    name: clients/core Build, Vet & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # clients/core is its own Go module (shared security core consumed by
      # desktop/android/ios — see clients/core/doc.go), so it gets its own
      # go-version-file/cache-dependency-path rather than backend's.
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/core/go.mod
          cache-dependency-path: clients/core/go.sum

      - name: Build
        run: cd clients/core && go build ./...

      - name: Vet
        run: cd clients/core && go vet ./...

      # Includes the pinning mutation-coverage suite: correct-pin connects,
      # wrong-pin is rejected, an unpaired box cannot obtain a TLSConfig, and
      # a tampered pairing payload fails to pair — see clients/core/pinning_test.go.
      - name: Test
        run: cd clients/core && go test ./... -count=1

  gofmt:
    name: gofmt Check
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend/ clients/core/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files have gofmt drift:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run: gofmt -w backend/ clients/core/"
            exit 1
          fi

  image-packages:
    name: PKGSET — The Dockerfile and build.sh package lists match their manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This gate existed for months and NOTHING RAN IT — not CI, not the
      # Makefile — which is how build.sh's deploy list sat truncated (avahi,
      # dhcpcd5, wpasupplicant and openssh-server passed to `flatpak` instead of
      # apt) without anyone noticing. Runs in about a second and needs no Docker.
      - name: Check pinned apt package sets
        run: scripts/check-image-packages.sh

  licenses:
    name: LICENCES — THIRD_PARTY_NOTICES.md matches the dependency graph
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # gen-notices reads the Go module cache AND node_modules, so this job needs
      # both toolchains and both dependency trees resolved — mirroring the
      # frontend + backend jobs' clone/setup.

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve dependencies (populates the licence sources)
        run: |
          cd frontend && npm ci && cd ..
          cd backend && go mod download

      # Fails if a dependency was added/removed/bumped without regenerating the
      # notices — i.e. if we would ship an attribution file that no longer matches
      # what is actually in the image. Fix: node scripts/licensing/gen-notices.mjs
      - name: Check notices are up to date
        run: node scripts/licensing/gen-notices.mjs --check

  registry-signatures:
    name: REGISTRY-SIGN — Every registry.json entry is signed
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # VERIFY-ONLY. CI holds NO private key — not the root key, not the release
      # key. Signing is a human operation on an offline machine and the signatures
      # are committed to the repo (docs/KEY-CEREMONY.md § Custody). This job proves
      # that what was committed actually verifies against the anchor we ship.
      #
      # It fails if any entry is unsigned, tampered with, signed by a key the
      # anchor never certified, or added without running `make sign-registry`.
      - name: Verify registry signatures against the shipped trust anchor
        run: make verify-registry

      # A private key must never reach a CI runner. If one is ever committed, this
      # is where we find out — not after it has been published in a release.
      - name: Assert no private key is committed
        run: |
          if git ls-files | grep -E '\.(priv\.json|key|pem)$'; then
            echo "::error::A private key is tracked in git. Remove it and rotate the key."
            exit 1
          fi
          echo "OK — no private key material tracked in git."

  smoke-peering:
    name: SMOKE-01 — Peering Route Regression
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run peering smoke test (SMOKE-01)
        # scripts/smoke-peering.sh builds the server binary, starts it, waits
        # for /health, then probes every registered peering route and fails if
        # any returns HTTP 501 (not implemented / not wired).
        # Exits 0 when go is absent (tool-guarded) so the job never fails on a
        # misconfigured runner — it will fail loudly only on a real regression.
        run: sh scripts/smoke-peering.sh

  # SMOKE-02 (live-USB QEMU boot) was REMOVED here on 2026-08-07, and this note
  # is deliberately left in its place.
  #
  # It ran `smoke-liveusb.sh --no-build --skip-if-unavailable` and was green on
  # every single run for one reason: GitHub's runners have no QEMU, so it printed
  # an itemised skip and exited 0. The skip was well built — it named every
  # assertion it had not checked, far better than `|| true`. But the net effect
  # was a permanently-passing job, so "CI green" never meant "the image boots".
  # Two releases shipped images that did not run at all while this job was green.
  #
  # Boot coverage now lives where it actually bites: BOOT-01 in release.yml
  # installs QEMU, boots the exact .img.gz about to be published, and asserts it
  # serves /api/setup/status AND that LAN HTTPS is bound to the box's routable
  # address rather than loopback. It does NOT skip when QEMU is absent, and it
  # runs before both publish steps — a non-booting image cannot be released.
  #
  # Not reinstated per-push on purpose: a full image build is ~75 minutes per
  # architecture, a poor trade on every main push for coverage that already gates
  # the artifact at release. Run it locally when touching the boot chain:
  #   bash scripts/smoke-liveusb.sh      # live image
  #   bash scripts/baremetal-smoke.sh    # installed-to-disk image

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend, gofmt, smoke-peering, registry-signatures]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      # Clone sibling packages required by go.mod replace + npm file: deps.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pre-build frontend (frontend/dist/ is COPY'd into the Docker image)
        run: npm ci && npm run build
        working-directory: frontend

      # ── Backend: build Go binary on the runner, COPY into the Docker image ───
      # Mirroring the frontend pattern: compile on the runner, COPY the prebuilt
      # binary into the image (avoids widening the Docker build context).
      # Binaries land at bin/${GOOS}_${GOARCH}/ so the Dockerfile's
      # COPY bin/${TARGETOS}_${TARGETARCH}/ / picks up the right arch automatically.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
        env:
          GOTOOLCHAIN: auto

      - name: Pre-build Go backend (${{ matrix.platform }})
        run: |
          PLATFORM="${{ matrix.platform }}"
          GOOS="${PLATFORM%%/*}"
          GOARCH="${PLATFORM##*/}"
          # Each matrix job builds for exactly one platform, so a flat bin/ dir
          # is sufficient — the Dockerfile's backend-prebuilt stage does COPY bin/ /
          # without any per-arch subdirectory lookup.
          mkdir -p bin
          cd backend
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
            -ldflags "-s -w -X main.Version=dev" \
            -o "../bin/vulos-server" ./cmd/server
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
            -ldflags "-s -w" \
            -o "../bin/vulos-init" ./cmd/init
        env:
          GOTOOLCHAIN: auto

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # BINARY_SOURCE=prebuilt (default): the Dockerfile's backend-prebuilt stage
      # COPY's bin/${TARGETOS}_${TARGETARCH}/ — no go build inside Docker.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
