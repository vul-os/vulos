name: CI

on:
  push:
    branches:
      - main
      - "staging/**"
  pull_request:
    branches:
      - main
      - "staging/**"

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    name: Backend Build, Vet & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: cd backend && go build ./...

      - name: Vet
        run: cd backend && go vet ./...

      - name: Test
        run: cd backend && go test ./...

  gofmt:
    name: gofmt Check
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l backend/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files have gofmt drift:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run: gofmt -w backend/"
            exit 1
          fi

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend, gofmt]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
