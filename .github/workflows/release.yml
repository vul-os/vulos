name: Release

on:
  push:
    tags:
      - "v*"
  # Manual builds produce the SAME images via the SAME steps, but publish
  # nothing: no release, no tag required. This exists so an image can be
  # boot-tested BEFORE it is released — notably amd64, which cannot be built on
  # an arm64 developer machine (apt deadlocks under qemu-user emulation), so CI
  # is the only place it can be produced.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # The lockfile moved to frontend/ with the rest of the web tier.
          # setup-node resolves this from the repo root, so without it the step
          # fails outright: "Dependencies lock file is not found".
          cache-dependency-path: frontend/package-lock.json

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive version from the pushed tag ───────────────────────────────────
      - name: Extract version
        id: version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # Manual run: derive from package.json so downstream steps and
            # artifact names still have a coherent version.
            echo "VERSION=v$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # ── Verify tag matches package.json version ───────────────────────────────
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          PKG_VERSION="v$(node -p "require('./frontend/package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG) does not match package.json version ($PKG_VERSION)"
            echo "Update package.json version to match the tag before releasing."
            exit 1
          fi
          echo "Version check passed: $TAG == $PKG_VERSION"

      # All `go build` / `go test` / `go vet` steps below require this sibling.

      # ── The release must not ship a forgeable registry ────────────────────────
      # The repo ships a DEV trust anchor so a fresh clone verifies real signatures
      # with no flags. Its private half is derived from a published seed, so anyone
      # can sign an app for it. A box refuses these keys in prod (it would boot with
      # the App Hub dead) — this halts the build instead, so we never cut the image.
      # Same contract as netboot's os-core.roothash.sig: no founder signature, no
      # release. Run the ceremony (docs/KEY-CEREMONY.md) to make this pass.
      - name: REGISTRY-SIGN — release is signed with production keys, not the dev key
        env:
          GOTOOLCHAIN: auto
        run: make verify-registry-prod

      # ── Verify tag matches binary --version ───────────────────────────────────
      - name: Verify tag matches binary version
        env:
          GOTOOLCHAIN: auto
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          SEMVER="${TAG#v}"
          cd backend && go build \
            -ldflags "-X main.Version=${TAG}" \
            -o /tmp/vulos-check \
            ./cmd/server
          BIN_VER=$(/tmp/vulos-check --version)
          if [ "${BIN_VER}" != "${TAG}" ]; then
            echo "ERROR: binary reports version '${BIN_VER}' but tag is '${TAG}'"
            exit 1
          fi
          echo "Binary version check passed: ${TAG}"

      # ── Frontend build ────────────────────────────────────────────────────────
      # Clone siblings required by file: deps in package.json and build the
      # relay-client lib so that @vulos/relay-client subpath exports resolve.
      - name: Install npm dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── Go: test + vet ────────────────────────────────────────────────────────
      - name: Go test
        run: cd backend && go test -short ./...
        env:
          GOTOOLCHAIN: auto

      - name: Go vet
        run: cd backend && go vet ./...
        env:
          GOTOOLCHAIN: auto

      # ── Docker image (multi-arch: Go built from source inside Docker) ────────────
      # Uses BINARY_SOURCE=built so the Dockerfile's backend-built stage
      # (FROM --platform=$BUILDPLATFORM golang:trixie) handles cross-compilation:
      # Go runs natively on the amd64 builder; GOOS/GOARCH from TARGETOS/TARGETARCH
      # (set automatically by buildx) target each platform's binary.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # TAG-ONLY push. A manual run still BUILDS the image (so the
          # Dockerfile is exercised) but must not publish to ghcr — otherwise
          # a test build silently republishes :latest.
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          build-args: |
            BINARY_SOURCE=built
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build flashable bare-metal images via the tested baremetal builder ────
      # Uses the SAME builder + `build.sh --live` path that is verified to boot in
      # QEMU/UEFI locally (loop-free: mke2fs -d + mtools + systemd-boot + a squashfs
      # /overlayfs live root). amd64 builds natively; arm64 builds under
      # `--platform linux/arm64` emulation (the docker/setup-qemu-action step above
      # registers the binfmt handlers). The old hand-rolled losetup + grub path
      # never actually produced a bootable image and is gone.
      - name: Build system images
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          build_one() {
            arch="$1"; flag="$2"; label="$3"
            echo "::group::Building ${label} live image (${arch})"
            # Build the builder image FOR THIS ARCH (a plain `docker build` only
            # produces the runner's native arch, so `docker run --platform
            # linux/arm64` then fails with "Unable to find image").
            docker build --platform "linux/${arch}" -q -t "vulos-bm-builder-${arch}" \
              -f scripts/baremetal-builder.Dockerfile scripts
            # -buildvcs=false + safe.directory: the repo is bind-mounted into the
            # container as a different uid than its root, so `go build`'s VCS
            # stamping otherwise dies with "error obtaining VCS status: exit
            # status 128" (git "dubious ownership"). The version comes from the
            # tag/VERSION via ldflags, not VCS, so skipping the stamp is fine.
            docker run --rm --privileged --platform "linux/${arch}" \
              -e GOFLAGS=-buildvcs=false \
              -v "$PWD":/src -w /src "vulos-bm-builder-${arch}" \
              bash -c "git config --global --add safe.directory '*' && ./build.sh ${flag} --live /src/out-${arch}"
            sudo chown -R "$(id -un)" "out-${arch}"
            gzip -c "out-${arch}/vulos-live-${arch}.img" > "vulos-${VERSION}-${label}.img.gz"
            # build.sh names these two ways: 'vulos-amd64.tar.gz' (bare arch) but
            # 'vulos-arm64-generic-arm64.tar.gz' (arch + device). A single
            # 'vulos-${arch}-*' glob requires a hyphen after the arch, so it
            # matched arm64 and silently missed amd64 — an earlier build shipped
            # without its x86_64 rootfs even though the 593 MB tarball built
            # fine. Match both spellings, and fail loudly rather than dropping
            # an artifact.
            tb="$(find "out-${arch}" -maxdepth 1 -type f \
              \( -name "vulos-${arch}.tar.gz" -o -name "vulos-${arch}-*.tar.gz" \) \
              2>/dev/null | sort | head -1 || true)"
            if [ -z "$tb" ]; then
              echo "::error::no rootfs tarball in out-${arch}/ (expected vulos-${arch}.tar.gz or vulos-${arch}-*.tar.gz)"
              ls -la "out-${arch}" || true
              exit 1
            fi
            cp "$tb" "vulos-${VERSION}-${label}-rootfs.tar.gz"
            sudo rm -rf "out-${arch}"
            echo "::endgroup::"
          }
          build_one amd64 --amd64 x86_64
          build_one arm64 --arm64 arm64
          ls -lh vulos-*.img.gz vulos-*-rootfs.tar.gz

          # Checksums. Without these a downloader has no way to tell a truncated
          # or tampered 600 MB image from a good one — which matters more than
          # usual for an OS you flash to a boot device.
          sha256sum vulos-*.img.gz vulos-*-rootfs.tar.gz > SHA256SUMS
          # Re-verify what we just wrote, so a malformed SHA256SUMS cannot ship.
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # ── BOOT-01: the image we are about to publish must actually boot ────────
      # Until now NOTHING in CI verified this. ci.yml's SMOKE-02 job exists and
      # is green on every run, but it SKIPS: GitHub's runners have no QEMU, so
      # --skip-if-unavailable prints an itemised skip and exits 0. The skip is
      # honest and loud, but the net effect was that "CI green" never meant "the
      # image boots" — and two earlier releases shipped images that did not run
      # at all, which is the single failure this project has actually had.
      #
      # This gates the ARTIFACT rather than the source tree: it boots the exact
      # .img.gz that is about to be uploaded. amd64 only — the runner is x86_64,
      # so this is the arch it can boot without nested emulation (arm64 would be
      # emulated-inside-emulated and is covered by the maintainer's local HVF
      # run). KVM is used when the runner exposes /dev/kvm and TCG otherwise, so
      # this works either way, just slower without it.
      #
      # Deliberately NOT --skip-if-unavailable: QEMU is installed right here, so
      # a missing binary is a real failure, not an environment quirk. If this
      # step cannot boot the image, the release does not publish.
      - name: Install QEMU + OVMF for the boot gate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          qemu-system-x86_64 --version | head -1
          ls -la /usr/share/OVMF/OVMF_CODE.fd /usr/share/OVMF/OVMF_VARS.fd
          if [ -e /dev/kvm ]; then echo "KVM available — native speed"; else echo "no /dev/kvm — TCG (slower)"; fi

      - name: BOOT-01 — boot the built amd64 image and assert it serves
        timeout-minutes: 30
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          IMG=vulos-boot-test.img
          gunzip -c "vulos-${VERSION}-x86_64.img.gz" > "$IMG"

          cp /usr/share/OVMF/OVMF_VARS.fd /tmp/vars.fd
          ACCEL=tcg; [ -e /dev/kvm ] && ACCEL=kvm
          qemu-system-x86_64 \
            -machine q35 -accel "$ACCEL" -cpu max -smp 4 -m 6144 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -drive if=virtio,format=raw,file="$IMG" \
            -device virtio-vga -device qemu-xhci -device usb-kbd \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:9088-:8080,hostfwd=tcp:127.0.0.1:9443-:443 \
            -device virtio-net-pci,netdev=n0 \
            -serial file:/tmp/boot-serial.log -display none &
          QEMU_PID=$!
          trap 'kill $QEMU_PID 2>/dev/null || true' EXIT

          # /api/setup/status is the readiness signal: it is public (so no auth
          # is needed) and only answers once the server is routing. /api/health
          # is auth-gated and would 401 even on a healthy box.
          echo "waiting for the box to serve (accel=$ACCEL)…"
          for i in $(seq 1 100); do
            sleep 15
            if ! kill -0 $QEMU_PID 2>/dev/null; then
              echo "::error::BOOT-01: QEMU exited before the box served — the image does not boot"
              tail -60 /tmp/boot-serial.log || true
              exit 1
            fi
            if curl -fsS --max-time 5 http://127.0.0.1:9088/api/setup/status >/dev/null 2>&1; then
              echo "BOOT-01: HTTP 200 after ~$((i*15))s"
              BOOTED=1; break
            fi
          done
          if [ "${BOOTED:-0}" != "1" ]; then
            echo "::error::BOOT-01: the image never served /api/setup/status — refusing to publish"
            tail -80 /tmp/boot-serial.log || true
            exit 1
          fi

          # LAN HTTPS must be bound to the box's ROUTABLE address, not loopback.
          # QEMU user-mode hostfwd connects to the guest's DHCP address
          # (10.0.2.15), so if the listener regressed to 127.0.0.1 this forward
          # is refused. That regression shipped once already: a browser on a
          # plain-HTTP LAN origin is not a secure context, so crypto.subtle is
          # undefined and the whole of src/lib (master key, content sealing,
          # offline auth) cannot run at all.
          if ! curl -fsSk --max-time 20 https://127.0.0.1:9443/api/setup/status >/dev/null 2>&1; then
            echo "::error::BOOT-01: LAN HTTPS is not reachable on the box's LAN address — it bound loopback"
            exit 1
          fi
          echo "BOOT-01: LAN HTTPS reachable on the box's LAN address"

          rm -f "$IMG"

      # ── Extract CHANGELOG section for this release ───────────────────────────
      - name: Extract CHANGELOG notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Strip leading 'v' to match CHANGELOG section headers like [1.0.0]
          SEMVER="${VERSION#v}"
          # Extract the block between ## [SEMVER] and the next ## heading
          NOTES=$(awk "/^## \[${SEMVER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            # Fall back to git log between tags
            PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || echo "")
            if [ -z "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s (%h)")
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
            fi
          fi
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Manual runs get the images as workflow artifacts instead of a release,
      # so they can be downloaded and boot-tested before anything is published.
      - name: Upload images as artifacts (manual runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: vulos-images-${{ steps.version.outputs.VERSION }}
          path: |
            vulos-*.img.gz
            vulos-*-rootfs.tar.gz
            SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      # Publishing is TAG-ONLY. A manual run must never create a release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Vulos ${{ steps.version.outputs.VERSION }}
          body: |
            ## Vulos ${{ steps.version.outputs.VERSION }}

            ### Bare metal (flash to USB)

            | Platform | File | Devices |
            |----------|------|---------|
            | x86_64 | `vulos-${{ steps.version.outputs.VERSION }}-x86_64.img.gz` | PC, laptop, server |
            | ARM64 | `vulos-${{ steps.version.outputs.VERSION }}-arm64.img.gz` | Generic ARM64 (UEFI-booting SBCs and VMs) |

            > **Raspberry Pi is not covered by the ARM64 image above.** It is a
            > `generic-arm64` build: a stock `linux-image-arm64` with no
            > `config.txt`, `cmdline.txt`, or `raspi-firmware`, so Pi firmware
            > will not boot it. A Pi image is a separate target — build it
            > yourself with `sudo ./build.sh --arm64 --device rpi4`. Same for
            > PinePhone via `--device pinephone`.

            ```bash
            gunzip -c vulos-${{ steps.version.outputs.VERSION }}-x86_64.img.gz | sudo dd of=/dev/sdX bs=4M status=progress
            ```

            Or use [Balena Etcher](https://etcher.balena.io/) — drag and drop the `.img.gz` file.

            ### Verify your download

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            `SHA256SUMS` covers every image and rootfs tarball in this release.

            ### Cloud server

            ```bash
            ./build.sh --deploy YOUR_SERVER_IP --domain os.yourdomain.com
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            docker run -p 8080:8080 --shm-size=1g -v vulos-data:/root/.vulos ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Changes

            ${{ steps.changelog.outputs.NOTES }}
          files: |
            vulos-*.img.gz
            vulos-*-rootfs.tar.gz
            SHA256SUMS
            keys/trust-anchor.pub
            keys/release-cert.json
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-alpha') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
