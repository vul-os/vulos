name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive version from the pushed tag ───────────────────────────────────
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # ── Verify tag matches package.json version ───────────────────────────────
      - name: Verify tag matches package.json version
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag ($TAG) does not match package.json version ($PKG_VERSION)"
            echo "Update package.json version to match the tag before releasing."
            exit 1
          fi
          echo "Version check passed: $TAG == $PKG_VERSION"

      # All `go build` / `go test` / `go vet` steps below require this sibling.

      # ── The release must not ship a forgeable registry ────────────────────────
      # The repo ships a DEV trust anchor so a fresh clone verifies real signatures
      # with no flags. Its private half is derived from a published seed, so anyone
      # can sign an app for it. A box refuses these keys in prod (it would boot with
      # the App Hub dead) — this halts the build instead, so we never cut the image.
      # Same contract as netboot's os-core.roothash.sig: no founder signature, no
      # release. Run the ceremony (docs/KEY-CEREMONY.md) to make this pass.
      - name: REGISTRY-SIGN — release is signed with production keys, not the dev key
        env:
          GOTOOLCHAIN: auto
        run: make verify-registry-prod

      # ── Verify tag matches binary --version ───────────────────────────────────
      - name: Verify tag matches binary version
        env:
          GOTOOLCHAIN: auto
        run: |
          TAG="${{ steps.version.outputs.VERSION }}"
          SEMVER="${TAG#v}"
          cd backend && go build \
            -ldflags "-X main.Version=${TAG}" \
            -o /tmp/vulos-check \
            ./cmd/server
          BIN_VER=$(/tmp/vulos-check --version)
          if [ "${BIN_VER}" != "${TAG}" ]; then
            echo "ERROR: binary reports version '${BIN_VER}' but tag is '${TAG}'"
            exit 1
          fi
          echo "Binary version check passed: ${TAG}"

      # ── Frontend build ────────────────────────────────────────────────────────
      # Clone siblings required by file: deps in package.json and build the
      # relay-client lib so that @vulos/relay-client subpath exports resolve.
      - name: Clone vulos-relay (relay-client)
        run: git clone --depth 1 https://github.com/vul-os/vulos-relay ../vulos-relay

      - name: Clone vulos-office (office-client)
        run: git clone --depth 1 https://github.com/vul-os/vulos-office ../vulos-office

      - name: Build @vulos/relay-client lib
        run: cd ../vulos-relay/client && npm install && (npm run build:lib || npm run build)

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # ── Go: test + vet ────────────────────────────────────────────────────────
      - name: Go test
        run: cd backend && go test -short ./...
        env:
          GOTOOLCHAIN: auto

      - name: Go vet
        run: cd backend && go vet ./...
        env:
          GOTOOLCHAIN: auto

      # ── Docker image (multi-arch: Go built from source inside Docker) ────────────
      # Uses BINARY_SOURCE=built so the Dockerfile's backend-built stage
      # (FROM --platform=$BUILDPLATFORM golang:trixie) handles cross-compilation:
      # Go runs natively on the amd64 builder; GOOS/GOARCH from TARGETOS/TARGETARCH
      # (set automatically by buildx) target each platform's binary.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BINARY_SOURCE=built
            VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Build flashable bare-metal images (Debian Trixie) ────────────────────
      - name: Build system images
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          for ARCH in amd64 arm64; do
            LABEL="x86_64"
            [ "$ARCH" = "arm64" ] && LABEL="arm64"
            echo "Building ${LABEL} system image..."
            sudo ARCH=$ARCH ./build.sh --output "output-${ARCH}"

            # Create a bootable disk image from the rootfs
            IMG="vulos-${VERSION}-${LABEL}.img"
            truncate -s 4G "$IMG"
            LOOP=$(sudo losetup --find --show "$IMG")
            sudo parted "$LOOP" mklabel gpt
            sudo parted "$LOOP" mkpart primary ext4 1MiB 100%
            sudo partprobe "$LOOP"
            sudo mkfs.ext4 -L vulos "${LOOP}p1"
            MNT=$(mktemp -d)
            sudo mount "${LOOP}p1" "$MNT"
            sudo cp -a "output-${ARCH}/." "$MNT/"
            if [ "$ARCH" = "amd64" ]; then
              sudo grub-install --target=x86_64-efi --boot-directory="$MNT/boot" --efi-directory="$MNT/boot/efi" --removable "$LOOP" 2>/dev/null || true
              sudo grub-install --target=i386-pc --boot-directory="$MNT/boot" "$LOOP" 2>/dev/null || true
            fi
            sudo umount "$MNT"
            sudo losetup -d "$LOOP"
            rmdir "$MNT"
            gzip "$IMG"
            rm -rf "output-${ARCH}"
          done

          ls -lh vulos-*.img.gz

      # ── Extract CHANGELOG section for this release ───────────────────────────
      - name: Extract CHANGELOG notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Strip leading 'v' to match CHANGELOG section headers like [1.0.0]
          SEMVER="${VERSION#v}"
          # Extract the block between ## [SEMVER] and the next ## heading
          NOTES=$(awk "/^## \[${SEMVER}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            # Fall back to git log between tags
            PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p' || echo "")
            if [ -z "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:"- %s (%h)")
            else
              NOTES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
            fi
          fi
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Vulos ${{ steps.version.outputs.VERSION }}
          body: |
            ## Vulos ${{ steps.version.outputs.VERSION }}

            ### Bare metal (flash to USB)

            | Platform | File | Devices |
            |----------|------|---------|
            | x86_64 | `vulos-${{ steps.version.outputs.VERSION }}-x86_64.img.gz` | PC, laptop, server |
            | ARM64 | `vulos-${{ steps.version.outputs.VERSION }}-arm64.img.gz` | Raspberry Pi, Pine64, Rock64 |

            ```bash
            gunzip -c vulos-${{ steps.version.outputs.VERSION }}-x86_64.img.gz | sudo dd of=/dev/sdX bs=4M status=progress
            ```

            Or use [Balena Etcher](https://etcher.balena.io/) — drag and drop the `.img.gz` file.

            ### Cloud server

            ```bash
            ./build.sh --deploy YOUR_SERVER_IP --domain os.yourdomain.com
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            docker run -p 8080:8080 --shm-size=1g -v vulos-data:/root/.vulos ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ```

            ### Changes

            ${{ steps.changelog.outputs.NOTES }}
          files: |
            vulos-*.img.gz
            keys/trust-anchor.pub
            keys/release-cert.json
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-alpha') || contains(steps.version.outputs.VERSION, '-beta') || contains(steps.version.outputs.VERSION, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
