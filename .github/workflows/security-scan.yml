# Security scanning workflow — MISC-04
#
# Runs on every pull request targeting main.  Three parallel jobs cover the
# full dependency + container attack surface:
#
#   go-vuln   — govulncheck scans Go module dependencies in backend/
#   npm-audit — npm audit flags high/critical advisories in the JS frontend
#   trivy     — Trivy scans the built Docker image for OS and app-layer CVEs
#
# IGNORE MECHANISMS
# ─────────────────
# • Go / govulncheck
#     Create backend/.govulncheck-ignore containing vuln IDs (one per line,
#     lines starting with # are comments). govulncheck does not have a native
#     allowlist file, so a wrapper script reads the file and post-filters
#     results.  Example entry:
#       GO-2024-1234   # tracked in issue #99, not reachable in our code
#
# • npm audit
#     Add advisory IDs to a top-level .npmauditignore JSON file or use the
#     "overrides" / "resolutions" fields in package.json.  The step uses
#     `npm audit --audit-level=high`; raise the level to "critical" if you
#     only want to block on the most severe findings.
#     To temporarily silence a known advisory while a fix lands upstream:
#       npm audit fix --dry-run    # confirm scope
#       # then add the advisory number to .npmauditignore (see below)
#
# • Trivy (container scan)
#     Add CVE IDs or severity classes to .trivyignore at the repo root.
#     Format: one CVE-ID per line; comments start with #.  Example:
#       CVE-2024-12345  # false positive — package not installed at runtime
#     Full syntax: https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/#trivyignore
#
# SEVERITY THRESHOLDS
# ───────────────────
# • govulncheck: fails on any vulnerability found (all severities)
# • npm audit:   --audit-level=high  (blocks on HIGH and CRITICAL)
# • Trivy:       --severity HIGH,CRITICAL
#
# Adjust these per-job as project policy evolves.

name: Security Scan

on:
  pull_request:
    branches: [main]

# Read-only token is enough for all three scanning jobs.
permissions:
  contents: read

jobs:
  # ── 1. Go dependency vulnerability scan ─────────────────────────────────────
  #
  # THIS REPO HAS MORE THAN ONE GO MODULE. `backend` is the obvious one;
  # `clients/core` (module `vulos/clients/core`) is the shared security core
  # consumed by desktop/android/ios — see clients/core/doc.go — and ci.yml
  # already gives it its own build/vet/test job for exactly that reason.
  #
  # This scan used to run only in backend/, so clients/core was never scanned
  # by anything. It was Trivy's filesystem scan — which walks every go.mod in
  # the tree rather than one module — that surfaced x/net CVE-2026-46600 there
  # on 2026-08-13, and only because Trivy itself had just been repaired (it had
  # been failing on a missing .trivyignore and scanning nothing at all). Two
  # blind gates covering for each other is not redundancy.
  #
  # The matrix is the guard: adding a Go module to this repo without adding it
  # here means it goes unscanned, and nothing will say so. If a third module
  # appears, it belongs in this list.
  go-vuln:
    name: Go Vulnerability Scan (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Advisory gate: report findings without blocking the merge.
    continue-on-error: true
    strategy:
      # One module's findings must not cancel the other's scan.
      fail-fast: false
      matrix:
        module: [backend, clients/core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Each module pins its own toolchain; read it from the module being
          # scanned rather than always from backend's.
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # govulncheck is the official Go vulnerability scanner maintained by the
      # Go security team.  It checks both direct and transitive dependencies
      # against the Go vulnerability database (vuln.go.dev).
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Run from the module root so it is resolved correctly.
        # Exit code 3 = vulnerabilities found (govulncheck convention).
        # IGNORE: add vuln IDs (e.g. GO-2024-1234) to <module>/.govulncheck-ignore,
        #         one per line; lines starting with # are treated as comments.
        #         The ignore list is PER-MODULE — suppressing a finding in
        #         backend must not silently suppress the same ID in clients/core,
        #         where the reachable call path may be entirely different.
        run: |
          cd "${{ matrix.module }}"

          RAW_OUTPUT=$(govulncheck ./... 2>&1) || EXIT_CODE=$?
          echo "$RAW_OUTPUT"

          # Apply ignore list if present
          IGNORE_FILE=".govulncheck-ignore"
          if [ -f "$IGNORE_FILE" ]; then
            IGNORED=$(grep -v '^\s*#' "$IGNORE_FILE" | grep -v '^\s*$' | tr '\n' '|' | sed 's/|$//')
            if [ -n "$IGNORED" ] && echo "$RAW_OUTPUT" | grep -qE "($IGNORED)"; then
              echo ""
              echo "NOTE: Some findings suppressed by $IGNORE_FILE — review periodically."
              # Re-run filtering: if all remaining lines after removing ignored IDs
              # indicate no vulnerabilities, override the exit code.
              FILTERED=$(echo "$RAW_OUTPUT" | grep -vE "($IGNORED)" || true)
              if ! echo "$FILTERED" | grep -q "^Vulnerability #"; then
                echo "All vulnerabilities are in the ignore list. Passing."
                exit 0
              fi
            fi
          fi

          exit ${EXIT_CODE:-0}

  # ── 2. npm dependency audit ──────────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    # npm-only job; the web tier lives in frontend/.
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-latest
    # Advisory gate: report findings without blocking the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # npm install (not ci) purely so this advisory scan never fails on a
        # lockfile/platform mismatch — the lockfile itself is now generated on
        # linux, so `npm ci` is the norm everywhere else.
        run: npm install --no-audit --no-fund

      # Fails on HIGH and CRITICAL advisories.
      # To silence a known advisory while a fix is pending upstream:
      #   1. Confirm the advisory ID from `npm audit --json`
      #   2. Add it to .npmauditignore at the repo root (JSON array):
      #        [1234567, 1234568]
      #   3. Document the reason and a review date in a comment above the entry.
      - name: Run npm audit
        run: |
          AUDIT_OUTPUT=$(npm audit --audit-level=high --json 2>&1) || AUDIT_EXIT=$?
          echo "$AUDIT_OUTPUT" | npx --yes audit-filter .npmauditignore 2>/dev/null \
            || npm audit --audit-level=high

  # ── 3. Container image CVE scan (Trivy) ─────────────────────────────────────
  trivy:
    name: Container CVE Scan (Trivy)
    runs-on: ubuntu-latest
    # Advisory gate: report findings without blocking the merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan of the source tree + dependencies (OS + library CVEs).
      # A filesystem scan avoids coupling this quick security gate to the
      # Docker image build (which uses sibling build-contexts); the full image
      # is built and tested in ci.yml.
      #
      # IGNORE: Create .trivyignore at the repo root.  One CVE-ID per line.
      # Comments start with #.  Full syntax docs:
      #   https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/#trivyignore
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
