<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme bootstrap — runs before first paint so there is no flash of the
         wrong theme. Reads the persisted choice (light | dark | system),
         resolves System against the OS preference, and stamps data-theme on
         <html>. Mirrors the marketing site so the console matches vulos.org. -->
    <script>
      (function () {
        var KEY = 'vulos-theme';
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function get() {
          try { return localStorage.getItem(KEY) || 'dark'; } catch (e) { return 'dark'; }
        }
        function resolve(mode) {
          if (mode === 'light' || mode === 'dark') return mode;
          return (mq && mq.matches) ? 'dark' : 'light';
        }
        function stamp(mode) {
          var t = resolve(mode);
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#fdfcfa' : '#0c0c0c');
        }
        function set(mode) {
          try { localStorage.setItem(KEY, mode); } catch (e) {}
          stamp(mode);
          try { window.dispatchEvent(new CustomEvent('vulostheme', { detail: mode })); } catch (e) {}
        }
        if (mq) {
          var onChange = function () { if (get() === 'system') stamp('system'); };
          if (mq.addEventListener) mq.addEventListener('change', onChange);
          else if (mq.addListener) mq.addListener(onChange);
        }
        stamp(get());
        window.__vulosTheme = { get: get, set: set, resolve: resolve };
      })();
    </script>

    <title>Vulos — Management Console</title>
    <meta name="description" content="The Vulos management control plane — self-hosted, sovereign, open source." />
    <meta name="theme-color" content="#0c0c0c" />
    <script type="module" crossorigin src="/console/assets/index-DsZB-fa3.js"></script>
    <link rel="stylesheet" crossorigin href="/console/assets/index-CqwVcmnj.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
