<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column}
.chat-wrap{display:flex;flex-direction:column;height:100vh}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#111;border-bottom:1px solid #222;flex-shrink:0}
.chat-title{font-size:14px;font-weight:600;color:#e5e5e5}
.chat-status{font-size:11px;color:#666}
.chat-status.ok{color:#4ade80}
.chat-status.err{color:#f87171}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.chat-empty{color:#555;font-size:14px;text-align:center;margin:auto}
.bubble{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.bubble-user{align-self:flex-end;background:#1e40af;color:#e5e5e5;border-bottom-right-radius:4px}
.bubble-assistant{align-self:flex-start;background:#1a1a1a;color:#d4d4d4;border-bottom-left-radius:4px}
.bubble-error{align-self:flex-start;background:#1a0a0a;color:#f87171;border-bottom-left-radius:4px}
.chat-form{display:flex;gap:8px;padding:10px 12px;background:#111;border-top:1px solid #222;flex-shrink:0}
.chat-form input{flex:1;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:8px 12px;color:#e5e5e5;font-size:13px;outline:none}
.chat-form input:focus{border-color:#555}
.chat-form input:disabled{opacity:0.5;cursor:not-allowed}
.chat-form button{background:#333;border:none;border-radius:8px;padding:8px 14px;color:#e5e5e5;font-size:13px;cursor:pointer;white-space:nowrap}
.chat-form button:hover:not(:disabled){background:#444}
.chat-form button:disabled{opacity:0.4;cursor:not-allowed}
#chat-cancel{background:#2a1a1a;color:#f87171}
#chat-cancel:hover:not(:disabled){background:#3a2a2a}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { mount } from './src/components/Chat.js'
mount(document.getElementById('app'))
</script>
</body>
</html>
