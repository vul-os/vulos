<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Social: rose tile -->
  <rect width="64" height="64" rx="14" fill="#881337"/>
  <!-- Primary speech bubble (larger, bottom-right) -->
  <rect x="20" y="24" width="30" height="20" rx="6" fill="#4c0519" stroke="#fda4af" stroke-width="1.5"/>
  <!-- Bubble tail bottom-left -->
  <path d="M26 44 L22 50 L32 44 Z" fill="#4c0519" stroke="#fda4af" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Chat dots inside bubble -->
  <circle cx="28" cy="34" r="2.5" fill="#fda4af"/>
  <circle cx="35" cy="34" r="2.5" fill="#fda4af"/>
  <circle cx="42" cy="34" r="2.5" fill="#fda4af"/>
  <!-- Secondary speech bubble (smaller, top-left overlapping) -->
  <rect x="13" y="14" width="22" height="15" rx="5" fill="#6b0d24" stroke="#fb7185" stroke-width="1.5"/>
  <!-- Secondary tail top-right -->
  <path d="M31 29 L35 33 L28 29 Z" fill="#6b0d24" stroke="#fb7185" stroke-width="1" stroke-linejoin="round"/>
  <!-- Dot in secondary bubble -->
  <circle cx="20" cy="21" r="2" fill="#fda4af" opacity="0.8"/>
  <circle cx="26" cy="21" r="2" fill="#fda4af" opacity="0.8"/>
</svg>
