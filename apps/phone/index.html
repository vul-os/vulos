<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Phone</title>
<link rel="stylesheet" href="vulos-tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* phone-specific dim status backgrounds */
:root{--green-dim:#14532d;--red-dim:#450a0a;--blue-dim:#1e3a5f;--surface2:#161616}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:56px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex-shrink:0}
.sidebar .nav-btn{width:40px;height:40px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.sidebar .nav-btn:hover{background:var(--surface3);color:var(--text)}
.sidebar .nav-btn.active{background:var(--green-dim);color:var(--green)}
.sidebar .spacer{flex:1}
.main{flex:1;display:flex;overflow:hidden}
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex}

/* ===== MESSAGES ===== */
#view-messages{flex-direction:row}
.thread-list{width:280px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.thread-list .list-header{padding:10px 12px 6px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.thread-list .list-header h2{font-size:15px;font-weight:600}
.thread-list .search-wrap{position:relative}
.thread-list .search-wrap input{width:100%;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px 8px 5px 28px;color:var(--text);font-size:12px;outline:none}
.thread-list .search-wrap input:focus{border-color:#444}
.thread-list .search-wrap .si{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.threads-scroll{flex:1;overflow-y:auto}
.thread-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.thread-item:hover{background:var(--surface2)}
.thread-item.active{background:var(--surface3)}
.thread-item .avatar{width:36px;height:36px;border-radius:50%;background:var(--green-dim);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.thread-item .info{flex:1;min-width:0}
.thread-item .info .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-item .info .preview{color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.thread-item .meta{text-align:right;flex-shrink:0}
.thread-item .meta .time{color:var(--text3);font-size:10px}
.thread-item .meta .badge{background:var(--green);color:#000;border-radius:10px;font-size:10px;font-weight:700;padding:1px 5px;margin-top:2px;display:none}
.thread-item.unread .meta .badge{display:block}
.thread-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px}

/* Thread view */
.thread-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.thread-view .thread-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.thread-view .thread-header .avatar{width:32px;height:32px;border-radius:50%;background:var(--green-dim);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.thread-view .thread-header .name{font-weight:600;font-size:14px}
.thread-view .thread-header .number{color:var(--text2);font-size:11px}
.thread-view .thread-header .actions{margin-left:auto;display:flex;gap:4px}
.thread-view .thread-header .actions button{background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:5px 10px;color:var(--text2);cursor:pointer;font-size:12px}
.thread-view .thread-header .actions button:hover{color:var(--text)}
.messages-scroll{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.msg-bubble{max-width:70%;padding:8px 12px;border-radius:var(--radius-lg);font-size:13px;line-height:1.4;word-break:break-word}
.msg-bubble.incoming{background:var(--surface3);color:var(--text);border-bottom-left-radius:4px;align-self:flex-start}
.msg-bubble.outgoing{background:var(--green-dim);color:var(--green);border-bottom-right-radius:4px;align-self:flex-end}
.msg-bubble .ts{font-size:10px;opacity:.5;margin-top:3px}
.msg-date-sep{text-align:center;color:var(--text3);font-size:10px;padding:4px 0}
.compose{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:13px;resize:none;outline:none;min-height:38px;max-height:120px;font-family:inherit;line-height:1.4}
.compose textarea:focus{border-color:#444}
.compose .send-btn{width:38px;height:38px;background:var(--green);color:#000;border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:opacity .15s}
.compose .send-btn:disabled{opacity:.4;cursor:not-allowed}
.no-thread{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);flex-direction:column;gap:8px}
.no-thread .icon{font-size:40px;opacity:.3}

/* ===== DIALER ===== */
#view-dialer{flex-direction:column;max-width:420px;margin:0 auto;width:100%}
.dialer-wrap{display:flex;flex-direction:column;flex:1;overflow:hidden}
.dialer-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.dialer-tabs .tab{flex:1;padding:10px;text-align:center;cursor:pointer;color:var(--text2);font-size:13px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.dialer-tabs .tab.active{color:var(--green);border-bottom-color:var(--green)}
.dialer-panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.dialer-panel.active{display:flex}

/* Numpad */
.numpad-wrap{display:flex;flex-direction:column;flex:1;padding:12px;gap:0}
.display{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;text-align:center;font-size:28px;letter-spacing:3px;font-weight:300;min-height:60px;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.display .cursor{display:inline-block;width:1px;height:1.2em;background:var(--green);animation:blink 1s step-end infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.key{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 0;text-align:center;cursor:pointer;user-select:none;transition:background .1s}
.key:hover{background:var(--surface3)}
.key:active{background:var(--surface2)}
.key .digit{font-size:20px;font-weight:500;display:block}
.key .sub{font-size:9px;color:var(--text3);letter-spacing:1px;display:block;min-height:12px}
.call-actions{display:flex;gap:8px;align-items:center;justify-content:center;padding:4px 0}
.call-btn{width:56px;height:56px;border:none;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.call-btn.green{background:var(--green);color:#000}
.call-btn.red{background:var(--red);color:#fff}
.call-btn.grey{background:var(--surface3);color:var(--text2)}
.call-btn:hover{opacity:.85}
.call-btn:disabled{opacity:.4;cursor:not-allowed}

/* Call history */
.history-list{flex:1;overflow-y:auto}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.history-item:hover{background:var(--surface2)}
.history-item .ci{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.history-item .ci.incoming{background:var(--green-dim)}
.history-item .ci.outgoing{background:var(--blue-dim)}
.history-item .ci.missed{background:var(--red-dim)}
.history-item .hinfo{flex:1;min-width:0}
.history-item .hinfo .hnum{font-size:13px;font-weight:500}
.history-item .hinfo .htype{font-size:11px;color:var(--text2)}
.history-item .htime{color:var(--text3);font-size:10px}
.history-item .redial{background:none;border:none;color:var(--green);cursor:pointer;font-size:16px;padding:4px;border-radius:4px}
.history-item .redial:hover{background:var(--green-dim)}
.history-empty{padding:24px;text-align:center;color:var(--text3);font-size:13px}
.history-unavail{padding:16px;text-align:center;background:var(--surface);margin:12px;border-radius:var(--radius);color:var(--text2);font-size:13px;border:1px solid var(--border)}

/* In-call screen */
#incall-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:24px}
#incall-overlay.active{display:flex}
#incall-overlay .caller{font-size:28px;font-weight:300;letter-spacing:1px}
#incall-overlay .call-state{color:var(--text2);font-size:14px}
#incall-overlay .incall-btns{display:flex;gap:20px;margin-top:8px}
#incall-overlay .incall-btn{width:60px;height:60px;border:none;border-radius:50%;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
#incall-overlay .incall-btn .label{font-size:9px;color:inherit;opacity:.7}
#incall-overlay .incall-btn.hangup{background:var(--red);color:#fff}
#incall-overlay .incall-btn.mute{background:var(--surface3);color:var(--text)}
#incall-overlay .incall-btn.mute.on{background:var(--yellow);color:#000}
#incall-overlay .incall-btn.dtmf-toggle{background:var(--surface3);color:var(--text)}
#incall-overlay .dtmf-pad{display:none;grid-template-columns:repeat(3,1fr);gap:8px;width:220px}
#incall-overlay .dtmf-pad.show{display:grid}
#incall-overlay .dtmf-key{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center;cursor:pointer;font-size:16px;font-weight:500}
#incall-overlay .dtmf-key:hover{background:var(--surface3)}

/* Incoming call banner */
#incoming-banner{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:900;background:var(--surface);border:1px solid var(--green);border-radius:var(--radius-lg);padding:14px 20px;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:280px;max-width:360px}
#incoming-banner.active{display:block}
#incoming-banner .banner-inner{display:flex;flex-direction:column;gap:10px;align-items:center}
#incoming-banner .banner-inner .caller-label{font-size:12px;color:var(--text2)}
#incoming-banner .banner-inner .caller-num{font-size:18px;font-weight:600}
#incoming-banner .banner-inner .banner-btns{display:flex;gap:16px}
#incoming-banner .banner-btn{width:48px;height:48px;border:none;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}
#incoming-banner .banner-btn.answer{background:var(--green);color:#000}
#incoming-banner .banner-btn.decline{background:var(--red);color:#fff}

/* Status bar */
#ws-status{position:fixed;bottom:6px;right:8px;font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px}
#ws-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
#ws-dot.connected{background:var(--green)}
#ws-dot.error{background:var(--red)}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar nav -->
  <nav class="sidebar">
    <button class="nav-btn active" id="nav-messages" onclick="showView('messages')" title="Messages">💬</button>
    <button class="nav-btn" id="nav-dialer" onclick="showView('dialer')" title="Dialer">📞</button>
  </nav>

  <div class="main">

    <!-- ===== MESSAGES VIEW ===== -->
    <div class="view active" id="view-messages">
      <div class="thread-list">
        <div class="list-header">
          <h2>Messages</h2>
          <div class="search-wrap">
            <span class="si">🔍</span>
            <input type="text" id="msg-search" placeholder="Search messages..." oninput="searchMessages()">
          </div>
        </div>
        <div class="threads-scroll" id="threads-scroll">
          <div class="thread-empty" id="threads-empty">Loading threads…</div>
        </div>
      </div>

      <div class="thread-view" id="thread-view">
        <div class="no-thread" id="no-thread">
          <div class="icon">💬</div>
          <div>Select a conversation</div>
        </div>
        <!-- populated when thread selected -->
      </div>
    </div>

    <!-- ===== DIALER VIEW ===== -->
    <div class="view" id="view-dialer">
      <div class="dialer-wrap">
        <div class="dialer-tabs">
          <div class="tab active" onclick="showDialerTab('numpad')">Keypad</div>
          <div class="tab" onclick="showDialerTab('history')">Recents</div>
        </div>
        <div class="dialer-panel active" id="panel-numpad">
          <div class="numpad-wrap">
            <div class="display" id="dial-display"><span id="dial-text"></span><span class="cursor" id="dial-cursor"></span></div>
            <div class="numpad" id="numpad"></div>
            <div class="call-actions">
              <button class="call-btn grey" id="del-btn" onclick="dialDelete()" title="Delete">⌫</button>
              <button class="call-btn green" id="call-btn" onclick="placeCall()" title="Call">📞</button>
            </div>
          </div>
        </div>
        <div class="dialer-panel" id="panel-history">
          <div id="history-content"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- In-call overlay -->
<div id="incall-overlay">
  <div class="caller" id="incall-caller">Unknown</div>
  <div class="call-state" id="incall-state">Calling…</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
    <div class="incall-btns">
      <button class="incall-btn mute" id="mute-btn" onclick="toggleMute()">🎙️<span class="label">Mute</span></button>
      <button class="incall-btn hangup" onclick="hangUp()">📵<span class="label">End</span></button>
      <button class="incall-btn dtmf-toggle" onclick="toggleDTMF()">⌨️<span class="label">DTMF</span></button>
    </div>
    <div class="dtmf-pad" id="dtmf-pad"></div>
  </div>
</div>

<!-- Incoming call banner -->
<div id="incoming-banner">
  <div class="banner-inner">
    <div class="caller-label">Incoming call</div>
    <div class="caller-num" id="banner-caller">Unknown</div>
    <div class="banner-btns">
      <button class="banner-btn decline" onclick="declineCall()" title="Decline">📵</button>
      <button class="banner-btn answer" onclick="answerCall()" title="Answer">📞</button>
    </div>
  </div>
</div>

<!-- WS status -->
<div id="ws-status"><div id="ws-dot"></div><span id="ws-label">Connecting…</span></div>

<script>
'use strict';

// ─── Config ───────────────────────────────────────────────────────────────────
const API = ''; // same origin; backend at /api/telephony/*
const WS_URL = (() => {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return `${proto}://${location.host}/api/telephony/ws`;
})();

// ─── State ────────────────────────────────────────────────────────────────────
let threads = [];
let activeThread = null;
let messages = [];
let ws = null;
let wsReconnectTimer = null;
let callState = null; // null | {number, state}
let muted = false;
let callTimer = null;
let callSeconds = 0;
let voiceAvailable = true;
let searchQuery = '';

// T9-style numpad keys
const KEYS = [
  ['1',''],['2','ABC'],['3','DEF'],
  ['4','GHI'],['5','JKL'],['6','MNO'],
  ['7','PQRS'],['8','TUV'],['9','WXYZ'],
  ['*',''],['0','+'],['#',''],
];

// ─── Init ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildNumpad();
  buildDTMFPad();
  loadThreads();
  connectWS();
});

// ─── View routing ─────────────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
  if (id === 'dialer') loadCallHistory();
}

function showDialerTab(tab) {
  document.querySelectorAll('.dialer-tabs .tab').forEach((t, i) => {
    t.classList.toggle('active', ['numpad','history'][i] === tab);
  });
  document.querySelectorAll('.dialer-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'history') loadCallHistory();
}

// ─── WebSocket ────────────────────────────────────────────────────────────────
function connectWS() {
  clearTimeout(wsReconnectTimer);
  setWSStatus('connecting');
  try {
    ws = new WebSocket(WS_URL);
  } catch(e) {
    setWSStatus('error');
    scheduleReconnect();
    return;
  }
  ws.onopen = () => setWSStatus('connected');
  ws.onclose = () => { setWSStatus('error'); scheduleReconnect(); };
  ws.onerror = () => setWSStatus('error');
  ws.onmessage = e => handleWSMessage(e.data);
}

function scheduleReconnect() {
  wsReconnectTimer = setTimeout(connectWS, 5000);
}

function setWSStatus(state) {
  const dot = document.getElementById('ws-dot');
  const label = document.getElementById('ws-label');
  dot.className = state === 'connected' ? 'connected' : state === 'error' ? 'error' : '';
  label.textContent = state === 'connected' ? 'Live' : state === 'error' ? 'Offline' : 'Connecting…';
}

function handleWSMessage(raw) {
  let msg;
  try { msg = JSON.parse(raw); } catch { return; }

  switch (msg.type) {
    case 'sms_received':
      // New incoming SMS — refresh thread list and current thread if matching
      loadThreads();
      if (activeThread && msg.from === activeThread) loadMessages(activeThread);
      showNotificationBanner('SMS from ' + msg.from + ': ' + (msg.body || '').slice(0, 60));
      break;
    case 'call_incoming':
      handleIncomingCall(msg.number || msg.from || 'Unknown');
      break;
    case 'call_connected':
      setCallState('connected', msg.number);
      break;
    case 'call_ended':
      endCallUI();
      break;
    case 'modem_update':
      // Status update — could refresh header info if needed
      break;
    default:
      // Unknown event — ignore gracefully
  }
}

function wsSend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ─── Threads ──────────────────────────────────────────────────────────────────
async function loadThreads() {
  try {
    const res = await fetch(API + '/api/telephony/sms/threads');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    threads = await res.json() || [];
  } catch(e) {
    threads = [];
  }
  renderThreads();
}

function renderThreads(filter) {
  const container = document.getElementById('threads-scroll');
  const empty = document.getElementById('threads-empty');
  let list = threads;
  if (filter) {
    const q = filter.toLowerCase();
    list = threads.filter(t =>
      (t.number || '').toLowerCase().includes(q) ||
      (t.last_body || '').toLowerCase().includes(q) ||
      (t.contact_name || '').toLowerCase().includes(q)
    );
  }
  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    empty.textContent = filter ? 'No results' : 'No messages yet';
    container.appendChild(empty);
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.map(t => {
    const name = t.contact_name || t.number || 'Unknown';
    const preview = t.last_body || '';
    const time = t.last_ts ? fmtTime(t.last_ts) : '';
    const initials = name.slice(0, 2).toUpperCase();
    const unread = t.unread_count > 0;
    // esc() around JSON.stringify is REQUIRED, not decorative. JSON.stringify
    // emits double quotes, and these onclick attributes are themselves
    // double-quoted: without escaping, the attribute terminates at the first
    // inner quote and the handler becomes the fragment `selectThread(`, so
    // every click threw "Unexpected end of input" and opening a thread did
    // nothing. esc() turns the quotes into &quot;, which the HTML parser
    // decodes back to a valid JS string literal.
    return `<div class="thread-item ${activeThread === t.number ? 'active' : ''} ${unread ? 'unread' : ''}"
               onclick="selectThread(${esc(JSON.stringify(t.number))}, ${esc(JSON.stringify(name))})">
      <div class="avatar">${initials}</div>
      <div class="info">
        <div class="name">${esc(name)}</div>
        <div class="preview">${esc(preview)}</div>
      </div>
      <div class="meta">
        <div class="time">${esc(time)}</div>
        <div class="badge">${t.unread_count || ''}</div>
      </div>
    </div>`;
  }).join('');
}

function searchMessages() {
  const q = document.getElementById('msg-search').value;
  searchQuery = q;
  renderThreads(q);
}

// ─── Thread / Message view ────────────────────────────────────────────────────
async function selectThread(number, name) {
  activeThread = number;
  renderThreads(searchQuery);
  await loadMessages(number, name);
}

async function loadMessages(number, name) {
  name = name || number;
  const tv = document.getElementById('thread-view');
  tv.innerHTML = `
    <div class="thread-header">
      <div class="avatar">${(name || '?').slice(0,2).toUpperCase()}</div>
      <div>
        <div class="name">${esc(name)}</div>
        <div class="number">${esc(number)}</div>
      </div>
      <div class="actions">
        <button onclick="dialNumber(${esc(JSON.stringify(number))})">📞 Call</button>
      </div>
    </div>
    <div class="messages-scroll" id="msgs-scroll">
      <div style="text-align:center;color:var(--text3);padding:16px;font-size:12px">Loading…</div>
    </div>
    <div class="compose">
      <textarea id="compose-input" placeholder="Message…" rows="1"
        onkeydown="composerKeydown(event)" oninput="autoResizeTextarea(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </div>`;

  try {
    const res = await fetch(API + '/api/telephony/sms/thread/' + encodeURIComponent(number));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    messages = await res.json() || [];
  } catch {
    messages = [];
  }
  renderMessages();
  document.getElementById('compose-input').focus();
}

function renderMessages() {
  const scroll = document.getElementById('msgs-scroll');
  if (!scroll) return;
  if (messages.length === 0) {
    scroll.innerHTML = '<div style="text-align:center;color:var(--text3);padding:24px;font-size:12px">No messages yet. Say hello!</div>';
    return;
  }
  let lastDate = '';
  scroll.innerHTML = messages.map(m => {
    const dir = m.direction === 'outgoing' ? 'outgoing' : 'incoming';
    const date = m.ts ? new Date(m.ts * 1000).toLocaleDateString() : '';
    let sep = '';
    if (date !== lastDate) { sep = `<div class="msg-date-sep">${esc(date)}</div>`; lastDate = date; }
    const time = m.ts ? new Date(m.ts * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    return `${sep}<div class="msg-bubble ${dir}">
      ${esc(m.body || '')}
      <div class="ts">${esc(time)}${m.status ? ' · ' + esc(m.status) : ''}</div>
    </div>`;
  }).join('');
  scroll.scrollTop = scroll.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('compose-input');
  const btn = document.getElementById('send-btn');
  const body = input.value.trim();
  if (!body || !activeThread) return;
  btn.disabled = true;
  input.value = '';
  autoResizeTextarea(input);

  // Optimistic update
  const now = Math.floor(Date.now() / 1000);
  messages.push({ direction: 'outgoing', body, ts: now, status: 'sending' });
  renderMessages();

  try {
    const res = await fetch(API + '/api/telephony/sms/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: activeThread, body }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    // Update last message status
    messages[messages.length - 1].status = 'sent';
    renderMessages();
    loadThreads();
  } catch(e) {
    messages[messages.length - 1].status = 'failed';
    renderMessages();
    showError('Failed to send message');
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function composerKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── Dialer ───────────────────────────────────────────────────────────────────
function buildNumpad() {
  const numpad = document.getElementById('numpad');
  numpad.innerHTML = KEYS.map(([digit, sub]) =>
    `<div class="key" onclick="dialDigit('${digit}')">
      <span class="digit">${digit}</span>
      <span class="sub">${sub}</span>
    </div>`
  ).join('');
}

function dialDigit(d) {
  const el = document.getElementById('dial-text');
  el.textContent += d;
}

function dialDelete() {
  const el = document.getElementById('dial-text');
  el.textContent = el.textContent.slice(0, -1);
}

function dialNumber(num) {
  document.getElementById('dial-text').textContent = num;
  showView('dialer');
  showDialerTab('numpad');
}

async function placeCall() {
  const number = document.getElementById('dial-text').textContent.trim();
  if (!number) return;
  showCallUI(number, 'Calling…');
  try {
    const res = await fetch(API + '/api/telephony/call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    voiceAvailable = true;
  } catch(e) {
    // Voice API not yet available — show graceful message
    voiceAvailable = false;
    document.getElementById('incall-state').textContent = 'Voice not available (backend pending)';
    // Hide after 2.5s
    setTimeout(() => { if (!callState) endCallUI(); }, 2500);
  }
}

// ─── In-call UI ───────────────────────────────────────────────────────────────
function showCallUI(number, state) {
  callState = { number, state };
  muted = false;
  callSeconds = 0;
  document.getElementById('incall-caller').textContent = number;
  document.getElementById('incall-state').textContent = state;
  document.getElementById('incall-overlay').classList.add('active');
  document.getElementById('mute-btn').classList.remove('on');
  document.getElementById('dtmf-pad').classList.remove('show');
  startCallTimer();
}

function setCallState(state, number) {
  if (!callState) showCallUI(number || 'Unknown', '');
  callState.state = state;
  document.getElementById('incall-state').textContent =
    state === 'connected' ? 'Connected' : state;
}

function startCallTimer() {
  clearInterval(callTimer);
  callTimer = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    const el = document.getElementById('incall-state');
    if (el && callState && callState.state === 'connected') el.textContent = `${m}:${s}`;
  }, 1000);
}

function toggleMute() {
  muted = !muted;
  const btn = document.getElementById('mute-btn');
  btn.classList.toggle('on', muted);
  btn.querySelector('.label').textContent = muted ? 'Unmute' : 'Mute';
  wsSend({ type: 'mute', muted });
}

function buildDTMFPad() {
  document.getElementById('dtmf-pad').innerHTML = KEYS.map(([d]) =>
    `<div class="dtmf-key" onclick="sendDTMF('${d}')">${d}</div>`
  ).join('');
}

function toggleDTMF() {
  document.getElementById('dtmf-pad').classList.toggle('show');
}

function sendDTMF(d) {
  wsSend({ type: 'dtmf', digit: d });
}

function hangUp() {
  wsSend({ type: 'hangup' });
  // Also try REST endpoint
  fetch(API + '/api/telephony/call/hangup', { method: 'POST' }).catch(() => {});
  endCallUI();
}

function endCallUI() {
  clearInterval(callTimer);
  callState = null;
  document.getElementById('incall-overlay').classList.remove('active');
  loadCallHistory();
}

// ─── Incoming call ────────────────────────────────────────────────────────────
function handleIncomingCall(number) {
  document.getElementById('banner-caller').textContent = number;
  document.getElementById('incoming-banner').classList.add('active');
}

function answerCall() {
  const number = document.getElementById('banner-caller').textContent;
  document.getElementById('incoming-banner').classList.remove('active');
  showCallUI(number, 'Connected');
  setCallState('connected', number);
  wsSend({ type: 'answer' });
  fetch(API + '/api/telephony/call/answer', { method: 'POST' }).catch(() => {});
}

function declineCall() {
  document.getElementById('incoming-banner').classList.remove('active');
  wsSend({ type: 'decline' });
  fetch(API + '/api/telephony/call/decline', { method: 'POST' }).catch(() => {});
}

// ─── Call history ─────────────────────────────────────────────────────────────
async function loadCallHistory() {
  const container = document.getElementById('history-content');
  container.innerHTML = '<div class="history-empty">Loading…</div>';
  try {
    const res = await fetch(API + '/api/telephony/calls');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const calls = await res.json() || [];
    if (calls.length === 0) {
      container.innerHTML = '<div class="history-empty">No recent calls</div>';
      return;
    }
    container.innerHTML = calls.map(c => {
      const dir = c.direction || 'incoming';
      const icon = dir === 'missed' ? '📵' : dir === 'outgoing' ? '📤' : '📥';
      const time = c.ts ? fmtTime(c.ts) : '';
      return `<div class="history-item">
        <div class="ci ${dir}">${icon}</div>
        <div class="hinfo">
          <div class="hnum">${esc(c.number || 'Unknown')}</div>
          <div class="htype">${esc(dir)}${c.duration ? ' · ' + fmtDuration(c.duration) : ''}</div>
        </div>
        <div class="htime">${esc(time)}</div>
        <button class="redial" onclick="dialNumber(${esc(JSON.stringify(c.number || ''))})" title="Redial">📞</button>
      </div>`;
    }).join('');
  } catch {
    container.innerHTML = `<div class="history-unavail">
      📞 Call history unavailable.<br>
      <small>Voice API not yet connected to backend.</small>
    </div>`;
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'Now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
  if (diff < 86400000) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  if (diff < 604800000) return d.toLocaleDateString([], {weekday:'short'});
  return d.toLocaleDateString([], {month:'short', day:'numeric'});
}

function fmtDuration(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function showNotificationBanner(text) {
  // Simple toast-style notification
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:12px;right:12px;z-index:800;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 14px;font-size:12px;max-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.5)';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showError(text) {
  showNotificationBanner('⚠ ' + text);
}
</script>
