<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Productivity: indigo tile -->
  <rect width="64" height="64" rx="14" fill="#312e81"/>
  <!-- Calendar body -->
  <rect x="12" y="17" width="40" height="36" rx="5" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Header bar -->
  <rect x="12" y="17" width="40" height="11" rx="5" fill="#4338ca"/>
  <!-- Clip off bottom rounding of header -->
  <rect x="12" y="23" width="40" height="5" fill="#4338ca"/>
  <!-- Ring pegs -->
  <rect x="21" y="13" width="4" height="9" rx="2" fill="#a5b4fc"/>
  <rect x="39" y="13" width="4" height="9" rx="2" fill="#a5b4fc"/>
  <!-- Day grid: 3 columns x 3 rows -->
  <rect x="16" y="32" width="8" height="7" rx="2" fill="#4338ca"/>
  <rect x="28" y="32" width="8" height="7" rx="2" fill="#a5b4fc"/>
  <rect x="40" y="32" width="8" height="7" rx="2" fill="#4338ca"/>
  <rect x="16" y="42" width="8" height="7" rx="2" fill="#4338ca"/>
  <rect x="28" y="42" width="8" height="7" rx="2" fill="#4338ca"/>
  <rect x="40" y="42" width="8" height="7" rx="2" fill="#6366f1"/>
</svg>
