<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Sheets</title>
<style>
/* ── Reset ──────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif}

/* ── Layout ─────────────────────────────────────────────────────────────── */
body{display:flex;flex-direction:column}

/* ── Toolbar ────────────────────────────────────────────────────────────── */
#toolbar{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:#111;border-bottom:1px solid #222;flex-shrink:0;flex-wrap:wrap;
  font-size:12px;
}
#toolbar button{
  background:#222;border:1px solid #333;border-radius:5px;
  padding:4px 10px;color:#ccc;cursor:pointer;font-size:12px;white-space:nowrap;
}
#toolbar button:hover{background:#2a2a2a;color:#fff}
#toolbar button.primary{background:#166534;border-color:#22c55e;color:#fff}
#toolbar button.primary:hover{background:#15803d}
#toolbar .sep{width:1px;background:#333;height:20px;flex-shrink:0}
#toolbar .spacer{flex:1}
#sheet-title{
  background:transparent;border:none;color:#e5e5e5;font-size:14px;
  font-weight:600;outline:none;min-width:120px;max-width:220px;cursor:pointer;
}
#sheet-title:focus{
  background:#1a1a1a;border-bottom:1px solid #3b82f6;padding:0 4px;cursor:text;
}

/* ── Collab bar ─────────────────────────────────────────────────────────── */
#collab-bar{
  display:flex;align-items:center;gap:8px;padding:3px 10px;
  background:#0f1929;border-bottom:1px solid #1e3a5f;font-size:11px;
  flex-shrink:0;
}
#collab-bar.hidden{display:none}
#collab-status{color:#3b82f6}
#peer-badges{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.peer-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:#1e3a5f;border:1px solid #2563eb;border-radius:10px;
  padding:1px 7px;font-size:10px;color:#93c5fd;
}
.peer-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
#sidebar{
  width:190px;flex-shrink:0;border-right:1px solid #222;
  display:flex;flex-direction:column;overflow:hidden;
}
#sidebar .top{padding:8px;border-bottom:1px solid #222;display:flex;gap:4px}
#sidebar .top button{
  flex:1;background:#166534;border:1px solid #22c55e;border-radius:5px;
  padding:4px 0;color:#fff;cursor:pointer;font-size:11px;
}
#sidebar .top button:hover{background:#15803d}
#sheet-list{flex:1;overflow-y:auto}
.sheet-item{
  padding:8px 10px;border-bottom:1px solid #111;cursor:pointer;
  font-size:12px;display:flex;align-items:center;gap:6px;
}
.sheet-item:hover{background:#111}
.sheet-item.active{background:#1a1a1a;border-left:2px solid #22c55e}
.sheet-item .sname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-item .del{color:#555;font-size:10px;padding:1px 4px;border-radius:3px}
.sheet-item .del:hover{background:#3f1212;color:#f87171}

/* ── Main area ──────────────────────────────────────────────────────────── */
#main{display:flex;flex:1;overflow:hidden}
#grid-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Formula bar ────────────────────────────────────────────────────────── */
#formula-bar{
  display:flex;align-items:center;gap:6px;padding:4px 8px;
  background:#111;border-bottom:1px solid #222;font-size:12px;flex-shrink:0;
}
#cell-ref{
  width:52px;background:#1a1a1a;border:1px solid #333;border-radius:4px;
  padding:3px 6px;color:#ccc;font-size:11px;text-align:center;flex-shrink:0;
}
#formula-sep{width:1px;background:#333;height:18px}
#formula-input{
  flex:1;background:#1a1a1a;border:1px solid #333;border-radius:4px;
  padding:3px 8px;color:#e5e5e5;font-size:12px;outline:none;
}
#formula-input:focus{border-color:#3b82f6}

/* ── Grid container ─────────────────────────────────────────────────────── */
#grid-container{flex:1;overflow:auto;position:relative}

/* ── Sheet grid ─────────────────────────────────────────────────────────── */
#grid{
  border-collapse:collapse;table-layout:fixed;
  border:none;
}
#grid th,#grid td{
  border:1px solid #1e1e1e;
  min-width:90px;max-width:220px;height:24px;
  padding:0;font-size:12px;position:relative;
  overflow:hidden;
}
#grid th{
  background:#111;color:#888;font-weight:500;text-align:center;
  user-select:none;cursor:default;position:sticky;z-index:2;
  font-size:11px;
}
#grid th.row-header{
  min-width:42px;max-width:42px;width:42px;
  left:0;z-index:3;
}
#grid th.col-header{top:0}
#grid td{background:#0a0a0a;cursor:default;outline:none}
#grid td.selected{
  background:#0f1f2e;
  outline:2px solid #3b82f6;
  outline-offset:-2px;
  z-index:1;
}
#grid td.peer-highlight{
  outline:2px solid var(--peer-color, #f59e0b);
  outline-offset:-2px;
}
#grid td .cell-content{
  display:block;width:100%;height:100%;
  padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  line-height:20px;
}
/* Inline editor overlay */
#grid td.editing .cell-content{display:none}
#cell-editor{
  position:absolute;z-index:10;background:#1e1e1e;border:2px solid #3b82f6;
  border-radius:2px;padding:1px 5px;font-size:12px;color:#e5e5e5;outline:none;
  min-width:90px;
}

/* ── Status bar ─────────────────────────────────────────────────────────── */
#statusbar{
  display:flex;align-items:center;gap:12px;padding:3px 10px;
  background:#111;border-top:1px solid #222;font-size:11px;color:#555;
  flex-shrink:0;
}
#statusbar .s-right{margin-left:auto;display:flex;gap:12px}
#sel-info{color:#666}

/* ── Share modal ────────────────────────────────────────────────────────── */
#share-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:100;align-items:center;justify-content:center;
}
#share-modal.open{display:flex}
#share-box{
  background:#111;border:1px solid #333;border-radius:10px;
  padding:20px;width:340px;display:flex;flex-direction:column;gap:12px;
}
#share-box h3{color:#e5e5e5;font-size:14px}
#share-box label{color:#888;font-size:12px}
#share-box input,#share-box select{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:6px 8px;color:#e5e5e5;font-size:13px;width:100%;outline:none;
}
#share-box input:focus,#share-box select:focus{border-color:#22c55e}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-actions button{
  background:#222;border:1px solid #333;border-radius:6px;
  padding:6px 14px;color:#ccc;cursor:pointer;font-size:13px;
}
.modal-actions button.primary{background:#166534;border-color:#22c55e;color:#fff}
.modal-actions button:hover{background:#2a2a2a}
.modal-actions button.primary:hover{background:#15803d}
</style>
</head>
<body>

<!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
<div id="toolbar">
  <input id="sheet-title" value="Untitled Sheet" title="Click to rename">
  <div class="sep"></div>
  <button id="btn-add-row" title="Add row">+ Row</button>
  <button id="btn-add-col" title="Add column">+ Col</button>
  <div class="sep"></div>
  <button id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <div class="sep"></div>
  <button class="primary" id="btn-share" title="Share for collaboration">Share</button>
  <div class="spacer"></div>
  <span id="save-status" style="color:#555">Ready</span>
</div>

<!-- ── Collab bar ───────────────────────────────────────────────────────── -->
<div id="collab-bar" class="hidden">
  <span id="collab-status">● Connecting…</span>
  <div id="peer-badges"></div>
</div>

<!-- ── Body ────────────────────────────────────────────────────────────── -->
<div id="main">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="top">
      <button id="btn-new-sheet">+ Sheet</button>
    </div>
    <div id="sheet-list"></div>
  </div>

  <!-- Grid area -->
  <div id="grid-wrap">
    <!-- Formula bar -->
    <div id="formula-bar">
      <input id="cell-ref" readonly value="A1">
      <div id="formula-sep"></div>
      <input id="formula-input" placeholder="Enter value or =formula">
    </div>
    <!-- Scrollable grid -->
    <div id="grid-container">
      <table id="grid"></table>
    </div>
  </div>
</div>

<!-- ── Status bar ──────────────────────────────────────────────────────── -->
<div id="statusbar">
  <span id="sel-info">A1</span>
  <span class="s-right">
    <span id="row-col-count"></span>
  </span>
</div>

<!-- ── Inline cell editor ─────────────────────────────────────────────── -->
<input id="cell-editor" style="display:none" autocomplete="off" spellcheck="false">

<!-- ── Share modal ─────────────────────────────────────────────────────── -->
<div id="share-modal">
  <div id="share-box">
    <h3>Share sheet for collaboration</h3>
    <div>
      <label>Peer Vula ID</label>
      <input type="text" id="share-peer" placeholder="vula:ed25519:… or user@example.com" autocomplete="off">
    </div>
    <div>
      <label>Permission</label>
      <select id="share-perm">
        <option value="edit">Edit — can write</option>
        <option value="view">View — read only</option>
      </select>
    </div>
    <div class="modal-actions">
      <button id="share-cancel">Cancel</button>
      <button class="primary" id="share-confirm">Share</button>
    </div>
  </div>
</div>

<!-- ── Scripts ─────────────────────────────────────────────────────────── -->
<!--
  SOVEREIGNTY: Yjs + y-websocket are vendored locally (self-hosted, same-origin
  ./vendor/*.js bundles produced by esbuild) instead of being fetched from the
  esm.sh CDN at runtime. A self-host / air-gapped Vulos OS must never depend on
  a third-party CDN to open an app, and must not leak the user's activity to
  esm.sh. Same library versions (yjs@13.6.18, y-websocket@1.5.4); only the
  delivery changes. Regenerate with scripts/vendor-apps.mjs.
  Cell data is stored in a Y.Map keyed by "R<row>C<col>".
  The y-websocket provider syncs to /api/peering/collab/<docId>/sync.
  Awareness carries cursor cell positions for remote cursor highlighting.
-->
<script type="importmap">
{
  "imports": {
    "yjs":         "./vendor/yjs.js",
    "y-websocket": "./vendor/y-websocket.js"
  }
}
</script>
<script type="module">
import * as Y from 'yjs';
import { WebsocketProvider } from 'y-websocket';

// ── Constants ────────────────────────────────────────────────────────────
const ROWS_INIT  = 30;
const COLS_INIT  = 10;
const COL_LABELS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// ── State ────────────────────────────────────────────────────────────────
let sheets       = [];
let currentSheet = null;
let rows         = ROWS_INIT;
let cols         = COLS_INIT;

// Selection
let selRow = 0, selCol = 0;

// Yjs collab state (per sheet)
let ydoc       = null;
let ycells     = null; // Y.Map — key "R<row>C<col>" → {v, bold, italic}
let ypresence  = null; // Y.Map — key clientId → {row, col, name, color}
let wsProvider = null;
let collabActive = false;

// Peer colours (round-robin)
const COLORS = ['#f87171','#fb923c','#facc15','#4ade80','#34d399',
                 '#38bdf8','#818cf8','#c084fc','#f472b6'];
let colorIdx = 0;
function nextColor() { return COLORS[colorIdx++ % COLORS.length]; }

// ── Element refs ─────────────────────────────────────────────────────────
const toolbar     = document.getElementById('toolbar');
const sheetTitle  = document.getElementById('sheet-title');
const collabBar   = document.getElementById('collab-bar');
const collabStatus= document.getElementById('collab-status');
const peerBadges  = document.getElementById('peer-badges');
const sheetList   = document.getElementById('sheet-list');
const grid        = document.getElementById('grid');
const cellRef     = document.getElementById('cell-ref');
const formulaInput= document.getElementById('formula-input');
const cellEditor  = document.getElementById('cell-editor');
const saveStatus  = document.getElementById('save-status');
const selInfo     = document.getElementById('sel-info');
const rowColCount = document.getElementById('row-col-count');

// ── API helpers ───────────────────────────────────────────────────────────

async function apiListSheets()          { const r = await fetch('/api/sheets'); return r.json(); }
async function apiCreateSheet(title)    { const r = await fetch('/api/sheets', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title}) }); return r.json(); }
async function apiDeleteSheet(id)       { await fetch('/api/sheets/'+encodeURIComponent(id), {method:'DELETE'}); }
async function apiRenameSheet(id, title){ const r = await fetch('/api/sheets/'+encodeURIComponent(id), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title}) }); return r.json(); }

// ── Grid rendering ────────────────────────────────────────────────────────

function colLabel(c) {
  let s = '';
  let n = c;
  do {
    s = COL_LABELS[n % 26] + s;
    n = Math.floor(n / 26) - 1;
  } while (n >= 0);
  return s;
}

function cellKey(r, c) { return `R${r}C${c}`; }

function buildGrid() {
  const frag = document.createDocumentFragment();

  // Header row
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  // Corner cell
  const corner = document.createElement('th');
  corner.className = 'row-header col-header';
  headerRow.appendChild(corner);
  for (let c = 0; c < cols; c++) {
    const th = document.createElement('th');
    th.className = 'col-header';
    th.textContent = colLabel(c);
    th.dataset.col = c;
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);
  frag.appendChild(thead);

  // Body rows
  const tbody = document.createElement('tbody');
  for (let r = 0; r < rows; r++) {
    const tr = document.createElement('tr');
    // Row header
    const th = document.createElement('th');
    th.className = 'row-header';
    th.textContent = r + 1;
    th.dataset.row = r;
    tr.appendChild(th);
    for (let c = 0; c < cols; c++) {
      const td = document.createElement('td');
      td.dataset.row = r;
      td.dataset.col = c;
      td.tabIndex = -1;
      const span = document.createElement('span');
      span.className = 'cell-content';
      td.appendChild(span);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  frag.appendChild(tbody);

  grid.innerHTML = '';
  grid.appendChild(frag);

  refreshAllCells();
  selectCell(selRow, selCol, false);
  rowColCount.textContent = `${rows} rows × ${cols} cols`;
}

function refreshAllCells() {
  if (!ycells) return;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      refreshCell(r, c);
    }
  }
}

function refreshCell(r, c) {
  const td = getTD(r, c);
  if (!td) return;
  const key = cellKey(r, c);
  const data = ycells ? ycells.get(key) : undefined;
  const span = td.querySelector('.cell-content');
  if (!span) return;
  span.textContent = data ? (data.v || '') : '';
  span.style.fontWeight = data && data.bold   ? '600' : '';
  span.style.fontStyle  = data && data.italic ? 'italic' : '';
}

function getTD(r, c) {
  return grid.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
}

function selectCell(r, c, updateFormula = true) {
  // Clear old selection
  const prev = grid.querySelector('td.selected');
  if (prev) prev.classList.remove('selected');

  selRow = Math.max(0, Math.min(rows - 1, r));
  selCol = Math.max(0, Math.min(cols - 1, c));

  const td = getTD(selRow, selCol);
  if (td) td.classList.add('selected');

  const label = colLabel(selCol) + (selRow + 1);
  cellRef.value = label;
  selInfo.textContent = label;

  if (updateFormula) {
    const data = ycells ? ycells.get(cellKey(selRow, selCol)) : undefined;
    formulaInput.value = data ? (data.v || '') : '';
  }

  // Broadcast presence
  broadcastPresence();
}

// ── Cell editing ──────────────────────────────────────────────────────────

let editingTD = null;

function startEdit(td, initialChar) {
  if (editingTD) commitEdit();
  editingTD = td;
  td.classList.add('editing');
  const rect = td.getBoundingClientRect();
  const containerRect = document.getElementById('grid-container').getBoundingClientRect();

  Object.assign(cellEditor.style, {
    display:  'block',
    left:     (rect.left - containerRect.left + document.getElementById('grid-container').scrollLeft) + 'px',
    top:      (rect.top  - containerRect.top  + document.getElementById('grid-container').scrollTop)  + 'px',
    width:    Math.max(rect.width, 120) + 'px',
    height:   rect.height + 'px',
  });

  const data = ycells ? ycells.get(cellKey(selRow, selCol)) : undefined;
  cellEditor.value = initialChar !== null ? initialChar : (data ? (data.v || '') : '');
  cellEditor.focus();
  if (initialChar !== null) {
    cellEditor.setSelectionRange(cellEditor.value.length, cellEditor.value.length);
  } else {
    cellEditor.select();
  }
}

function commitEdit() {
  if (!editingTD) return;
  const r = parseInt(editingTD.dataset.row);
  const c = parseInt(editingTD.dataset.col);
  const val = cellEditor.value;

  if (ycells) {
    const key = cellKey(r, c);
    const prev = ycells.get(key) || {};
    ydoc.transact(() => {
      ycells.set(key, { ...prev, v: val });
    });
  }

  editingTD.classList.remove('editing');
  cellEditor.style.display = 'none';
  cellEditor.value = '';
  editingTD = null;

  formulaInput.value = val;
}

function cancelEdit() {
  if (!editingTD) return;
  editingTD.classList.remove('editing');
  cellEditor.style.display = 'none';
  cellEditor.value = '';
  editingTD = null;
}

// ── Keyboard handling ─────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.target === cellEditor) return; // handled inline
  if (e.target === sheetTitle || e.target === formulaInput || e.target === document.getElementById('share-peer')) return;

  if (document.getElementById('share-modal').classList.contains('open')) return;

  const arrowKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'];

  if (arrowKeys.includes(e.key)) {
    e.preventDefault();
    if (editingTD) commitEdit();
    switch (e.key) {
      case 'ArrowUp':    selectCell(selRow-1, selCol); break;
      case 'ArrowDown':  selectCell(selRow+1, selCol); break;
      case 'ArrowLeft':  selectCell(selRow, selCol-1); break;
      case 'ArrowRight': selectCell(selRow, selCol+1); break;
      case 'Tab':        e.shiftKey ? selectCell(selRow, selCol-1) : selectCell(selRow, selCol+1); break;
    }
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    if (editingTD) { commitEdit(); selectCell(selRow+1, selCol); }
    else { const td = getTD(selRow, selCol); if (td) startEdit(td, null); }
    return;
  }

  if (e.key === 'Escape') {
    cancelEdit();
    return;
  }

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!editingTD) {
      e.preventDefault();
      if (ycells) {
        const key = cellKey(selRow, selCol);
        const prev = ycells.get(key) || {};
        ydoc.transact(() => { ycells.set(key, { ...prev, v: '' }); });
      }
      formulaInput.value = '';
    }
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
    e.preventDefault(); toggleStyle('bold'); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
    e.preventDefault(); toggleStyle('italic'); return;
  }

  // Printable char → start edit
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
    const td = getTD(selRow, selCol);
    if (td && !editingTD) startEdit(td, e.key);
  }
});

cellEditor.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { e.preventDefault(); commitEdit(); selectCell(selRow+1, selCol); }
  if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  if (e.key === 'Tab')    { e.preventDefault(); commitEdit(); e.shiftKey ? selectCell(selRow, selCol-1) : selectCell(selRow, selCol+1); }
});

// formula bar → cell
formulaInput.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { commitFormulaEdit(); selectCell(selRow+1, selCol); formulaInput.blur(); }
  if (e.key === 'Escape') { formulaInput.blur(); }
});

function commitFormulaEdit() {
  const val = formulaInput.value;
  if (ycells) {
    const key = cellKey(selRow, selCol);
    const prev = ycells.get(key) || {};
    ydoc.transact(() => { ycells.set(key, { ...prev, v: val }); });
  }
}

// ── Grid click handling ───────────────────────────────────────────────────

document.getElementById('grid-container').addEventListener('click', e => {
  const td = e.target.closest('td');
  if (!td) return;
  const r = parseInt(td.dataset.row);
  const c = parseInt(td.dataset.col);

  if (editingTD && editingTD === td) return; // already editing this cell
  if (editingTD) commitEdit();

  selectCell(r, c);
});

document.getElementById('grid-container').addEventListener('dblclick', e => {
  const td = e.target.closest('td');
  if (!td) return;
  const r = parseInt(td.dataset.row);
  const c = parseInt(td.dataset.col);
  selectCell(r, c, false);
  startEdit(td, null);
});

// ── Style toggles ─────────────────────────────────────────────────────────

function toggleStyle(prop) {
  if (!ycells) return;
  const key = cellKey(selRow, selCol);
  const prev = ycells.get(key) || {};
  ydoc.transact(() => {
    ycells.set(key, { ...prev, [prop]: !prev[prop] });
  });
}

document.getElementById('btn-bold').addEventListener('click',   () => toggleStyle('bold'));
document.getElementById('btn-italic').addEventListener('click', () => toggleStyle('italic'));

// ── Row / col additions ───────────────────────────────────────────────────

document.getElementById('btn-add-row').addEventListener('click', () => {
  rows++;
  buildGrid();
});
document.getElementById('btn-add-col').addEventListener('click', () => {
  cols++;
  buildGrid();
});

// ── Sheet sidebar ─────────────────────────────────────────────────────────

async function loadSheets() {
  sheets = await apiListSheets();
  renderSheetList();
  if (sheets.length === 0) {
    const meta = await apiCreateSheet('Sheet 1');
    sheets = [meta];
    renderSheetList();
    openSheet(meta.id);
  } else if (!currentSheet) {
    openSheet(sheets[0].id);
  }
}

function renderSheetList() {
  sheetList.innerHTML = sheets.map(s => `
    <div class="sheet-item ${s.id === (currentSheet && currentSheet.id) ? 'active' : ''}"
         data-id="${esc(s.id)}">
      <span class="sname">${esc(s.title || 'Untitled')}</span>
      <span class="del" data-del="${esc(s.id)}" title="Delete">✕</span>
    </div>`).join('');
  sheetList.querySelectorAll('.sheet-item').forEach(el => {
    el.addEventListener('click', e => {
      const delId = e.target.dataset.del;
      if (delId) { deleteSheetById(delId); return; }
      openSheet(el.dataset.id);
    });
  });
}

async function openSheet(id) {
  if (currentSheet && currentSheet.id === id) return;
  disconnectCollab();

  currentSheet = sheets.find(s => s.id === id) || null;
  if (!currentSheet) return;

  sheetTitle.value = currentSheet.title || 'Untitled Sheet';
  renderSheetList();
  rows = ROWS_INIT;
  cols = COLS_INIT;
  buildGrid();
  startCollab(id);
}

async function deleteSheetById(id) {
  if (!confirm('Delete this sheet?')) return;
  await apiDeleteSheet(id);
  sheets = sheets.filter(s => s.id !== id);
  if (currentSheet && currentSheet.id === id) {
    currentSheet = null;
    disconnectCollab();
    grid.innerHTML = '';
  }
  renderSheetList();
  if (sheets.length > 0) openSheet(sheets[0].id);
}

document.getElementById('btn-new-sheet').addEventListener('click', async () => {
  const title = prompt('Sheet name:', 'New Sheet') || 'New Sheet';
  const meta = await apiCreateSheet(title);
  sheets.push(meta);
  renderSheetList();
  openSheet(meta.id);
});

// ── Title editing ─────────────────────────────────────────────────────────

sheetTitle.addEventListener('change', async () => {
  if (!currentSheet) return;
  const updated = await apiRenameSheet(currentSheet.id, sheetTitle.value);
  if (updated) {
    currentSheet.title = updated.title;
    const s = sheets.find(x => x.id === currentSheet.id);
    if (s) s.title = updated.title;
    renderSheetList();
  }
});

// ── Yjs collab ────────────────────────────────────────────────────────────

function collabWsUrl(docId) {
  const loc = window.location;
  const proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  const backendHost = loc.hostname + ':8080';
  return `${proto}//${backendHost}/api/peering/collab/${encodeURIComponent(docId)}/sync`;
}

function startCollab(docId) {
  if (collabActive) disconnectCollab();

  ydoc = new Y.Doc();
  ycells    = ydoc.getMap('cells');    // Y.Map — cell data keyed by "R<row>C<col>"
  ypresence = ydoc.getMap('presence'); // Y.Map — keyed by clientId string

  const wsUrl = collabWsUrl(docId);
  wsProvider = new WebsocketProvider(wsUrl, docId, ydoc, { connect: true });
  collabActive = true;

  // Set local awareness: cursor position + display name
  const myColor = nextColor();
  wsProvider.awareness.setLocalStateField('user', {
    name:  'Me',
    color: myColor,
    row:   selRow,
    col:   selCol,
  });

  wsProvider.on('status', ({ status }) => {
    collabBar.classList.remove('hidden');
    if (status === 'connected') {
      collabStatus.textContent = '● Live';
      collabStatus.style.color = '#22c55e';
    } else {
      collabStatus.textContent = '● ' + (status === 'disconnected' ? 'Offline' : 'Connecting…');
      collabStatus.style.color = status === 'disconnected' ? '#f87171' : '#93c5fd';
    }
  });

  // Remote cell updates → refresh affected cells
  ycells.observe(event => {
    event.keysChanged.forEach(key => {
      const match = key.match(/^R(\d+)C(\d+)$/);
      if (match) refreshCell(parseInt(match[1]), parseInt(match[2]));
    });
    // Update formula bar if the selected cell changed
    const selKey = cellKey(selRow, selCol);
    if (event.keysChanged.has(selKey)) {
      const data = ycells.get(selKey);
      formulaInput.value = data ? (data.v || '') : '';
    }
  });

  // Peer presence → remote cursor highlights + badges
  wsProvider.awareness.on('change', updatePeerPresence);
}

function disconnectCollab() {
  if (!collabActive) return;
  wsProvider?.disconnect();
  wsProvider?.destroy();
  ydoc?.destroy();
  wsProvider = null;
  ydoc = null;
  ycells = null;
  ypresence = null;
  collabActive = false;
  collabBar.classList.add('hidden');
  peerBadges.innerHTML = '';
}

function broadcastPresence() {
  if (!wsProvider || !collabActive) return;
  const state = wsProvider.awareness.getLocalState();
  wsProvider.awareness.setLocalStateField('user', {
    ...(state ? state.user : {}),
    row: selRow,
    col: selCol,
  });
}

function updatePeerPresence() {
  if (!wsProvider) return;

  // Clear all peer-highlight classes
  grid.querySelectorAll('.peer-highlight').forEach(el => {
    el.classList.remove('peer-highlight');
    el.style.removeProperty('--peer-color');
  });

  const peers = [];
  wsProvider.awareness.getStates().forEach((state, clientId) => {
    if (clientId === wsProvider.awareness.clientID) return;
    const u = state.user;
    if (!u) return;
    peers.push(u);
    // Highlight peer's current cell
    const td = getTD(u.row, u.col);
    if (td) {
      td.classList.add('peer-highlight');
      td.style.setProperty('--peer-color', u.color || '#f59e0b');
    }
  });

  peerBadges.innerHTML = peers.length
    ? peers.map(p => `
        <span class="peer-badge">
          <span class="peer-dot" style="background:${esc(p.color || '#888')}"></span>
          ${esc(p.name || 'Peer')}
        </span>`).join('')
    : '<span style="color:#3b6bbf;font-size:10px">Waiting for peers…</span>';
}

// ── Share modal ───────────────────────────────────────────────────────────

document.getElementById('btn-share').addEventListener('click', openShareModal);

function openShareModal() {
  if (!currentSheet) { alert('Open a sheet first.'); return; }
  document.getElementById('share-peer').value = '';
  document.getElementById('share-perm').value = 'edit';
  document.getElementById('share-modal').classList.add('open');
  document.getElementById('share-peer').focus();
}

async function confirmShare() {
  const peer = document.getElementById('share-peer').value.trim();
  const perm = document.getElementById('share-perm').value;
  if (!peer) { alert('Enter a Vula ID.'); return; }

  try {
    await fetch('/api/peering/collab/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        doc_id:   currentSheet.id,
        doc_type: 'sheet',
        title:    currentSheet.title,
        peer_id:  peer,
        perm,
      }),
    });
  } catch (e) {
    console.warn('[sheets] share API error (continuing):', e);
  }

  document.getElementById('share-modal').classList.remove('open');
}

document.getElementById('share-cancel').addEventListener('click', () => {
  document.getElementById('share-modal').classList.remove('open');
});
document.getElementById('share-confirm').addEventListener('click', confirmShare);
document.getElementById('share-peer').addEventListener('keydown', e => {
  if (e.key === 'Enter')  confirmShare();
  if (e.key === 'Escape') document.getElementById('share-modal').classList.remove('open');
});

// ── Join from URL (?collab=<docId>) ──────────────────────────────────────

function maybeJoinFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const docId  = params.get('collab');
  if (docId) {
    // If we have a sheet with this id, open it; otherwise start collab directly.
    const existing = sheets.find(s => s.id === docId);
    if (existing) {
      openSheet(docId);
    } else {
      // Peer mode: create a local stub so we can edit
      currentSheet = { id: docId, title: 'Shared Sheet' };
      sheetTitle.value = 'Shared Sheet';
      buildGrid();
      startCollab(docId);
    }
  }
}

// ── Utility ───────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Bootstrap ─────────────────────────────────────────────────────────────

// Build an empty grid immediately so the app feels responsive.
ydoc = new Y.Doc();
ycells = ydoc.getMap('cells');
buildGrid();

// Load sheet list, then open first sheet (or join from URL)
loadSheets().then(() => maybeJoinFromUrl());
</script>
