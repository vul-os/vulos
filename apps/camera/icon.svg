<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#1a1a1a"/>
  <!-- Camera body -->
  <rect x="8" y="20" width="48" height="32" rx="5" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
  <!-- Lens outer ring -->
  <circle cx="32" cy="36" r="11" fill="#111" stroke="#555" stroke-width="2"/>
  <!-- Lens inner -->
  <circle cx="32" cy="36" r="7" fill="#0a0a0a" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Lens highlight -->
  <circle cx="32" cy="36" r="3.5" fill="#1a2a4a"/>
  <!-- Flash / viewfinder bump -->
  <rect x="26" y="14" width="12" height="8" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1.2"/>
  <!-- Shutter button indicator -->
  <circle cx="52" cy="26" r="3" fill="#3b82f6"/>
</svg>
