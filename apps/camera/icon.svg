<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Media: violet tile -->
  <rect width="64" height="64" rx="14" fill="#4c1d95"/>
  <!-- Viewfinder bump -->
  <rect x="24" y="16" width="16" height="8" rx="4" fill="#2e1065"/>
  <!-- Camera body -->
  <rect x="10" y="21" width="44" height="28" rx="6" fill="#2e1065" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Lens ring outer -->
  <circle cx="32" cy="35" r="10" fill="#1e1035" stroke="#c4b5fd" stroke-width="2"/>
  <!-- Lens ring inner -->
  <circle cx="32" cy="35" r="6" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Lens center -->
  <circle cx="32" cy="35" r="3" fill="#4c1d95"/>
  <!-- Shutter button -->
  <circle cx="50" cy="27" r="3.5" fill="#c4b5fd"/>
  <!-- Flash indicator -->
  <rect x="14" y="27" width="5" height="3" rx="1.5" fill="#c4b5fd" opacity="0.6"/>
</svg>
