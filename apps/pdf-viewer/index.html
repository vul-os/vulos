<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self';">
<title>PDF Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171d24;--elev:#1f2630;--border:#2a3340;--border2:#3a4656;--text:#eef2f7;--text2:#a7b0bd;--text3:#6f7b8a;--accent:#0ea5a4;--accent2:#f97316;--danger:#ef4444}
body{height:100vh;display:flex;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--border2);background:var(--elev);color:var(--text);border-radius:6px;cursor:pointer;min-height:32px;padding:6px 10px;transition:background .15s,border-color .15s,color .15s}
button:hover{background:#263140;border-color:#526071}
button:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;width:100%;height:100%}
.sidebar,.notes{background:var(--panel);border-color:var(--border);display:flex;flex-direction:column;min-width:0}
.sidebar{border-right:1px solid var(--border)}
.notes{border-left:1px solid var(--border)}
.head{height:56px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.head h1{font-size:15px;font-weight:650;white-space:nowrap}
.head .spacer{flex:1}
.open-btn{position:relative;background:var(--accent);border-color:var(--accent);color:#042f2e;font-weight:650}
.open-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.small{min-height:28px;padding:4px 8px;font-size:12px;color:var(--text2)}
.side-section{padding:12px 12px 0;min-height:0}
.section-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.drop{border:1px dashed var(--border2);border-radius:8px;background:var(--panel2);padding:16px 12px;text-align:center;color:var(--text2);font-size:13px;line-height:1.45}
.drop.drag{border-color:var(--accent);background:#0f2f31;color:var(--text)}
.file-list{overflow-y:auto;padding:8px 8px 14px;flex:1;min-height:0}
.file-card{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px;color:var(--text2);margin-bottom:6px}
.file-card:hover,.file-card.active{background:var(--panel2);border-color:var(--border)}
.thumb{height:54px;border-radius:5px;background:linear-gradient(180deg,#f8fafc,#cbd5e1);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #0002}
.thumb:before{content:"";position:absolute;right:0;top:0;border-left:13px solid transparent;border-bottom:13px solid #94a3b8}
.thumb span{position:absolute;left:7px;bottom:7px;background:#dc2626;color:white;font-size:9px;font-weight:800;letter-spacing:.04em;border-radius:3px;padding:2px 4px}
.file-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:11px;color:var(--text3);margin-top:3px}
.main{display:flex;flex-direction:column;min-width:0;background:#080a0d}
.toolbar{height:56px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0;flex-wrap:wrap}
.doc-title{font-size:13px;font-weight:650;min-width:120px;max-width:24vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.group{display:flex;align-items:center;gap:6px;padding-left:8px;border-left:1px solid var(--border)}
.page-input,.zoom-select{height:32px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--text);outline:none}
.page-input{width:52px;text-align:center}
.page-total{font-size:12px;color:var(--text3)}
.zoom-select{width:88px;padding:0 6px}
.viewer-wrap{flex:1;position:relative;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.viewer-empty{margin:auto;text-align:center;color:var(--text3);max-width:420px;padding:24px;line-height:1.5}
.viewer-empty strong{display:block;color:var(--text);font-size:20px;margin-bottom:8px}
#pdfCanvas{display:block;box-shadow:0 4px 24px #0007;background:#fff;max-width:100%}
.notes-body{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:0;flex:1}
.note-tabs{display:flex;gap:6px}
.note-tabs button{flex:1;font-size:12px;color:var(--text2)}
.note-tabs button.active{background:var(--accent);border-color:var(--accent);color:#042f2e;font-weight:700}
.note-row{display:flex;gap:8px}
.note-row input{width:78px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:7px 8px;outline:none}
.note-row input:focus,textarea:focus{border-color:var(--accent)}
.note-row button{flex:1}
textarea{flex:1;min-height:0;resize:none;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:10px;line-height:1.45;outline:none}
.annotation-list{flex:1;overflow-y:auto;display:none;min-height:0}
.annotation{border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:9px;margin-bottom:8px}
.annotation-top{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:11px;margin-bottom:6px}
.annotation-top strong{color:var(--accent2)}
.annotation-top button{margin-left:auto;min-height:22px;padding:2px 6px;border-radius:4px;background:transparent;color:var(--text3)}
.annotation p{font-size:13px;color:var(--text2);line-height:1.45;white-space:pre-wrap}
.status{height:30px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text3);font-size:11px;background:var(--panel);flex-shrink:0}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.status .dot.on{background:var(--accent)}
@media(max-width:960px){.app{grid-template-columns:210px minmax(0,1fr)}.notes{position:absolute;right:0;top:0;bottom:0;width:320px;z-index:5;transform:translateX(calc(100% - 44px))}.notes:focus-within,.notes:hover{transform:translateX(0)}.doc-title{max-width:18vw}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{display:none}.toolbar{height:auto}.doc-title{max-width:100%;width:100%}.notes{display:none}.group{padding-left:0;border-left:0}}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar: file list -->
  <aside class="sidebar">
    <div class="head">
      <h1>PDF Viewer</h1>
      <span class="spacer"></span>
      <label class="open-btn">Open<input id="fileInput" type="file" accept="application/pdf,.pdf" multiple></label>
    </div>
    <div class="side-section">
      <div id="dropZone" class="drop">Drop PDFs here or open files from this device.</div>
    </div>
    <div class="side-section" style="padding-top:14px">
      <div class="section-title">Recent PDFs</div>
    </div>
    <div id="fileList" class="file-list"></div>
  </aside>

  <!-- Main viewer -->
  <main class="main">
    <div class="toolbar">
      <div id="docTitle" class="doc-title">No PDF open</div>
      <span class="spacer"></span>
      <div class="group">
        <button id="prevPage" title="Previous page" disabled>&#8249;</button>
        <input id="pageInput" class="page-input" type="number" min="1" value="1" title="Current page" disabled>
        <span class="page-total" id="pageTotal">/ —</span>
        <button id="nextPage" title="Next page" disabled>&#8250;</button>
      </div>
      <div class="group">
        <button id="zoomOut" title="Zoom out" disabled>&#8722;</button>
        <select id="zoomSelect" class="zoom-select" title="Zoom" disabled>
          <option value="50">50%</option>
          <option value="75">75%</option>
          <option value="100" selected>100%</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
          <option value="200">200%</option>
          <option value="page-width">Fit Width</option>
        </select>
        <button id="zoomIn" title="Zoom in" disabled>+</button>
      </div>
      <div class="group">
        <button id="printBtn" title="Print" disabled>Print</button>
      </div>
    </div>

    <div class="viewer-wrap" id="viewerWrap">
      <div id="empty" class="viewer-empty">
        <strong>Open a local PDF</strong>
        Files stay in this browser session. Notes and annotations are saved locally per file.
        Rendered using PDF.js — no network requests required.
      </div>
      <canvas id="pdfCanvas" style="display:none"></canvas>
    </div>

    <div class="status">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Waiting for a PDF</span>
    </div>
  </main>

  <!-- Right panel: notes + annotations -->
  <aside class="notes">
    <div class="head">
      <h1>Notes</h1>
      <span class="spacer"></span>
      <button id="clearNotes" class="small">Clear</button>
    </div>
    <div class="notes-body">
      <div class="note-tabs">
        <button id="notesTab" class="active">Document notes</button>
        <button id="annTab">Annotations</button>
      </div>
      <textarea id="notesText" placeholder="Notes for this PDF..."></textarea>
      <div id="annotationPane" class="annotation-list"></div>
      <div class="note-row">
        <input id="annotationPage" type="number" min="1" value="1" title="Annotation page">
        <button id="addAnnotation">Add annotation for current page</button>
      </div>
    </div>
  </aside>
</div>

<!-- PDF.js served locally — no CDN, no external network requests -->
<script type="module">
import * as pdfjsLib from './pdfjs/pdf.mjs';

// Point the worker at the locally-served worker script.
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdfjs/pdf.worker.mjs';

// ─── State ────────────────────────────────────────────────────────────────
const state = {
  files: [],
  current: null,      // file record
  pdfDoc: null,       // PDFDocumentProxy
  page: 1,
  totalPages: 0,
  zoom: 100,          // numeric percent or 'page-width'
  rendering: false,
  renderTask: null,
  saveTimer: null,
  tab: 'notes'
};

// ─── DOM refs ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const els = {
  fileInput:      $('fileInput'),
  dropZone:       $('dropZone'),
  fileList:       $('fileList'),
  docTitle:       $('docTitle'),
  pageInput:      $('pageInput'),
  pageTotal:      $('pageTotal'),
  prevPage:       $('prevPage'),
  nextPage:       $('nextPage'),
  zoomSelect:     $('zoomSelect'),
  zoomOut:        $('zoomOut'),
  zoomIn:         $('zoomIn'),
  printBtn:       $('printBtn'),
  viewerWrap:     $('viewerWrap'),
  empty:          $('empty'),
  pdfCanvas:      $('pdfCanvas'),
  notesText:      $('notesText'),
  annotationPane: $('annotationPane'),
  annotationPage: $('annotationPage'),
  addAnnotation:  $('addAnnotation'),
  notesTab:       $('notesTab'),
  annTab:         $('annTab'),
  clearNotes:     $('clearNotes'),
  statusDot:      $('statusDot'),
  statusText:     $('statusText')
};

// ─── Storage helpers ──────────────────────────────────────────────────────
const storageKey  = id  => 'pdf-viewer:' + id;
const recentKey   = ()  => 'pdf-viewer:recent';
const fingerprint = f   => [f.name, f.size, f.lastModified].join(':');

function loadDocState(id) {
  try { return JSON.parse(localStorage.getItem(storageKey(id))) || { notes: '', annotations: [] }; }
  catch { return { notes: '', annotations: [] }; }
}

function persistDocState() {
  if (!state.current) return;
  const doc = loadDocState(state.current.id);
  doc.notes = els.notesText.value;
  localStorage.setItem(storageKey(state.current.id), JSON.stringify(doc));
  setStatus('Notes saved', true);
}

function saveRecent() {
  const recent = state.files.map(f => ({
    id: f.id, name: f.name, size: f.size,
    lastModified: f.lastModified, openedAt: f.openedAt
  })).slice(0, 20);
  localStorage.setItem(recentKey(), JSON.stringify(recent));
}

function loadRecent() {
  try { return JSON.parse(localStorage.getItem(recentKey())) || []; }
  catch { return []; }
}

// ─── Utilities ────────────────────────────────────────────────────────────
function formatSize(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i ? 1 : 0) + ' ' + units[i];
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setStatus(text, ok) {
  els.statusText.textContent = text;
  els.statusDot.classList.toggle('on', !!ok);
}

function setControls(enabled) {
  [els.prevPage, els.nextPage, els.pageInput, els.zoomSelect,
   els.zoomOut, els.zoomIn, els.printBtn].forEach(el => el.disabled = !enabled);
}

// ─── File management ──────────────────────────────────────────────────────
function addFiles(fileList) {
  const pdfs = Array.from(fileList).filter(
    f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name)
  );
  for (const file of pdfs) {
    const id = fingerprint(file);
    const existing = state.files.find(f => f.id === id);
    if (existing) { existing.file = file; existing.openedAt = Date.now(); continue; }
    state.files.unshift({ id, name: file.name, size: file.size,
      lastModified: file.lastModified, openedAt: Date.now(), file });
  }
  state.files.sort((a, b) => b.openedAt - a.openedAt);
  renderFileList();
  saveRecent();
  if (pdfs[0]) openDoc(fingerprint(pdfs[0]));
}

function renderFileList() {
  const fromRecent = loadRecent().filter(r => !state.files.some(f => f.id === r.id));
  const list = [...state.files, ...fromRecent];
  if (!list.length) {
    els.fileList.innerHTML = '<div class="file-meta" style="padding:8px">No recent PDFs yet.</div>';
    return;
  }
  els.fileList.innerHTML = list.map(doc => {
    const active = state.current && state.current.id === doc.id ? ' active' : '';
    const local  = doc.file ? '' : ' · reopen to view';
    return `<button class="file-card${active}" data-id="${escapeHtml(doc.id)}">
      <div class="thumb"><span>PDF</span></div>
      <div>
        <div class="file-name">${escapeHtml(doc.name)}</div>
        <div class="file-meta">${formatSize(doc.size)}${local}</div>
      </div>
    </button>`;
  }).join('');
  els.fileList.querySelectorAll('.file-card').forEach(btn =>
    btn.addEventListener('click', () => openDoc(btn.dataset.id))
  );
}

// ─── PDF loading ──────────────────────────────────────────────────────────
async function openDoc(id) {
  const doc = state.files.find(f => f.id === id);
  if (!doc) return;
  if (!doc.file) {
    setStatus('Reopen this PDF from disk to view it; notes are still available', false);
    state.current = doc;
    loadNotesForDoc(doc);
    renderFileList();
    return;
  }

  state.current = doc;
  doc.openedAt = Date.now();
  els.docTitle.textContent = doc.name;
  loadNotesForDoc(doc);
  renderFileList();
  saveRecent();
  setStatus('Loading…', false);
  setControls(false);

  try {
    const arrayBuffer = await doc.file.arrayBuffer();
    // Close previous document if any
    if (state.pdfDoc) {
      state.pdfDoc.destroy();
      state.pdfDoc = null;
    }
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    state.pdfDoc = await loadingTask.promise;
    state.totalPages = state.pdfDoc.numPages;
    state.page = 1;

    els.pageInput.min   = 1;
    els.pageInput.max   = state.totalPages;
    els.pageInput.value = 1;
    els.pageTotal.textContent = '/ ' + state.totalPages;
    els.annotationPage.max   = state.totalPages;
    els.annotationPage.value = 1;

    els.empty.style.display    = 'none';
    els.pdfCanvas.style.display = 'block';
    setControls(true);
    await renderPage(state.page);
    setStatus('Viewing ' + doc.name + ' (' + state.totalPages + ' page' + (state.totalPages > 1 ? 's' : '') + ')', true);
  } catch (err) {
    setStatus('Error loading PDF: ' + err.message, false);
    console.error('[pdf-viewer]', err);
  }
}

// ─── Page rendering ───────────────────────────────────────────────────────
async function renderPage(pageNum) {
  if (!state.pdfDoc) return;
  // Cancel any in-progress render
  if (state.rendering && state.renderTask) {
    state.renderTask.cancel();
  }
  state.rendering = true;

  const page = await state.pdfDoc.getPage(pageNum);
  const scale = computeScale(page);

  const viewport  = page.getViewport({ scale });
  const canvas    = els.pdfCanvas;
  const ctx       = canvas.getContext('2d');

  // Set canvas dimensions to match viewport at device pixel ratio for crisp text
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(viewport.width  * dpr);
  canvas.height = Math.floor(viewport.height * dpr);
  canvas.style.width  = Math.floor(viewport.width)  + 'px';
  canvas.style.height = Math.floor(viewport.height) + 'px';
  ctx.scale(dpr, dpr);

  const renderContext = { canvasContext: ctx, viewport };
  try {
    state.renderTask = page.render(renderContext);
    await state.renderTask.promise;
  } catch (err) {
    if (err?.name === 'RenderingCancelledException') return;
    throw err;
  } finally {
    page.cleanup();
    state.rendering = false;
    state.renderTask = null;
  }
}

// Compute scale factor from zoom setting vs page natural size
function computeScale(page) {
  const zoomVal = els.zoomSelect.value;
  if (zoomVal === 'page-width') {
    const wrap = els.viewerWrap;
    const availableWidth = wrap.clientWidth - 40; // 20px padding each side
    const viewport1 = page.getViewport({ scale: 1 });
    return Math.max(0.1, availableWidth / viewport1.width);
  }
  return parseFloat(zoomVal) / 100;
}

// ─── Navigation ───────────────────────────────────────────────────────────
function goToPage(n) {
  if (!state.pdfDoc) return;
  state.page = Math.max(1, Math.min(state.totalPages, n));
  els.pageInput.value = state.page;
  els.annotationPage.value = state.page;
  renderPage(state.page);
}

function stepZoom(delta) {
  const steps = ['50', '75', '100', '125', '150', '200'];
  const current = steps.indexOf(els.zoomSelect.value);
  const next = Math.max(0, Math.min(steps.length - 1, (current === -1 ? 2 : current) + delta));
  els.zoomSelect.value = steps[next];
  if (state.pdfDoc) renderPage(state.page);
}

// ─── Notes / Annotations ──────────────────────────────────────────────────
function loadNotesForDoc(doc) {
  const data = loadDocState(doc.id);
  els.notesText.value = data.notes || '';
  renderAnnotations();
}

function renderAnnotations() {
  if (!state.current) {
    els.annotationPane.innerHTML = '<div class="file-meta">Open a PDF to add annotations.</div>';
    return;
  }
  const data        = loadDocState(state.current.id);
  const annotations = data.annotations || [];
  if (!annotations.length) {
    els.annotationPane.innerHTML = '<div class="file-meta">No annotations yet.</div>';
    return;
  }
  els.annotationPane.innerHTML = annotations.map((a, idx) => `
    <div class="annotation">
      <div class="annotation-top">
        <strong>Page ${a.page}</strong>
        <span>${new Date(a.created).toLocaleString()}</span>
        <button data-del="${idx}">Delete</button>
      </div>
      <p>${escapeHtml(a.text)}</p>
    </div>`).join('');
  els.annotationPane.querySelectorAll('[data-del]').forEach(btn =>
    btn.addEventListener('click', () => deleteAnnotation(Number(btn.dataset.del)))
  );
}

function addAnnotation() {
  if (!state.current) return;
  const text = els.notesText.value.trim();
  if (!text) { setStatus('Write note text before adding an annotation', false); return; }
  const doc = loadDocState(state.current.id);
  doc.annotations = doc.annotations || [];
  doc.annotations.unshift({
    page: Math.max(1, Number(els.annotationPage.value) || state.page || 1),
    text, created: Date.now()
  });
  localStorage.setItem(storageKey(state.current.id), JSON.stringify(doc));
  els.notesText.value = '';
  renderAnnotations();
  setTab('annotations');
  setStatus('Annotation saved locally', true);
}

function deleteAnnotation(idx) {
  if (!state.current) return;
  const doc = loadDocState(state.current.id);
  doc.annotations = doc.annotations || [];
  doc.annotations.splice(idx, 1);
  localStorage.setItem(storageKey(state.current.id), JSON.stringify(doc));
  renderAnnotations();
}

function setTab(tab) {
  state.tab = tab;
  const notes = tab === 'notes';
  els.notesTab.classList.toggle('active', notes);
  els.annTab.classList.toggle('active', !notes);
  els.notesText.style.display     = notes ? 'block' : 'none';
  els.annotationPane.style.display = notes ? 'none' : 'block';
  renderAnnotations();
}

// ─── Print ────────────────────────────────────────────────────────────────
function printCurrent() {
  if (!state.current || !state.current.file) return;
  const url   = URL.createObjectURL(state.current.file);
  const frame = document.createElement('iframe');
  Object.assign(frame.style, {
    position: 'fixed', right: '0', bottom: '0',
    width: '0', height: '0', border: '0'
  });
  frame.src = url;
  frame.onload = () => {
    try { frame.contentWindow.focus(); frame.contentWindow.print(); }
    catch { window.open(url, '_blank', 'noopener'); }
    setTimeout(() => { frame.remove(); URL.revokeObjectURL(url); }, 3000);
  };
  document.body.appendChild(frame);
}

// ─── Event wiring ─────────────────────────────────────────────────────────
els.fileInput.addEventListener('change', e => addFiles(e.target.files));

els.dropZone.addEventListener('dragover', e => {
  e.preventDefault(); els.dropZone.classList.add('drag');
});
els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('drag'));
els.dropZone.addEventListener('drop', e => {
  e.preventDefault(); els.dropZone.classList.remove('drag'); addFiles(e.dataTransfer.files);
});

els.prevPage.addEventListener('click', () => goToPage(state.page - 1));
els.nextPage.addEventListener('click', () => goToPage(state.page + 1));
els.pageInput.addEventListener('change', () => goToPage(Number(els.pageInput.value)));

els.zoomSelect.addEventListener('change', () => { if (state.pdfDoc) renderPage(state.page); });
els.zoomOut.addEventListener('click', () => stepZoom(-1));
els.zoomIn.addEventListener('click',  () => stepZoom(+1));

els.printBtn.addEventListener('click', printCurrent);

els.notesText.addEventListener('input', () => {
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(persistDocState, 250);
});
els.addAnnotation.addEventListener('click', addAnnotation);
els.notesTab.addEventListener('click', () => setTab('notes'));
els.annTab.addEventListener('click',   () => setTab('annotations'));
els.clearNotes.addEventListener('click', () => {
  if (!state.current) return;
  localStorage.removeItem(storageKey(state.current.id));
  els.notesText.value = '';
  renderAnnotations();
  setStatus('Notes cleared for this PDF', false);
});

// Re-render on wrap resize (e.g. fit-width after window resize)
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.pdfDoc && els.zoomSelect.value === 'page-width') renderPage(state.page);
  }, 150);
});

// ─── Boot ─────────────────────────────────────────────────────────────────
state.files = loadRecent();
renderFileList();
setTab('notes');
</script>
</body>
</html>
