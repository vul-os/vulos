  <line x1="24" y1="13" x2="24" y2="31" stroke="#7c6af7" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="9" y1="22" x2="39" y2="22" stroke="#7c6af7" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- Corner brackets -->
  <path d="M11 15 L11 19 M11 15 L15 15" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M37 15 L37 19 M37 15 L33 15" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M11 29 L11 25 M11 29 L15 29" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M37 29 L37 25 M37 29 L33 29" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Record dot -->
  <circle cx="38" cy="12" r="4" fill="#ef4444"/>
  <circle cx="38" cy="12" r="2" fill="#fff" opacity="0.9"/>
  <!-- Stand -->
  <rect x="19" y="34" width="10" height="2" rx="1" fill="#7c6af7" opacity="0.6"/>
  <rect x="16" y="36" width="16" height="2" rx="1" fill="#7c6af7" opacity="0.4"/>
</svg>
