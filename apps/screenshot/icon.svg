<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#1a1a2e"/>
  <!-- Screen frame -->
  <rect x="6" y="10" width="36" height="24" rx="3" stroke="#7c6af7" stroke-width="2" fill="#0f0f1a"/>
  <!-- Screen inner -->
  <rect x="9" y="13" width="30" height="18" rx="1" fill="#1e1e3a"/>
