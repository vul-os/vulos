<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Maps</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif}

/* ── Layout ─────────────────────────────────────────── */
#app{display:flex;height:100vh;width:100vw}
#sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:#111;border-right:1px solid #222;z-index:10}
#map-container{flex:1;position:relative}
#map{height:100%;width:100%}

/* ── Sidebar sections ────────────────────────────────── */
.section{padding:10px;border-bottom:1px solid #1e1e1e}
.section-title{font-size:10px;font-weight:600;letter-spacing:.08em;color:#555;text-transform:uppercase;margin-bottom:6px}

/* ── Search ──────────────────────────────────────────── */
#search-wrap{position:relative}
#search-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 10px;color:#e5e5e5;font-size:13px;outline:none;transition:border-color .15s}
#search-input:focus{border-color:#3b82f6}
#search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;max-height:240px;overflow-y:auto;z-index:1000;display:none}
.result-item{padding:8px 10px;cursor:pointer;font-size:12px;border-bottom:1px solid #222}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:#222}
.result-name{font-weight:500;color:#e5e5e5}
.result-addr{color:#666;font-size:11px;margin-top:1px}

/* ── Directions ──────────────────────────────────────── */
.dir-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.dir-label{font-size:11px;color:#666;width:22px;flex-shrink:0;text-align:right}
.dir-input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:6px 8px;color:#e5e5e5;font-size:12px;outline:none}
.dir-input:focus{border-color:#3b82f6}
#profile-tabs{display:flex;gap:4px;margin-bottom:8px}
.profile-btn{flex:1;padding:5px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;color:#999;font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
.profile-btn.active{background:#1d3557;border-color:#3b82f6;color:#e5e5e5}
#route-btn{width:100%;padding:7px;background:#1d4ed8;border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
#route-btn:hover{background:#2563eb}
#route-info{margin-top:8px;font-size:11px;color:#888;min-height:14px}
#route-steps{max-height:140px;overflow-y:auto;margin-top:6px}
.step{padding:4px 0;border-bottom:1px solid #1e1e1e;font-size:11px;color:#aaa;line-height:1.4}
.step:last-child{border-bottom:none}
.step-dist{color:#666;font-size:10px}

/* ── Favourites ──────────────────────────────────────── */
#favs-list{flex:1;overflow-y:auto}
.fav-item{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #1e1e1e;cursor:pointer;gap:6px}
.fav-item:hover{background:#161616}
.fav-icon{font-size:14px;flex-shrink:0}
.fav-name{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-coords{font-size:10px;color:#555}
.fav-del{padding:2px 6px;background:transparent;border:1px solid #333;border-radius:4px;color:#666;font-size:10px;cursor:pointer;flex-shrink:0;transition:all .15s}
.fav-del:hover{background:#3a1010;border-color:#7f1d1d;color:#ef4444}
.empty-msg{padding:12px 10px;font-size:11px;color:#444;text-align:center}

/* ── Map overlay buttons ─────────────────────────────── */
#locate-btn{position:absolute;bottom:90px;right:10px;z-index:500;width:36px;height:36px;background:#1a1a1a;border:1px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#e5e5e5;transition:background .15s}
#locate-btn:hover{background:#222}
#save-btn{position:absolute;bottom:50px;right:10px;z-index:500;width:36px;height:36px;background:#1a1a1a;border:1px solid #333;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#e5e5e5;transition:background .15s;display:none}
#save-btn:hover{background:#222}

/* ── Toast ───────────────────────────────────────────── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* ── Scrollbar ───────────────────────────────────────── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <!-- ── Sidebar ── -->
  <div id="sidebar">

    <!-- Search -->
    <div class="section">
      <div class="section-title">Search Places</div>
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Search address or place…" autocomplete="off">
        <div id="search-results"></div>
      </div>
    </div>

    <!-- Directions -->
    <div class="section">
      <div class="section-title">Directions</div>
      <div id="profile-tabs">
        <div class="profile-btn active" data-profile="driving" onclick="setProfile(this)">&#x1F697; Drive</div>
        <div class="profile-btn" data-profile="walking" onclick="setProfile(this)">&#x1F6B6; Walk</div>
        <div class="profile-btn" data-profile="cycling" onclick="setProfile(this)">&#x1F6B2; Cycle</div>
      </div>
      <div class="dir-row">
        <span class="dir-label">A</span>
        <input class="dir-input" id="from-input" type="text" placeholder="Starting point…" autocomplete="off">
      </div>
      <div class="dir-row">
        <span class="dir-label">B</span>
        <input class="dir-input" id="to-input" type="text" placeholder="Destination…" autocomplete="off">
      </div>
      <button id="route-btn" onclick="getRoute()">Get Directions</button>
      <div id="route-info"></div>
      <div id="route-steps"></div>
    </div>

    <!-- Favourites -->
    <div class="section-title" style="padding:10px 10px 4px">Favourites</div>
    <div id="favs-list"></div>

  </div>

  <!-- ── Map ── -->
  <div id="map-container">
    <div id="map"></div>
    <div id="locate-btn" title="My location" onclick="locateMe()">&#x25CE;</div>
    <div id="save-btn" title="Save to favourites" onclick="saveCurrent()">&#x2605;</div>
  </div>
</div>

<div id="toast"></div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
// ── Fix default icon paths (vendored) ─────────────────────────────────────────
delete L.Icon.Default.prototype._getIconUrl;
L.Icon.Default.mergeOptions({
  iconUrl:       '/vendor/leaflet/marker-icon.png',
  iconRetinaUrl: '/vendor/leaflet/marker-icon-2x.png',
  shadowUrl:     '/vendor/leaflet/marker-shadow.png',
});

// ── State ─────────────────────────────────────────────────────────────────────
let map, routeLayer = null, searchMarker = null, routeFrom = null, routeTo = null;
let currentLat = null, currentLon = null, currentName = '';
let activeProfile = 'driving';
let searchTimeout = null;
let fromCoords = null, toCoords = null;

// ── Initialise map ────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  // Right-click / long-press to drop pin
  map.on('contextmenu', e => {
    dropPin(e.latlng.lat, e.latlng.lng, 'Pinned location');
  });

  loadFavourites();
}

// ── Search ────────────────────────────────────────────────────────────────────
const searchInput  = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchResults.style.display = 'none'; return; }
  searchTimeout = setTimeout(() => doSearch(q, searchResults, result => {
    flyTo(result.lat, result.lon, result.display_name);
  }), 300);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { searchResults.style.display = 'none'; searchInput.blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) searchResults.style.display = 'none';
});

async function doSearch(q, resultsEl, onSelect) {
  const res = await fetch('/api/search?q=' + encodeURIComponent(q));
  const data = await res.json();
  if (!data.length) { resultsEl.style.display = 'none'; return; }
  resultsEl.innerHTML = data.map((r, i) => `
    <div class="result-item" data-i="${i}">
      <div class="result-name">${escHtml(r.name || r.display_name.split(',')[0])}</div>
      <div class="result-addr">${escHtml(r.display_name)}</div>
    </div>`).join('');
  resultsEl.style.display = 'block';
  resultsEl.querySelectorAll('.result-item').forEach((el, i) => {
    el.addEventListener('click', () => {
      resultsEl.style.display = 'none';
      searchInput.value = data[i].display_name;
      onSelect(data[i]);
    });
  });
}

// Inline search in directions fields
function setupDirSearch(inputEl, onSelect) {
  let t = null;
  inputEl.addEventListener('input', () => {
    clearTimeout(t);
    const q = inputEl.value.trim();
    if (q.length < 2) return;
    t = setTimeout(async () => {
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      if (!data.length) return;
      // Just auto-select the first result quietly
      onSelect(data[0]);
      inputEl.dataset.lat = data[0].lat;
      inputEl.dataset.lon = data[0].lon;
    }, 600);
  });
}

setupDirSearch(document.getElementById('from-input'), d => { fromCoords = [parseFloat(d.lat), parseFloat(d.lon)]; });
setupDirSearch(document.getElementById('to-input'),   d => { toCoords   = [parseFloat(d.lat), parseFloat(d.lon)]; });

// ── Map actions ───────────────────────────────────────────────────────────────
function flyTo(lat, lon, name) {
  lat = parseFloat(lat); lon = parseFloat(lon);
  if (searchMarker) map.removeLayer(searchMarker);
  searchMarker = L.marker([lat, lon]).addTo(map).bindPopup(escHtml(name)).openPopup();
  map.flyTo([lat, lon], 14, { animate: true, duration: 1 });
  currentLat = lat; currentLon = lon; currentName = name;
  document.getElementById('save-btn').style.display = 'flex';
}

function dropPin(lat, lon, name) {
  flyTo(lat, lon, name);
}

// ── Geolocation ───────────────────────────────────────────────────────────────
function locateMe() {
  if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      flyTo(lat, lon, 'My Location');
      toast('Location found');
    },
    err => toast('Could not get location: ' + err.message),
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

// ── Routing ───────────────────────────────────────────────────────────────────
function setProfile(btn) {
  document.querySelectorAll('.profile-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeProfile = btn.dataset.profile;
}

async function getRoute() {
  const fromVal = document.getElementById('from-input').value.trim();
  const toVal   = document.getElementById('to-input').value.trim();
  const info    = document.getElementById('route-info');
  const steps   = document.getElementById('route-steps');

  if (!fromVal || !toVal) { toast('Enter both start and destination'); return; }

  // Geocode if we don't have coords yet
  if (!fromCoords) {
    const r = await fetch('/api/search?q=' + encodeURIComponent(fromVal));
    const d = await r.json();
    if (!d.length) { toast('Could not find starting point'); return; }
    fromCoords = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
  }
  if (!toCoords) {
    const r = await fetch('/api/search?q=' + encodeURIComponent(toVal));
    const d = await r.json();
    if (!d.length) { toast('Could not find destination'); return; }
    toCoords = [parseFloat(d[0].lat), parseFloat(d[0].lon)];
  }

  info.textContent = 'Calculating…';
  steps.innerHTML = '';

  const url = `/api/route?profile=${activeProfile}&from_lat=${fromCoords[0]}&from_lon=${fromCoords[1]}&to_lat=${toCoords[0]}&to_lon=${toCoords[1]}`;
  const res = await fetch(url);
  const data = await res.json();

  if (!data.routes || !data.routes.length) {
    info.textContent = 'No route found.';
    return;
  }

  const route = data.routes[0];
  const distKm = (route.distance / 1000).toFixed(1);
  const durMin = Math.round(route.duration / 60);
  info.textContent = `${distKm} km · ~${durMin} min`;

  // Draw route on map
  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = L.geoJSON(route.geometry, {
    style: { color: '#3b82f6', weight: 4, opacity: 0.85 }
  }).addTo(map);
  map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

  // Render turn-by-turn steps
  if (route.legs && route.legs[0] && route.legs[0].steps) {
    steps.innerHTML = route.legs[0].steps.map(s => {
      const d = s.distance >= 1000
        ? (s.distance / 1000).toFixed(1) + ' km'
        : Math.round(s.distance) + ' m';
      const name = s.name ? escHtml(s.name) : 'Continue';
      const maneuver = s.maneuver && s.maneuver.type ? capitalise(s.maneuver.type.replace(/-/g,' ')) : '';
      return `<div class="step">${maneuver ? maneuver + ' — ' : ''}${name} <span class="step-dist">(${d})</span></div>`;
    }).join('');
  }

  // Markers for A and B
  if (routeFrom) map.removeLayer(routeFrom);
  if (routeTo)   map.removeLayer(routeTo);
  const iconA = makeLetterIcon('A', '#22c55e');
  const iconB = makeLetterIcon('B', '#ef4444');
  routeFrom = L.marker(fromCoords, { icon: iconA }).addTo(map).bindPopup('Start: ' + fromVal);
  routeTo   = L.marker(toCoords,   { icon: iconB }).addTo(map).bindPopup('End: ' + toVal);
}

function makeLetterIcon(letter, color) {
  return L.divIcon({
    html: `<div style="width:24px;height:24px;background:${color};border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,0.7)">${letter}</div>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12],
    className: '',
  });
}

// ── Favourites ────────────────────────────────────────────────────────────────
let favourites = [];

async function loadFavourites() {
  try {
    const res = await fetch('/api/favourites');
    favourites = await res.json();
  } catch { favourites = []; }
  renderFavourites();
}

function renderFavourites() {
  const el = document.getElementById('favs-list');
  if (!favourites.length) {
    el.innerHTML = '<div class="empty-msg">No saved places yet.<br>Search and click ★ to save.</div>';
    return;
  }
  el.innerHTML = favourites.map((f, i) => `
    <div class="fav-item" onclick="flyTo(${f.lat},${f.lon},'${escJs(f.name)}')">
      <span class="fav-icon">&#x2605;</span>
      <div style="flex:1;min-width:0">
        <div class="fav-name">${escHtml(f.name)}</div>
        <div class="fav-coords">${f.lat.toFixed(4)}, ${f.lon.toFixed(4)}</div>
      </div>
      <button class="fav-del" onclick="event.stopPropagation();deleteFav(${i})">&#x2715;</button>
    </div>`).join('');
}

async function saveCurrent() {
  if (currentLat === null) return;
  const name = prompt('Save as:', currentName || 'My Place');
  if (!name) return;
  const res = await fetch('/api/favourites', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, lat: currentLat, lon: currentLon }),
  });
  const d = await res.json();
  if (d.status === 'exists') { toast('Already in favourites'); return; }
  toast('Saved to favourites');
  await loadFavourites();
}

async function deleteFav(idx) {
  await fetch('/api/favourites/' + idx, { method: 'DELETE' });
  await loadFavourites();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escJs(str) {
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function capitalise(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initMap();
</script>
</body>
</html>
