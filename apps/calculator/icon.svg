<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Productivity: indigo tile -->
  <rect width="64" height="64" rx="14" fill="#312e81"/>
  <!-- Calculator body -->
  <rect x="16" y="12" width="32" height="40" rx="5" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Display -->
  <rect x="20" y="16" width="24" height="9" rx="3" fill="#a5b4fc" opacity="0.9"/>
  <!-- Button grid: row 1 -->
  <rect x="20" y="29" width="7" height="6" rx="2" fill="#4338ca"/>
  <rect x="29" y="29" width="7" height="6" rx="2" fill="#4338ca"/>
  <rect x="38" y="29" width="6" height="6" rx="2" fill="#6366f1"/>
  <!-- Button grid: row 2 -->
  <rect x="20" y="37" width="7" height="6" rx="2" fill="#4338ca"/>
  <rect x="29" y="37" width="7" height="6" rx="2" fill="#4338ca"/>
  <rect x="38" y="37" width="6" height="6" rx="2" fill="#a5b4fc"/>
  <!-- Button grid: row 3 -->
  <rect x="20" y="45" width="16" height="5" rx="2" fill="#4338ca"/>
  <rect x="38" y="45" width="6" height="5" rx="2" fill="#a5b4fc"/>
</svg>
