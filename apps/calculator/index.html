<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg: #101113;
  --panel: #191b1f;
  --panel-2: #202329;
  --line: #30343b;
  --text: #f2f4f7;
  --muted: #9ca3af;
  --num: #2b3038;
  --op: #254456;
  --op-hover: #2d5a73;
  --accent: #46c2a6;
  --danger: #dc6b6b;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
.app {
  display: grid;
  grid-template-columns: minmax(320px, 440px) minmax(240px, 1fr);
  gap: 14px;
  min-height: 100vh;
  padding: 14px;
}
.calculator, .history {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 13px;
  font-weight: 650;
  color: #d7dde4;
}
.mode {
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  background: #111316;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px;
}
.mode button {
  min-width: 82px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  padding: 6px 9px;
  cursor: pointer;
}
.mode button.active {
  background: var(--panel-2);
  color: var(--text);
}
.display {
  padding: 18px 14px 12px;
  border-bottom: 1px solid var(--line);
}
.expression {
  width: 100%;
  min-height: 35px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #cbd5e1;
  text-align: right;
  font-size: 20px;
}
.result {
  min-height: 48px;
  overflow: hidden;
  text-align: right;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.12;
  font-weight: 700;
}
.status {
  min-height: 18px;
  margin-top: 5px;
  text-align: right;
  color: var(--danger);
  font-size: 12px;
}
.keypad {
  display: grid;
  gap: 8px;
  padding: 10px;
}
.scientific-pad {
  display: none;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.scientific .scientific-pad { display: grid; }
.standard-pad {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.key {
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--num);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
}
.key:hover { filter: brightness(1.14); }
.key:active { transform: translateY(1px); }
.key.small { height: 42px; font-size: 14px; color: #d4d8de; }
.key.op { background: var(--op); }
.key.action { background: #363b45; }
.key.equal { background: var(--accent); color: #081310; font-weight: 800; }
.key.danger { color: #fee2e2; background: #4a2528; }
.key.zero { grid-column: span 2; }
.history {
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
}
.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.history-head h2 {
  margin: 0;
  font-size: 13px;
}
.toolbar {
  display: flex;
  gap: 8px;
}
.tool {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: #d1d5db;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 12px;
}
.tape {
  min-height: 0;
  overflow: auto;
  padding: 8px;
}
.empty {
  color: var(--muted);
  padding: 24px 8px;
  text-align: center;
  font-size: 13px;
}
.entry {
  width: 100%;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  padding: 9px;
  text-align: right;
  cursor: pointer;
}
.entry:hover {
  background: var(--panel-2);
  border-color: var(--line);
}
.entry .expr {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.entry .value {
  margin-top: 3px;
  font-size: 20px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
@media (max-width: 760px) {
  .app {
    grid-template-columns: 1fr;
    padding: 8px;
  }
  .history { min-height: 260px; }
  .key { height: 48px; }
}
</style>
</head>
<body>
<main class="app">
  <section class="calculator" id="calculator">
    <div class="topbar">
      <div class="brand">Calculator</div>
      <div class="mode" aria-label="Calculator mode">
        <button id="standardMode" class="active" type="button">Standard</button>
        <button id="scientificMode" type="button">Scientific</button>
      </div>
    </div>
    <div class="display">
      <input id="expression" class="expression" autocomplete="off" spellcheck="false" inputmode="decimal" aria-label="Expression">
      <div id="result" class="result">0</div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
    <div class="keypad">
      <div class="scientific-pad">
        <button class="key small op" data-insert="sin(">sin</button>
        <button class="key small op" data-insert="cos(">cos</button>
        <button class="key small op" data-insert="tan(">tan</button>
        <button class="key small op" data-insert="ln(">ln</button>
        <button class="key small op" data-insert="log(">log</button>
        <button class="key small op" data-insert="asin(">asin</button>
        <button class="key small op" data-insert="acos(">acos</button>
        <button class="key small op" data-insert="atan(">atan</button>
        <button class="key small op" data-insert="sqrt(">sqrt</button>
        <button class="key small op" data-insert="^">x^y</button>
        <button class="key small op" data-insert="pi">pi</button>
        <button class="key small op" data-insert="e">e</button>
        <button class="key small op" data-insert="("> ( </button>
        <button class="key small op" data-insert=")"> ) </button>
        <button class="key small op" data-insert="!">x!</button>
      </div>
      <div class="standard-pad">
        <button class="key danger" data-action="clear">C</button>
        <button class="key action" data-action="backspace">⌫</button>
        <button class="key action" data-insert="%">%</button>
        <button class="key op" data-insert="/">÷</button>
        <button class="key" data-insert="7">7</button>
        <button class="key" data-insert="8">8</button>
        <button class="key" data-insert="9">9</button>
        <button class="key op" data-insert="*">×</button>
        <button class="key" data-insert="4">4</button>
        <button class="key" data-insert="5">5</button>
        <button class="key" data-insert="6">6</button>
        <button class="key op" data-insert="-">−</button>
        <button class="key" data-insert="1">1</button>
        <button class="key" data-insert="2">2</button>
        <button class="key" data-insert="3">3</button>
        <button class="key op" data-insert="+">+</button>
        <button class="key zero" data-insert="0">0</button>
        <button class="key" data-insert=".">.</button>
        <button class="key equal" data-action="equals">=</button>
      </div>
    </div>
  </section>
  <aside class="history" aria-label="History tape">
    <div class="history-head">
      <h2>History Tape</h2>
      <div class="toolbar">
        <button id="copyResult" class="tool" type="button">Copy result</button>
        <button id="clearHistory" class="tool" type="button">Clear</button>
      </div>
    </div>
    <div id="tape" class="tape"></div>
  </aside>
</main>
<script>
const HISTORY_KEY = "vulos.calculator.history";
const MODE_KEY = "vulos.calculator.mode";
const expressionInput = document.getElementById("expression");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");
const tapeEl = document.getElementById("tape");
const calculatorEl = document.getElementById("calculator");
const standardMode = document.getElementById("standardMode");
const scientificMode = document.getElementById("scientificMode");
let history = loadHistory();
let lastResult = "0";

const functions = {
  sin: Math.sin,
  cos: Math.cos,
  tan: Math.tan,
  asin: Math.asin,
  acos: Math.acos,
  atan: Math.atan,
  sqrt: Math.sqrt,
  ln: Math.log,
  log: Math.log10,
  abs: Math.abs
};

const operators = {
  "+": { precedence: 1, assoc: "left", args: 2, fn: (a, b) => a + b },
  "-": { precedence: 1, assoc: "left", args: 2, fn: (a, b) => a - b },
  "*": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a * b },
  "/": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a / b },
  "%": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a % b },
  "^": { precedence: 4, assoc: "right", args: 2, fn: (a, b) => Math.pow(a, b) },
  "u-": { precedence: 3, assoc: "right", args: 1, fn: a => -a },
  "!": { precedence: 5, assoc: "left", args: 1, postfix: true, fn: factorial }
};

function loadHistory() {
  try {
    const items = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(items) ? items.slice(0, 100) : [];
  } catch {
    return [];
  }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 100)));
}

function setMode(mode) {
  const scientific = mode === "scientific";
  calculatorEl.classList.toggle("scientific", scientific);
  standardMode.classList.toggle("active", !scientific);
  scientificMode.classList.toggle("active", scientific);
  localStorage.setItem(MODE_KEY, mode);
  expressionInput.focus();
}

function insertText(text) {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  const value = expressionInput.value;
  expressionInput.value = value.slice(0, start) + text + value.slice(end);
  const cursor = start + text.length;
  expressionInput.setSelectionRange(cursor, cursor);
  preview();
}

function backspace() {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  if (start !== end) {
    insertText("");
    return;
  }
  if (start > 0) {
    expressionInput.value = expressionInput.value.slice(0, start - 1) + expressionInput.value.slice(start);
    expressionInput.setSelectionRange(start - 1, start - 1);
    preview();
  }
}

function clearExpression() {
  expressionInput.value = "";
  resultEl.textContent = "0";
  statusEl.textContent = "";
  expressionInput.focus();
}

function preview() {
  statusEl.textContent = "";
  const expr = expressionInput.value.trim();
  if (!expr) {
    resultEl.textContent = lastResult;
    return;
  }
  try {
    const value = evaluate(expr);
    resultEl.textContent = formatNumber(value);
  } catch {
  }
}

function commitCalculation() {
  const expr = expressionInput.value.trim();
  if (!expr) return;
  try {
    const value = evaluate(expr);
    const result = formatNumber(value);
    resultEl.textContent = result;
    statusEl.textContent = "";
    lastResult = result;
    history.unshift({ expression: expr, result, time: Date.now() });
    history = history.slice(0, 100);
    saveHistory();
    renderHistory();
    expressionInput.value = result;
    expressionInput.select();
  } catch (error) {
    statusEl.textContent = error.message || "Invalid expression";
  }
}

function copyResult() {
  const value = resultEl.textContent || "0";
  navigator.clipboard.writeText(value).then(() => {
    statusEl.textContent = "Copied";
    setTimeout(() => {
      if (statusEl.textContent === "Copied") statusEl.textContent = "";
    }, 1200);
  }).catch(() => {
    statusEl.textContent = "Clipboard unavailable";
  });
}

function renderHistory() {
  tapeEl.innerHTML = "";
  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No calculations yet";
    tapeEl.appendChild(empty);
    return;
  }
  history.forEach(item => {
    const button = document.createElement("button");
    button.className = "entry";
    button.type = "button";
    button.title = "Reuse this result";
    button.innerHTML = `<div class="expr"></div><div class="value"></div>`;
    button.querySelector(".expr").textContent = item.expression;
    button.querySelector(".value").textContent = item.result;
    button.addEventListener("click", () => {
      expressionInput.value = item.result;
      lastResult = item.result;
      resultEl.textContent = item.result;
      expressionInput.focus();
      expressionInput.select();
    });
    tapeEl.appendChild(button);
  });
}

function evaluate(input) {
  const tokens = tokenize(input);
  const rpn = toRpn(tokens);
  const value = solveRpn(rpn);
  if (!Number.isFinite(value)) throw new Error("Result is not finite");
  return value;
}

function tokenize(input) {
  const normalized = input.toLowerCase().replaceAll("π", "pi").replaceAll("×", "*").replaceAll("÷", "/").replaceAll("−", "-");
  const tokens = [];
  let i = 0;
  while (i < normalized.length) {
    const char = normalized[i];
    if (/\s/.test(char)) {
      i += 1;
    } else if (/[0-9.]/.test(char)) {
      let raw = "";
      while (i < normalized.length && /[0-9.]/.test(normalized[i])) raw += normalized[i++];
      if ((raw.match(/\./g) || []).length > 1) throw new Error("Invalid number");
      tokens.push({ type: "number", value: Number(raw) });
    } else if (/[a-z]/.test(char)) {
      let name = "";
      while (i < normalized.length && /[a-z]/.test(normalized[i])) name += normalized[i++];
      if (name === "pi") tokens.push({ type: "number", value: Math.PI });
      else if (name === "e") tokens.push({ type: "number", value: Math.E });
      else if (functions[name]) tokens.push({ type: "function", value: name });
      else throw new Error(`Unknown function: ${name}`);
    } else if ("+-*/%^!".includes(char)) {
      tokens.push({ type: "operator", value: char });
      i += 1;
    } else if (char === "(" || char === ")") {
      tokens.push({ type: "paren", value: char });
      i += 1;
    } else {
      throw new Error("Invalid character");
    }
  }
  return tokens;
}

function toRpn(tokens) {
  const output = [];
  const stack = [];
  let prev = "start";
  tokens.forEach(token => {
    if (token.type === "number") {
      output.push(token);
      prev = "value";
    } else if (token.type === "function") {
      stack.push(token);
      prev = "function";
    } else if (token.type === "operator") {
      let op = token.value;
      if (op === "-" && (prev === "start" || prev === "operator" || prev === "leftParen" || prev === "function")) op = "u-";
      const current = operators[op];
      if (!current) throw new Error("Unknown operator");
      while (stack.length) {
        const top = stack[stack.length - 1];
        const topOp = operators[top.value];
        if (top.type === "function" || (topOp && ((current.assoc === "left" && current.precedence <= topOp.precedence) || (current.assoc === "right" && current.precedence < topOp.precedence)))) {
          output.push(stack.pop());
        } else {
          break;
        }
      }
      stack.push({ type: "operator", value: op });
      prev = op === "!" ? "value" : "operator";
    } else if (token.value === "(") {
      stack.push(token);
      prev = "leftParen";
    } else if (token.value === ")") {
      while (stack.length && stack[stack.length - 1].value !== "(") output.push(stack.pop());
      if (!stack.length) throw new Error("Mismatched parentheses");
      stack.pop();
      if (stack.length && stack[stack.length - 1].type === "function") output.push(stack.pop());
      prev = "value";
    }
  });
  while (stack.length) {
    const token = stack.pop();
    if (token.type === "paren") throw new Error("Mismatched parentheses");
    output.push(token);
  }
  return output;
}

function solveRpn(tokens) {
  const stack = [];
  tokens.forEach(token => {
    if (token.type === "number") {
      stack.push(token.value);
    } else if (token.type === "function") {
      if (!stack.length) throw new Error("Missing function input");
      stack.push(functions[token.value](stack.pop()));
    } else if (token.type === "operator") {
      const op = operators[token.value];
      if (stack.length < op.args) throw new Error("Missing operator input");
      if (op.args === 1) stack.push(op.fn(stack.pop()));
      else {
        const b = stack.pop();
        const a = stack.pop();
        stack.push(op.fn(a, b));
      }
    }
  });
  if (stack.length !== 1) throw new Error("Invalid expression");
  return stack[0];
}

function factorial(value) {
  if (!Number.isInteger(value) || value < 0 || value > 170) throw new Error("Factorial requires an integer from 0 to 170");
  let total = 1;
  for (let i = 2; i <= value; i += 1) total *= i;
  return total;
}

function formatNumber(value) {
  if (Object.is(value, -0)) value = 0;
  const abs = Math.abs(value);
  if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return value.toExponential(10).replace(/\.?0+e/, "e");
  return Number(value.toPrecision(14)).toString();
}

document.querySelectorAll("[data-insert]").forEach(button => {
  button.addEventListener("click", () => {
    insertText(button.dataset.insert);
    expressionInput.focus();
  });
});

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => {
    if (button.dataset.action === "clear") clearExpression();
    if (button.dataset.action === "backspace") backspace();
    if (button.dataset.action === "equals") commitCalculation();
  });
});

expressionInput.addEventListener("input", preview);
expressionInput.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === "=") {
    event.preventDefault();
    commitCalculation();
  } else if (event.key === "Escape") {
    event.preventDefault();
    clearExpression();
  }
});

standardMode.addEventListener("click", () => setMode("standard"));
scientificMode.addEventListener("click", () => setMode("scientific"));
document.getElementById("copyResult").addEventListener("click", copyResult);
document.getElementById("clearHistory").addEventListener("click", () => {
  history = [];
  saveHistory();
  renderHistory();
});

setMode(localStorage.getItem(MODE_KEY) || "standard");
renderHistory();
expressionInput.focus();
</script>
</body>
</html>
