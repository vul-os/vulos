<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Diwan">
  <title>Diwan</title>
  <defs>
    <!-- A soft sheen so the tile reads like warm, lit material, not flat paint -->
    <linearGradient id="diwan-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed ember tile -->
  <rect width="512" height="512" rx="113" fill="#D0471F"/>
  <rect width="512" height="512" rx="113" fill="url(#diwan-sheen)"/>
  <!-- Ring mark, centred (geometry kept as-is; the mark is being redesigned separately) -->
  <circle cx="256" cy="256" r="134" fill="none" stroke="#FBF3E9" stroke-width="70"/>
  <!-- Ember bead centred in the counter -->
  <circle cx="256" cy="256" r="35" fill="#FBF3E9"/>
</svg>
