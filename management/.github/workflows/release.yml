name: Release

# On tag vX.Y.Z:
#   - version-guard: tag must equal the VERSION file (fail closed before any build runs)
#   - test: go vet + go test ./... against the exact commit being released
#   - build: single control-plane binary (./cmd/server), cross-compiled for
#     linux/amd64, linux/arm64, darwin/amd64, darwin/arm64 (CGO_ENABLED=0 —
#     the sqlite driver is modernc.org/sqlite, pure Go, so cross-compiling
#     needs no C toolchain). web/dist (the built React console) is committed
#     to the repo, so go:embed picks it up with no Node step here.
#   - release: one GitHub Release with all four archives + SHA256SUMS.txt
#
# There is no container image published by this workflow — vulos-management
# is a library + self-host binary; vulos-cloud (private) owns the image build
# for the commercial deployment.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version-guard:
    name: tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag == VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag VERSION=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file ($ver) — bump VERSION before pushing the tag"
            exit 1
          fi

  test:
    name: vet & test
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # web/dist (the built management console SPA) is committed to the repo
      # per web/embed.go's EMBED CONTRACT, so `go build` alone produces a
      # binary with the console baked in — no npm/Playwright needed here.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="vulos-management_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/${name}/cp" ./cmd/server
          cp README.md CHANGELOG.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Self-host control-plane binary (`cp`) for each platform, plus `SHA256SUMS.txt` covering every attached file.

            `vulos-management` is the OSS (MIT) operational control plane — the free no-op billing seam and bring-your-own-bucket storage are wired in. See [README.md](https://github.com/vul-os/vulos-management#readme) for `make dev` / `make run` and [docs/SELF-HOST.md](https://github.com/vul-os/vulos-management/blob/main/docs/SELF-HOST.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
