<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-shared-assets.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>

  <div class="sep"></div>
  <div class="group">

    <button id="btn-redo" onclick="redo()" disabled title="Redo (Ctrl+Y)">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 0 4-4h12"/>
      </svg>

  <div class="sep"></div>
  <div class="group">

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>

        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

<div id="main">

          <line x1="4" y1="22" x2="44" y2="22" stroke="#7c6af7" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>

          <rect x="18" y="36" width="12" height="2" rx="1" fill="#7c6af7" opacity="0.5"/>

      <span class="label">Tool:</span>
      <button id="t-arrow" class="active" onclick="setTool('arrow')" title="Arrow">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="19" x2="19" y2="5"/><polyline points="8 5 19 5 19 16"/>
        </svg>Arrow
      </button>
      <button id="t-text" onclick="setTool('text')" title="Text">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>Text
      </button>
      <button id="t-rect" onclick="setTool('rect')" title="Rectangle">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>Rect
      </button>
      <button id="t-blur" onclick="setTool('blur')" title="Blur region">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/>
        </svg>Blur
      </button>
      <div class="sep"></div>
      <span class="label">Color:</span>
      <input type="color" id="tool-color" value="#ef4444" title="Annotation color">
      <div class="sep"></div>
      <span class="label">Size:</span>
      <input type="range" id="tool-size" min="1" max="20" value="3" oninput="updateSize()">
      <span id="tool-size-label">3</span>
    </div>
  </div>

  <!-- Gallery sidebar -->
  <div id="sidebar">
    <h3>Saved</h3>
    <div id="gallery"></div>
  </div>

<div id="status">Ready — click Screenshot to capture</div>

<script>
// ─── State ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const annotBar = document.getElementById('annot-bar');
const cropBar = document.getElementById('crop-bar');
const cropOverlay = document.getElementById('crop-overlay');
const statusEl = document.getElementById('status');

let baseImage = null;       // ImageData of the clean captured image
let undoStack = [];         // stack of ImageData snapshots
let redoStack = [];
let currentTool = 'arrow';
let toolColor = '#ef4444';
let toolSize = 3;

// Drawing state
let drawing = false;
let startX = 0, startY = 0;
let previewSnap = null;     // snapshot before current stroke (for live preview)

// Crop state
let cropping = false;
let cropStart = {x:0,y:0}, cropEnd = {x:0,y:0};

// Recording state
let mediaRecorder = null;
let recChunks = [];
let recInterval = null;
let recStart = 0;
let recording = false;

// ─── Capture ──────────────────────────────────────────────
async function startCapture() {
  setStatus('Requesting screen access…');
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always' },
      audio: false,
    });
  } catch(e) {
    setStatus('Screen capture cancelled.');
    return;
  }
  const video = document.createElement('video');
  video.srcObject = stream;
  video.onloadedmetadata = () => {
    video.play();
    requestAnimationFrame(() => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      stream.getTracks().forEach(t => t.stop());
      baseImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
      showCanvas();
      pushUndo();
      setStatus(`Captured ${canvas.width}×${canvas.height} — annotate or save`);
    });
  };
}

function showCanvas() {
  placeholder.style.display = 'none';
  canvas.style.display = 'block';
  annotBar.style.display = 'flex';
  document.getElementById('btn-copy').disabled = false;
  document.getElementById('btn-save').disabled = false;
  document.getElementById('btn-crop').disabled = false;
}

// ─── Screen Recording ─────────────────────────────────────
async function toggleRecord() {
  if (recording) {
    stopRecord();
  } else {
    await startRecord();
  }
}

async function startRecord() {
  setStatus('Requesting screen access for recording…');
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always' },
      audio: true,
    });
  } catch(e) {
    setStatus('Recording cancelled.');
    return;
  }

  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';

  recChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = finishRecord;
  mediaRecorder.start(1000);

  // Stop if user ends share via browser UI
  stream.getVideoTracks()[0].addEventListener('ended', () => {
    if (recording) stopRecord();
  });

  recording = true;
  recStart = Date.now();
  recInterval = setInterval(updateRecTimer, 500);

  const dot = document.getElementById('rec-dot');
  dot.classList.add('pulse');
  document.getElementById('rec-label').textContent = 'Stop';
  document.getElementById('rec-timer').style.display = 'inline';
  document.getElementById('btn-record').style.borderColor = '#ef4444';
  setStatus('Recording…');
}

function stopRecord() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
    mediaRecorder.stop();
  }
  recording = false;
  clearInterval(recInterval);
  document.getElementById('rec-dot').classList.remove('pulse');
  document.getElementById('rec-label').textContent = 'Record';
  document.getElementById('rec-timer').style.display = 'none';
  document.getElementById('btn-record').style.borderColor = '';
  setStatus('Processing recording…');
}

function updateRecTimer() {
  const secs = Math.floor((Date.now() - recStart) / 1000);
  const m = String(Math.floor(secs / 60)).padStart(2, '0');
  const s = String(secs % 60).padStart(2, '0');
  document.getElementById('rec-timer').textContent = `${m}:${s}`;
}

async function finishRecord() {
  const blob = new Blob(recChunks, { type: 'video/webm' });
  const buf = await blob.arrayBuffer();
  try {
    const res = await fetch(vulosApi.appUrl('/api/save/recording'), {
      method: 'POST',
      headers: { 'Content-Type': 'video/webm', 'Content-Length': buf.byteLength },
      body: buf,
    });
    const data = await res.json();
    setStatus(`Recording saved: ${data.name}`);
    loadGallery();
  } catch(e) {
    setStatus(`Save failed: ${e.message}`);
  }
}

// ─── Annotation tools ─────────────────────────────────────
function setTool(t) {
  currentTool = t;
  cancelCrop();
  ['arrow','text','rect','blur'].forEach(id => {
    document.getElementById('t-'+id).classList.toggle('active', id===t);
  });
  canvas.className = `cursor-${t}`;
}

function updateSize() {
  toolSize = +document.getElementById('tool-size').value;
  document.getElementById('tool-size-label').textContent = toolSize;
}

// Canvas scale (for HiDPI)
function getScale() {
  const cont = canvas.parentElement;
  const scaleX = cont.clientWidth / canvas.width;
  const scaleY = cont.clientHeight / canvas.height;
  return Math.min(scaleX, scaleY, 1);
}

function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

canvas.addEventListener('mousedown', e => {
  if (!baseImage) return;
  if (cropping) { startCropDrag(e); return; }
  if (currentTool === 'text') { addText(e); return; }
  drawing = true;
  const p = canvasPos(e);
  startX = p.x; startY = p.y;
  previewSnap = ctx.getImageData(0, 0, canvas.width, canvas.height);
});

canvas.addEventListener('mousemove', e => {
  if (cropping) { updateCropDrag(e); return; }
  if (!drawing) return;
  const p = canvasPos(e);
  // Restore pre-stroke snapshot for live preview
  ctx.putImageData(previewSnap, 0, 0);
  const color = document.getElementById('tool-color').value;
  drawShape(currentTool, startX, startY, p.x, p.y, color, toolSize, false);
});

canvas.addEventListener('mouseup', e => {
  if (cropping) { endCropDrag(e); return; }
  if (!drawing) return;
  drawing = false;
  const p = canvasPos(e);
  ctx.putImageData(previewSnap, 0, 0);
  const color = document.getElementById('tool-color').value;
  drawShape(currentTool, startX, startY, p.x, p.y, color, toolSize, true);
  previewSnap = null;
  pushUndo();
});

canvas.addEventListener('mouseleave', () => {
  if (drawing && previewSnap) {
    ctx.putImageData(previewSnap, 0, 0);
    drawing = false;
    previewSnap = null;
  }
});

function drawShape(tool, x1, y1, x2, y2, color, size, commit) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (tool === 'arrow') {
    drawArrow(x1, y1, x2, y2, size);
  } else if (tool === 'rect') {
    ctx.strokeRect(x1, y1, x2-x1, y2-y1);
  } else if (tool === 'blur') {
    if (commit) {
      applyBlur(x1, y1, x2, y2);
    } else {
      // Preview: dashed rect
      ctx.setLineDash([4,4]);
      ctx.strokeStyle = color;
      ctx.strokeRect(x1, y1, x2-x1, y2-y1);
    }
  }
  ctx.restore();
}

function drawArrow(x1, y1, x2, y2, size) {
  const headLen = Math.max(12, size * 4);
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // Arrowhead
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(
    x2 - headLen * Math.cos(angle - Math.PI/7),
    y2 - headLen * Math.sin(angle - Math.PI/7)
  );
  ctx.lineTo(
    x2 - headLen * Math.cos(angle + Math.PI/7),
    y2 - headLen * Math.sin(angle + Math.PI/7)
  );
  ctx.closePath();
  ctx.fill();
}

function applyBlur(x1, y1, x2, y2) {
  const lx = Math.min(x1,x2), ly = Math.min(y1,y2);
  const w = Math.abs(x2-x1), h = Math.abs(y2-y1);
  if (w < 2 || h < 2) return;
  // Pixelate region (no OffscreenCanvas required)
  const blockSize = Math.max(8, Math.round(Math.min(w,h)/10));
  const imgData = ctx.getImageData(lx, ly, w, h);
  const d = imgData.data;
  for (let by = 0; by < h; by += blockSize) {
    for (let bx = 0; bx < w; bx += blockSize) {
      // Average block colour
      let r=0, g=0, b=0, count=0;
      for (let py=by; py<Math.min(by+blockSize,h); py++) {
        for (let px=bx; px<Math.min(bx+blockSize,w); px++) {
          const i=(py*w+px)*4;
          r+=d[i]; g+=d[i+1]; b+=d[i+2]; count++;
        }
      }
      r=r/count|0; g=g/count|0; b=b/count|0;
      // Fill block
      for (let py=by; py<Math.min(by+blockSize,h); py++) {
        for (let px=bx; px<Math.min(bx+blockSize,w); px++) {
          const i=(py*w+px)*4;
          d[i]=r; d[i+1]=g; d[i+2]=b;
        }
      }
    }
  }
  ctx.putImageData(imgData, lx, ly);
}

function addText(e) {
  const p = canvasPos(e);
  const color = document.getElementById('tool-color').value;
  const size = Math.max(14, toolSize * 5);
  const text = prompt('Enter text:');
  if (!text) return;
  ctx.save();
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 3;
  ctx.strokeText(text, p.x, p.y);
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
  pushUndo();
}

// ─── Crop ─────────────────────────────────────────────────
let _cropRect = null;

function setCropMode() {
  if (!baseImage) return;
  cropping = true;
  _cropRect = null;
  canvas.style.cursor = 'crosshair';
  cropBar.style.display = 'flex';
  cropOverlay.style.display = 'block';
  setStatus('Drag to select crop region');
}

function cancelCrop() {
  cropping = false;
  _cropRect = null;
  cropBar.style.display = 'none';
  cropOverlay.style.display = 'none';
  canvas.style.cursor = '';
}

function startCropDrag(e) {
  const p = canvasPos(e);
  cropStart = p; cropEnd = p;
  updateCropOverlay();
}

function updateCropDrag(e) {
  const p = canvasPos(e);
  cropEnd = p;
  updateCropOverlay();
}

function endCropDrag(e) {
  const p = canvasPos(e);
  cropEnd = p;
  _cropRect = getNormalizedRect(cropStart, cropEnd);
  updateCropOverlay();
}

function updateCropOverlay() {
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  const contRect = canvas.parentElement.getBoundingClientRect();
  const off = { left: rect.left - contRect.left, top: rect.top - contRect.top };
  const r = getNormalizedRect(cropStart, cropEnd);
  cropOverlay.style.left   = (off.left + r.x * scaleX) + 'px';
  cropOverlay.style.top    = (off.top  + r.y * scaleY) + 'px';
  cropOverlay.style.width  = (r.w * scaleX) + 'px';
  cropOverlay.style.height = (r.h * scaleY) + 'px';
}

function getNormalizedRect(a, b) {
  return {
    x: Math.min(a.x, b.x),
    y: Math.min(a.y, b.y),
    w: Math.abs(b.x - a.x),
    h: Math.abs(b.y - a.y),
  };
}

function applyCrop() {
  if (!_cropRect || _cropRect.w < 2 || _cropRect.h < 2) { cancelCrop(); return; }
  const {x, y, w, h} = _cropRect;
  const imgData = ctx.getImageData(x, y, w, h);
  canvas.width = w;
  canvas.height = h;
  ctx.putImageData(imgData, 0, 0);
  baseImage = ctx.getImageData(0, 0, w, h);
  cancelCrop();
  pushUndo();
  setStatus(`Cropped to ${w}×${h}`);
}

// ─── Undo / Redo ──────────────────────────────────────────
function pushUndo() {
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > 30) undoStack.shift();
  redoStack = [];
  document.getElementById('btn-undo').disabled = undoStack.length <= 1;
  document.getElementById('btn-redo').disabled = true;
}

function undo() {
  if (undoStack.length <= 1) return;
  redoStack.push(undoStack.pop());
  const snap = undoStack[undoStack.length - 1];
  canvas.width = snap.width; canvas.height = snap.height;
  ctx.putImageData(snap, 0, 0);
  document.getElementById('btn-undo').disabled = undoStack.length <= 1;
  document.getElementById('btn-redo').disabled = false;
}

function redo() {
  if (!redoStack.length) return;
  const snap = redoStack.pop();
  undoStack.push(snap);
  canvas.width = snap.width; canvas.height = snap.height;
  ctx.putImageData(snap, 0, 0);
  document.getElementById('btn-undo').disabled = false;
  document.getElementById('btn-redo').disabled = !redoStack.length;
}

// ─── Save ─────────────────────────────────────────────────
async function saveToServer() {
  if (!baseImage && undoStack.length === 0) return;
  const dataUrl = canvas.toDataURL('image/png');
  setStatus('Saving…');
  try {
    const res = await fetch(vulosApi.appUrl('/api/save/screenshot'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataUrl }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    setStatus(`Saved: ${data.name}`);
    loadGallery();
  } catch(e) {
    setStatus(`Save failed: ${e.message}`);
  }
}

// ─── Clipboard ────────────────────────────────────────────
async function copyToClipboard() {
  try {
    canvas.toBlob(async (blob) => {
      try {
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob }),
        ]);
        setStatus('Copied to clipboard!');
      } catch(e) {
        // Fallback: open in new tab so user can right-click save
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        setStatus('Opened in new tab (clipboard unavailable)');
      }
    }, 'image/png');
  } catch(e) {
    setStatus(`Copy failed: ${e.message}`);
  }
}

// ─── Gallery ──────────────────────────────────────────────
async function loadGallery() {
  try {
    const res = await fetch(vulosApi.appUrl('/api/screenshots'));
    const items = await res.json();
    const el = document.getElementById('gallery');
    if (!items.length) {
      el.innerHTML = '<div style="padding:12px;color:var(--muted);font-size: 12px;text-align:center">No captures yet</div>';
      return;
    }
    el.innerHTML = items.map(it => `
      <div class="thumb-item" onclick="loadItem('${it.name}')" id="th-${CSS.escape(it.name)}">
        ${it.type === 'video'
          ? `<video src="${vulosApi.appUrl('/api/file/' + encodeURIComponent(it.name))}" muted></video>`
          : `<img src="${vulosApi.appUrl('/api/file/' + encodeURIComponent(it.name))}" loading="lazy">`
        }
        <div class="thumb-label">${it.name}</div>
        <button class="thumb-del" onclick="deleteItem(event,'${it.name}')">✕</button>
      </div>
    `).join('');
  } catch(e) {
    console.warn('gallery load failed', e);
  }
}

async function loadItem(name) {
  if (name.endsWith('.webm')) {
    const url = vulosApi.appUrl('/api/file/' + encodeURIComponent(name));
    window.open(url, '_blank');
    return;
  }
  // Load PNG onto canvas
  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    baseImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    undoStack = [];
    redoStack = [];
    showCanvas();
    pushUndo();
    setStatus(`Loaded: ${name} — ${img.width}×${img.height}`);
  };
  img.src = vulosApi.appUrl('/api/file/' + encodeURIComponent(name));
}

async function deleteItem(e, name) {
  e.stopPropagation();
  if (!confirm(`Delete ${name}?`)) return;
  await fetch(vulosApi.appUrl('/api/delete'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  loadGallery();
}

// ─── Keyboard shortcuts ───────────────────────────────────
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if (ctrl && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  if (ctrl && e.key === 's') { e.preventDefault(); saveToServer(); }
  if (ctrl && e.key === 'c' && canvas.style.display !== 'none') { e.preventDefault(); copyToClipboard(); }
});

// ─── Helpers ──────────────────────────────────────────────
function setStatus(msg) { statusEl.textContent = msg; }

// color picker change
document.getElementById('tool-color').addEventListener('input', e => { toolColor = e.target.value; });

// ─── Init ─────────────────────────────────────────────────
loadGallery();
</script>
</body>
