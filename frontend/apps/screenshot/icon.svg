<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Core/system: slate tile -->
  <rect width="64" height="64" rx="14" fill="#1e293b"/>
  <!-- Screen area -->
  <rect x="10" y="14" width="44" height="30" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Dashed capture frame inside screen -->
  <rect x="16" y="19" width="32" height="20" rx="3" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Corner bracket: top-left -->
  <path d="M16 24 L16 19 L21 19" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner bracket: top-right -->
  <path d="M48 24 L48 19 L43 19" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner bracket: bottom-left -->
  <path d="M16 35 L16 39 L21 39" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner bracket: bottom-right -->
  <path d="M48 35 L48 39 L43 39" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitor stand -->
  <rect x="28" y="44" width="8" height="5" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="22" y="49" width="20" height="3" rx="1.5" fill="#38bdf8" opacity="0.7"/>
</svg>
