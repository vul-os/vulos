<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Calculator</title>
<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg: #101113;
  --panel: #191b1f;
  --panel-2: #202329;
  --line: #30343b;
  --text: #f2f4f7;
  --muted: #9ca3af;
  --num: #2b3038;
  --op: #254456;
  --op-hover: #2d5a73;
  --accent: #46c2a6;
  --danger: #dc6b6b;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input { font: inherit; }
.app {
  display: grid;
  grid-template-columns: minmax(320px, 440px) minmax(240px, 1fr);
  gap: 14px;
  min-height: 100vh;
  padding: 14px;
}
.calculator, .history {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 13px;
  font-weight: 650;
  color: #d7dde4;
}
.mode {
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  background: #111316;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 2px;
}
.mode button {
  min-width: 82px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  padding: 6px 9px;
  cursor: pointer;
}
.mode button.active {
  background: var(--panel-2);
  color: var(--text);
}
.display {
  padding: 18px 14px 12px;
  border-bottom: 1px solid var(--line);
}
.expression {
  width: 100%;
  min-height: 35px;
  border: 0;
  outline: 0;
  background: transparent;
  color: #cbd5e1;
  text-align: right;
  font-size: 20px;
}
.result {
  min-height: 48px;
  overflow: hidden;
  text-align: right;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1.12;
  font-weight: 700;
}
.status {
  min-height: 18px;
  margin-top: 5px;
  text-align: right;
  color: var(--danger);
  font-size: 12px;
}
.keypad {
  display: grid;
  gap: 8px;
  padding: 10px;
}
.scientific-pad {
  display: none;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}
.scientific .scientific-pad { display: grid; }
.standard-pad {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.key {
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--num);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
}
.key:hover { filter: brightness(1.14); }
.key:active { transform: translateY(1px); }
.key.small { height: 42px; font-size: 14px; color: #d4d8de; }
.key.op { background: var(--op); }
.key.action { background: #363b45; }
.key.equal { background: var(--accent); color: #081310; font-weight: 800; }
.key.danger { color: #fee2e2; background: #4a2528; }
.key.zero { grid-column: span 2; }
.history {
  display: grid;
  grid-template-rows: auto 1fr;
  min-width: 0;
}
.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.history-head h2 {
  margin: 0;
  font-size: 13px;
}
.toolbar {
  display: flex;
  gap: 8px;
}
.tool {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-2);
  color: #d1d5db;
  padding: 6px 9px;
  cursor: pointer;
  font-size: 12px;
}
.tape {
  min-height: 0;
  overflow: auto;
  padding: 8px;
}
.empty {
  color: var(--muted);
  padding: 24px 8px;
  text-align: center;
  font-size: 13px;
}
.entry {
  width: 100%;
  border: 1px solid transparent;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  padding: 9px;
  text-align: right;
  cursor: pointer;
}
.entry:hover {
  background: var(--panel-2);
  border-color: var(--line);
}
.entry .expr {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.entry .value {
  margin-top: 3px;
  font-size: 20px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
@media (max-width: 760px) {
  .app {
    grid-template-columns: 1fr;
    padding: 8px;
  }
  .history { min-height: 260px; }
  .key { height: 48px; }
}
</style>
</head>

<main class="app">
  <section class="calculator" id="calculator">
    <div class="topbar">
      <div class="brand">Calculator</div>
      <div class="mode" aria-label="Calculator mode">
        <button id="standardMode" class="active" type="button">Standard</button>
        <button id="scientificMode" type="button">Scientific</button>
      </div>
    </div>
    <div class="display">
      <input id="expression" class="expression" autocomplete="off" spellcheck="false" inputmode="decimal" aria-label="Expression">
      <div id="result" class="result">0</div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
    <div class="keypad">
      <div class="scientific-pad">
        <button class="key small op" data-insert="sin(">sin</button>
        <button class="key small op" data-insert="cos(">cos</button>
        <button class="key small op" data-insert="tan(">tan</button>
        <button class="key small op" data-insert="ln(">ln</button>
        <button class="key small op" data-insert="log(">log</button>
        <button class="key small op" data-insert="asin(">asin</button>
        <button class="key small op" data-insert="acos(">acos</button>
        <button class="key small op" data-insert="atan(">atan</button>
        <button class="key small op" data-insert="sqrt(">sqrt</button>
        <button class="key small op" data-insert="^">x^y</button>
        <button class="key small op" data-insert="pi">pi</button>
        <button class="key small op" data-insert="e">e</button>
        <button class="key small op" data-insert="("> ( </button>
        <button class="key small op" data-insert=")"> ) </button>
        <button class="key small op" data-insert="!">x!</button>
      </div>
      <div class="standard-pad">
        <button class="key danger" data-action="clear">C</button>
        <button class="key action" data-action="backspace">⌫</button>
        <button class="key action" data-insert="%">%</button>
        <button class="key op" data-insert="/">÷</button>
        <button class="key" data-insert="7">7</button>
        <button class="key" data-insert="8">8</button>
        <button class="key" data-insert="9">9</button>
        <button class="key op" data-insert="*">×</button>
        <button class="key" data-insert="4">4</button>
        <button class="key" data-insert="5">5</button>
        <button class="key" data-insert="6">6</button>
        <button class="key op" data-insert="-">−</button>
        <button class="key" data-insert="1">1</button>
        <button class="key" data-insert="2">2</button>
        <button class="key" data-insert="3">3</button>
        <button class="key op" data-insert="+">+</button>
        <button class="key zero" data-insert="0">0</button>
        <button class="key" data-insert=".">.</button>
        <button class="key equal" data-action="equals">=</button>
      </div>
    </div>
  </section>
  <aside class="history" aria-label="History tape">
    <div class="history-head">
      <h2>History Tape</h2>
      <div class="toolbar">
        <button id="copyResult" class="tool" type="button">Copy result</button>
        <button id="clearHistory" class="tool" type="button">Clear</button>
      </div>
    </div>
    <div id="tape" class="tape"></div>
  </aside>
</main>
<script>
const HISTORY_KEY = "vulos.calculator.history";
const MODE_KEY = "vulos.calculator.mode";
const expressionInput = document.getElementById("expression");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");
const tapeEl = document.getElementById("tape");
const calculatorEl = document.getElementById("calculator");
const standardMode = document.getElementById("standardMode");
const scientificMode = document.getElementById("scientificMode");
let history = loadHistory();
let lastResult = "0";

const functions = {
  sin: Math.sin,
  cos: Math.cos,
  tan: Math.tan,
  asin: Math.asin,
  acos: Math.acos,
  atan: Math.atan,
  sqrt: Math.sqrt,
  ln: Math.log,
  log: Math.log10,
  abs: Math.abs
};

const operators = {
  "+": { precedence: 1, assoc: "left", args: 2, fn: (a, b) => a + b },
  "-": { precedence: 1, assoc: "left", args: 2, fn: (a, b) => a - b },
  "*": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a * b },
  "/": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a / b },
  "%": { precedence: 2, assoc: "left", args: 2, fn: (a, b) => a % b },
  "^": { precedence: 4, assoc: "right", args: 2, fn: (a, b) => Math.pow(a, b) },
  "u-": { precedence: 3, assoc: "right", args: 1, fn: a => -a },
  "!": { precedence: 5, assoc: "left", args: 1, postfix: true, fn: factorial }
};

function loadHistory() {
  try {
    const items = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(items) ? items.slice(0, 100) : [];
  } catch {
    return [];
  }
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 100)));
}

function setMode(mode) {
  const scientific = mode === "scientific";
  calculatorEl.classList.toggle("scientific", scientific);
  standardMode.classList.toggle("active", !scientific);
  scientificMode.classList.toggle("active", scientific);
  localStorage.setItem(MODE_KEY, mode);
  expressionInput.focus();
}

function insertText(text) {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  const value = expressionInput.value;
  expressionInput.value = value.slice(0, start) + text + value.slice(end);
  const cursor = start + text.length;
  expressionInput.setSelectionRange(cursor, cursor);
  preview();
}

function backspace() {
  const start = expressionInput.selectionStart;
  const end = expressionInput.selectionEnd;
  if (start !== end) {
    insertText("");
    return;
  }
  if (start > 0) {
    expressionInput.value = expressionInput.value.slice(0, start - 1) + expressionInput.value.slice(start);
    expressionInput.setSelectionRange(start - 1, start - 1);
    preview();
  }
}

function clearExpression() {
  expressionInput.value = "";
  resultEl.textContent = "0";
  statusEl.textContent = "";
  expressionInput.focus();
}

function preview() {
  statusEl.textContent = "";
  const expr = expressionInput.value.trim();
  if (!expr) {
    resultEl.textContent = lastResult;
    return;
  }
  try {
    const value = evaluate(expr);
    resultEl.textContent = formatNumber(value);
  } catch {
  }
}

function commitCalculation() {
  const expr = expressionInput.value.trim();
  if (!expr) return;
  try {
    const value = evaluate(expr);
    const result = formatNumber(value);
    resultEl.textContent = result;
    statusEl.textContent = "";
    lastResult = result;
    history.unshift({ expression: expr, result, time: Date.now() });
    history = history.slice(0, 100);
    saveHistory();
    renderHistory();
    expressionInput.value = result;
    expressionInput.select();
  } catch (error) {
    statusEl.textContent = error.message || "Invalid expression";
  }
}

function copyResult() {
  const value = resultEl.textContent || "0";
  navigator.clipboard.writeText(value).then(() => {
    statusEl.textContent = "Copied";
    setTimeout(() => {
      if (statusEl.textContent === "Copied") statusEl.textContent = "";
    }, 1200);
  }).catch(() => {
    statusEl.textContent = "Clipboard unavailable";
  });
}

function renderHistory() {
  tapeEl.innerHTML = "";
  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No calculations yet";
    tapeEl.appendChild(empty);
    return;
  }
  history.forEach(item => {
    const button = document.createElement("button");
    button.className = "entry";
    button.type = "button";
    button.title = "Reuse this result";
    button.innerHTML = `<div class="expr"></div><div class="value"></div>`;
    button.querySelector(".expr").textContent = item.expression;
    button.querySelector(".value").textContent = item.result;
    button.addEventListener("click", () => {
      expressionInput.value = item.result;
      lastResult = item.result;
      resultEl.textContent = item.result;
      expressionInput.focus();
      expressionInput.select();
    });
    tapeEl.appendChild(button);
  });
}

function evaluate(input) {
  const tokens = tokenize(input);
  const rpn = toRpn(tokens);
  const value = solveRpn(rpn);
  if (!Number.isFinite(value)) throw new Error("Result is not finite");
  return value;
}

function tokenize(input) {
  const normalized = input.toLowerCase().replaceAll("π", "pi").replaceAll("×", "*").replaceAll("÷", "/").replaceAll("−", "-");
  const tokens = [];
  let i = 0;
  while (i < normalized.length) {
    const char = normalized[i];
    if (/\s/.test(char)) {
      i += 1;
    } else if (/[0-9.]/.test(char)) {
      let raw = "";
      while (i < normalized.length && /[0-9.]/.test(normalized[i])) raw += normalized[i++];
      if ((raw.match(/\./g) || []).length > 1) throw new Error("Invalid number");
      tokens.push({ type: "number", value: Number(raw) });
    } else if (/[a-z]/.test(char)) {
      let name = "";
      while (i < normalized.length && /[a-z]/.test(normalized[i])) name += normalized[i++];
      if (name === "pi") tokens.push({ type: "number", value: Math.PI });
      else if (name === "e") tokens.push({ type: "number", value: Math.E });
      else if (functions[name]) tokens.push({ type: "function", value: name });
      else throw new Error(`Unknown function: ${name}`);
    } else if ("+-*/%^!".includes(char)) {
      tokens.push({ type: "operator", value: char });
      i += 1;
    } else if (char === "(" || char === ")") {
      tokens.push({ type: "paren", value: char });
      i += 1;
    } else {
      throw new Error("Invalid character");
    }
  }
  return tokens;
}

function toRpn(tokens) {
  const output = [];
  const stack = [];
  let prev = "start";
  tokens.forEach(token => {
    if (token.type === "number") {
      output.push(token);
      prev = "value";
    } else if (token.type === "function") {
      stack.push(token);
      prev = "function";
    } else if (token.type === "operator") {
      let op = token.value;
      if (op === "-" && (prev === "start" || prev === "operator" || prev === "leftParen" || prev === "function")) op = "u-";
      const current = operators[op];
      if (!current) throw new Error("Unknown operator");
      while (stack.length) {
        const top = stack[stack.length - 1];
        const topOp = operators[top.value];
        if (top.type === "function" || (topOp && ((current.assoc === "left" && current.precedence <= topOp.precedence) || (current.assoc === "right" && current.precedence < topOp.precedence)))) {
          output.push(stack.pop());
        } else {
          break;
        }
      }
      stack.push({ type: "operator", value: op });
      prev = op === "!" ? "value" : "operator";
    } else if (token.value === "(") {
      stack.push(token);
      prev = "leftParen";
    } else if (token.value === ")") {
      while (stack.length && stack[stack.length - 1].value !== "(") output.push(stack.pop());
      if (!stack.length) throw new Error("Mismatched parentheses");
      stack.pop();
      if (stack.length && stack[stack.length - 1].type === "function") output.push(stack.pop());
      prev = "value";
    }
  });
  while (stack.length) {
    const token = stack.pop();
    if (token.type === "paren") throw new Error("Mismatched parentheses");
    output.push(token);
  }
  return output;
}

function solveRpn(tokens) {
  const stack = [];
  tokens.forEach(token => {
    if (token.type === "number") {
      stack.push(token.value);
    } else if (token.type === "function") {
      if (!stack.length) throw new Error("Missing function input");
      stack.push(functions[token.value](stack.pop()));
    } else if (token.type === "operator") {
      const op = operators[token.value];
      if (stack.length < op.args) throw new Error("Missing operator input");
      if (op.args === 1) stack.push(op.fn(stack.pop()));
      else {
        const b = stack.pop();
        const a = stack.pop();
        stack.push(op.fn(a, b));
      }
    }
  });
  if (stack.length !== 1) throw new Error("Invalid expression");
  return stack[0];
}

function factorial(value) {
  if (!Number.isInteger(value) || value < 0 || value > 170) throw new Error("Factorial requires an integer from 0 to 170");
  let total = 1;
  for (let i = 2; i <= value; i += 1) total *= i;
  return total;
}

function formatNumber(value) {
  if (Object.is(value, -0)) value = 0;
  const abs = Math.abs(value);
  if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return value.toExponential(10).replace(/\.?0+e/, "e");
  return Number(value.toPrecision(14)).toString();
}

document.querySelectorAll("[data-insert]").forEach(button => {
  button.addEventListener("click", () => {
    insertText(button.dataset.insert);
    expressionInput.focus();
  });
});

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => {
    if (button.dataset.action === "clear") clearExpression();
    if (button.dataset.action === "backspace") backspace();
    if (button.dataset.action === "equals") commitCalculation();
  });
});

expressionInput.addEventListener("input", preview);
expressionInput.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === "=") {
    event.preventDefault();
    commitCalculation();
  } else if (event.key === "Escape") {
    event.preventDefault();
    clearExpression();
  }
});

standardMode.addEventListener("click", () => setMode("standard"));
scientificMode.addEventListener("click", () => setMode("scientific"));
document.getElementById("copyResult").addEventListener("click", copyResult);
document.getElementById("clearHistory").addEventListener("click", () => {
  history = [];
  saveHistory();
  renderHistory();
});

setMode(localStorage.getItem(MODE_KEY) || "standard");
renderHistory();
expressionInput.focus();
</script>
</body>
</html>
