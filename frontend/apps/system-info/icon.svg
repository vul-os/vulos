<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Core/system: slate tile -->
  <rect width="64" height="64" rx="14" fill="#1e293b"/>
  <!-- CPU chip outline -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <!-- Inner die -->
  <rect x="24" y="24" width="16" height="16" rx="2" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1"/>
  <!-- Die grid lines -->
  <line x1="24" y1="29" x2="40" y2="29" stroke="#38bdf8" stroke-width="0.75" opacity="0.5"/>
  <line x1="24" y1="35" x2="40" y2="35" stroke="#38bdf8" stroke-width="0.75" opacity="0.5"/>
  <line x1="29" y1="24" x2="29" y2="40" stroke="#38bdf8" stroke-width="0.75" opacity="0.5"/>
  <line x1="35" y1="24" x2="35" y2="40" stroke="#38bdf8" stroke-width="0.75" opacity="0.5"/>
  <!-- Pin legs: top -->
  <line x1="24" y1="18" x2="24" y2="13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="32" y2="13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="18" x2="40" y2="13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Pin legs: bottom -->
  <line x1="24" y1="46" x2="24" y2="51" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="51" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="40" y2="51" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Pin legs: left -->
  <line x1="18" y1="24" x2="13" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="13" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="13" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Pin legs: right -->
  <line x1="46" y1="24" x2="51" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="51" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="40" x2="51" y2="40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
