<title>Camera</title>
<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-shared-assets.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* camera-specific extras */
:root{--record-pulse:#ff6060;--border:#222}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui);overflow:hidden}

/* Layout */
.shell{display:flex;flex-direction:column;height:100vh}

/* Viewfinder */
.viewfinder-wrap{flex:1;position:relative;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;min-height:0}
#preview{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
#preview.mirror{transform:scaleX(-1)}

/* Overlay badges */
.badge-wrap{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 14px;pointer-events:none}
.mode-badge{background:#000a;border:1px solid #ffffff18;border-radius:20px;padding:3px 10px;font-size: 12px;font-weight:600;letter-spacing:.04em;color:#fff;pointer-events:auto;cursor:pointer;user-select:none}
.mode-badge.active-photo{border-color:var(--accent);color:var(--accent)}
.mode-badge.active-video{border-color:var(--record);color:var(--record)}
.rec-indicator{display:none;align-items:center;gap:6px;background:#000a;border-radius:20px;padding:3px 10px;font-size: 12px;font-weight:700;color:var(--record);letter-spacing:.04em}
.rec-indicator.on{display:flex}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--record);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.rec-timer{font-variant-numeric:tabular-nums}

/* Filter pill row */
.filter-row{position:absolute;bottom:88px;left:0;right:0;padding:0 12px;pointer-events:auto}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-pill{flex-shrink:0;background:#000b;border:1.5px solid transparent;border-radius:20px;padding:4px 12px;font-size: 12px;color:var(--text2);cursor:pointer;transition:all .15s;backdrop-filter:blur(4px)}
.filter-pill.active{border-color:#fff5;color:#fff;background:#fff1}

/* Controls bar */
.controls{height:88px;background:#0008;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;border-top:1px solid #ffffff08}

/* Last capture thumbnail */
.thumb-btn{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--elevated);border:2px solid #fff2;cursor:pointer;transition:transform .12s,border-color .12s;flex-shrink:0}
.thumb-btn:hover{transform:scale(1.06);border-color:#fff5}
.thumb-btn img,.thumb-btn video{width:100%;height:100%;object-fit:cover;display:block}
.thumb-btn.empty{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:20px}

/* Shutter */
.shutter-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#fff1;cursor:pointer;transition:transform .1s,background .1s;display:flex;align-items:center;justify-content:center;position:relative}
.shutter:hover{background:#fff2}
.shutter:active{transform:scale(.93)}
.shutter .shutter-inner{width:54px;height:54px;border-radius:50%;background:#fff;transition:background .1s,border-radius .1s}
.shutter.video-mode .shutter-inner{background:var(--record)}
.shutter.recording .shutter-inner{border-radius:8px;width:28px;height:28px;background:var(--record)}

/* Flip camera */
.flip-btn{width:52px;height:52px;border-radius:50%;background:#fff1;border:1.5px solid #fff2;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .15s;color:#fff;backdrop-filter:blur(4px);flex-shrink:0}
.flip-btn:hover{background:#fff2}
.flip-btn:active{transform:scale(.9)}
.flip-btn.hidden{visibility:hidden;pointer-events:none}

/* Mode selector tabs */
.mode-tabs{display:flex;justify-content:center;gap:0;background:#0006;border-top:1px solid #ffffff0a}
.mode-tab{flex:1;max-width:100px;padding:6px 0;font-size: 12px;font-weight:600;letter-spacing:.05em;text-align:center;color:var(--text3);cursor:pointer;transition:color .15s;user-select:none;text-transform:uppercase}
.mode-tab.active{color:#fff}

/* Toast */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#111c;border:1px solid #fff1;border-radius:20px;padding:6px 16px;font-size:12px;color:#fff;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1}

/* Permission error */
.perm-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;background:var(--bg)}
.perm-error .icon{font-size:48px;opacity:.4}
.perm-error p{color:var(--text2);font-size:14px;line-height:1.5;max-width:320px}
.perm-error button{background:var(--accent);border:none;border-radius:8px;color:#fff;padding:8px 20px;font-size:13px;cursor:pointer;font-weight:600}
.perm-error button:hover{background:#2563eb}

/* Save flash */
@keyframes saveflash{0%{opacity:.5}100%{opacity:0}}
.save-flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
.save-flash.on{animation:saveflash .18s ease-out forwards}
</style>

<div class="shell">
  <!-- Viewfinder -->
  <div class="viewfinder-wrap" id="vfWrap">
    <video id="preview" autoplay playsinline muted></video>

    <div class="badge-wrap">
      <div class="rec-indicator" id="recIndicator">
        <span class="rec-dot"></span>
        <span class="rec-timer" id="recTimer">0:00</span>
      </div>
      <div></div>
    </div>

    <!-- CSS filter pills -->
    <div class="filter-row">
      <div class="filter-scroll" id="filterRow"></div>
    </div>

    <!-- Permission error overlay -->
    <div class="perm-error" id="permError" style="display:none">
      <div class="icon">⬤</div>
      <p id="permMsg">Camera access is required. Please allow camera permission and reload.</p>
      <button onclick="initCamera()">Try Again</button>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs" id="modeTabs">
    <div class="mode-tab active" data-mode="photo" onclick="switchMode('photo')">Photo</div>
    <div class="mode-tab" data-mode="video" onclick="switchMode('video')">Video</div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <!-- Last capture preview -->
    <div class="thumb-btn empty" id="thumbBtn" title="Last capture" onclick="openLastCapture()">
      <span>&#9634;</span>
    </div>

    <!-- Shutter -->
    <div class="shutter-wrap">
      <div class="shutter" id="shutter" onclick="handleShutter()" title="Capture">
        <div class="shutter-inner"></div>
      </div>
    </div>

    <!-- Flip camera -->
    <button class="flip-btn" id="flipBtn" onclick="flipCamera()" title="Flip camera">&#8645;</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let stream = null;
let mode = 'photo';           // 'photo' | 'video'
let recorder = null;
let recordingChunks = [];
let recordingSeconds = 0;
let recTimerHandle = null;
let devices = [];             // VideoInputDevice list
let currentDeviceIdx = 0;
let currentFacingMode = 'user'; // 'user' (front) | 'environment' (back)
let isMirrored = true;        // mirror front cam by default
let lastCapture = null;       // { type: 'photo'|'video', url: blobURL }
let currentFilter = 'none';

// ── CSS Filters ───────────────────────────────────────────────────────────────
const FILTERS = [
  { id: 'none',      label: 'Normal',    css: 'none' },
  { id: 'vivid',     label: 'Vivid',     css: 'saturate(1.8) contrast(1.1)' },
  { id: 'muted',     label: 'Muted',     css: 'saturate(0.6) brightness(1.05)' },
  { id: 'bw',        label: 'B&W',       css: 'grayscale(1)' },
  { id: 'sepia',     label: 'Sepia',     css: 'sepia(0.9)' },
  { id: 'warm',      label: 'Warm',      css: 'sepia(0.3) saturate(1.4) hue-rotate(-10deg)' },
  { id: 'cool',      label: 'Cool',      css: 'hue-rotate(30deg) saturate(1.2)' },
  { id: 'fade',      label: 'Fade',      css: 'brightness(1.15) contrast(0.85) saturate(0.8)' },
  { id: 'drama',     label: 'Drama',     css: 'contrast(1.4) saturate(1.2) brightness(0.9)' },
  { id: 'invert',    label: 'Invert',    css: 'invert(1)' },
];

function buildFilterRow() {
  const row = document.getElementById('filterRow');
  row.innerHTML = FILTERS.map(f =>
    `<div class="filter-pill${f.id === 'none' ? ' active' : ''}" data-id="${f.id}" onclick="setFilter('${f.id}')">${f.label}</div>`
  ).join('');
}

function setFilter(id) {
  const f = FILTERS.find(x => x.id === id);
  if (!f) return;
  currentFilter = id;
  document.getElementById('preview').style.filter = f.css;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
}

// ── Camera init ───────────────────────────────────────────────────────────────
async function initCamera() {
  document.getElementById('permError').style.display = 'none';
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  try {
    await enumerateDevices();

    const constraints = buildConstraints();
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    document.getElementById('preview').srcObject = stream;

    // Mirror front cam
    const track = stream.getVideoTracks()[0];
    const settings = track.getSettings ? track.getSettings() : {};
    isMirrored = settings.facingMode !== 'environment';
    applyMirror();

    // Show/hide flip button based on device count
    document.getElementById('flipBtn').classList.toggle('hidden', devices.length < 2);
  } catch (err) {
    showPermError(err);
  }
}

function buildConstraints() {
  // If we have multiple labelled devices, pick by index
  if (devices.length > 1) {
    return {
      video: { deviceId: { exact: devices[currentDeviceIdx].deviceId } },
      audio: true,
    };
  }
  // Fallback: use facingMode
  return {
    video: {
      facingMode: currentFacingMode,
      width: { ideal: 1920 },
      height: { ideal: 1080 },
    },
    audio: true,
  };
}

async function enumerateDevices() {
  try {
    const all = await navigator.mediaDevices.enumerateDevices();
    devices = all.filter(d => d.kind === 'videoinput');
    // Clamp index
    if (currentDeviceIdx >= devices.length) currentDeviceIdx = 0;
  } catch (_) {
    devices = [];
  }
}

function applyMirror() {
  document.getElementById('preview').classList.toggle('mirror', isMirrored);
}

function showPermError(err) {
  const el = document.getElementById('permError');
  el.style.display = 'flex';
  let msg = 'Camera access is required. Please allow camera permission and reload.';
  if (err && err.name === 'NotAllowedError') {
    msg = 'Camera permission was denied. Allow access in your browser settings, then try again.';
  } else if (err && err.name === 'NotFoundError') {
    msg = 'No camera device found on this system.';
  } else if (err && err.message) {
    msg = 'Could not start camera: ' + err.message;
  }
  document.getElementById('permMsg').textContent = msg;
}

// ── Flip camera ───────────────────────────────────────────────────────────────
async function flipCamera() {
  if (devices.length > 1) {
    // Cycle through devices by index
    currentDeviceIdx = (currentDeviceIdx + 1) % devices.length;
  } else {
    // Toggle facing mode
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
  }
  await initCamera();
}

// ── Mode switch ───────────────────────────────────────────────────────────────
function switchMode(m) {
  if (recorder && recorder.state === 'recording') stopRecording();
  mode = m;
  document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  const shutter = document.getElementById('shutter');
  shutter.classList.toggle('video-mode', m === 'video');
  shutter.classList.remove('recording');
}

// ── Shutter / Record ──────────────────────────────────────────────────────────
function handleShutter() {
  if (mode === 'photo') {
    takePhoto();
  } else {
    if (recorder && recorder.state === 'recording') {
      stopRecording();
    } else {
      startRecording();
    }
  }
}

// ── Photo capture ─────────────────────────────────────────────────────────────
function takePhoto() {
  const video = document.getElementById('preview');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  const ctx = canvas.getContext('2d');

  // Apply mirror transform when drawing if front cam
  if (isMirrored) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }

  // Apply CSS filter via canvas filter API (best-effort — may not be supported in all envs)
  const f = FILTERS.find(x => x.id === currentFilter);
  if (f && f.css !== 'none' && ctx.filter !== undefined) {
    ctx.filter = f.css;
  }

  ctx.drawImage(video, 0, 0);

  // Flash effect
  const flash = document.getElementById('saveFlash');
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');

  // Get data URL and send to server
  const dataURL = canvas.toDataURL('image/png');
  savePhoto(dataURL);

  // Update thumbnail
  setThumb('photo', dataURL);
}

async function savePhoto(dataURL) {
  try {
    const res = await fetch(vulosApi.appUrl('/api/save-photo'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: dataURL }),
    });
    if (res.ok) {
      const d = await res.json();
      showToast('Photo saved — ' + d.filename);
    } else {
      showToast('Failed to save photo');
    }
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

// ── Video recording ───────────────────────────────────────────────────────────
function startRecording() {
  if (!stream) return;
  recordingChunks = [];
  recordingSeconds = 0;

  // Pick best supported MIME type
  const mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';

  try {
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
  } catch (e) {
    recorder = new MediaRecorder(stream);
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) recordingChunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(recordingChunks, { type: recorder.mimeType || 'video/webm' });
    saveVideo(blob);
    const url = URL.createObjectURL(blob);
    setThumb('video', url);
    lastCapture = { type: 'video', url };
  };

  recorder.start(1000); // collect chunks every 1s

  // UI
  document.getElementById('shutter').classList.add('recording');
  document.getElementById('recIndicator').classList.add('on');
  updateRecTimer();
  recTimerHandle = setInterval(() => {
    recordingSeconds++;
    updateRecTimer();
  }, 1000);
}

function stopRecording() {
  if (!recorder || recorder.state !== 'recording') return;
  clearInterval(recTimerHandle);
  recorder.stop();
  // UI reset
  document.getElementById('shutter').classList.remove('recording');
  document.getElementById('recIndicator').classList.remove('on');
}

function updateRecTimer() {
  const m = Math.floor(recordingSeconds / 60);
  const s = recordingSeconds % 60;
  document.getElementById('recTimer').textContent = m + ':' + String(s).padStart(2, '0');
}

async function saveVideo(blob) {
  try {
    const res = await fetch(vulosApi.appUrl('/api/save-video'), {
      method: 'POST',
      headers: { 'Content-Type': blob.type || 'video/webm' },
      body: blob,
    });
    if (res.ok) {
      const d = await res.json();
      showToast('Video saved — ' + d.filename);
    } else {
      showToast('Failed to save video');
    }
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}

// ── Thumbnail ─────────────────────────────────────────────────────────────────
function setThumb(type, url) {
  const btn = document.getElementById('thumbBtn');
  btn.classList.remove('empty');
  if (type === 'photo') {
    btn.innerHTML = `<img src="${url}" alt="Last photo">`;
  } else {
    btn.innerHTML = `<video src="${url}" muted></video>`;
  }
  lastCapture = { type, url };
}

function openLastCapture() {
  if (!lastCapture) return;
  window.open(lastCapture.url, '_blank');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildFilterRow();
initCamera();

// Re-enumerate when devices change (plug/unplug)
if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener('devicechange', async () => {
    await enumerateDevices();
    document.getElementById('flipBtn').classList.toggle('hidden', devices.length < 2);
  });
}

// Space bar = shutter
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); handleShutter(); }
  if (e.key === 'f' || e.key === 'F') flipCamera();
  if (e.key === 'v' || e.key === 'V') switchMode(mode === 'photo' ? 'video' : 'photo');
});
</script>
</body>
</html>
