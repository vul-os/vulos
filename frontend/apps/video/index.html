<title>Video Player</title>
<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-shared-assets.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--elevated:#1a1a1a;--border:#222;--border2:#333;
  --text:#e5e5e5;--text2:#999;--text3:#555;
  --accent:#3b82f6;--accent2:#2563eb;--danger:#ef4444;
  --ctrl-h:44px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column}

/* ── Layout ────────────────────────────────── */
#app{display:flex;flex:1;overflow:hidden;min-height:0}
#sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
#player-area{flex:1;display:flex;flex-direction:column;min-width:0}

/* ── Sidebar ────────────────────────────────── */
#sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
#sidebar-header h2{font-size:13px;font-weight:600;flex:1}
#open-btn{background:var(--elevated);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;color:var(--text2);font-size:12px;cursor:pointer;transition:.15s}
#open-btn:hover{background:var(--border2);color:var(--text)}

#tab-bar{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px;font-size:12px;text-align:center;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.active){color:var(--text2)}

#library-panel,#queue-panel{flex:1;overflow-y:auto;display:none}
#library-panel.visible,#queue-panel.visible{display:block}

.video-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-left:3px solid transparent;transition:.12s}
.video-item:hover{background:var(--elevated)}
.video-item.active{background:var(--elevated);border-left-color:var(--accent)}
.video-item .vi-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.video-item .vi-size{font-size: 12px;color:var(--text3);flex-shrink:0}
.video-item .vi-icon{font-size:14px;flex-shrink:0;opacity:.6}
.video-item .vi-remove{flex-shrink:0;opacity:0;font-size:12px;color:var(--text3);cursor:pointer;padding:2px 4px;border-radius:3px;transition:.12s}
.video-item:hover .vi-remove{opacity:1}
.video-item .vi-remove:hover{color:var(--danger);background:rgba(239,68,68,.12)}

#queue-empty{padding:24px 14px;font-size:12px;color:var(--text3);text-align:center;display:none}
#queue-empty.visible{display:block}
#lib-empty{padding:24px 14px;font-size:12px;color:var(--text3);text-align:center;display:none}
#lib-empty.visible{display:block}

/* ── Drop zone ──────────────────────────────── */
#drop-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none}
#drop-overlay.visible{display:flex}
#drop-overlay .drop-box{border:2px dashed var(--accent);border-radius:16px;padding:48px 64px;text-align:center;color:var(--accent)}
#drop-overlay .drop-box .drop-title{font-size:22px;font-weight:700;margin-bottom:6px}
#drop-overlay .drop-box .drop-sub{font-size:14px;opacity:.7}

/* ── Video container ────────────────────────── */
#video-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden;min-height:0}
video#vid{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;outline:none}

#placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text3);pointer-events:none}
#placeholder .ph-icon{font-size:56px;opacity:.3}
#placeholder .ph-text{font-size:14px;opacity:.5}
#placeholder .ph-sub{font-size:12px;opacity:.35}

/* loading spinner */
#spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#spinner.visible{display:flex}
#spinner::after{content:"";width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* subtitle overlay */
#subtitle-display{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:10;white-space:pre-wrap;max-width:80%;font-size:18px;line-height:1.4;color:#fff;text-shadow:0 1px 4px #000,0 0 8px #000;background:rgba(0,0,0,.35);border-radius:4px;padding:2px 8px;display:none}
#subtitle-display.visible{display:block}

/* ── Controls ───────────────────────────────── */
#controls{height:var(--ctrl-h);flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:0 14px;display:flex;align-items:center;gap:10px}

.ctrl-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:6px;border-radius:6px;line-height:1;transition:.12s;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{color:var(--text);background:var(--elevated)}
.ctrl-btn.active{color:var(--accent)}

#time-track{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#time-display{font-size: 12px;color:var(--text3);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:80px}

/* range sliders */
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;cursor:pointer;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;margin-top:-5px;transition:.1s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px}

#seek{flex:1;background:linear-gradient(to right,var(--accent) 0%,var(--border2) 0%)}
#vol-slider{width:72px;background:linear-gradient(to right,var(--text2) 0%,var(--border2) 0%)}

/* speed picker */
#speed-select{background:var(--elevated);border:1px solid var(--border2);color:var(--text);font-size: 12px;border-radius:5px;padding:3px 6px;cursor:pointer;outline:none}
#speed-select:focus{border-color:var(--accent)}

/* subtitle badge */
#sub-info{font-size: 12px;color:var(--text3);white-space:nowrap}
</style>
</head>
<body>

<!-- Drop overlay (video files + srt/vtt) -->
<div id="drop-overlay">
  <div class="drop-box">
    <div class="drop-title">Drop to open</div>
    <div class="drop-sub">Video files — or .srt / .vtt subtitles</div>
  </div>
</div>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Video Player</h2>
      <button id="open-btn" title="Open video file">Open…</button>
    </div>
    <div id="tab-bar">
      <div class="tab active" data-tab="library">Library</div>
      <div class="tab" data-tab="queue">Queue</div>
    </div>
    <div id="library-panel" class="visible"></div>
    <div id="lib-empty">No videos found in ~/videos.<br>Drop a file anywhere to play.</div>
    <div id="queue-panel"></div>
    <div id="queue-empty">Queue is empty.<br>Double-click a video to enqueue it.</div>
  </div>

  <!-- Player area -->
  <div id="player-area">
    <div id="video-wrap">
      <video id="vid" preload="metadata" tabindex="0"></video>
      <div id="placeholder">
        <div class="ph-icon">▶</div>
        <div class="ph-text">No video loaded</div>
        <div class="ph-sub">Drop a file or open from the library</div>
      </div>
      <div id="spinner"></div>
      <div id="subtitle-display"></div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <!-- Prev -->
      <button class="ctrl-btn" id="btn-prev" title="Previous (←)">&#9664;&#9664;</button>
      <!-- Play/Pause -->
      <button class="ctrl-btn" id="btn-play" title="Play / Pause (Space)">&#9654;</button>
      <!-- Next -->
      <button class="ctrl-btn" id="btn-next" title="Next (→)">&#9654;&#9654;</button>

      <!-- Seek + time -->
      <div id="time-track">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" title="Seek">
        <span id="time-display">0:00 / 0:00</span>
      </div>

      <!-- Volume -->
      <button class="ctrl-btn" id="btn-mute" title="Mute">&#128264;</button>
      <input type="range" id="vol-slider" min="0" max="1" value="1" step="0.02" title="Volume">

      <!-- Speed -->
      <select id="speed-select" title="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>

      <!-- Subtitle info -->
      <span id="sub-info"></span>

      <!-- PiP -->
      <button class="ctrl-btn" id="btn-pip" title="Picture-in-Picture">&#9974;</button>
      <!-- Fullscreen (F) -->
      <button class="ctrl-btn" id="btn-fs" title="Fullscreen (F)">&#9974;&#65038;</button>
    </div>
  </div>
</div>

<!-- Hidden file inputs -->
<input type="file" id="file-input" accept="video/*,.mkv" style="display:none">
<input type="file" id="sub-input" accept=".srt,.vtt" style="display:none">

<script>
// ── State ─────────────────────────────────────────────────────────────────
const vid = document.getElementById('vid');
let library = [];      // {name, path, size, ext} from server
let queue = [];        // array of rel paths (local lib) or blob URLs
let queueMeta = {};    // rel -> name map for display
let currentIdx = -1;
let subtitleCues = []; // [{start, end, text}]
let subTimer = null;
let seekDragging = false;

// ── DOM refs ──────────────────────────────────────────────────────────────
const libraryPanel  = document.getElementById('library-panel');
const queuePanel    = document.getElementById('queue-panel');
const libEmpty      = document.getElementById('lib-empty');
const queueEmpty    = document.getElementById('queue-empty');
const placeholder   = document.getElementById('placeholder');
const spinner       = document.getElementById('spinner');
const subDisplay    = document.getElementById('subtitle-display');
const subInfo       = document.getElementById('sub-info');
const seekEl        = document.getElementById('seek');
const volSlider     = document.getElementById('vol-slider');
const timeDisplay   = document.getElementById('time-display');
const btnPlay       = document.getElementById('btn-play');
const btnMute       = document.getElementById('btn-mute');
const btnPrev       = document.getElementById('btn-prev');
const btnNext       = document.getElementById('btn-next');
const btnPip        = document.getElementById('btn-pip');
const btnFs         = document.getElementById('btn-fs');
const speedSel      = document.getElementById('speed-select');
const dropOverlay   = document.getElementById('drop-overlay');
const fileInput     = document.getElementById('file-input');
const subInputEl    = document.getElementById('sub-input');

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(1) + ' GB';
}

function updateSeekGradient() {
  const pct = seekEl.max > 0 ? (seekEl.value / seekEl.max * 100) : 0;
  seekEl.style.background = `linear-gradient(to right,var(--accent) ${pct}%,var(--border2) ${pct}%)`;
}

function updateVolGradient() {
  const pct = volSlider.value * 100;
  volSlider.style.background = `linear-gradient(to right,var(--text2) ${pct}%,var(--border2) ${pct}%)`;
}

function updatePlayBtn() {
  btnPlay.innerHTML = vid.paused ? '&#9654;' : '&#9646;&#9646;';
}

function updateMuteBtn() {
  if (vid.muted || vid.volume === 0) btnMute.innerHTML = '&#128263;';
  else if (vid.volume < 0.5) btnMute.innerHTML = '&#128264;';
  else btnMute.innerHTML = '&#128266;';
}

// ── Library ───────────────────────────────────────────────────────────────
async function loadLibrary() {
  try {
    const r = await fetch(vulosApi.appUrl('/api/videos'));
    library = await r.json();
  } catch (_) { library = []; }
  renderLibrary();
}

function renderLibrary() {
  libraryPanel.innerHTML = '';
  if (library.length === 0) { libEmpty.classList.add('visible'); return; }
  libEmpty.classList.remove('visible');
  library.forEach(v => {
    const el = makeLibItem(v.name, v.path, v.size, false);
    el.addEventListener('click', () => playLibVideo(v.path, v.name));
    el.addEventListener('dblclick', () => { enqueueLib(v.path, v.name); });
    el.title = v.name + '\n' + fmtSize(v.size) + '\nDouble-click to enqueue';
    libraryPanel.appendChild(el);
  });
}

function makeLibItem(name, path, size, isQueue) {
  const el = document.createElement('div');
  el.className = 'video-item';
  el.dataset.path = path;
  el.innerHTML = `
    <span class="vi-icon">&#127916;</span>
    <span class="vi-name">${escHtml(name)}</span>
    ${size != null ? `<span class="vi-size">${fmtSize(size)}</span>` : ''}
    ${isQueue ? `<span class="vi-remove" title="Remove">&#10005;</span>` : ''}
  `;
  if (isQueue) {
    el.querySelector('.vi-remove').addEventListener('click', e => {
      e.stopPropagation();
      removeFromQueue(path);
    });
  }
  return el;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Queue ─────────────────────────────────────────────────────────────────
async function loadQueue() {
  try {
    const r = await fetch(vulosApi.appUrl('/api/queue'));
    const saved = await r.json();
    // Merge saved queue with current library names
    queue = saved.filter(p => library.some(v => v.path === p));
    queue.forEach(p => {
      const v = library.find(x => x.path === p);
      if (v) queueMeta[p] = v.name;
    });
  } catch (_) { queue = []; }
  renderQueue();
}

function renderQueue() {
  queuePanel.innerHTML = '';
  if (queue.length === 0) { queueEmpty.classList.add('visible'); return; }
  queueEmpty.classList.remove('visible');
  queue.forEach((p, i) => {
    const name = queueMeta[p] || p.split('/').pop();
    const el = makeLibItem(name, p, null, true);
    el.addEventListener('click', () => playQueueItem(i));
    if (i === currentIdx) el.classList.add('active');
    queuePanel.appendChild(el);
  });
}

function enqueueLib(path, name) {
  if (!queue.includes(path)) {
    queue.push(path);
    queueMeta[path] = name;
    persistQueue();
    renderQueue();
  }
  switchTab('queue');
}

function removeFromQueue(path) {
  const idx = queue.indexOf(path);
  queue = queue.filter(p => p !== path);
  if (currentIdx > idx) currentIdx--;
  else if (currentIdx === idx) currentIdx = -1;
  persistQueue();
  renderQueue();
}

function persistQueue() {
  fetch(vulosApi.appUrl('/api/queue'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({queue})
  }).catch(_=>{});
}

// ── Playback ──────────────────────────────────────────────────────────────
function playLibVideo(rel, name) {
  clearSubtitles();
  placeholder.style.display = 'none';
  spinner.classList.add('visible');
  vid.src = vulosApi.appUrl('/stream/') + encodeURIComponent(rel);
  vid.load();
  vid.play().catch(_=>{});
  document.title = name;
  highlightLibItem(rel);
}

function playQueueItem(idx) {
  if (idx < 0 || idx >= queue.length) return;
  currentIdx = idx;
  const p = queue[idx];
  const name = queueMeta[p] || p.split('/').pop();
  playLibVideo(p, name);
  renderQueue();
}

function playNext() {
  if (queue.length === 0) return;
  const next = currentIdx + 1;
  if (next < queue.length) playQueueItem(next);
}

function playPrev() {
  if (vid.currentTime > 3) { vid.currentTime = 0; return; }
  if (queue.length === 0) return;
  const prev = currentIdx - 1;
  if (prev >= 0) playQueueItem(prev);
}

function highlightLibItem(rel) {
  document.querySelectorAll('#library-panel .video-item').forEach(el => {
    el.classList.toggle('active', el.dataset.path === rel);
  });
}

// ── Local file drop / open ────────────────────────────────────────────────
function openLocalFile(file) {
  if (!file) return;
  clearSubtitles();
  const url = URL.createObjectURL(file);
  placeholder.style.display = 'none';
  spinner.classList.add('visible');
  vid.src = url;
  vid.load();
  vid.play().catch(_=>{});
  document.title = file.name;
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) openLocalFile(fileInput.files[0]);
  fileInput.value = '';
});

document.getElementById('open-btn').addEventListener('click', () => fileInput.click());

// ── Subtitle handling ─────────────────────────────────────────────────────
function parseSrt(text) {
  const cues = [];
  // Normalise line endings
  const blocks = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    if (lines.length < 2) continue;
    // Skip numeric index line
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
    const start = parseSrtTime(startStr);
    const end = parseSrtTime(endStr);
    const textLines = lines.slice(lines.indexOf(timeLine) + 1).join('\n').trim();
    if (textLines) cues.push({start, end, text: textLines});
  }
  return cues;
}

function parseSrtTime(s) {
  // HH:MM:SS,mmm
  const m = s.match(/(\d+):(\d+):(\d+)[,.](\d+)/);
  if (!m) return 0;
  return parseInt(m[1])*3600 + parseInt(m[2])*60 + parseInt(m[3]) + parseInt(m[4])/1000;
}

function parseVtt(text) {
  const cues = [];
  const blocks = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split(/\n\n+/);
  for (const block of blocks) {
    const lines = block.trim().split('\n');
    const timeLine = lines.find(l => l.includes('-->'));
    if (!timeLine) continue;
    const [startStr, endStr] = timeLine.split('-->').map(s => s.trim());
    const start = parseVttTime(startStr);
    const end = parseVttTime(endStr);
    const textLines = lines.slice(lines.indexOf(timeLine) + 1).join('\n').trim();
    if (textLines) cues.push({start, end, text: textLines});
  }
  return cues;
}

function parseVttTime(s) {
  // HH:MM:SS.mmm or MM:SS.mmm
  const m = s.match(/(?:(\d+):)?(\d+):(\d+)\.(\d+)/);
  if (!m) return 0;
  const h = m[1] ? parseInt(m[1]) : 0;
  return h*3600 + parseInt(m[2])*60 + parseInt(m[3]) + parseInt(m[4])/1000;
}

function loadSubtitleFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    if (ext === 'srt') {
      subtitleCues = parseSrt(text);
    } else {
      subtitleCues = parseVtt(text);
    }
    subInfo.textContent = `CC: ${file.name}`;
    startSubTimer();
  };
  reader.readAsText(file);
}

function clearSubtitles() {
  subtitleCues = [];
  subDisplay.classList.remove('visible');
  subDisplay.textContent = '';
  subInfo.textContent = '';
  if (subTimer) { clearInterval(subTimer); subTimer = null; }
}

function startSubTimer() {
  if (subTimer) clearInterval(subTimer);
  subTimer = setInterval(updateSubtitle, 100);
}

function updateSubtitle() {
  if (!subtitleCues.length || vid.paused) return;
  const t = vid.currentTime;
  const cue = subtitleCues.find(c => t >= c.start && t <= c.end);
  if (cue) {
    subDisplay.textContent = cue.text;
    subDisplay.classList.add('visible');
  } else {
    subDisplay.classList.remove('visible');
  }
}

// ── Drag and Drop ─────────────────────────────────────────────────────────
let dragDepth = 0;

document.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  dropOverlay.classList.add('visible');
});
document.addEventListener('dragleave', () => {
  dragDepth--;
  if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('visible'); }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove('visible');
  const files = Array.from(e.dataTransfer.files);
  const videoFile = files.find(f => f.type.startsWith('video/') || /\.(mp4|webm|mkv|avi|m4v|mov|ogv)$/i.test(f.name));
  const subFile = files.find(f => /\.(srt|vtt)$/i.test(f.name));
  if (subFile) loadSubtitleFile(subFile);
  if (videoFile) openLocalFile(videoFile);
});

// ── Video events ──────────────────────────────────────────────────────────
vid.addEventListener('loadedmetadata', () => {
  spinner.classList.remove('visible');
  seekEl.max = 1000;
  updateSeekGradient();
});
vid.addEventListener('waiting', () => spinner.classList.add('visible'));
vid.addEventListener('canplay',  () => spinner.classList.remove('visible'));
vid.addEventListener('play',  updatePlayBtn);
vid.addEventListener('pause', updatePlayBtn);
vid.addEventListener('ended', () => { updatePlayBtn(); playNext(); });
vid.addEventListener('volumechange', () => { updateMuteBtn(); updateVolGradient(); });
vid.addEventListener('timeupdate', () => {
  if (!seekDragging) {
    const pct = vid.duration ? (vid.currentTime / vid.duration) : 0;
    seekEl.value = pct * 1000;
    updateSeekGradient();
  }
  const dur = vid.duration || 0;
  timeDisplay.textContent = `${fmtTime(vid.currentTime)} / ${fmtTime(dur)}`;
  updateSubtitle();
});

// ── Seek ──────────────────────────────────────────────────────────────────
seekEl.addEventListener('mousedown', () => { seekDragging = true; });
seekEl.addEventListener('input', () => {
  updateSeekGradient();
  if (vid.duration) {
    const t = (seekEl.value / 1000) * vid.duration;
    timeDisplay.textContent = `${fmtTime(t)} / ${fmtTime(vid.duration)}`;
  }
});
seekEl.addEventListener('change', () => {
  seekDragging = false;
  if (vid.duration) vid.currentTime = (seekEl.value / 1000) * vid.duration;
});
seekEl.addEventListener('mouseup', () => { seekDragging = false; });

// ── Volume ────────────────────────────────────────────────────────────────
volSlider.addEventListener('input', () => {
  vid.volume = parseFloat(volSlider.value);
  vid.muted = vid.volume === 0;
  updateVolGradient();
});

// ── Control buttons ───────────────────────────────────────────────────────
btnPlay.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
btnMute.addEventListener('click', () => {
  vid.muted = !vid.muted;
  if (!vid.muted && vid.volume === 0) { vid.volume = 0.7; volSlider.value = 0.7; }
  updateMuteBtn(); updateVolGradient();
});
btnPrev.addEventListener('click', playPrev);
btnNext.addEventListener('click', playNext);

btnPip.addEventListener('click', async () => {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
    } else if (vid.src) {
      await vid.requestPictureInPicture();
    }
  } catch (_) {}
});

btnFs.addEventListener('click', toggleFullscreen);

speedSel.addEventListener('change', () => {
  vid.playbackRate = parseFloat(speedSel.value);
});

// ── Fullscreen ────────────────────────────────────────────────────────────
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.getElementById('video-wrap').requestFullscreen().catch(_=>{});
  } else {
    document.exitFullscreen().catch(_=>{});
  }
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  // Ignore when typing in an input/select
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      vid.paused ? vid.play() : vid.pause();
      break;
    case 'ArrowRight':
      e.preventDefault();
      vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + (e.shiftKey ? 30 : 5));
      break;
    case 'ArrowLeft':
      e.preventDefault();
      vid.currentTime = Math.max(0, vid.currentTime - (e.shiftKey ? 30 : 5));
      break;
    case 'ArrowUp':
      e.preventDefault();
      vid.volume = Math.min(1, vid.volume + 0.1);
      volSlider.value = vid.volume;
      updateVolGradient(); updateMuteBtn();
      break;
    case 'ArrowDown':
      e.preventDefault();
      vid.volume = Math.max(0, vid.volume - 0.1);
      volSlider.value = vid.volume;
      updateVolGradient(); updateMuteBtn();
      break;
    case 'KeyF':
      e.preventDefault();
      toggleFullscreen();
      break;
    case 'KeyM':
      e.preventDefault();
      vid.muted = !vid.muted;
      updateMuteBtn(); updateVolGradient();
      break;
    case 'KeyN':
      e.preventDefault();
      playNext();
      break;
    case 'KeyP':
      e.preventDefault();
      playPrev();
      break;
  }
});

// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  libraryPanel.classList.toggle('visible', name === 'library');
  queuePanel.classList.toggle('visible', name === 'queue');
  libEmpty.style.display = name === 'library' ? '' : 'none';
  queueEmpty.style.display = name === 'queue' ? '' : 'none';
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// ── Init ──────────────────────────────────────────────────────────────────
updateVolGradient();
updateSeekGradient();
updateMuteBtn();

loadLibrary().then(() => loadQueue());
</script>
</body>
</html>
