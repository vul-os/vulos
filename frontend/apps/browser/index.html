<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self';">
<title>Smart Browser</title>
<link rel="stylesheet" href="vulos-tokens.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-base); color: var(--text-primary); font-family: var(--font-ui); }
.bar { display: flex; gap: 8px; padding: 8px; background: var(--bg-surface); border-bottom: 1px solid var(--border-strong); }
.bar input { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border-emphasis); border-radius: 8px; padding: 8px 12px; color: var(--text-primary); font-size: 14px; outline: none; }
.bar input:focus { border-color: var(--accent); }
.bar button { background: var(--border-emphasis); border: none; border-radius: 8px; padding: 8px 16px; color: var(--text-primary); cursor: pointer; font-size: 13px; transition: background .15s; }
.bar button:hover { background: var(--accent); color: #fff; }
.content { padding: 16px; }
.content iframe { width: 100%; height: calc(100vh - 52px); border: none; background: white; border-radius: 4px; }
.summary { background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 14px; line-height: 1.5; }
.summary h3 { color: var(--text-muted); font-size: 12px; text-transform: uppercase; margin-bottom: 4px; }
.summary-footer { display: flex; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-strong); }
.bar button:disabled { opacity: 0.4; cursor: not-allowed; }
/* Vulos branding chip */
.vulos-brand { margin-left: auto; padding: 0 4px; font-size: 12px; letter-spacing: .04em; color: var(--text-ghost); align-self: center; white-space: nowrap; }
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-api-helper.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
</head>
<body>
<div class="bar">
  <input id="url" type="text" placeholder="Enter URL..." autofocus>
  <button onclick="go()">Go</button>
  <button onclick="summarize()">Summarize</button>
  <span class="vulos-brand" title="Part of Vulos">Vulos</span>
</div>
<div id="summary"></div>
<div class="content"><iframe id="frame"></iframe></div>
<script>
const frame = document.getElementById('frame');
const urlInput = document.getElementById('url');
const summaryDiv = document.getElementById('summary');

urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

function go() {
  let url = urlInput.value.trim();
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  frame.src = '/browse?url=' + encodeURIComponent(url);
}

// Active AbortController for the running stream (null when idle).
let activeAbort = null;

async function summarize() {
  // Cancel any in-flight request first.
  if (activeAbort) { activeAbort.abort(); activeAbort = null; }

  const url = urlInput.value.trim();
  if (!url) return;

  // Show streaming panel.
  renderSummary('', true);

  // Extract visible page text from the iframe if same-origin, else fall back.
  let pageText = '';
  try {
    pageText = frame.contentDocument?.body?.innerText?.trim() || '';
  } catch (_) { /* cross-origin iframe — no access */ }
  if (!pageText) pageText = 'Please summarise the web page at: ' + url;

  const ac = new AbortController();
  activeAbort = ac;

  try {
    // Check AI Router status first to get the active model.
    let activeModel = '';
    try {
      const stRes = await fetch(vulosApi.appUrl('/api/ai/status'), { signal: ac.signal });
      if (stRes.ok) { const st = await stRes.json(); activeModel = st.active_model || ''; }
    } catch (_) { /* proceed without model — router will pick default */ }

    const res = await fetch(vulosApi.appUrl('/api/ai/chat'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: activeModel,
        messages: [
          { role: 'system', content: 'You are a helpful web-page summariser. Summarise the supplied page text in 3–5 concise bullet points. Use plain text, no markdown headers.' },
          { role: 'user', content: 'Page URL: ' + url + '\n\n' + pageText.slice(0, 8000) }
        ],
        stream: true,
      }),
      signal: ac.signal,
    });

    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || 'HTTP ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete last line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') break;
        try {
          const ev = JSON.parse(payload);
          const delta = (ev.choices && ev.choices[0] && ev.choices[0].delta && ev.choices[0].delta.content) || ev.content || '';
          if (delta) { fullText += delta; renderSummary(fullText, true); }
        } catch (_) { /* skip malformed chunk */ }
      }
    }

    renderSummary(fullText, false);
  } catch(e) {
    if (e.name === 'AbortError') { renderSummary('', false); return; }
    renderSummaryError(e.message || 'Could not summarize.');
  } finally {
    if (activeAbort === ac) activeAbort = null;
  }
}

function renderSummary(text, streaming) {
  summaryDiv.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'summary';

  const heading = document.createElement('h3');
  heading.textContent = 'AI Summary';
  wrapper.appendChild(heading);

  if (text) {
    const body = document.createElement('p');
    body.textContent = text; // textContent prevents XSS
    wrapper.appendChild(body);
  } else if (streaming) {
    const loading = document.createElement('p');
    loading.style.color = 'var(--text-faint)';
    loading.textContent = 'Generating summary…';
    wrapper.appendChild(loading);
  }

  if (!streaming && text) {
    const footer = document.createElement('div');
    footer.className = 'summary-footer';

    const copyBtn = document.createElement('button');
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = () => navigator.clipboard.writeText(text).catch(() => {});
    footer.appendChild(copyBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Close';
    cancelBtn.onclick = () => { summaryDiv.innerHTML = ''; };
    footer.appendChild(cancelBtn);

    wrapper.appendChild(footer);
  } else if (streaming) {
    const footer = document.createElement('div');
    footer.className = 'summary-footer';
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { if (activeAbort) { activeAbort.abort(); activeAbort = null; } summaryDiv.innerHTML = ''; };
    footer.appendChild(cancelBtn);
    wrapper.appendChild(footer);
  }

  summaryDiv.appendChild(wrapper);
}

function renderSummaryError(msg) {
  summaryDiv.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.className = 'summary';
  const heading = document.createElement('h3');
  heading.textContent = 'Error';
  wrapper.appendChild(heading);
  const body = document.createElement('p');
  body.style.color = 'var(--danger-bright)';
  body.textContent = msg;
  wrapper.appendChild(body);
  summaryDiv.appendChild(wrapper);
}
</script>
</body>
</html>
