<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Media: violet tile -->
  <rect width="64" height="64" rx="14" fill="#4c1d95"/>
  <!-- Canvas frame -->
  <rect x="10" y="12" width="30" height="26" rx="4" fill="#2e1065" stroke="#a78bfa" stroke-width="1.5"/>
  <!-- Mountains in canvas -->
  <polygon points="13,35 21,23 29,35" fill="#7c3aed"/>
  <polygon points="23,35 31,26 37,35" fill="#6d28d9"/>
  <!-- Sun dot in canvas -->
  <circle cx="33" cy="19" r="3" fill="#c4b5fd"/>
  <!-- Pencil body (diagonal, bottom-right) -->
  <rect x="37" y="30" width="6" height="20" rx="2" transform="rotate(-45 40 40)" fill="#ddd6fe"/>
  <!-- Pencil eraser end -->
  <rect x="37" y="30" width="6" height="4" rx="2" transform="rotate(-45 40 40)" fill="#a78bfa"/>
  <!-- Pencil tip triangle -->
  <polygon points="47,47 53,47 50,53" transform="rotate(-45 50 49)" fill="#ede9fe"/>
</svg>
