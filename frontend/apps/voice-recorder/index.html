<title>Voice Recorder</title>
<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-shared-assets.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
  --text:#e5e5e5;--muted:#666;--accent:#ef4444;--accent2:#f87171;
  --green:#22c55e;--blue:#3b82f6;--yellow:#eab308;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---- Header ---- */
.header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:16px;font-weight:600;letter-spacing:.3px}
.header .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s,box-shadow .3s}
.header .dot.recording{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ---- Main layout ---- */
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.recordings-list{flex:1;overflow-y:auto}
.rec-item{padding:10px 12px;border-bottom:1px solid #161616;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.rec-item:hover{background:var(--surface)}
.rec-item.active{background:var(--surface2);border-left:2px solid var(--blue)}
.rec-item .rec-icon{font-size:18px;flex-shrink:0}
.rec-item .rec-info{flex:1;min-width:0}
.rec-item .rec-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-item .rec-meta{font-size: 12px;color:var(--muted);margin-top:2px}
.rec-item .rec-del{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;font-size:14px}
.rec-item:hover .rec-del{opacity:1}
.rec-item .rec-del:hover{color:var(--accent)}
.no-recordings{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px}

/* ---- Content area ---- */
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px;gap:20px;overflow-y:auto}

/* ---- Waveform canvas ---- */
.waveform-wrap{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative}
.waveform-label{font-size: 12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
canvas#waveform{width:100%;height:80px;display:block;border-radius:6px}

/* ---- Timer ---- */
.timer{font-size:48px;font-weight:300;letter-spacing:4px;font-variant-numeric:tabular-nums;color:var(--text)}
.timer.recording-on{color:var(--accent)}

/* ---- Record button ---- */
.record-btn{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .1s,box-shadow .2s;background:var(--accent);box-shadow:0 0 0 0 rgba(239,68,68,0)}
.record-btn:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(239,68,68,.4)}
.record-btn:active{transform:scale(.96)}
.record-btn.recording{background:var(--surface2);border:3px solid var(--accent);box-shadow:0 0 16px rgba(239,68,68,.3)}
.record-btn .icon{transition:transform .2s}

/* ---- Playback / trim section ---- */
.playback-section{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.playback-section.hidden{display:none}
.pb-title{font-size:13px;font-weight:600;color:var(--text)}
.pb-sub{font-size: 12px;color:var(--muted);margin-top:2px}

/* Trim sliders */
.trim-wrap{display:flex;flex-direction:column;gap:6px}
.trim-label{font-size: 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.trim-row{display:flex;align-items:center;gap:10px}
.trim-row label{font-size:12px;color:var(--muted);width:36px;flex-shrink:0}
.trim-row input[type=range]{flex:1;accent-color:var(--blue)}
.trim-row span{font-size:12px;color:var(--text);width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* Audio element hidden, we control it */
audio{display:none}

/* Playback controls */
.pb-controls{display:flex;align-items:center;gap:12px}
.pb-play-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pb-play-btn:hover{background:#2563eb}
.pb-progress{flex:1;accent-color:var(--blue)}
.pb-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Save / discard buttons */
.action-row{display:flex;gap:10px;justify-content:flex-end}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#16a34a}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:#222}
.btn-danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-danger:hover{background:rgba(239,68,68,.1)}

/* ---- Status bar ---- */
.status-bar{padding:6px 16px;border-top:1px solid var(--border);font-size: 12px;color:var(--muted);flex-shrink:0}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <div class="dot" id="recDot"></div>
  <h1>Voice Recorder</h1>
  <span id="headerStatus" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
</div>

<div class="main">
  <!-- Sidebar: saved recordings list -->
  <div class="sidebar">
    <div class="sidebar-header">Recordings</div>
    <div class="recordings-list" id="recList">
      <div class="no-recordings">No recordings yet</div>
    </div>
  </div>

  <!-- Main content -->
  <div class="content">

    <!-- Live waveform during recording -->
    <div class="waveform-wrap" id="waveformWrap">
      <div class="waveform-label">Live waveform</div>
      <canvas id="waveform"></canvas>
    </div>

    <!-- Timer -->
    <div class="timer" id="timer">0:00.0</div>

    <!-- Record button -->
    <button class="record-btn" id="recordBtn" title="Start recording" onclick="toggleRecord()">
      <span class="icon" id="recordIcon">⏺</span>
    </button>
    <div style="font-size:12px;color:var(--muted)" id="recordHint">Click to record</div>

    <!-- Playback & trim (shown after recording stops) -->
    <div class="playback-section hidden" id="playbackSection">
      <div>
        <div class="pb-title" id="pbTitle">New Recording</div>
        <div class="pb-sub" id="pbSub"></div>
      </div>

      <div class="trim-wrap">
        <div class="trim-label">Trim</div>
        <div class="trim-row">
          <label>Start</label>
          <input type="range" id="trimStart" min="0" max="100" step="0.1" value="0" oninput="onTrimChange()">
          <span id="trimStartVal">0.0s</span>
        </div>
        <div class="trim-row">
          <label>End</label>
          <input type="range" id="trimEnd" min="0" max="100" step="0.1" value="100" oninput="onTrimChange()">
          <span id="trimEndVal">—</span>
        </div>
      </div>

      <div class="pb-controls">
        <button class="pb-play-btn" id="pbPlayBtn" onclick="togglePlayback()" title="Play / pause">▶</button>
        <input type="range" id="pbProgress" class="pb-progress" min="0" max="100" step="0.01" value="0" oninput="onSeek()">
        <span class="pb-time" id="pbTime">0:00 / 0:00</span>
      </div>

      <div class="action-row">
        <button class="btn btn-danger" onclick="discardRecording()">Discard</button>
        <button class="btn btn-secondary" onclick="reRecord()">Re-record</button>
        <button class="btn btn-primary" onclick="saveRecording()">Save</button>
      </div>
    </div>

  </div><!-- .content -->
</div><!-- .main -->

<!-- Hidden audio element for playback -->
<audio id="audioPlayer"></audio>

<div class="status-bar" id="statusBar">Ready</div>

<script>
/* ================================================================
   State
================================================================ */
let mediaRecorder = null;
let audioChunks   = [];
let recordedBlob  = null;
let trimmedBlob   = null;
let isRecording   = false;
let startTime     = 0;
let timerInterval = null;

// Web Audio
let audioCtx      = null;
let analyser      = null;
let sourceNode    = null;
let animFrameId   = null;
let micStream     = null;

// Playback
const audioEl     = document.getElementById('audioPlayer');
let audioDuration = 0;

/* ================================================================
   DOM refs
================================================================ */
const recDot         = document.getElementById('recDot');
const timerEl        = document.getElementById('timer');
const recordBtn      = document.getElementById('recordBtn');
const recordIcon     = document.getElementById('recordIcon');
const recordHint     = document.getElementById('recordHint');
const playbackSection= document.getElementById('playbackSection');
const waveformWrap   = document.getElementById('waveformWrap');
const canvas         = document.getElementById('waveform');
const ctx2d          = canvas.getContext('2d');
const pbPlayBtn      = document.getElementById('pbPlayBtn');
const pbProgress     = document.getElementById('pbProgress');
const pbTime         = document.getElementById('pbTime');
const trimStartEl    = document.getElementById('trimStart');
const trimEndEl      = document.getElementById('trimEnd');
const trimStartVal   = document.getElementById('trimStartVal');
const trimEndVal     = document.getElementById('trimEndVal');
const pbTitle        = document.getElementById('pbTitle');
const pbSub          = document.getElementById('pbSub');
const statusBar      = document.getElementById('statusBar');
const recList        = document.getElementById('recList');
const headerStatus   = document.getElementById('headerStatus');

/* ================================================================
   Utilities
================================================================ */
function fmtTime(secs) {
  if (!isFinite(secs)) return '0:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function fmtTimeLive(ms) {
  const total = ms / 1000;
  const m = Math.floor(total / 60);
  const s = Math.floor(total % 60).toString().padStart(2,'0');
  const ds = Math.floor((total % 1) * 10);
  return `${m}:${s}.${ds}`;
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  } catch { return iso; }
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

function setStatus(msg) { statusBar.textContent = msg; }

/* ================================================================
   Waveform drawing
================================================================ */
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width  = rect.width  * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  ctx2d.scale(devicePixelRatio, devicePixelRatio);
}

function drawWaveform() {
  if (!analyser) return;
  animFrameId = requestAnimationFrame(drawWaveform);

  const bufferLength = analyser.fftSize;
  const dataArray    = new Float32Array(bufferLength);
  analyser.getFloatTimeDomainData(dataArray);

  const W = canvas.width  / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;

  ctx2d.clearRect(0, 0, W, H);

  // Background
  ctx2d.fillStyle = '#0f0f0f';
  ctx2d.fillRect(0, 0, W, H);

  // Waveform line
  ctx2d.lineWidth   = 2;
  ctx2d.strokeStyle = '#ef4444';
  ctx2d.shadowColor = '#ef4444';
  ctx2d.shadowBlur  = 8;
  ctx2d.beginPath();

  const sliceWidth = W / bufferLength;
  let x = 0;
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i];
    const y = (H / 2) + (v * H / 2);
    i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
    x += sliceWidth;
  }
  ctx2d.stroke();
  ctx2d.shadowBlur = 0;
}

function drawIdleWaveform() {
  const W = canvas.width  / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.fillStyle = '#0f0f0f';
  ctx2d.fillRect(0, 0, W, H);

  // Flat line with subtle dots
  ctx2d.lineWidth   = 1.5;
  ctx2d.strokeStyle = '#333';
  ctx2d.beginPath();
  ctx2d.moveTo(0, H / 2);
  ctx2d.lineTo(W, H / 2);
  ctx2d.stroke();
}

/* ================================================================
   Recording
================================================================ */
async function toggleRecord() {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
}

async function startRecording() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    setStatus('Microphone access denied: ' + err.message);
    return;
  }

  // Web Audio for live waveform
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  sourceNode = audioCtx.createMediaStreamSource(micStream);
  sourceNode.connect(analyser);
  // Note: do NOT connect analyser to destination — we don't want monitoring feedback

  resizeCanvas();
  drawWaveform();

  // MediaRecorder
  const mimeType = getSupportedMime();
  const options  = mimeType ? { mimeType } : {};
  mediaRecorder  = new MediaRecorder(micStream, options);
  audioChunks    = [];

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordStop;
  mediaRecorder.start(100); // collect in 100ms chunks

  isRecording = true;
  startTime   = Date.now();

  // UI
  recordBtn.classList.add('recording');
  recordIcon.textContent = '⏹';
  recordHint.textContent = 'Click to stop';
  recDot.classList.add('recording');
  timerEl.classList.add('recording-on');
  playbackSection.classList.add('hidden');

  // Live timer
  timerInterval = setInterval(() => {
    timerEl.textContent = fmtTimeLive(Date.now() - startTime);
  }, 100);

  setStatus('Recording...');
  headerStatus.textContent = 'Recording';
}

function getSupportedMime() {
  const candidates = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
    'audio/mp4',
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function stopRecording() {
  if (!isRecording) return;
  mediaRecorder.stop();
  isRecording = false;

  clearInterval(timerInterval);
  timerInterval = null;

  // Stop mic tracks
  if (micStream) {
    micStream.getTracks().forEach(t => t.stop());
    micStream = null;
  }

  // Stop waveform animation
  if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
  if (sourceNode)  { try { sourceNode.disconnect(); } catch(_) {} sourceNode = null; }
  if (analyser)    { analyser = null; }
  if (audioCtx)    { audioCtx.close().catch(()=>{}); audioCtx = null; }

  drawIdleWaveform();

  // UI reset
  recordBtn.classList.remove('recording');
  recordIcon.textContent = '⏺';
  recordHint.textContent = 'Click to record';
  recDot.classList.remove('recording');
  timerEl.classList.remove('recording-on');
  headerStatus.textContent = '';
  setStatus('Processing...');
}

function onRecordStop() {
  const mime = mediaRecorder.mimeType || 'audio/webm';
  recordedBlob = new Blob(audioChunks, { type: mime });
  trimmedBlob  = null;

  const url = URL.createObjectURL(recordedBlob);
  audioEl.src = url;
  audioEl.load();

  audioEl.onloadedmetadata = () => {
    audioDuration = audioEl.duration;
    initTrimControls(audioDuration);
    updatePbTime(0);
    showPlaybackSection();
    setStatus('Ready to save');
  };

  audioEl.onerror = () => {
    audioDuration = 0;
    initTrimControls(0);
    showPlaybackSection();
    setStatus('Ready to save (duration unknown)');
  };
}

/* ================================================================
   Trim controls
================================================================ */
function initTrimControls(duration) {
  trimStartEl.value = 0;
  trimEndEl.value   = 100;
  updateTrimLabels(duration);
}

function onTrimChange() {
  const sVal = parseFloat(trimStartEl.value);
  const eVal = parseFloat(trimEndEl.value);

  // Clamp: start < end
  if (sVal >= eVal) {
    trimStartEl.value = Math.max(0, eVal - 1);
  }
  updateTrimLabels(audioDuration);

  // Move playback position to trim start
  const startSec = (parseFloat(trimStartEl.value) / 100) * audioDuration;
  if (isFinite(startSec)) {
    audioEl.currentTime = startSec;
    pbProgress.value     = trimStartEl.value;
    updatePbTime(startSec);
  }
}

function updateTrimLabels(duration) {
  const s = (parseFloat(trimStartEl.value) / 100) * (duration || 0);
  const e = (parseFloat(trimEndEl.value)   / 100) * (duration || 0);
  trimStartVal.textContent = s.toFixed(1) + 's';
  trimEndVal.textContent   = e.toFixed(1) + 's';
}

function getTrimSeconds() {
  const s = (parseFloat(trimStartEl.value) / 100) * audioDuration;
  const e = (parseFloat(trimEndEl.value)   / 100) * audioDuration;
  return { start: s, end: e };
}

/* ================================================================
   Playback controls
================================================================ */
function showPlaybackSection() {
  const elapsed = timerEl.textContent;
  pbTitle.textContent = 'New Recording';
  pbSub.textContent   = `Duration: ${elapsed}`;
  playbackSection.classList.remove('hidden');
}

function togglePlayback() {
  if (audioEl.paused) {
    // Honour trim: don't play before start or past end
    const { start, end } = getTrimSeconds();
    if (!isFinite(audioDuration) || audioDuration === 0) {
      audioEl.play().catch(()=>{});
    } else {
      if (audioEl.currentTime < start || audioEl.currentTime >= end) {
        audioEl.currentTime = start;
      }
      audioEl.play().catch(()=>{});
    }
    pbPlayBtn.textContent = '⏸';
  } else {
    audioEl.pause();
    pbPlayBtn.textContent = '▶';
  }
}

audioEl.addEventListener('timeupdate', () => {
  if (!audioDuration || !isFinite(audioDuration)) return;
  const pct = (audioEl.currentTime / audioDuration) * 100;
  pbProgress.value = pct;
  updatePbTime(audioEl.currentTime);

  // Auto-stop at trim end
  const { end } = getTrimSeconds();
  if (isFinite(end) && audioEl.currentTime >= end) {
    audioEl.pause();
    audioEl.currentTime = end;
    pbPlayBtn.textContent = '▶';
  }
});

audioEl.addEventListener('ended', () => { pbPlayBtn.textContent = '▶'; });
audioEl.addEventListener('pause',  () => { pbPlayBtn.textContent = '▶'; });
audioEl.addEventListener('play',   () => { pbPlayBtn.textContent = '⏸'; });

function onSeek() {
  if (!audioDuration || !isFinite(audioDuration)) return;
  const t = (parseFloat(pbProgress.value) / 100) * audioDuration;
  audioEl.currentTime = t;
  updatePbTime(t);
}

function updatePbTime(current) {
  const dur = (audioDuration && isFinite(audioDuration)) ? audioDuration : 0;
  pbTime.textContent = `${fmtTime(current)} / ${fmtTime(dur)}`;
}

/* ================================================================
   Trim + Save
================================================================ */
async function buildTrimmedBlob() {
  // If duration unknown or no meaningful trim, return original
  const { start, end } = getTrimSeconds();
  if (!audioDuration || !isFinite(audioDuration) ||
      (start <= 0.05 && end >= audioDuration - 0.05)) {
    return recordedBlob;
  }

  // Use Web Audio OfflineAudioContext to decode + trim
  try {
    const arrayBuf = await recordedBlob.arrayBuffer();
    const decodedCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded    = await decodedCtx.decodeAudioData(arrayBuf);
    decodedCtx.close().catch(()=>{});

    const sampleRate    = decoded.sampleRate;
    const startSample   = Math.floor(start * sampleRate);
    const endSample     = Math.min(Math.ceil(end * sampleRate), decoded.length);
    const trimLength    = Math.max(1, endSample - startSample);
    const numChannels   = decoded.numberOfChannels;

    const offCtx = new OfflineAudioContext(numChannels, trimLength, sampleRate);
    const offBuf = offCtx.createBuffer(numChannels, trimLength, sampleRate);
    for (let c = 0; c < numChannels; c++) {
      const srcData  = decoded.getChannelData(c);
      const destData = offBuf.getChannelData(c);
      for (let i = 0; i < trimLength; i++) {
        destData[i] = srcData[startSample + i] || 0;
      }
    }

    const src = offCtx.createBufferSource();
    src.buffer = offBuf;
    src.connect(offCtx.destination);
    src.start();
    const rendered = await offCtx.startRendering();

    // Encode rendered AudioBuffer → WAV
    return audioBufferToWav(rendered);
  } catch (err) {
    console.warn('Trim via OfflineAudioContext failed, saving original:', err);
    return recordedBlob;
  }
}

function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate  = buffer.sampleRate;
  const length      = buffer.length;
  const bitDepth    = 16;
  const bytesPerSample = bitDepth / 8;
  const blockAlign  = numChannels * bytesPerSample;
  const byteRate    = sampleRate * blockAlign;
  const dataSize    = length * blockAlign;
  const ab          = new ArrayBuffer(44 + dataSize);
  const view        = new DataView(ab);

  function writeStr(off, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
  }

  writeStr(0,  'RIFF');
  view.setUint32(4,  36 + dataSize, true);
  writeStr(8,  'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1,  true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeStr(36, 'data');
  view.setUint32(40, dataSize, true);

  let off = 44;
  for (let i = 0; i < length; i++) {
    for (let c = 0; c < numChannels; c++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(c)[i]));
      view.setInt16(off, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      off += 2;
    }
  }

  return new Blob([ab], { type: 'audio/wav' });
}

async function saveRecording() {
  setStatus('Trimming and saving...');
  try {
    trimmedBlob = await buildTrimmedBlob();
    const ext  = trimmedBlob.type.includes('wav') ? '.wav' : '.webm';
    const ts   = new Date().toISOString().replace(/[:.]/g,'-').replace('T','_').slice(0,19);
    const name = `recording_${ts}${ext}`;

    const resp = await fetch(vulosApi.appUrl(`/api/recordings?name=${encodeURIComponent(name)}`), {
      method: 'POST',
      headers: { 'Content-Type': trimmedBlob.type || 'audio/webm' },
      body: trimmedBlob,
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    setStatus('Saved: ' + name);
    resetUI();
    loadRecordings();
  } catch (err) {
    setStatus('Save failed: ' + err.message);
  }
}

function discardRecording() {
  audioEl.pause();
  URL.revokeObjectURL(audioEl.src);
  audioEl.src = '';
  recordedBlob = null;
  trimmedBlob  = null;
  resetUI();
  setStatus('Discarded');
}

function reRecord() {
  discardRecording();
}

function resetUI() {
  playbackSection.classList.add('hidden');
  timerEl.textContent = '0:00.0';
  drawIdleWaveform();
}

/* ================================================================
   Recordings list
================================================================ */
async function loadRecordings() {
  try {
    const resp = await fetch(vulosApi.appUrl('/api/recordings'));
    const recs  = await resp.json();
    renderRecordingsList(recs);
  } catch (err) {
    setStatus('Could not load recordings: ' + err.message);
  }
}

function renderRecordingsList(recs) {
  if (!recs || recs.length === 0) {
    recList.innerHTML = '<div class="no-recordings">No recordings yet.<br>Hit the button to start.</div>';
    return;
  }
  recList.innerHTML = recs.map(r => `
    <div class="rec-item" onclick="playbackSaved('${r.id}')">
      <div class="rec-icon">🎙</div>
      <div class="rec-info">
        <div class="rec-name" title="${r.name}">${r.name}</div>
        <div class="rec-meta">${fmtDate(r.created_iso)} · ${fmtSize(r.size)}</div>
      </div>
      <button class="rec-del" title="Delete" onclick="deleteRecording(event,'${r.id}')">✕</button>
    </div>
  `).join('');
}

function playbackSaved(id) {
  // Highlight
  document.querySelectorAll('.rec-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.rec-item');
  items.forEach(el => {
    if (el.querySelector('.rec-name')?.title === id ||
        el.querySelector('.rec-name')?.textContent === id) {
      el.classList.add('active');
    }
  });

  audioEl.pause();
  audioEl.src = vulosApi.appUrl(`/audio/${encodeURIComponent(id)}`);
  audioEl.load();

  audioEl.onloadedmetadata = () => {
    audioDuration = audioEl.duration;
    initTrimControls(audioDuration);
    updatePbTime(0);

    pbTitle.textContent = id;
    pbSub.textContent   = `Duration: ${fmtTime(audioDuration)}`;
    recordedBlob = null; // marks as saved — save button will be hidden
    playbackSection.classList.remove('hidden');

    // Hide save/discard actions for already-saved recordings
    document.querySelector('.action-row').style.display = 'none';
    trimmedBlob = null;
    setStatus('Playing: ' + id);
  };
}

async function deleteRecording(evt, id) {
  evt.stopPropagation();
  if (!confirm(`Delete "${id}"?`)) return;
  try {
    const resp = await fetch(vulosApi.appUrl(`/api/recordings/${encodeURIComponent(id)}`), { method: 'DELETE' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    setStatus('Deleted: ' + id);
    loadRecordings();
    if (audioEl.src.includes(encodeURIComponent(id))) {
      audioEl.pause();
      audioEl.src = '';
      playbackSection.classList.add('hidden');
      document.querySelector('.action-row').style.display = 'flex';
    }
  } catch (err) {
    setStatus('Delete failed: ' + err.message);
  }
}

/* ================================================================
   Resize handler
================================================================ */
window.addEventListener('resize', () => {
  resizeCanvas();
  if (!isRecording) drawIdleWaveform();
});

/* ================================================================
   Init
================================================================ */
resizeCanvas();
drawIdleWaveform();
loadRecordings();

// Restore action-row display when starting a new record
document.getElementById('recordBtn').addEventListener('click', () => {
  document.querySelector('.action-row').style.display = 'flex';
});
</script>
</body>
</html>
