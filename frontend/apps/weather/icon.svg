  <line x1="13" y1="23" x2="9" y2="23" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="16" x2="12" y2="13" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="16" x2="32" y2="13" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="30" x2="12" y2="33" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
