<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;

  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;

    --text-muted: #5c626e;
    --text-faint: #606977;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1014;
      --panel: #121a20;
      --panel-2: #182329;
      --line: #27343b;
      --text: #eef6f4;
      --muted: #9fb1ad;
      --accent: #7dd3fc;
      --warm: #f8d66d;
      --rain: #60a5fa;
      --ok: #7dd3a7;

      --uv-low: #7dd3a7;

      --uv-high: #fb923c;
      --uv-vhigh: #f87171;
      --uv-extreme: #c084fc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 8%, rgba(125, 211, 252, .18), transparent 28rem),

    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: .98rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(18, 26, 32, .75);
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;

      grid-template-columns: 1fr 1fr;

      padding: 4px;
      border: 1px solid var(--line);

      background: rgba(18, 26, 32, .75);

    .result button {
      border: 0;
      color: var(--text);
      cursor: pointer;

      height: 34px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);

      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 26, 32, .9);
      color: var(--text);
      padding: 0 15px;
      font: inherit;
      outline: none;
    }

      border-color: var(--accent);

      gap: 8px;

      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(18, 26, 32, .92);
      text-align: left;
      padding: 10px 12px;
    }

    .result button:hover { border-color: var(--accent); }

    .details,
    .forecast-card,
    .hourly-card {

      border-radius: 8px;
      background: rgba(18, 26, 32, .84);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .23);

      padding: 28px;

      background: rgba(24, 35, 41, .76);
    }

    .day-name { font-weight: 800; }
    .day-condition {
      color: var(--muted);
      font-size: .92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .temps {
      text-align: right;
      white-space: nowrap;
      font-weight: 800;
    }

    .meta {
      grid-column: 2 / 4;
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: .85rem;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      background: rgba(18, 26, 32, .55);
    }

    @media (max-width: 840px) {
      main { width: min(100% - 24px, 680px); padding-top: 18px; }
      header { align-items: flex-start; }
      .dashboard { grid-template-columns: 1fr; }
      .details { grid-template-columns: repeat(3, 1fr); }
      .current { min-height: 330px; padding: 22px; }
    }

    @media (max-width: 640px) {
      .details { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 540px) {
      header { flex-direction: column; }
      .header-controls { align-self: flex-end; }
      .search { grid-template-columns: 1fr; }
      .search button { width: 100%; }
      .place { flex-direction: column-reverse; }
      .weather-mark { width: 76px; height: 76px; }
      .temperature { font-size: 4.8rem; }
      .temp-row { align-items: flex-start; flex-direction: column; gap: 8px; }
      .condition { padding-bottom: 0; }
      .details { grid-template-columns: 1fr 1fr; }
      .day { grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; }
      .meta { grid-column: 1 / 4; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Weather</h1>
        <p class="subtitle">Current conditions and the next seven days.</p>
      </div>
      <div class="header-controls">
        <button id="geoBtn" class="geo-btn" type="button" title="Use my location" aria-label="Detect my location">&#x1F4CD;</button>
        <div class="unit-toggle" aria-label="Temperature unit">
          <button id="celsiusBtn" type="button" class="active" aria-pressed="true">C</button>
          <button id="fahrenheitBtn" type="button" aria-pressed="false">F</button>
        </div>
      </div>
    </header>

    <form class="search" id="searchForm">
      <label for="cityInput" hidden>City</label>
      <input id="cityInput" type="search" placeholder="Search city or use location pin above" autocomplete="off" spellcheck="false">
      <button type="submit">Search</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="results" id="results"></div>

    <section id="content" class="empty">Detecting your location&hellip;</section>
  </main>

  <script>
    const state = {
      unit: localStorage.getItem("weather.unit") || "celsius",
      location: JSON.parse(localStorage.getItem("weather.location") || "null"),
      data: null,
      hourlyData: null
    };

    const els = {
      form: document.getElementById("searchForm"),
      input: document.getElementById("cityInput"),
      status: document.getElementById("status"),
      results: document.getElementById("results"),
      content: document.getElementById("content"),
      celsius: document.getElementById("celsiusBtn"),
      fahrenheit: document.getElementById("fahrenheitBtn"),
      geoBtn: document.getElementById("geoBtn")
    };

    const weatherCodes = {
      0: "Clear sky",
      1: "Mainly clear",
      2: "Partly cloudy",
      3: "Overcast",
      45: "Fog",
      48: "Depositing rime fog",
      51: "Light drizzle",
      53: "Moderate drizzle",
      55: "Dense drizzle",
      56: "Freezing drizzle",
      57: "Freezing drizzle",
      61: "Slight rain",
      63: "Moderate rain",
      65: "Heavy rain",
      66: "Freezing rain",
      67: "Freezing rain",
      71: "Slight snow",
      73: "Moderate snow",
      75: "Heavy snow",
      77: "Snow grains",
      80: "Rain showers",
      81: "Rain showers",
      82: "Violent rain showers",
      85: "Snow showers",
      86: "Snow showers",
      95: "Thunderstorm",
      96: "Thunderstorm with hail",
      99: "Thunderstorm with hail"
    };

    // Weather code to simple emoji icon
    function weatherIcon(code, isDay = true) {
      if (code === 0) return isDay ? "☀️" : "🌙";
      if (code <= 2) return isDay ? "⛅" : "🌙";
      if (code === 3) return "☁️";
      if (code <= 48) return "🌫️";
      if (code <= 55) return "🌦️";
      if (code <= 57) return "🌧️";
      if (code <= 65) return "🌧️";
      if (code <= 67) return "🌨️";
      if (code <= 77) return "❄️";
      if (code <= 82) return "🌧️";
      if (code <= 86) return "🌨️";
      return "⛈️";
    }

    function uvCategory(uv) {
      if (uv < 3) return { cls: "uv-low", label: "Low" };
      if (uv < 6) return { cls: "uv-mod", label: "Moderate" };
      if (uv < 8) return { cls: "uv-high", label: "High" };
      if (uv < 11) return { cls: "uv-vhigh", label: "Very High" };
      return { cls: "uv-extreme", label: "Extreme" };
    }

    function setStatus(message, kind = "") {
      els.status.textContent = message;
      els.status.className = "status " + kind;
    }

    function unitLabel() {
      return state.unit === "celsius" ? "C" : "F";
    }

    function speedLabel() {
      return state.unit === "celsius" ? "km/h" : "mph";
    }

    function tempUnitParam() {
      return state.unit === "celsius" ? "celsius" : "fahrenheit";
    }

    function speedUnitParam() {
      return state.unit === "celsius" ? "kmh" : "mph";
    }

    function precipitationUnitParam() {
      return state.unit === "celsius" ? "mm" : "inch";
    }

    function formatTemp(value) {
      if (value === null || value === undefined) return "--";
      return Math.round(value) + "&deg;" + unitLabel();
    }

    function formatDate(value, options) {
      return new Intl.DateTimeFormat(undefined, options).format(new Date(value));
    }

    function condition(code) {
      return weatherCodes[code] || "Mixed conditions";
    }

    function setUnit(unit, refresh = true) {
      state.unit = unit;
      localStorage.setItem("weather.unit", unit);
      els.celsius.classList.toggle("active", unit === "celsius");
      els.fahrenheit.classList.toggle("active", unit === "fahrenheit");
      els.celsius.setAttribute("aria-pressed", unit === "celsius");
      els.fahrenheit.setAttribute("aria-pressed", unit === "fahrenheit");
      if (refresh && state.location) loadForecast(state.location);
    }

    // ── Geolocation chain ────────────────────────────────────────────────────

    function tryBrowserGeo() {
      setStatus("Detecting location via GPS…", "info");
      els.geoBtn.classList.add("active");

      if (!navigator.geolocation) {
        tryIpGeo();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          reverseGeocode(latitude, longitude, "GPS");
        },
        err => {
          // denied or unavailable — fall back to IP
          tryIpGeo();
        },
        { timeout: 8000, maximumAge: 300000 }
      );
    }

    async function tryIpGeo() {
      setStatus("Detecting location via IP…", "info");
      try {
        // ip-api.com returns JSON with lat/lon for the current IP — no key needed
        // Route through the host proxy to avoid direct cross-origin requests from app iframe.
        const res = await fetch("/api/proxy/https://ip-api.com/json/?fields=status,lat,lon,city,regionName,country,timezone");
        if (!res.ok) throw new Error("IP geo failed");
        const data = await res.json();
        if (data.status !== "success") throw new Error("IP geo failed");
        reverseGeocode(data.lat, data.lon, "IP", {
          name: data.city || "Unknown",
          admin1: data.regionName || "",
          country: data.country || "",
          timezone: data.timezone || "auto"
        });
      } catch {
        // All auto-detection failed — show manual search prompt
        els.geoBtn.classList.remove("active");
        setStatus("Location detection unavailable. Search for a city below.", "");
        els.content.className = "empty";
        els.content.innerHTML = "Search for a city to load the forecast.";
      }
    }

    async function reverseGeocode(lat, lon, source, prefill = null) {
      // Use Open-Meteo geocoding reverse to get a structured place name
      // We just pass coords directly to forecast — geocoding is optional for name
      let location;
      if (prefill) {
        location = { ...prefill, latitude: lat, longitude: lon };
      } else {
        // Try Open-Meteo geocoding to get admin1/country for coords
        try {
          const res = await fetch(
            "https://geocoding-api.open-meteo.com/v1/search?name=" +
            lat.toFixed(4) + "," + lon.toFixed(4) + "&count=1&language=en&format=json"
          );
          // The geocoding API doesn't support lat,lon lookup — use coords directly
          throw new Error("use-coords");
        } catch {
          location = {
            name: "My Location",
            admin1: "",
            country: "",
            latitude: lat,
            longitude: lon,
            timezone: "auto"
          };
        }
      }

      state.location = location;
      localStorage.setItem("weather.location", JSON.stringify(location));
      els.input.value = location.name !== "My Location" ? location.name : "";
      setStatus("Location found via " + source + ". Loading forecast…", "info");
      loadForecast(location);
    }

    // ── City search ──────────────────────────────────────────────────────────

    async function searchCity(query) {
      if (!navigator.onLine) { showOffline(); return; }
      // Route through host proxy — avoids direct cross-origin fetch from app iframe.
      const url = "/api/proxy/https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(query) + "&count=5&language=en&format=json";
      setStatus("Searching...");
      els.results.innerHTML = "";

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("City search failed");
        const data = await res.json();
        const places = data.results || [];
        if (!places.length) {
          setStatus("No matching cities found.", "error");
          return;
        }
        setStatus("Choose a location.", "ok");
        els.results.innerHTML = places.map((place, index) => {
          const admin = [place.admin1, place.country].filter(Boolean).join(", ");
          return '<div class="result"><button type="button" data-index="' + index + '">' +
            escapeHtml(place.name) + (admin ? '<br><span class="subtitle">' + escapeHtml(admin) + '</span>' : "") +
            '</button></div>';
        }).join("");
        els.results.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            const place = places[Number(button.dataset.index)];
            const location = {
              name: place.name,
              admin1: place.admin1 || "",
              country: place.country || "",
              latitude: place.latitude,
              longitude: place.longitude,
              timezone: place.timezone || "auto"
            };
            state.location = location;
            localStorage.setItem("weather.location", JSON.stringify(location));
            els.results.innerHTML = "";
            els.geoBtn.classList.remove("active");
            loadForecast(location);
          });
        });
      } catch {
        showError("Unable to search cities. Check your connection and try again.");
      }
    }

    // ── Forecast loading ─────────────────────────────────────────────────────

    async function loadForecast(location) {
      if (!navigator.onLine) { showOffline(); return; }

      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: [
          "temperature_2m",
          "relative_humidity_2m",
          "apparent_temperature",
          "is_day",
          "precipitation",
          "weather_code",
          "cloud_cover",
          "pressure_msl",
          "wind_speed_10m",
          "wind_direction_10m",
          "uv_index"
        ].join(","),
        hourly: [
          "temperature_2m",
          "weather_code",
          "precipitation_probability",
          "is_day"
        ].join(","),
        daily: [
          "weather_code",
          "temperature_2m_max",
          "temperature_2m_min",
          "precipitation_probability_max",
          "wind_speed_10m_max"
        ].join(","),
        timezone: "auto",
        forecast_days: "2",   // only need today + tomorrow for hourly; extend daily separately
        temperature_unit: tempUnitParam(),
        wind_speed_unit: speedUnitParam(),
        precipitation_unit: precipitationUnitParam()
      });

      // We need 7 days for the daily forecast — send a second param override
      // Actually Open-Meteo supports one request with forecast_days up to 16
      // Use forecast_days=7 but hourly for 2 days (48 h) is fine — just slice today's 24h
      params.set("forecast_days", "7");

      setStatus("Loading forecast...");
      els.content.className = "empty";
      els.content.textContent = "Loading weather data.";

      try {
        // Route through host proxy — avoids direct cross-origin fetch from app iframe.
        const res = await fetch("/api/proxy/https://api.open-meteo.com/v1/forecast?" + params.toString());
        if (!res.ok) throw new Error("Forecast failed");
        state.data = await res.json();
        render(location, state.data);
        setStatus("Forecast updated.", "ok");
      } catch {
        showError("Unable to load the forecast. The weather service may be unavailable.");
      }
    }

    // ── Rendering ────────────────────────────────────────────────────────────

    function render(location, data) {
      const current = data.current;
      const daily = data.daily;
      const hourly = data.hourly;
      const placeLine = [location.admin1, location.country].filter(Boolean).join(", ");
      const precipUnit = state.unit === "celsius" ? "mm" : "in";

      // UV index
      const uvRaw = current.uv_index !== undefined ? current.uv_index : null;
      const uvVal = uvRaw !== null ? Math.round(uvRaw * 10) / 10 : null;
      const uvInfo = uvVal !== null ? uvCategory(uvVal) : null;

      // 7-day forecast rows
      const days = daily.time.map((date, i) => {
        return '<article class="day">' +
          '<div><div class="day-name">' + (i === 0 ? "Today" : formatDate(date, { weekday: "short" })) + '</div>' +
          '<div class="day-condition">' + formatDate(date, { month: "short", day: "numeric" }) + '</div></div>' +
          '<div class="day-condition">' + condition(daily.weather_code[i]) + '</div>' +
          '<div class="temps">' + formatTemp(daily.temperature_2m_max[i]) + ' / ' + formatTemp(daily.temperature_2m_min[i]) + '</div>' +
          '<div class="meta"><span>Rain ' + (daily.precipitation_probability_max[i] ?? 0) + '%</span>' +
          '<span>Wind ' + Math.round(daily.wind_speed_10m_max[i] || 0) + ' ' + speedLabel() + '</span></div>' +
          '</article>';
      }).join("");

      // Hourly strip — only today's 24 h (first 24 entries or until midnight)
      const nowIso = data.current.time; // e.g. "2025-05-16T14:00"
      const todayDate = nowIso.slice(0, 10);
      const nowHour = parseInt(nowIso.slice(11, 13), 10);
      const hourCells = [];
      for (let i = 0; i < hourly.time.length; i++) {
        const t = hourly.time[i];
        if (!t.startsWith(todayDate)) continue; // only today
        const h = parseInt(t.slice(11, 13), 10);
        const isNow = h === nowHour;
        const label = h === 0 ? "12 AM" : h < 12 ? h + " AM" : h === 12 ? "12 PM" : (h - 12) + " PM";
        const icon = weatherIcon(hourly.weather_code[i], hourly.is_day[i]);
        const precip = hourly.precipitation_probability[i];
        hourCells.push(
          '<div class="hour-cell' + (isNow ? ' now' : '') + '" aria-label="' + label + '">' +
          '<div class="hour-label">' + label + '</div>' +
          '<div class="hour-icon">' + icon + '</div>' +
          '<div class="hour-temp">' + formatTemp(hourly.temperature_2m[i]) + '</div>' +
          (precip > 0 ? '<div class="hour-precip">' + precip + '%</div>' : '<div class="hour-precip">&nbsp;</div>') +
          '</div>'
        );
      }

      const hourlyHtml = hourCells.length
        ? '<div class="hourly-strip" role="list" aria-label="Today\'s hourly forecast">' + hourCells.join("") + '</div>'
        : "";

      // UV metric HTML
      const uvMetricHtml = uvVal !== null
        ? '<div class="metric ' + uvInfo.cls + '"><span>UV Index</span><strong>' + uvVal + ' &ndash; ' + uvInfo.label + '</strong></div>'
        : '<div class="metric"><span>UV Index</span><strong>--</strong></div>';

      els.content.className = "";
      els.content.innerHTML =
        '<div class="dashboard">' +
          '<div>' +
            '<section class="current">' +
              '<div class="place">' +
                '<div>' +
                  '<h2>' + escapeHtml(location.name) + '</h2>' +
                  '<p class="updated">' + escapeHtml(placeLine || data.timezone || "") + '</p>' +
                  '<p class="updated">Updated ' + formatDate(current.time, { hour: "numeric", minute: "2-digit" }) + '</p>' +
                '</div>' +
                '<div class="weather-mark" aria-hidden="true"></div>' +
              '</div>' +
              '<div class="temp-row">' +
                '<div class="temperature">' + formatTemp(current.temperature_2m) + '</div>' +
                '<p class="condition">' + condition(current.weather_code) + '<br>Feels like ' + formatTemp(current.apparent_temperature) + '</p>' +
              '</div>' +
            '</section>' +
            '<section class="details" aria-label="Current weather details">' +
              metric("Humidity", Math.round(current.relative_humidity_2m) + "%") +
              metric("Wind", Math.round(current.wind_speed_10m) + " " + speedLabel()) +
              metric("Pressure", Math.round(current.pressure_msl) + " hPa") +
              uvMetricHtml +
              metric("Precip", current.precipitation + " " + precipUnit) +
              metric("Clouds", Math.round(current.cloud_cover) + "%") +
              metric("Direction", Math.round(current.wind_direction_10m) + "&deg;") +
              metric("Daylight", current.is_day ? "Day" : "Night") +
              metric("Timezone", data.timezone_abbreviation || data.timezone || "Auto") +
            '</section>' +
            (hourlyHtml
              ? '<section class="hourly-card" aria-label="Today\'s hourly breakdown"><h2>Today&rsquo;s hourly</h2>' + hourlyHtml + '</section>'
              : "") +
          '</div>' +
          '<section class="forecast-card"><h2>7-day forecast</h2><div class="forecast">' + days + '</div></section>' +
        '</div>';

      // Scroll hourly strip to current hour
      const strip = els.content.querySelector(".hourly-strip");
      const nowCell = els.content.querySelector(".hour-cell.now");
      if (strip && nowCell) {
        // Center the "now" cell in the strip
        const cellLeft = nowCell.offsetLeft;
        const stripWidth = strip.clientWidth;
        const cellWidth = nowCell.offsetWidth;
        strip.scrollLeft = cellLeft - stripWidth / 2 + cellWidth / 2;
      }
    }

    function metric(label, value) {
      return '<div class="metric"><span>' + label + '</span><strong>' + value + '</strong></div>';
    }

    function showOffline() {
      setStatus("Offline. Connect to the internet to fetch weather data.", "error");
      els.content.className = "empty";
      els.content.textContent = "Weather data is unavailable while offline.";
    }

    function showError(message) {
      setStatus(message, "error");
      if (!state.data) {
        els.content.className = "empty";
        els.content.textContent = "No forecast data loaded.";
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    // ── Event bindings ────────────────────────────────────────────────────────

    els.form.addEventListener("submit", event => {
      event.preventDefault();
      const query = els.input.value.trim();
      if (query) searchCity(query);
    });

    els.celsius.addEventListener("click", () => setUnit("celsius"));
    els.fahrenheit.addEventListener("click", () => setUnit("fahrenheit"));

    els.geoBtn.addEventListener("click", () => {
      state.location = null;
      localStorage.removeItem("weather.location");
      els.input.value = "";
      els.results.innerHTML = "";
      tryBrowserGeo();
    });

    window.addEventListener("offline", showOffline);
    window.addEventListener("online", () => {
      setStatus("Back online.", "ok");
      if (state.location) loadForecast(state.location);
    });

    // ── Boot ──────────────────────────────────────────────────────────────────

    setUnit(state.unit, false);

    if (state.location) {
      // Cached location from previous session — load it immediately
      els.input.value = state.location.name !== "My Location" ? state.location.name : "";
      loadForecast(state.location);
    } else {
      // No saved location — start the geolocation chain
      tryBrowserGeo();
    }
  </script>
</body>
</html>
