<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-api-helper.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--surface:#111;--elevated:#1a1a1a;--border:#222;--border2:#333;--text:#e5e5e5;--text2:#999;--text3:#666;--accent:#3b82f6;--danger:#ef4444;--fav:#f59e0b}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;display:flex;height:100vh;overflow:hidden}

.sidebar h2{padding:14px 16px 8px;font-size: 12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:600}

.sidebar .nav-item:hover{background:var(--elevated);color:var(--text)}
.sidebar .nav-item.active{background:var(--elevated);color:var(--text);border-left-color:var(--accent)}
.sidebar .nav-item .icon{font-size:15px;width:20px;text-align:center}
.sidebar .nav-item .count{margin-left:auto;font-size: 12px;color:var(--text3)}
.sidebar .albums{flex:1;overflow-y:auto;padding-bottom:12px}
.sidebar .album-item{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s}
.sidebar .album-item:hover{background:var(--elevated);color:var(--text)}
.sidebar .album-item.active{background:var(--elevated);color:var(--text)}
.sidebar .album-thumb{width:28px;height:28px;border-radius:4px;object-fit:cover;background:var(--elevated)}

/* Main content */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.toolbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}

.toolbar .spacer{flex:1}

.toolbar input:focus{border-color:#555}
.toolbar .btn{background:var(--elevated);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;color:var(--text2);font-size:12px;cursor:pointer;transition:all .15s}
.toolbar .btn:hover{background:var(--border2);color:var(--text)}
.toolbar .btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.content{flex:1;overflow-y:auto;padding:12px}
.date-group{margin-bottom:20px}
.date-label{font-size:12px;font-weight:600;color:var(--text2);padding:4px 4px 8px;position:sticky;top:0;background:var(--bg);z-index:2}

.info-panel .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.info-panel .row .label{color:var(--text3)}
.info-panel .row .value{color:var(--text);text-align:right;max-width:60%;word-break:break-all}
.info-panel .preview{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;margin-bottom:12px}
.info-panel .ai-desc{font-size:12px;line-height:1.5;color:var(--text2);padding:8px 12px;background:var(--elevated);border-radius:8px;margin-top:8px}
.info-panel .ai-btn{display:block;width:100%;margin-top:8px;padding:6px;background:var(--elevated);border:1px solid var(--border2);border-radius:6px;color:var(--accent);font-size:12px;cursor:pointer;text-align:center}
.info-panel .ai-btn:hover{background:var(--border2)}
.info-panel .close-info{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Library</h2>
  <div class="nav-item active" data-view="all" onclick="switchView('all')">
    <span class="icon">&#9633;</span> All Media <span class="count" id="countAll"></span>
  </div>
  <div class="nav-item" data-view="photos" onclick="switchView('photos')">
    <span class="icon">&#9634;</span> Photos <span class="count" id="countPhotos"></span>
  </div>
  <div class="nav-item" data-view="videos" onclick="switchView('videos')">
    <span class="icon">&#9654;</span> Videos <span class="count" id="countVideos"></span>
  </div>
  <div class="nav-item" data-view="favorites" onclick="switchView('favorites')">
    <span class="icon">&#9733;</span> Favorites <span class="count" id="countFavs"></span>
  </div>

  <h2>Albums</h2>
  <div class="albums" id="albumList"></div>
</div>

<!-- Main content -->
<div class="main">
  <div class="toolbar">
    <div class="title" id="viewTitle">All Media</div>
    <div class="spacer"></div>
    <input id="searchInput" type="text" placeholder="Search with AI..." onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn" onclick="doSearch()">Search</button>
    <button class="btn" id="gridSizeBtn" onclick="toggleGridSize()">&#9638;</button>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- Lightbox -->
<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <span class="name" id="viewerName"></span>
    <button class="vbtn" onclick="toggleFavViewer()" id="viewerFav">&#9734;</button>
    <button class="vbtn" onclick="showInfo()">&#8505;</button>
    <button class="vbtn" onclick="deleteViewer()">&#128465;</button>
    <button class="vbtn" onclick="closeViewer()">&#10005;</button>
  </div>
  <div class="viewer-body" id="viewerBody">
    <button class="nav-btn nav-prev" onclick="navViewer(-1)">&#8249;</button>
    <button class="nav-btn nav-next" onclick="navViewer(1)">&#8250;</button>
  </div>
</div>

<!-- Info Panel -->
<div class="info-panel" id="infoPanel">
  <button class="close-info" onclick="closeInfo()">&#10005;</button>
  <div id="infoPanelContent"></div>
</div>

<script>
let allMedia = [], currentView = 'all', currentAlbum = null, viewerItems = [], viewerIdx = 0;
let gridLarge = false;

// --- Data loading ---
async function loadMedia() {
  const res = await fetch(vulosApi.appUrl('/api/media'));
  allMedia = await res.json();
  updateCounts();
  renderCurrentView();
  loadAlbums();
}

async function loadAlbums() {
  const res = await fetch(vulosApi.appUrl('/api/albums'));
  const albums = await res.json();
  const el = document.getElementById('albumList');
  el.innerHTML = albums.map(a => `
    <div class="album-item${currentAlbum === a.path ? ' active' : ''}" onclick="switchAlbum('${a.path}')">
      ${a.cover ? `<img class="album-thumb" src="${vulosApi.appUrl('/media/' + a.cover)}" loading="lazy">` : '<div class="album-thumb"></div>'}
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.name}</span>
      <span style="font-size: 12px;color:var(--text3)">${a.count}</span>
    </div>
  `).join('');
}

function updateCounts() {
  document.getElementById('countAll').textContent = allMedia.length;
  document.getElementById('countPhotos').textContent = allMedia.filter(m => m.type === 'image').length;
  document.getElementById('countVideos').textContent = allMedia.filter(m => m.type === 'video').length;
  document.getElementById('countFavs').textContent = allMedia.filter(m => m.favorite).length;
}

// --- Views ---
function switchView(view) {
  currentView = view;
  currentAlbum = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  document.querySelectorAll('.album-item').forEach(el => el.classList.remove('active'));
  const titles = { all: 'All Media', photos: 'Photos', videos: 'Videos', favorites: 'Favorites' };
  document.getElementById('viewTitle').textContent = titles[view] || view;
  renderCurrentView();
}

function switchAlbum(folder) {
  currentView = 'album';
  currentAlbum = folder;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.album-item').forEach(el =>
    el.classList.toggle('active', el.textContent.includes(folder.split('/').pop()))
  );
  document.getElementById('viewTitle').textContent = folder.split('/').pop() || 'Root';
  renderCurrentView();
}

function getFiltered() {
  if (currentView === 'photos') return allMedia.filter(m => m.type === 'image');
  if (currentView === 'videos') return allMedia.filter(m => m.type === 'video');
  if (currentView === 'favorites') return allMedia.filter(m => m.favorite);
  if (currentView === 'album') return allMedia.filter(m => m.folder === currentAlbum);
  return allMedia;
}

function renderCurrentView() {
  const items = getFiltered();
  viewerItems = items;
  const content = document.getElementById('content');

  if (items.length === 0) {
    content.innerHTML = '<div class="empty"><div class="icon">&#9634;</div><p>No media found</p></div>';
    return;
  }

  // Group by date
  const groups = {};
  for (const m of items) {
    const date = m.date || 'Unknown';
    if (!groups[date]) groups[date] = [];
    groups[date].push(m);
  }

  const colSize = gridLarge ? '200px' : '150px';
  let html = '';
  for (const [date, media] of Object.entries(groups)) {
    const d = new Date(date + 'T00:00:00');
    const label = isNaN(d) ? date : d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    html += `<div class="date-group"><div class="date-label">${label} &mdash; ${media.length} items</div>`;
    html += `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(${colSize},1fr))">`;
    for (const m of media) {
      const idx = items.indexOf(m);
      const esc = m.path.replace(/'/g, "\\'");
      if (m.type === 'video') {
        html += `<div class="thumb" onclick="openViewer(${idx})">
          <video src="${vulosApi.appUrl('/media/' + m.path)}" muted preload="metadata"></video>
          <div class="overlay"><span class="fav-star${m.favorite ? ' on' : ''}" onclick="event.stopPropagation();toggleFav('${esc}',this)">${m.favorite ? '&#9733;' : '&#9734;'}</span></div>
          <div class="dur">&#9654;</div>
        </div>`;
      } else {
        html += `<div class="thumb" onclick="openViewer(${idx})">
          <img src="${vulosApi.appUrl('/media/' + m.path)}" loading="lazy">
          <div class="overlay"><span class="fav-star${m.favorite ? ' on' : ''}" onclick="event.stopPropagation();toggleFav('${esc}',this)">${m.favorite ? '&#9733;' : '&#9734;'}</span></div>
        </div>`;
      }
    }
    html += '</div></div>';
  }
  content.innerHTML = html;
}

function toggleGridSize() {
  gridLarge = !gridLarge;
  renderCurrentView();
}

// --- Favorites ---
async function toggleFav(path, el) {
  const item = allMedia.find(m => m.path === path);
  if (!item) return;
  const add = !item.favorite;
  await fetch(vulosApi.appUrl('/api/favorite'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, add }),
  });
  item.favorite = add;
  if (el) {
    el.classList.toggle('on', add);
    el.innerHTML = add ? '&#9733;' : '&#9734;';
  }
  updateCounts();
  // Re-render if on favorites view
  if (currentView === 'favorites') renderCurrentView();
}

// --- Search ---
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { renderCurrentView(); return; }
  document.getElementById('viewTitle').textContent = 'Search: ' + q;
  try {
    const res = await fetch(vulosApi.appUrl('/api/search?q=') + encodeURIComponent(q));
    const results = await res.json();
    viewerItems = results;
    const content = document.getElementById('content');
    if (results.length === 0) {
      content.innerHTML = '<div class="empty"><div class="icon">&#128269;</div><p>No results for "' + q + '"</p></div>';
      return;
    }
    const colSize = gridLarge ? '200px' : '150px';
    let html = `<div class="date-group"><div class="date-label">${results.length} results</div>`;
    html += `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(${colSize},1fr))">`;
    for (let i = 0; i < results.length; i++) {
      const m = results[i];
      if (m.type === 'video') {
        html += `<div class="thumb" onclick="openViewer(${i})"><video src="${vulosApi.appUrl('/media/' + m.path)}" muted preload="metadata"></video><div class="dur">&#9654;</div></div>`;
      } else {
        html += `<div class="thumb" onclick="openViewer(${i})"><img src="${vulosApi.appUrl('/media/' + m.path)}" loading="lazy"></div>`;
      }
    }
    html += '</div></div>';
    content.innerHTML = html;
  } catch {
    document.getElementById('content').innerHTML = '<div class="empty"><p>Search failed</p></div>';
  }
}

// --- Lightbox viewer ---
function openViewer(idx) {
  viewerIdx = idx;
  renderViewer();
  document.getElementById('viewer').classList.add('open');
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('viewerBody').querySelector('video')?.pause?.();
  closeInfo();
}

function navViewer(dir) {
  viewerIdx = (viewerIdx + dir + viewerItems.length) % viewerItems.length;
  renderViewer();
}

function renderViewer() {
  const m = viewerItems[viewerIdx];
  if (!m) return;
  document.getElementById('viewerName').textContent = m.name || m.path.split('/').pop();
  const body = document.getElementById('viewerBody');
  const navPrev = body.querySelector('.nav-prev');
  const navNext = body.querySelector('.nav-next');
  // Remove old media
  const old = body.querySelector('.viewer-media');
  if (old) old.remove();
  if (m.type === 'video') {
    const el = document.createElement('video');
    el.className = 'viewer-media';
    el.src = vulosApi.appUrl('/media/' + m.path);
    el.controls = true;
    el.autoplay = true;
    body.insertBefore(el, navPrev);
  } else {
    const el = document.createElement('img');
    el.className = 'viewer-media';
    el.src = vulosApi.appUrl('/media/' + m.path);
    body.insertBefore(el, navPrev);
  }
  // Update fav button
  const favBtn = document.getElementById('viewerFav');
  favBtn.innerHTML = m.favorite ? '&#9733;' : '&#9734;';
  favBtn.style.color = m.favorite ? 'var(--fav)' : '';
}

function toggleFavViewer() {
  const m = viewerItems[viewerIdx];
  if (!m) return;
  const add = !m.favorite;
  fetch(vulosApi.appUrl('/api/favorite'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: m.path, add }),
  });
  m.favorite = add;
  const orig = allMedia.find(o => o.path === m.path);
  if (orig) orig.favorite = add;
  renderViewer();
  updateCounts();
}

async function deleteViewer() {
  const m = viewerItems[viewerIdx];
  if (!m || !confirm('Delete ' + (m.name || m.path) + '?')) return;
  await fetch(vulosApi.appUrl('/api/delete'), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: m.path }),
  });
  allMedia = allMedia.filter(o => o.path !== m.path);
  viewerItems.splice(viewerIdx, 1);
  updateCounts();
  if (viewerItems.length === 0) { closeViewer(); renderCurrentView(); return; }
  if (viewerIdx >= viewerItems.length) viewerIdx = viewerItems.length - 1;
  renderViewer();
  renderCurrentView();
}

// --- Info panel ---
async function showInfo() {
  const m = viewerItems[viewerIdx];
  if (!m) return;
  const panel = document.getElementById('infoPanel');
  const content = document.getElementById('infoPanelContent');
  content.innerHTML = '<p style="color:var(--text3);font-size:12px">Loading...</p>';
  panel.classList.add('open');

  try {
    const res = await fetch(vulosApi.appUrl('/api/info?path=') + encodeURIComponent(m.path));
    const info = await res.json();
    let html = `<img class="preview" src="${vulosApi.appUrl('/media/' + m.path)}">`;
    html += `<h3>File</h3>`;
    html += infoRow('Name', info.name);
    html += infoRow('Size', info.size_human);
    html += infoRow('Type', info.ext?.toUpperCase().slice(1));
    if (info.width) html += infoRow('Dimensions', info.width + ' x ' + info.height);
    html += infoRow('Modified', new Date(info.modified).toLocaleString());
    html += infoRow('Path', info.path);

    if (info.exif) {
      html += '<h3>Camera</h3>';
      if (info.exif.make) html += infoRow('Make', info.exif.make);
      if (info.exif.model) html += infoRow('Model', info.exif.model);
      if (info.exif.date_taken) html += infoRow('Taken', info.exif.date_taken);
      if (info.exif.exposure_time) html += infoRow('Exposure', info.exif.exposure_time + 's');
      if (info.exif.f_number) html += infoRow('Aperture', 'f/' + info.exif.f_number);
      if (info.exif.iso) html += infoRow('ISO', info.exif.iso);
      if (info.exif.focal_length) html += infoRow('Focal Length', info.exif.focal_length + 'mm');
    }

    html += '<h3>AI</h3>';
    html += '<div id="aiDesc" class="ai-desc" style="color:var(--text3);font-style:italic">Not yet described</div>';
    html += `<button class="ai-btn" onclick="describeImage('${m.path.replace(/'/g, "\\'")}')">Describe with AI</button>`;

    content.innerHTML = html;
  } catch {
    content.innerHTML = '<p style="color:var(--text3)">Could not load info</p>';
  }
}

function infoRow(label, value) {
  return `<div class="row"><span class="label">${label}</span><span class="value">${value || '—'}</span></div>`;
}

async function describeImage(path) {
  const el = document.getElementById('aiDesc');
  if (!el) return;
  el.textContent = 'Thinking...';
  el.style.fontStyle = 'italic';
  try {
    const res = await fetch(vulosApi.appUrl('/api/describe?path=') + encodeURIComponent(path));
    const data = await res.json();
    el.textContent = data.description || 'No description.';
    el.style.fontStyle = 'normal';
  } catch {
    el.textContent = 'Failed to describe.';
  }
}

function closeInfo() {
  document.getElementById('infoPanel').classList.remove('open');
}

// --- Keyboard shortcuts ---
document.addEventListener('keydown', e => {
  const viewer = document.getElementById('viewer');
  if (!viewer.classList.contains('open')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') navViewer(-1);
  if (e.key === 'ArrowRight') navViewer(1);
  if (e.key === 'f') toggleFavViewer();
  if (e.key === 'i') showInfo();
  if (e.key === 'Delete' || e.key === 'Backspace') deleteViewer();
});

// --- Init ---
loadMedia();
</script>
</body>
</html>
