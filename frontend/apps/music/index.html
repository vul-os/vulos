<title>Music Player</title>
<script data-vulos-shared="vulos-theme.js">
/* ---------------------------------------------------------------------------
   vulos-theme.js — let a bundled app render in the theme the SHELL is in.

   THE PROBLEM
   -----------
   A bundled app is a separate document in an iframe. With per-app origins off
   (the default) it runs in an OPAQUE origin — src/core/AppOrigins.ts withholds
   allow-same-origin on the shell's own origin, deliberately — and with them on
   it runs on its own origin. Either way it cannot read the shell's
   <html data-theme>, and it cannot read the shell's localStorage where
   ThemeProvider persists the user's choice.

   So prefers-color-scheme is all an app can see by itself, and that is only
   ever right for ONE of the shell's four theme modes. ThemeProvider supports
   'auto' (follow the system), 'light', 'dark' and 'schedule'; three of those
   can disagree with the system preference, and when they do the app renders
   light furniture inside a dark shell. An app that is consistently wrong is
   better than one that is wrong only sometimes — so guessing is not an option
   either.

   THE CHANNEL
   -----------
   The shell already puts data into the app's frame URL. AppBridge.appFrameSrc()
   appends `#__vulos_s=<seed>`, the app's own storage snapshot, to every frame
   src. A fragment is the right carrier and it is already proven here:

     - it never reaches the server, so it cannot leak into gateway logs or be
       cached by the proxy;
     - it survives the `?_r=<attempt>` query-string cache-bust IframeApp applies
       when it retries a frame;
     - it is readable on the frame's first line, before first paint, so there is
       no flash of the wrong theme;
     - changing ONLY the fragment fires hashchange without reloading the frame,
       so a live theme switch in the shell costs the app nothing.

   This file reads `__vulos_t` off that same fragment and stamps data-theme on
   <html>, where apps/_shared/vulos-tokens.css layers 2 and 3 pick it up. When
   the parameter is ABSENT it stamps nothing, on purpose: the attribute's
   absence is what lets the prefers-color-scheme fallback in layer 4 govern. A
   stamped guess would silently disable that fallback.

   WHAT IS STILL MISSING
   ---------------------
   The sender. appFrameSrc must add `__vulos_t=<resolved>` alongside
   `__vulos_s`, and that file is shell-owned. Until it does, every app follows
   the system preference — correct for the DEFAULT mode ('auto') and wrong only
   for an explicit Light/Dark/Schedule choice. This file is the receiving half
   and is inert until the sender lands: no parameter, no attribute, no change.

   THIS FILE IS A SINGLE SOURCE OF TRUTH.
   Inlined verbatim into every bundled app by sync-shared-assets.mjs and pinned
   byte-for-byte by backend/internal/docsref/appthemetokens_test.go.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The fragment key. Kept alongside __vulos_s, which AppBridge already sends.
  var PARAM = '__vulos_t';
  // The only two values that mean anything. ThemeProvider resolves 'auto' and
  // 'schedule' down to one of these before it stamps its own attribute, so the
  // app never has to know about modes — only about the resolved result.
  var VALID = { light: 1, dark: 1 };

  // themeFromHash extracts the resolved theme, or '' when the shell did not
  // send one (or sent something that is not a theme).
  function themeFromHash(hash) {
    var h = typeof hash === 'string'
      ? hash
      : (root && root.location && root.location.hash) || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (!h) return '';
    for (var i = 0, parts = h.split('&'); i < parts.length; i++) {
      var eq = parts[i].indexOf('=');
      if (eq < 0) continue;
      if (parts[i].slice(0, eq) !== PARAM) continue;
      var v = decodeURIComponent(parts[i].slice(eq + 1)).toLowerCase();
      return VALID[v] ? v : '';
    }
    return '';
  }

  // applyTheme stamps <html data-theme>, or REMOVES it when the shell has not
  // told us — absence is what hands control to the prefers-color-scheme
  // fallback, so it is a meaningful state and not merely "unset".
  function applyTheme(doc, hash) {
    var d = doc || (root && root.document);
    if (!d || !d.documentElement) return '';
    var t = themeFromHash(hash);
    if (t) d.documentElement.setAttribute('data-theme', t);
    else d.documentElement.removeAttribute('data-theme');
    return t;
  }

  var api = { themeFromHash: themeFromHash, applyTheme: applyTheme };
  if (root) {
    root.vulosTheme = api;
    applyTheme();
    // A shell-side theme switch rewrites only the fragment, so the frame is not
    // reloaded and this is the only thing that would notice.
    if (root.addEventListener) {
      root.addEventListener('hashchange', function () { applyTheme(); });
    }
  }
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>
<style data-vulos-shared="vulos-tokens.css">
/* ════════════════════════════════════════════════════════════════════════
   vulos-tokens.css — shared design tokens for the bundled single-file apps
   ────────────────────────────────────────────────────────────────────────
   This mirrors the semantic variables in /src/index.css so the whole suite
   reads as one product. It is inlined verbatim into every bundled app as a
   style element tagged data-vulos-shared="vulos-tokens.css" by
   apps/_shared/sync-shared-assets.mjs, and pinned byte-for-byte by
   backend/internal/docsref/appthemetokens_test.go.

   WHY INLINED AND NOT LINKED
   Each app ships its own hand-rolled server.py with its own ad-hoc static
   route table. Only four of the fifteen (browser, camera, phone,
   system-info) ever special-cased `/vulos-tokens.css` to escape their APP_DIR
   and serve this file; the other eleven would 404 a <link>. An inline copy
   has no such failure mode — and no round trip, so there is no unstyled
   first paint either.

   STRUCTURE — the same four layers as /src/index.css, in the same order:
     1. :root                     structural tokens + the DARK palette as the
                                  shipped default, and EVERY alias, defined
                                  exactly once so no colour's only definition
                                  lives inside a conditional block.
     2. [data-theme="dark"]       the dark palette again, explicitly, so an
                                  explicit Dark choice is symmetric with Light.
     3. [data-theme="light"]      the light palette.
     4. @media (prefers-color-scheme: light) :root:not([data-theme])
                                  the pure-CSS fallback, for a document that
                                  has not been told the shell's theme.

   HOW AN APP LEARNS THE THEME
   A bundled app is a SEPARATE DOCUMENT in an iframe — on an opaque origin
   when per-app origins are off, on its own origin when they are on. Either
   way it cannot read the shell's <html data-theme> or the shell's
   localStorage, so layer 4 alone would leave an app disagreeing with a shell
   whose theme the user set EXPLICITLY (Light on a dark-system machine, or the
   Schedule mode) — which is worse than being consistently dark.

   The shell must therefore tell it, and there is already a channel for
   exactly this: src/core/AppBridge.ts appFrameSrc() appends
   `#__vulos_s=<seed>` to every app frame URL. A fragment never reaches the
   server, survives the query-string cache-bust IframeApp applies on retry,
   and is readable by the frame on its very first line — before first paint.
   apps/_shared/vulos-theme.js reads `__vulos_t` off that same fragment and
   stamps data-theme, falling back to prefers-color-scheme when it is absent.
   Sending it is a one-line change in appFrameSrc, which is shell-owned; until
   it lands, apps follow the system preference, which is correct for the
   DEFAULT theme mode ('auto') and wrong only for an explicit choice.

   Canonical names match /src/index.css (--bg-*, --text-*, --border-*,
   --accent). Short aliases (--surface, --text, --accent2, status colours) are
   provided so existing app CSS can adopt the tokens with minimal churn.
   ════════════════════════════════════════════════════════════════════════ */
:root {
  /* ── Shared shape + type (theme-agnostic) ── */
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 16px;
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI',
    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── DARK PALETTE (shipped default) ── */
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;
  --accent-contrast: #ffffff;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;

  /* ── Aliases. Defined ONCE, here, as var() indirections: they follow
     whichever palette is in force, so no theme block ever has to restate
     them and none of them can go missing in one theme only. ── */
  --bg: var(--bg-base);
  --surface: var(--bg-surface);
  --surface2: var(--bg-elevated);
  --surface3: var(--bg-hover);
  --elevated: var(--bg-elevated);
  --border: var(--border-default);
  --border2: var(--border-strong);
  --text: var(--text-primary);
  --text2: var(--text-tertiary);
  --text3: var(--text-ghost);
  --muted: var(--text-muted);
  --green: var(--ok-bright);
  --green2: var(--ok);
  --red: var(--danger-bright);
  --yellow: var(--warn-bright);
  --blue: var(--accent);
  --record: var(--danger);
}

/* 2. Explicit Dark — symmetric with Light, so `data-theme="dark"` on a
   system-light machine is honoured rather than falling through to layer 4. */
[data-theme="dark"] {
  color-scheme: dark;

  --accent: #5b6cff;
  --accent-hover: #4a58d1;
  --accent2: #7c6ef7;

  --bg-base: #08090c;
  --bg-surface: #0f1116;
  --bg-elevated: #171a21;
  --bg-hover: #1e222b;

  --border-default: #1f232c;
  --border-strong: #2b303b;
  --border-emphasis: #3a4150;

  --text-primary: #f2f4f8;
  --text-secondary: #c3c8d2;
  --text-tertiary: #9ea5b1;
  --text-muted: #8c93a1;
  --text-faint: #7f8798;
  --text-ghost: #414653;

  --ok: #35c081;
  --ok-bright: #4ade80;
  --warn: #f0b232;
  --warn-bright: #fbbf24;
  --danger: #f2565b;
  --danger-bright: #f87171;
}

/* 3. Explicit Light. Values are /src/index.css's light palette, including the
   text ramp it derived by measurement against its own surfaces — the muted and
   faint steps sit closer together than in dark because a near-white ground has
   little room between AA and invisible. The status colours are the light ones
   too: the dark theme's brights measure well under 4.5:1 on white. */
[data-theme="light"] {
  color-scheme: light;

  --accent: #4d5efb;
  --accent-hover: #3d4bd0;
  --accent2: #6d5ef0;

  --bg-base: #ffffff;
  --bg-surface: #f7f8fa;
  --bg-elevated: #eef0f4;
  --bg-hover: #e7eaf0;

  --border-default: #e2e5eb;
  --border-strong: #cfd4dd;
  --border-emphasis: #b7bdc9;

  --text-primary: #12141a;
  --text-secondary: #333844;
  --text-tertiary: #565d6b;
  --text-muted: #5c626e;
  --text-faint: #606977;
  --text-ghost: #aab0bc;

  --ok: #16a34a;
  --ok-bright: #16a34a;
  --warn: #d97706;
  --warn-bright: #d97706;
  --danger: #dc2626;
  --danger-bright: #dc2626;
}

/* 4. Pure-CSS fallback for a document that has NOT been told the shell's
   theme. Only applies when no explicit data-theme is present, so the stamped
   attribute always wins. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    color-scheme: light;

    --accent: #4d5efb;
    --accent-hover: #3d4bd0;
    --accent2: #6d5ef0;

    --bg-base: #ffffff;
    --bg-surface: #f7f8fa;
    --bg-elevated: #eef0f4;
    --bg-hover: #e7eaf0;

    --border-default: #e2e5eb;
    --border-strong: #cfd4dd;
    --border-emphasis: #b7bdc9;

    --text-primary: #12141a;
    --text-secondary: #333844;
    --text-tertiary: #565d6b;
    --text-muted: #5c626e;
    --text-faint: #606977;
    --text-ghost: #aab0bc;

    --ok: #16a34a;
    --ok-bright: #16a34a;
    --warn: #d97706;
    --warn-bright: #d97706;
    --danger: #dc2626;
    --danger-bright: #dc2626;
  }
}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-api-helper.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>

  .album-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .album-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .album-artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Player bar ---- */
  #player-bar {
    height: var(--player-h); background: var(--surface2); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
    transition: height 0.2s;
  }
  #now-playing { display: flex; align-items: center; gap: 12px; width: 240px; flex-shrink: 0; }
  #np-art {
    width: 52px; height: 52px; border-radius: 6px; background: var(--surface); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden;
  }
  #np-art img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  #np-info { min-width: 0; }
  #np-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  #np-artist { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }

  #player-controls { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #control-btns { display: flex; align-items: center; gap: 8px; }
  .ctrl-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 6px 8px;
    border-radius: 50%; font-size: 18px; transition: color 0.12s, background 0.12s; line-height: 1;
  }
  .ctrl-btn:hover { color: var(--text); background: var(--hover); }
  .ctrl-btn.active { color: var(--accent); }
  #play-btn { font-size: 28px; color: var(--text); padding: 4px 8px; }
  #play-btn:hover { color: var(--accent); background: var(--hover); }

  #seek-row { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 500px; }
  #time-current, #time-total { font-size: 12px; color: var(--text-dim); width: 36px; }
  #time-total { text-align: right; }
  #seek-bar { flex: 1; accent-color: var(--accent); cursor: pointer; height: 4px; }

  #player-right { display: flex; align-items: center; gap: 10px; width: 200px; justify-content: flex-end; flex-shrink: 0; }
  #vol-icon { font-size: 16px; cursor: pointer; color: var(--text-dim); }
  #vol-bar { accent-color: var(--accent); cursor: pointer; width: 80px; height: 4px; }
  #mini-toggle { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; }
  #mini-toggle:hover { color: var(--text); background: var(--hover); }

  /* Mini player */
  #player-bar.mini { height: var(--mini-h); padding: 0 12px; gap: 10px; }
  #player-bar.mini #np-art { width: 36px; height: 36px; font-size: 18px; }
  #player-bar.mini #np-title { font-size: 12px; }
  #player-bar.mini #np-artist { font-size: 12px; }
  #player-bar.mini #now-playing { width: 160px; }
  #player-bar.mini #seek-row, #player-bar.mini #time-current, #player-bar.mini #time-total { display: none; }
  #player-bar.mini #vol-bar { width: 60px; }

  /* ---- Modals ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; min-width: 320px; max-width: 460px;
  }
  .modal h2 { margin-bottom: 16px; font-size: 16px; }
  .modal input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 12px; color: var(--text); outline: none; font-size: 14px;
  }
  .modal input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--text); }

  /* ---- Drag reorder ---- */
  .track-row.drag-over { border-top: 2px solid var(--accent); }

  /* ---- Scrollbars ---- */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ---- Empty state ---- */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); gap: 12px; }
  .empty-state .icon { font-size: 56px; }
  .empty-state p { font-size: 15px; }
  .empty-state small { font-size: 12px; color: var(--text-dim); text-align: center; max-width: 280px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <!-- Main area -->
  <div id="main">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">Music Player</div>
      <div class="nav-item active" data-view="all" onclick="showView('all')">
        <span class="nav-icon">♬</span> All Songs
      </div>
      <div class="nav-item" data-view="artists" onclick="showView('artists')">
        <span class="nav-icon">♟</span> Artists
      </div>
      <div class="nav-item" data-view="albums" onclick="showView('albums')">
        <span class="nav-icon">◫</span> Albums
      </div>

      <div class="sidebar-section">Playlists</div>
      <div id="playlist-nav"></div>
      <button id="add-playlist-btn" onclick="showNewPlaylistModal()">+ New Playlist</button>
    </div>

    <!-- Content -->
    <div id="content">
      <div id="view-header">
        <div id="view-title">All Songs</div>
        <input id="search-box" type="search" placeholder="Search…" oninput="onSearch(this.value)"/>
      </div>
      <div id="track-list-container">
        <div class="empty-state" id="empty-state">
          <div class="icon">♪</div>
          <p>Loading library…</p>
          <small>Add audio files to ~/.vulos/music/ and they will appear here.</small>
        </div>
      </div>
      <div id="album-grid" style="display:none;"></div>
    </div>
  </div>

  <!-- Player bar -->
  <div id="player-bar">
    <div id="now-playing">
      <div id="np-art">♪</div>
      <div id="np-info">
        <div id="np-title">No track playing</div>
        <div id="np-artist">—</div>
      </div>
    </div>

    <div id="player-controls">
      <div id="control-btns">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle (S)" onclick="toggleShuffle()">⇌</button>
        <button class="ctrl-btn" title="Previous (←)" onclick="prevTrack()">⏮</button>
        <button class="ctrl-btn" id="play-btn" title="Play/Pause (Space)" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" title="Next (→)" onclick="nextTrack()">⏭</button>
        <button class="ctrl-btn" id="repeat-btn" title="Repeat (R)" onclick="cycleRepeat()">↻</button>
      </div>
      <div id="seek-row">
        <span id="time-current">0:00</span>
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1"
          oninput="onSeekInput(this.value)" onchange="onSeekChange(this.value)"/>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div id="player-right">
      <span id="vol-icon" onclick="toggleMute()" title="Mute">🔊</span>
      <input type="range" id="vol-bar" min="0" max="100" value="80" oninput="setVolume(this.value)"/>
      <button id="mini-toggle" title="Mini mode" onclick="toggleMini()">⊟</button>
    </div>
  </div>
</div>

<!-- New Playlist Modal -->
<div class="modal-overlay hidden" id="playlist-modal">
  <div class="modal">
    <h2>New Playlist</h2>
    <input type="text" id="playlist-name-input" placeholder="Playlist name…" onkeydown="if(event.key==='Enter')confirmNewPlaylist()"/>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideNewPlaylistModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmNewPlaylist()">Create</button>
    </div>
  </div>
</div>

<!-- Add to Playlist Modal -->
<div class="modal-overlay hidden" id="add-to-playlist-modal">
  <div class="modal">
    <h2>Add to Playlist</h2>
    <div id="playlist-pick-list" style="max-height:200px;overflow-y:auto;margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="hideAddToPlaylist()">Cancel</button>
    </div>
  </div>
</div>

<audio id="audio-el" preload="metadata"></audio>

<script>
// ============================================================
// State
// ============================================================
const audio = document.getElementById("audio-el");
let library = [];         // full library from server
let currentView = "all";  // all | artists | albums | playlist:<name>
let currentQueue = [];    // currently playing list
let currentIndex = -1;    // index in currentQueue
let shuffle = false;
let repeat = "none";      // none | one | all
let isMini = false;
let isSeeking = false;
let playlists = {};       // {name: [track, ...]}
let addToPlaylistTrack = null;
let shuffleOrder = [];
let shufflePos = 0;
let artCache = {};        // path -> "url" | "none"
let searchQuery = "";
let currentAlbumFilter = null; // for album drill-down

// ============================================================
// Init
// ============================================================
async function init() {
  await Promise.all([loadLibrary(), loadPlaylists()]);
  renderView();
  setupAudio();
  setupKeyboard();
}

async function loadLibrary() {
  try {
    const r = await fetch(vulosApi.appUrl("/api/library"));
    library = await r.json();
  } catch(e) {
    library = [];
  }
}

async function loadPlaylists() {
  try {
    const r = await fetch(vulosApi.appUrl("/api/playlists"));
    playlists = await r.json();
  } catch(e) {
    playlists = {};
  }
  renderPlaylistNav();
}

// ============================================================
// Art loading
// ============================================================
function getArt(track, callback) {
  if (!track) { callback(null); return; }
  const key = track.path;
  if (artCache[key] !== undefined) { callback(artCache[key] === "none" ? null : artCache[key]); return; }
  if (track.ext !== ".mp3") { artCache[key] = "none"; callback(null); return; }
  const url = vulosApi.appUrl("/api/art?path=") + encodeURIComponent(track.path);
  const img = new Image();
  img.onload = () => { artCache[key] = url; callback(url); };
  img.onerror = () => { artCache[key] = "none"; callback(null); };
  img.src = url;
}

function artEl(track, size) {
  const div = document.createElement("div");
  div.className = size === "thumb" ? "track-art-thumb" : "album-cover";
  div.textContent = "♪";
  if (track && track.ext === ".mp3") {
    getArt(track, url => {
      if (url) {
        div.textContent = "";
        const img = document.createElement("img");
        img.src = url;
        div.appendChild(img);
      }
    });
  }
  return div;
}

// ============================================================
// Views
// ============================================================
function showView(view) {
  currentView = view;
  currentAlbumFilter = null;
  searchQuery = "";
  document.getElementById("search-box").value = "";
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.view === view);
  });
  document.querySelectorAll(".playlist-nav-item").forEach(el => {
    el.classList.remove("active");
  });
  renderView();
}

function showPlaylistView(name) {
  currentView = "playlist:" + name;
  currentAlbumFilter = null;
  searchQuery = "";
  document.getElementById("search-box").value = "";
  document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".playlist-nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.playlist === name);
  });
  renderView();
}

function renderView() {
  const trackList = document.getElementById("track-list-container");
  const albumGrid = document.getElementById("album-grid");
  const title = document.getElementById("view-title");
  const empty = document.getElementById("empty-state");

  trackList.style.display = "block";
  albumGrid.style.display = "none";
  empty.style.display = "none";

  let tracks = getFilteredTracks();

  if (currentView === "all") {
    title.textContent = "All Songs";
    renderTrackList(tracks, trackList, true);
  } else if (currentView === "artists") {
    title.textContent = "Artists";
    renderArtistList(tracks, trackList);
  } else if (currentView === "albums") {
    if (currentAlbumFilter) {
      title.textContent = currentAlbumFilter;
      renderTrackList(tracks, trackList, true);
    } else {
      title.textContent = "Albums";
      trackList.style.display = "none";
      albumGrid.style.display = "flex";
      renderAlbumGrid(tracks, albumGrid);
    }
  } else if (currentView.startsWith("playlist:")) {
    const name = currentView.slice(9);
    title.textContent = name;
    const pl = playlists[name] || [];
    renderPlaylistTrackList(pl, trackList, name);
  }
}

function getFilteredTracks() {
  let tracks = library;
  if (currentView === "albums" && currentAlbumFilter) {
    tracks = tracks.filter(t => t.album === currentAlbumFilter);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    tracks = tracks.filter(t =>
      t.title.toLowerCase().includes(q) ||
      t.artist.toLowerCase().includes(q) ||
      t.album.toLowerCase().includes(q)
    );
  }
  return tracks;
}

function renderTrackList(tracks, container, showAlbum) {
  if (tracks.length === 0) {
    container.innerHTML = "";
    const es = emptyState(library.length === 0
      ? "No music found"
      : "No results",
      library.length === 0
        ? "Add audio files to ~/.vulos/music/"
        : "Try a different search term");
    container.appendChild(es);
    return;
  }
  const frag = document.createDocumentFragment();
  tracks.forEach((track, i) => {
    const row = makeTrackRow(track, i, tracks, showAlbum);
    frag.appendChild(row);
  });
  container.innerHTML = "";
  container.appendChild(frag);
  updateTrackHighlight();
}

function renderPlaylistTrackList(tracks, container, playlistName) {
  if (tracks.length === 0) {
    container.innerHTML = "";
    container.appendChild(emptyState("Empty playlist", "Add songs using the ⋯ menu on any track."));
    return;
  }
  const frag = document.createDocumentFragment();
  tracks.forEach((track, i) => {
    const row = makeTrackRow(track, i, tracks, true, playlistName);
    row.setAttribute("draggable", "true");
    row.dataset.index = i;
    row.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", i);
    });
    row.addEventListener("dragover", e => {
      e.preventDefault();
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      row.classList.remove("drag-over");
      const from = parseInt(e.dataTransfer.getData("text/plain"));
      const to = i;
      if (from !== to) reorderPlaylist(playlistName, from, to);
    });
    frag.appendChild(row);
  });
  container.innerHTML = "";
  container.appendChild(frag);
  updateTrackHighlight();
}

function makeTrackRow(track, i, tracks, showAlbum, playlistName) {
  const row = document.createElement("div");
  row.className = "track-row";
  row.dataset.path = track.path;

  const num = document.createElement("div");
  num.className = "track-num";
  num.textContent = i + 1;

  const art = artEl(track, "thumb");

  const info = document.createElement("div");
  info.className = "track-info";
  info.innerHTML = `<div class="track-title">${esc(track.title)}</div>
    <div class="track-sub">${esc(track.artist)}${showAlbum && track.album !== "Unknown Album" ? " · " + esc(track.album) : ""}</div>`;

  const dur = document.createElement("div");
  dur.className = "track-dur";
  dur.textContent = "";

  const actions = document.createElement("div");
  actions.className = "track-actions";

  const addBtn = document.createElement("button");
  addBtn.className = "track-action-btn";
  addBtn.title = "Add to playlist";
  addBtn.textContent = "➕";
  addBtn.onclick = e => { e.stopPropagation(); showAddToPlaylist(track); };

  const rmBtn = document.createElement("button");
  rmBtn.className = "track-action-btn";
  rmBtn.title = "Remove from playlist";
  rmBtn.textContent = "✕";
  rmBtn.onclick = e => { e.stopPropagation(); removeFromPlaylist(playlistName, i); };

  actions.appendChild(addBtn);
  if (playlistName) actions.appendChild(rmBtn);

  row.appendChild(num);
  row.appendChild(art);
  row.appendChild(info);
  row.appendChild(dur);
  row.appendChild(actions);

  row.onclick = () => playQueue(tracks, i);
  return row;
}

function renderArtistList(tracks, container) {
  const artists = {};
  tracks.forEach(t => {
    if (!artists[t.artist]) artists[t.artist] = [];
    artists[t.artist].push(t);
  });
  const sorted = Object.keys(artists).sort((a, b) => a.localeCompare(b));
  if (sorted.length === 0) {
    container.innerHTML = "";
    container.appendChild(emptyState("No artists found", "Add music to ~/.vulos/music/"));
    return;
  }
  container.innerHTML = "";
  sorted.forEach(artist => {
    const tracks = artists[artist];
    const row = document.createElement("div");
    row.className = "track-row";
    row.style.padding = "10px 20px";
    row.innerHTML = `
      <div class="nav-icon" style="font-size:22px;">♟</div>
      <div class="track-info">
        <div class="track-title">${esc(artist)}</div>
        <div class="track-sub">${tracks.length} song${tracks.length !== 1 ? "s" : ""}</div>
      </div>
    `;
    row.onclick = () => {
      currentAlbumFilter = null;
      searchQuery = artist;
      document.getElementById("search-box").value = artist;
      currentView = "all";
      document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === "all"));
      renderView();
    };
    container.appendChild(row);
  });
}

function renderAlbumGrid(tracks, container) {
  const albums = {};
  tracks.forEach(t => {
    const key = t.album + "\x00" + t.artist;
    if (!albums[key]) albums[key] = { album: t.album, artist: t.artist, tracks: [], first: t };
    albums[key].tracks.push(t);
  });
  const sorted = Object.values(albums).sort((a, b) => a.album.localeCompare(b.album));
  container.innerHTML = "";
  if (sorted.length === 0) {
    container.appendChild(emptyState("No albums found", "Add music to ~/.vulos/music/"));
    return;
  }
  sorted.forEach(alb => {
    const card = document.createElement("div");
    card.className = "album-card";
    const cover = artEl(alb.first, "album");
    if (!alb.first || alb.first.ext !== ".mp3") cover.textContent = "◫";
    card.appendChild(cover);
    const title = document.createElement("div");
    title.className = "album-title";
    title.textContent = alb.album;
    const artist = document.createElement("div");
    artist.className = "album-artist";
    artist.textContent = alb.artist;
    card.appendChild(title);
    card.appendChild(artist);
    card.onclick = () => {
      currentAlbumFilter = alb.album;
      renderView();
    };
    container.appendChild(card);
  });
}

function emptyState(title, sub) {
  const div = document.createElement("div");
  div.className = "empty-state";
  div.innerHTML = `<div class="icon">♪</div><p>${esc(title)}</p><small>${esc(sub)}</small>`;
  return div;
}

// ============================================================
// Playlist sidebar
// ============================================================
function renderPlaylistNav() {
  const nav = document.getElementById("playlist-nav");
  nav.innerHTML = "";
  Object.keys(playlists).sort().forEach(name => {
    const item = document.createElement("div");
    item.className = "playlist-nav-item";
    item.dataset.playlist = name;
    if (currentView === "playlist:" + name) item.classList.add("active");
    item.innerHTML = `<span>${esc(name)}</span>`;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "Delete playlist";
    del.onclick = e => { e.stopPropagation(); deletePlaylist(name); };
    item.appendChild(del);
    item.onclick = () => showPlaylistView(name);
    nav.appendChild(item);
  });
}

// ============================================================
// Playlist CRUD
// ============================================================
function showNewPlaylistModal() {
  document.getElementById("playlist-name-input").value = "";
  document.getElementById("playlist-modal").classList.remove("hidden");
  setTimeout(() => document.getElementById("playlist-name-input").focus(), 50);
}
function hideNewPlaylistModal() {
  document.getElementById("playlist-modal").classList.add("hidden");
}
async function confirmNewPlaylist() {
  const name = document.getElementById("playlist-name-input").value.trim();
  if (!name) return;
  hideNewPlaylistModal();
  await fetch(vulosApi.appUrl("/api/playlists/save"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, tracks: []})
  });
  await loadPlaylists();
  showPlaylistView(name);
}

async function deletePlaylist(name) {
  if (!confirm(`Delete playlist "${name}"?`)) return;
  await fetch(vulosApi.appUrl("/api/playlists/delete"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name})
  });
  if (currentView === "playlist:" + name) showView("all");
  await loadPlaylists();
}

function showAddToPlaylist(track) {
  addToPlaylistTrack = track;
  const list = document.getElementById("playlist-pick-list");
  list.innerHTML = "";
  const names = Object.keys(playlists).sort();
  if (names.length === 0) {
    list.textContent = "No playlists yet. Create one first.";
  } else {
    names.forEach(name => {
      const item = document.createElement("div");
      item.className = "track-row";
      item.innerHTML = `<span>${esc(name)}</span>`;
      item.onclick = () => addTrackToPlaylist(name);
      list.appendChild(item);
    });
  }
  document.getElementById("add-to-playlist-modal").classList.remove("hidden");
}
function hideAddToPlaylist() {
  document.getElementById("add-to-playlist-modal").classList.add("hidden");
  addToPlaylistTrack = null;
}
async function addTrackToPlaylist(name) {
  hideAddToPlaylist();
  const track = addToPlaylistTrack;
  if (!track) return;
  const pl = playlists[name] ? [...playlists[name]] : [];
  if (!pl.find(t => t.path === track.path)) pl.push(track);
  await fetch(vulosApi.appUrl("/api/playlists/save"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, tracks: pl})
  });
  await loadPlaylists();
}

async function removeFromPlaylist(name, index) {
  if (!name) return;
  const pl = [...(playlists[name] || [])];
  pl.splice(index, 1);
  await fetch(vulosApi.appUrl("/api/playlists/save"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, tracks: pl})
  });
  await loadPlaylists();
  renderView();
}

async function reorderPlaylist(name, from, to) {
  const pl = [...(playlists[name] || [])];
  const [moved] = pl.splice(from, 1);
  pl.splice(to, 0, moved);
  await fetch(vulosApi.appUrl("/api/playlists/reorder"), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, tracks: pl})
  });
  await loadPlaylists();
  renderView();
}

// ============================================================
// Playback
// ============================================================
function playQueue(tracks, index) {
  currentQueue = tracks;
  currentIndex = index;
  if (shuffle) buildShuffleOrder(tracks.length, index);
  playCurrentTrack();
}

function playCurrentTrack() {
  if (currentIndex < 0 || currentIndex >= currentQueue.length) return;
  const track = currentQueue[currentIndex];
  audio.src = vulosApi.appUrl("/audio/") + encodeURIComponent(track.path);
  audio.load();
  audio.play().catch(() => {});
  updateNowPlaying(track);
  updateTrackHighlight();
  updateMediaSession(track);
}

function updateNowPlaying(track) {
  if (!track) return;
  document.getElementById("np-title").textContent = track.title;
  document.getElementById("np-artist").textContent = track.artist;
  document.getElementById("np-art").textContent = "♪";
  document.getElementById("np-art").innerHTML = "♪";
  if (track.ext === ".mp3") {
    getArt(track, url => {
      if (url) {
        document.getElementById("np-art").textContent = "";
        const img = document.createElement("img");
        img.src = url;
        document.getElementById("np-art").appendChild(img);
      }
    });
  }
}

function updateTrackHighlight() {
  const playing = currentQueue[currentIndex];
  document.querySelectorAll(".track-row").forEach(row => {
    row.classList.toggle("playing", playing && row.dataset.path === playing.path);
  });
}

function togglePlay() {
  if (!audio.src || audio.src === window.location.href) {
    if (library.length > 0) playQueue(library, 0);
    return;
  }
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
}

function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (currentQueue.length === 0) return;
  if (shuffle) {
    shufflePos = Math.max(0, shufflePos - 1);
    currentIndex = shuffleOrder[shufflePos];
  } else {
    currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
  }
  playCurrentTrack();
}

function nextTrack(auto) {
  if (currentQueue.length === 0) return;
  if (repeat === "one" && auto) { audio.currentTime = 0; audio.play(); return; }
  if (shuffle) {
    if (shufflePos < shuffleOrder.length - 1) {
      shufflePos++;
    } else if (repeat === "all") {
      buildShuffleOrder(currentQueue.length, -1);
    } else {
      return;
    }
    currentIndex = shuffleOrder[shufflePos];
  } else {
    if (currentIndex < currentQueue.length - 1) {
      currentIndex++;
    } else if (repeat === "all") {
      currentIndex = 0;
    } else {
      return;
    }
  }
  playCurrentTrack();
}

function buildShuffleOrder(len, startIndex) {
  shuffleOrder = Array.from({length: len}, (_, i) => i).filter(i => i !== startIndex);
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
  if (startIndex >= 0) shuffleOrder.unshift(startIndex);
  shufflePos = 0;
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById("shuffle-btn").classList.toggle("active", shuffle);
  if (shuffle) buildShuffleOrder(currentQueue.length, currentIndex);
}

function cycleRepeat() {
  const modes = ["none", "all", "one"];
  repeat = modes[(modes.indexOf(repeat) + 1) % modes.length];
  const icons = {none: "↻", all: "↻", one: "↺"};
  const btn = document.getElementById("repeat-btn");
  btn.textContent = icons[repeat];
  btn.title = repeat === "none" ? "Repeat off" : repeat === "all" ? "Repeat all" : "Repeat one";
  btn.classList.toggle("active", repeat !== "none");
}

function setVolume(val) {
  audio.volume = val / 100;
  const icon = document.getElementById("vol-icon");
  icon.textContent = val == 0 ? "🔇" : val < 50 ? "🔉" : "🔊";
}

function toggleMute() {
  audio.muted = !audio.muted;
  document.getElementById("vol-icon").textContent = audio.muted ? "🔇" : "🔊";
}

function toggleMini() {
  isMini = !isMini;
  document.getElementById("player-bar").classList.toggle("mini", isMini);
  document.getElementById("mini-toggle").textContent = isMini ? "⊞" : "⊟";
}

// ============================================================
// Audio events
// ============================================================
function setupAudio() {
  audio.volume = 0.8;
  document.getElementById("vol-bar").value = 80;

  audio.addEventListener("timeupdate", () => {
    if (isSeeking || !isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById("seek-bar").value = pct || 0;
    document.getElementById("time-current").textContent = fmtTime(audio.currentTime);
  });

  audio.addEventListener("loadedmetadata", () => {
    document.getElementById("time-total").textContent = fmtTime(audio.duration);
  });

  audio.addEventListener("play", () => {
    document.getElementById("play-btn").textContent = "⏸";
  });
  audio.addEventListener("pause", () => {
    document.getElementById("play-btn").textContent = "▶";
  });
  audio.addEventListener("ended", () => nextTrack(true));
}

function onSeekInput(val) {
  isSeeking = true;
  if (isFinite(audio.duration)) {
    document.getElementById("time-current").textContent = fmtTime(audio.duration * val / 100);
  }
}
function onSeekChange(val) {
  isSeeking = false;
  if (isFinite(audio.duration)) {
    audio.currentTime = audio.duration * val / 100;
  }
}

// ============================================================
// Media Session API (OS media controls)
// ============================================================
function updateMediaSession(track) {
  if (!navigator.mediaSession) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: track.artist,
    album: track.album,
  });
  navigator.mediaSession.setActionHandler("play", togglePlay);
  navigator.mediaSession.setActionHandler("pause", togglePlay);
  navigator.mediaSession.setActionHandler("previoustrack", prevTrack);
  navigator.mediaSession.setActionHandler("nexttrack", () => nextTrack(false));
}

// ============================================================
// Keyboard shortcuts
// ============================================================
function setupKeyboard() {
  document.addEventListener("keydown", e => {
    const tag = document.activeElement.tagName.toLowerCase();
    if (tag === "input" || tag === "textarea") return;
    switch(e.key) {
      case " ":
        e.preventDefault();
        togglePlay();
        break;
      case "ArrowRight":
        e.preventDefault();
        if (e.shiftKey) nextTrack(false);
        else if (isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
        break;
      case "ArrowLeft":
        e.preventDefault();
        if (e.shiftKey) prevTrack();
        else if (isFinite(audio.duration)) audio.currentTime = Math.max(0, audio.currentTime - 10);
        break;
      case "ArrowUp":
        e.preventDefault();
        audio.volume = Math.min(1, audio.volume + 0.05);
        document.getElementById("vol-bar").value = Math.round(audio.volume * 100);
        break;
      case "ArrowDown":
        e.preventDefault();
        audio.volume = Math.max(0, audio.volume - 0.05);
        document.getElementById("vol-bar").value = Math.round(audio.volume * 100);
        break;
      case "s": case "S":
        if (!e.ctrlKey && !e.metaKey) toggleShuffle();
        break;
      case "r": case "R":
        if (!e.ctrlKey && !e.metaKey) cycleRepeat();
        break;
      case "m": case "M":
        if (!e.ctrlKey && !e.metaKey) toggleMute();
        break;
      case "Escape":
        hideNewPlaylistModal();
        hideAddToPlaylist();
        break;
    }
  });
}

// ============================================================
// Search
// ============================================================
function onSearch(q) {
  searchQuery = q;
  renderView();
}

// ============================================================
// Utils
// ============================================================
function fmtTime(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ":" + String(sec).padStart(2, "0");
}

function esc(str) {
  return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ============================================================
// Boot
// ============================================================
init();
</script>
