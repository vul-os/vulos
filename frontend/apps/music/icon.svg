<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Media: violet tile -->
  <rect width="64" height="64" rx="14" fill="#4c1d95"/>
  <!-- Musical note stem -->
  <rect x="30" y="16" width="3" height="22" rx="1.5" fill="#c4b5fd"/>
  <!-- Beam / flag -->
  <rect x="33" y="16" width="12" height="3" rx="1.5" fill="#c4b5fd"/>
  <!-- Second note stem -->
  <rect x="42" y="16" width="3" height="18" rx="1.5" fill="#c4b5fd"/>
  <!-- Note head 1 -->
  <ellipse cx="29" cy="38" rx="6" ry="4" transform="rotate(-15 29 38)" fill="#c4b5fd"/>
  <!-- Note head 2 -->
  <ellipse cx="41" cy="34" rx="6" ry="4" transform="rotate(-15 41 34)" fill="#c4b5fd"/>
  <!-- Equalizer bars at bottom -->
  <rect x="13" y="42" width="4" height="10" rx="2" fill="#a78bfa"/>
  <rect x="20" y="38" width="4" height="14" rx="2" fill="#c4b5fd"/>
  <rect x="27" y="45" width="4" height="7" rx="2" fill="#a78bfa"/>
</svg>
