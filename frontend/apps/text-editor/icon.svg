  <rect x="14" y="12" width="36" height="42" rx="5" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Text lines -->
  <line x1="20" y1="22" x2="44" y2="22" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="29" x2="44" y2="29" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="44" y2="36" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="43" x2="34" y2="43" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <!-- Blinking cursor -->
