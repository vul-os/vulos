<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'none'; object-src 'none'; base-uri 'self';">
<title>Text Editor</title>
<style>
/* ── Reset & base ───────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}

/* ── Toolbar ────────────────────────────────────────────────────────────── */
#toolbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;
  background:#111;border-bottom:1px solid #222;
  flex-shrink:0;
  flex-wrap:wrap;
}
#toolbar button{
  background:#222;border:1px solid #333;border-radius:5px;
  padding:4px 10px;color:#ccc;cursor:pointer;font-size:12px;
  white-space:nowrap;
}
#toolbar button:hover{background:#2a2a2a;color:#fff}
#toolbar button.active{background:#1e40af;border-color:#3b82f6;color:#fff}
#toolbar select{
  background:#222;border:1px solid #333;border-radius:5px;
  padding:4px 6px;color:#ccc;font-size:12px;cursor:pointer;
}
#toolbar input[type=text]{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:4px 8px;color:#e5e5e5;font-size:12px;width:140px;outline:none;
}
#toolbar input[type=number]{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:4px 6px;color:#e5e5e5;font-size:12px;width:52px;outline:none;
}
#toolbar .sep{width:1px;background:#333;height:20px;flex-shrink:0}
#toolbar .spacer{flex:1}
#file-label{color:#666;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Body layout ────────────────────────────────────────────────────────── */
#body{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
#sidebar{
  width:200px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid #222;
}
#sidebar .top{padding:8px;border-bottom:1px solid #222;display:flex;gap:4px}
#sidebar .top button{
  flex:1;background:#222;border:1px solid #333;border-radius:5px;
  padding:5px 0;color:#ccc;cursor:pointer;font-size: 12px;
}
#sidebar .top button:hover{background:#2a2a2a}
#file-list{flex:1;overflow-y:auto}
.file-item{
  padding:8px 10px;border-bottom:1px solid #111;cursor:pointer;
  font-size:12px;display:flex;align-items:center;gap:6px;
}
.file-item:hover{background:#111}
.file-item.active{background:#1a1a1a;border-left:2px solid #3b82f6}
.file-item .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .del{color:#555;font-size: 12px;padding:1px 4px;border-radius:3px;flex-shrink:0}
.file-item .del:hover{background:#3f1212;color:#f87171}

/* ── Editor area ────────────────────────────────────────────────────────── */
#editor-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#cm-host{flex:1;overflow:auto;font-size:14px}

/* ── Find/replace panel ─────────────────────────────────────────────────── */
#find-bar{
  display:none;flex-shrink:0;
  background:#111;border-top:1px solid #222;
  padding:6px 10px;gap:6px;align-items:center;flex-wrap:wrap;
}
#find-bar.open{display:flex}
#find-bar input{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:4px 8px;color:#e5e5e5;font-size:12px;width:160px;outline:none;
}
#find-bar input:focus{border-color:#3b82f6}
#find-bar button{
  background:#222;border:1px solid #333;border-radius:5px;
  padding:4px 10px;color:#ccc;cursor:pointer;font-size:12px;
}
#find-bar button:hover{background:#2a2a2a}
#find-count{color:#666;font-size: 12px;min-width:60px}

/* ── Status bar ─────────────────────────────────────────────────────────── */
#statusbar{
  display:flex;align-items:center;gap:12px;
  padding:3px 10px;
  background:#111;border-top:1px solid #222;
  font-size: 12px;color:#555;flex-shrink:0;
}
#statusbar .s-right{margin-left:auto;display:flex;gap:12px}
#save-status{color:#555}
#save-status.saving{color:#f59e0b}
#save-status.saved{color:#22c55e}
#save-status.error{color:#f87171}

/* ── Collab panel (Share) ───────────────────────────────────────────────── */
#collab-bar{
  display:none;flex-shrink:0;
  background:#0f1929;border-top:1px solid #1e3a5f;
  padding:6px 10px;gap:8px;align-items:center;font-size:12px;
}
#collab-bar.open{display:flex}
#collab-bar .c-title{color:#60a5fa;font-weight:600}
#collab-peers{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.peer-badge{
  display:flex;align-items:center;gap:4px;
  background:#1e3a5f;border:1px solid #2563eb;border-radius:12px;
  padding:2px 8px;font-size: 12px;
}
.peer-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#collab-link-wrap{display:flex;align-items:center;gap:6px}
#collab-link{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:3px 8px;color:#93c5fd;font-size: 12px;
  cursor:pointer;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#collab-link:hover{border-color:#3b82f6}

/* ── Share modal ────────────────────────────────────────────────────────── */
#share-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:100;align-items:center;justify-content:center;
}
#share-modal.open{display:flex}
#share-box{
  background:#111;border:1px solid #333;border-radius:10px;
  padding:20px;width:340px;display:flex;flex-direction:column;gap:12px;
}
#share-box h3{color:#e5e5e5;font-size:14px}
#share-box label{color:#888;font-size:12px}
#share-box input,#share-box select{
  background:#1a1a1a;border:1px solid #333;border-radius:5px;
  padding:6px 8px;color:#e5e5e5;font-size:13px;width:100%;outline:none;
}
#share-box input:focus,#share-box select:focus{border-color:#3b82f6}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-actions button{
  background:#222;border:1px solid #333;border-radius:6px;
  padding:6px 14px;color:#ccc;cursor:pointer;font-size:13px;
}
.modal-actions button.primary{background:#1d4ed8;border-color:#3b82f6;color:#fff}
.modal-actions button:hover{background:#2a2a2a}
.modal-actions button.primary:hover{background:#1e40af}

/* ── CodeMirror overrides ───────────────────────────────────────────────── */
.cm-editor{height:100%}
.cm-scroller{height:100%}
.cm-content{padding:12px 0}
.cm-line{padding:0 16px}

/* Light theme overrides */
body.light-theme{background:#fafafa;color:#1a1a1a}
body.light-theme #toolbar,body.light-theme #find-bar,body.light-theme #statusbar{background:#f0f0f0;border-color:#ddd}
body.light-theme #sidebar{border-color:#ddd}
body.light-theme #sidebar .top{border-color:#ddd}
body.light-theme #sidebar .top button{background:#e8e8e8;border-color:#ccc;color:#333}
body.light-theme .file-item{border-color:#eee}
body.light-theme .file-item:hover{background:#f0f0f0}
body.light-theme .file-item.active{background:#e8f0fe}
body.light-theme #toolbar button{background:#e8e8e8;border-color:#ccc;color:#333}
body.light-theme #toolbar button:hover{background:#d8d8d8;color:#000}
body.light-theme #toolbar select,body.light-theme #toolbar input{background:#fff;border-color:#ccc;color:#1a1a1a}
body.light-theme #collab-bar{background:#eff6ff;border-color:#bfdbfe}
</style>
<script data-vulos-shared="vulos-api.js">
/* ---------------------------------------------------------------------------
   vulos-api.js — resolve an app's own API URL against the mount point the app
   is actually being served from.

   THE DEFECT THIS EXISTS TO KILL
   -----------------------------
   A bundled app is served from two different places depending on one server
   flag, and only one of them makes an absolute `/api/…` correct:

     per-app origins ON   →  https://{app}--{profile}.{base}[:port]/     ← app at root
     per-app origins OFF  →  https://{base}[:port]/app/{app}/            ← app under a prefix

   `backend/services/gateway/gateway.go` Handler() builds `appPath` from the
   request in both shapes: on an app origin `appPath = r.URL.Path` (the app sees
   the whole path), on the path prefix `appPath` is what is left after
   `/app/{id}` is stripped. So the app's server only ever sees `/api/info` —
   which is why `/app/system-info/api/info` works when you curl it, and why
   `/api/info` from inside the frame does not: it never entered the gateway's
   app route at all.

   OFF is the DEFAULT (`frontend/src/core/AppOrigins.ts`: the fallback config is
   `{enabled:false}`, and `setOriginConfig` additionally requires a non-empty
   base_domain), so the broken shape is the normal shape. An absolute `/api/…`
   from the frame leaves the app's mount point and lands on the SHELL's origin,
   where it is either a 404 or — worse — a real, unrelated shell endpoint.

   WHY A HELPER AND NOT JUST A RELATIVE PATH
   -----------------------------------------
   `fetch('api/info')` does resolve correctly against `document.baseURI` in both
   modes, and that is 90% of the fix. It is not all of it: the gateway also
   serves an app addressed WITHOUT the trailing slash (`/app/gallery`, see
   gateway_test.go TestPathFallback), and against that document URL a bare
   `api/info` resolves to `/app/api/info` — a different app's mount, silently.
   `appUrl()` reads the mount out of the path instead of trusting the base URI,
   so it is right either way. It is also a name: a reviewer who sees
   `vulosApi.appUrl('/api/info')` will not "tidy" it back into `'/api/info'`,
   which is exactly how this bug is written in the first place.

   THIS FILE IS THE SINGLE SOURCE OF TRUTH.
   It is inlined verbatim into every bundled app's index.html inside a script
   element tagged data-vulos-shared="vulos-api.js". Inlined rather than linked
   because each app ships its own hand-rolled `server.py` with its own static
   route table (fifteen different shapes — four of them serve
   `../_shared/vulos-tokens.css`, eleven serve nothing shared at all), so a
   `<script src>` would be a 404 and a dead app in every server.py that was not
   also edited. An inline copy has no such failure mode.

   Regenerate the copies:  node frontend/apps/_shared/sync-api-helper.mjs
   The copies are pinned byte-for-byte by
   backend/internal/docsref/appapibase_test.go, so drift fails the build.
   --------------------------------------------------------------------------- */
(function (root) {
  'use strict';

  // The gateway's path-prefix route. Kept in sync with PATH_PREFIX in
  // frontend/src/core/AppOrigins.ts and the `/app/` literal in gateway.go.
  var PREFIX = '/app/';
  // The same app-id shape AppOrigins.gatewayAppId accepts. Deliberately strict:
  // anything else is not a mount we minted, so we do not treat it as one.
  var MOUNT = /^\/app\/([a-z0-9][a-z0-9-]*)(?:\/|$)/;

  // mountBase returns the path the app is served under, always with a trailing
  // slash: '/app/{id}/' behind the gateway path prefix, '/' on an app origin
  // (and '/' when the app's own server is hit directly in development).
  function mountBase(pathname) {
    var p = typeof pathname === 'string'
      ? pathname
      : (root && root.location && root.location.pathname) || '/';
    var m = MOUNT.exec(p);
    return m ? PREFIX + m[1] + '/' : '/';
  }

  // appUrl maps a path the app's own server implements onto the URL the browser
  // must actually request. A fully-qualified URL is returned untouched.
  function appUrl(path, pathname) {
    var p = path == null ? '' : String(path);
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p) || p.slice(0, 2) === '//') return p;
    return mountBase(pathname) + p.replace(/^\/+/, '');
  }

  // appFetch is appUrl + fetch, so a call site changes in one place.
  function appFetch(path, init) {
    return fetch(appUrl(path), init);
  }

  var api = { mountBase: mountBase, appUrl: appUrl, appFetch: appFetch };
  if (root) root.vulosApi = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : null);
</script>

  <span id="file-label">No file open</span>

<!-- ── Scripts ─────────────────────────────────────────────────────────── -->
<!--
  SOVEREIGNTY: CodeMirror 6, Yjs, y-codemirror.next and y-websocket are vendored
  locally (self-hosted, same-origin ./vendor/*.js bundles produced by esbuild
  with code-splitting, so @codemirror/state & @codemirror/view stay singletons)
  instead of being fetched from the esm.sh CDN at runtime. A self-host /
  air-gapped Vulos OS must never depend on a third-party CDN to open an app, and
  must not leak the user's activity to esm.sh. Same library versions; only the
  delivery changes. Regenerate with scripts/vendor-apps.mjs.
-->
<script type="importmap">
{
  "imports": {
    "@codemirror/state":       "./vendor/state.js",
    "@codemirror/view":        "./vendor/view.js",
    "@codemirror/commands":    "./vendor/commands.js",
    "@codemirror/language":    "./vendor/language.js",

    "@codemirror/lint":        "./vendor/lint.js",
    "@codemirror/theme-one-dark": "./vendor/theme-one-dark.js",
    "@codemirror/lang-javascript": "./vendor/lang-javascript.js",
    "@codemirror/lang-python":    "./vendor/lang-python.js",
    "@codemirror/lang-html":      "./vendor/lang-html.js",
    "@codemirror/lang-css":       "./vendor/lang-css.js",
    "@codemirror/lang-json":      "./vendor/lang-json.js",
    "@codemirror/lang-markdown":  "./vendor/lang-markdown.js",
    "@codemirror/lang-sql":       "./vendor/lang-sql.js",
    "@codemirror/lang-xml":       "./vendor/lang-xml.js",
    "@lezer/highlight":           "./vendor/lezer-highlight.js",
    "yjs":                        "./vendor/yjs.js",
    "y-websocket":                "./vendor/y-websocket.js",
    "y-codemirror.next":          "./vendor/y-codemirror.next.js",
    "lib0":                       "./vendor/lib0.js"
  }
}
</script>

<script type="module">
// ── Imports ─────────────────────────────────────────────────────────────
import { EditorState, Compartment } from "@codemirror/state";
import {
  EditorView, keymap, lineNumbers, highlightActiveLineGutter,
  highlightSpecialChars, drawSelection, dropCursor, rectangularSelection,
  crosshairCursor, highlightActiveLine, ViewUpdate
} from "@codemirror/view";
import {
  defaultKeymap, history, historyKeymap,
  indentWithTab, undo, redo
} from "@codemirror/commands";
import {
  syntaxHighlighting, defaultHighlightStyle,
  bracketMatching, foldGutter, indentOnInput,
  StreamLanguage
} from "@codemirror/language";
import {
  searchKeymap, search, findNext, findPrevious,
  openSearchPanel, closeSearchPanel, replaceNext, replaceAll,
  SearchQuery, setSearchQuery, getSearchQuery
} from "@codemirror/search";
import { autocompletion, closeBrackets, closeBracketsKeymap } from "@codemirror/autocomplete";
import { oneDark } from "@codemirror/theme-one-dark";
import { javascript } from "@codemirror/lang-javascript";
import { python } from "@codemirror/lang-python";
import { html } from "@codemirror/lang-html";
import { css } from "@codemirror/lang-css";
import { json } from "@codemirror/lang-json";
import { markdown } from "@codemirror/lang-markdown";
import { sql } from "@codemirror/lang-sql";
import { xml } from "@codemirror/lang-xml";

// Yjs
import * as Y from "yjs";
import { WebsocketProvider } from "y-websocket";
import { yCollab, yUndoManagerKeymap } from "y-codemirror.next";

// ── State ────────────────────────────────────────────────────────────────
let view = null;          // CodeMirror EditorView
let currentFile = null;   // currently open filename
let saveTimer = null;
let wordWrap = false;

// Yjs collab state
let ydoc = null;
let wsProvider = null;
let collabActive = false;
let currentDocId = null;

// CodeMirror Compartments (for dynamic reconfiguration)
const langCompartment  = new Compartment();
const themeCompartment = new Compartment();
const wrapCompartment  = new Compartment();

// ── Language map ────────────────────────────────────────────────────────
const LANG_EXT = {
  javascript: javascript(),
  typescript: javascript({ typescript: true }),
  python: python(),
  html: html(),
  css: css(),
  json: json(),
  markdown: markdown(),
  sql: sql(),
  xml: xml(),
  go: [],   // no dedicated lang extension; plain text fallback
  rust: [],
  cpp: [],
  java: [],
  shell: [],
};

// Guess language from filename
function guessLang(name) {
  const ext = (name || "").split(".").pop().toLowerCase();
  const map = {
    js: "javascript", mjs: "javascript", cjs: "javascript",
    ts: "typescript", tsx: "typescript",
    py: "python",
    html: "html", htm: "html",
    css: "css", scss: "css",
    json: "json",
    md: "markdown", mdx: "markdown",
    sql: "sql",
    xml: "xml", svg: "xml",
    go: "go",
    rs: "rust",
    c: "cpp", cpp: "cpp", cc: "cpp", h: "cpp",
    java: "java",
    sh: "shell", bash: "shell", zsh: "shell",
  };
  return map[ext] || "";
}

// ── Build CodeMirror extensions ─────────────────────────────────────────
function buildExtensions(langId, dark, wrap, collabExts=[]) {
  const langExt = LANG_EXT[langId] || [];
  return [
    lineNumbers(),
    highlightActiveLineGutter(),
    highlightSpecialChars(),
    history(),
    foldGutter(),
    drawSelection(),
    dropCursor(),
    EditorState.allowMultipleSelections.of(true),
    indentOnInput(),
    syntaxHighlighting(defaultHighlightStyle, {fallback: true}),
    bracketMatching(),
    closeBrackets(),
    autocompletion(),
    rectangularSelection(),
    crosshairCursor(),
    highlightActiveLine(),
    // keymaps
    keymap.of([
      ...closeBracketsKeymap,
      ...defaultKeymap,
      ...historyKeymap,
      ...searchKeymap,
      ...yUndoManagerKeymap,
      indentWithTab,
    ]),
    // language compartment
    langCompartment.of(langExt),
    // theme compartment
    themeCompartment.of(dark ? oneDark : []),
    // word wrap compartment
    wrapCompartment.of(wrap ? EditorView.lineWrapping : []),
    // update listener → cursor pos + save
    EditorView.updateListener.of(onUpdate),
    // collab extensions (Yjs) injected here
    ...collabExts,
  ];
}

// ── Create / reset editor ───────────────────────────────────────────────
function createEditor(content, langId, collabExts=[]) {
  const dark = document.getElementById("theme-select").value === "dark";
  const wrap = wordWrap;

  if (view) {
    view.destroy();
    view = null;
  }

  const state = EditorState.create({
    doc: content,
    extensions: buildExtensions(langId, dark, wrap, collabExts),
  });

  view = new EditorView({
    state,
    parent: document.getElementById("cm-host"),
  });

  // Restore font size
  applyFontSize(parseInt(document.getElementById("font-size").value, 10));
}

// ── Update listener ─────────────────────────────────────────────────────
function onUpdate(upd) {
  if (upd.docChanged && !collabActive && currentFile) {
    schedSave();
  }

  // Cursor position
  const sel = upd.state.selection.main;
  const line = upd.state.doc.lineAt(sel.head);
  document.getElementById("cursor-pos").textContent =
    `Ln ${line.number}, Col ${sel.head - line.from + 1}`;

  // Selection count
  const selLen = sel.to - sel.from;
  document.getElementById("sel-count").textContent =
    selLen > 0 ? `${selLen} selected` : "";

  // Word count
  const text = upd.state.doc.toString();
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById("word-count").textContent = `${words} words`;
}

// ── Auto-save (local files only, not while collab is active) ────────────
function schedSave() {
  clearTimeout(saveTimer);
  setStatus("saving");
  saveTimer = setTimeout(saveFile, 600);
}

async function saveFile() {
  if (!currentFile || !view) return;
  const content = view.state.doc.toString();
  try {
    const res = await fetch(vulosApi.appUrl("/api/files/") + encodeURIComponent(currentFile), {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: content,
    });
    if (!res.ok) throw new Error(res.statusText);
    setStatus("saved");
    loadFileList();
  } catch (e) {
    setStatus("error");
    console.error("save error:", e);
  }
}

function setStatus(s) {
  const el = document.getElementById("save-status");
  el.className = s;
  el.textContent = s === "saving" ? "Saving…" : s === "saved" ? "Saved" : s === "error" ? "Save failed" : "Ready";
}

// ── File list ───────────────────────────────────────────────────────────
async function loadFileList() {
  const res = await fetch(vulosApi.appUrl("/api/files"));
  const files = await res.json();
  const list = document.getElementById("file-list");
  if (!files.length) {
    list.innerHTML = '<div style="padding:10px;color:#555;font-size: 12px">No files yet</div>';
    return;
  }
  list.innerHTML = files.map(f => `
    <div class="file-item ${f.name === currentFile ? "active" : ""}" data-name="${esc(f.name)}">
      <span class="fname">${esc(f.name)}</span>
      <span class="del" data-del="${esc(f.name)}" title="Delete">✕</span>
    </div>`).join("");

  list.querySelectorAll(".file-item").forEach(el => {
    el.addEventListener("click", e => {
      if (e.target.dataset.del) { deleteFile(e.target.dataset.del); return; }
      openFile(el.dataset.name);
    });
  });
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Open file ───────────────────────────────────────────────────────────
async function openFile(name) {
  disconnectCollab(); // leave any active collab session
  const res = await fetch(vulosApi.appUrl("/api/files/") + encodeURIComponent(name));
  if (!res.ok) return;
  const content = await res.text();
  currentFile = name;
  const langId = guessLang(name);

  document.getElementById("lang-select").value = langId || "";
  document.getElementById("file-label").textContent = name;

  createEditor(content, langId);
  loadFileList();
  setStatus("ready");
}

// ── New file ────────────────────────────────────────────────────────────
async function newFile() {
  disconnectCollab();
  const name = prompt("File name:", "untitled.txt");
  if (!name) return;
  const res = await fetch(vulosApi.appUrl("/api/files/") + encodeURIComponent(name), {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: "",
  });
  if (!res.ok) return;
  await loadFileList();
  openFile(name);
}

// ── Delete file ─────────────────────────────────────────────────────────
async function deleteFile(name) {
  if (!confirm("Delete "" + name + ""?")) return;
  await fetch(vulosApi.appUrl("/api/files/") + encodeURIComponent(name), { method: "DELETE" });
  if (currentFile === name) {
    currentFile = null;
    document.getElementById("file-label").textContent = "No file open";
    createEditor("", "");
  }
  loadFileList();
}

// ── Language switch ──────────────────────────────────────────────────────
function switchLang(langId) {
  if (!view) return;
  view.dispatch({ effects: langCompartment.reconfigure(LANG_EXT[langId] || []) });
}

// ── Theme switch ─────────────────────────────────────────────────────────
function switchTheme(theme) {
  document.body.classList.toggle("light-theme", theme === "light");
  if (!view) return;
  view.dispatch({ effects: themeCompartment.reconfigure(theme === "dark" ? oneDark : []) });
}

// ── Font size ────────────────────────────────────────────────────────────
function applyFontSize(px) {
  if (!view) return;
  view.dom.style.fontSize = px + "px";
}

// ── Word wrap toggle ─────────────────────────────────────────────────────
function toggleWrap() {
  wordWrap = !wordWrap;
  document.getElementById("btn-wrap").classList.toggle("active", wordWrap);
  if (!view) return;
  view.dispatch({ effects: wrapCompartment.reconfigure(wordWrap ? EditorView.lineWrapping : []) });
}

// ── Find/Replace ─────────────────────────────────────────────────────────
let findOpen = false;

function toggleFind() {
  findOpen = !findOpen;
  document.getElementById("find-bar").classList.toggle("open", findOpen);
  if (findOpen) document.getElementById("find-input").focus();
}

function doSearch() {
  if (!view) return;
  const q = new SearchQuery({
    search: document.getElementById("find-input").value,
    replace: document.getElementById("replace-input").value,
    caseSensitive: false,
  });
  view.dispatch({ effects: setSearchQuery.of(q) });
}

document.getElementById("find-input").addEventListener("input", doSearch);
document.getElementById("replace-input").addEventListener("input", doSearch);

document.getElementById("find-next").addEventListener("click", () => {
  doSearch(); if (view) findNext(view);
});
document.getElementById("find-prev").addEventListener("click", () => {
  doSearch(); if (view) findPrevious(view);
});
document.getElementById("btn-replace-one").addEventListener("click", () => {
  doSearch(); if (view) replaceNext(view);
});
document.getElementById("btn-replace-all").addEventListener("click", () => {
  doSearch(); if (view) replaceAll(view);
});
document.getElementById("find-close").addEventListener("click", () => {
  findOpen = false;
  document.getElementById("find-bar").classList.remove("open");
});

// ── Keyboard shortcuts ───────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveFile();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === "f") {
    e.preventDefault();
    if (!findOpen) toggleFind();
  }
  if (e.key === "Escape" && findOpen) {
    findOpen = false;
    document.getElementById("find-bar").classList.remove("open");
    view?.focus();
  }
});

// ── localStorage persistence (selected file / settings) ─────────────────
function persistSettings() {
  localStorage.setItem("te-theme", document.getElementById("theme-select").value);
  localStorage.setItem("te-fontsize", document.getElementById("font-size").value);
  localStorage.setItem("te-wrap", wordWrap ? "1" : "0");
  if (currentFile) localStorage.setItem("te-file", currentFile);
}

function restoreSettings() {
  const theme = localStorage.getItem("te-theme") || "dark";
  const fontSize = parseInt(localStorage.getItem("te-fontsize") || "14", 10);
  const wrap = localStorage.getItem("te-wrap") === "1";

  document.getElementById("theme-select").value = theme;
  document.getElementById("font-size").value = fontSize;
  if (theme === "light") document.body.classList.add("light-theme");
  wordWrap = wrap;
  document.getElementById("btn-wrap").classList.toggle("active", wrap);
}

// ── Collab (Yjs + WebSocket) ─────────────────────────────────────────────

// Colour palette for remote cursors
const PEER_COLORS = [
  "#f87171","#fb923c","#facc15","#4ade80",
  "#34d399","#38bdf8","#818cf8","#c084fc","#f472b6",
];
let peerColorIdx = 0;
function nextPeerColor() { return PEER_COLORS[peerColorIdx++ % PEER_COLORS.length]; }

function buildCollabWsUrl(docId) {
  // The Vulos backend exposes the collab WS at /api/peering/collab/<docId>/sync
  // Derive from current window location so it works both locally and proxied.
  const loc = window.location;
  const proto = loc.protocol === "https:" ? "wss:" : "ws:";
  // The app server proxies through VULOS_API; the WS endpoint is on the main
  // Vulos backend (port 8080 by default). We connect directly to the backend.
  const backendHost = loc.hostname + ":8080";
  return `${proto}//${backendHost}/api/peering/collab/${encodeURIComponent(docId)}/sync`;
}

function startCollab(docId, peer, permission) {
  if (collabActive) disconnectCollab();

  // Create a fresh Yjs document
  ydoc = new Y.Doc();
  const yText = ydoc.getText("codemirror");

  // Colour for this user
  const myColor = nextPeerColor();
  const myName  = "Me";

  const wsUrl = buildCollabWsUrl(docId);
  wsProvider = new WebsocketProvider(wsUrl, docId, ydoc, { connect: true });

  // Set local awareness (presence / cursor)
  wsProvider.awareness.setLocalStateField("user", {
    name: myName,
    color: myColor,
    colorLight: myColor + "55",
  });

  // Build yCollab extension
  const collabExts = [
    yCollab(yText, wsProvider.awareness, {
      undoManager: new Y.UndoManager(yText),
    }),
    search(), // keep search working
  ];

  // If we have existing content (owner), load it into yText
  if (view && permission === "edit") {
    const existingContent = view.state.doc.toString();
    if (existingContent && yText.toString() === "") {
      ydoc.transact(() => { yText.insert(0, existingContent); });
    }
  }

  // Recreate editor with collab extensions
  const langId = document.getElementById("lang-select").value;
  createEditor("", langId, collabExts);

  collabActive = true;
  currentDocId = docId;

  // Show collab UI
  document.getElementById("collab-bar").classList.add("open");
  document.getElementById("collab-status").style.display = "";

  // Track awareness changes (remote cursors / peers)
  wsProvider.awareness.on("change", updatePeerBadges);

  wsProvider.on("status", ({ status }) => {
    if (status === "disconnected") {
      document.getElementById("collab-status").textContent = "● Collab (reconnecting…)";
    } else if (status === "connected") {
      document.getElementById("collab-status").textContent = "● Collab active";
    }
  });
}

function updatePeerBadges() {
  const peers = [];
  wsProvider.awareness.getStates().forEach((state, clientId) => {
    if (clientId !== wsProvider.awareness.clientID && state.user) {
      peers.push(state.user);
    }
  });
  const container = document.getElementById("collab-peers");
  if (!peers.length) {
    container.innerHTML = '<span style="color:#3b6bbf;font-size: 12px">Waiting for peers…</span>';
    return;
  }
  container.innerHTML = peers.map(p => `
    <span class="peer-badge">
      <span class="peer-dot" style="background:${p.color}"></span>
      ${esc(p.name || "Peer")}
    </span>`).join("");
}

function disconnectCollab() {
  if (!collabActive) return;
  wsProvider?.disconnect();
  wsProvider?.destroy();
  ydoc?.destroy();
  wsProvider = null;
  ydoc = null;
  collabActive = false;
  currentDocId = null;

  document.getElementById("collab-bar").classList.remove("open");
  document.getElementById("collab-status").style.display = "none";
}

// ── Share modal ──────────────────────────────────────────────────────────

function openShareModal() {
  if (!currentFile) {
    alert("Please open or save a file before sharing.");
    return;
  }
  document.getElementById("share-peer").value = "";
  document.getElementById("share-perm").value = "edit";
  document.getElementById("share-modal").classList.add("open");
  document.getElementById("share-peer").focus();
}

async function confirmShare() {
  const peer = document.getElementById("share-peer").value.trim();
  const perm = document.getElementById("share-perm").value;

  if (!peer) {
    alert("Enter a Vulos ID or email.");
    return;
  }

  // Generate a doc ID from the file name + timestamp (simple, stable)
  const docId = "te-" + btoa(currentFile).replace(/[^a-zA-Z0-9]/g,"") +
                "-" + Date.now().toString(36);

  // POST /api/peering/collab/share (proxied through our server.py)
  try {
    const res = await fetch(vulosApi.appUrl("/api/peering/collab/share"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        doc_id: docId,
        doc_type: "text",
        title: currentFile,
        peer: peer,
        permission: perm,
        app: "text-editor",
      }),
    });
    // 502 means backend not up (expected in dev) — still start local collab
    if (!res.ok && res.status !== 502) {
      console.warn("share API returned", res.status);
    }
  } catch (e) {
    console.warn("share API error (continuing):", e);
  }

  document.getElementById("share-modal").classList.remove("open");

  // Show link in collab bar
  const shareUrl = window.location.origin + "/?collab=" + encodeURIComponent(docId);
  const linkEl = document.getElementById("collab-link");
  linkEl.textContent = shareUrl;
  linkEl.title = "Click to copy";
  linkEl.onclick = () => { navigator.clipboard.writeText(shareUrl).catch(()=>{}); };
  document.getElementById("collab-link-wrap").style.display = "flex";

  // Start collab session
  startCollab(docId, peer, perm);
}

// Join if URL has ?collab=<docId>
function maybeJoinFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const docId = params.get("collab");
  if (docId) {
    startCollab(docId, null, "edit");
  }
}

// ── Wire up UI ───────────────────────────────────────────────────────────

document.getElementById("btn-new").addEventListener("click", newFile);
document.getElementById("btn-new2").addEventListener("click", newFile);
document.getElementById("btn-save").addEventListener("click", saveFile);
document.getElementById("btn-wrap").addEventListener("click", () => { toggleWrap(); persistSettings(); });
document.getElementById("btn-find").addEventListener("click", toggleFind);
document.getElementById("btn-share").addEventListener("click", openShareModal);

document.getElementById("lang-select").addEventListener("change", e => switchLang(e.target.value));
document.getElementById("theme-select").addEventListener("change", e => { switchTheme(e.target.value); persistSettings(); });
document.getElementById("font-size").addEventListener("input", e => {
  applyFontSize(parseInt(e.target.value, 10)); persistSettings();
});

document.getElementById("share-cancel").addEventListener("click", () => {
  document.getElementById("share-modal").classList.remove("open");
});
document.getElementById("share-confirm").addEventListener("click", confirmShare);
document.getElementById("share-peer").addEventListener("keydown", e => {
  if (e.key === "Enter") confirmShare();
  if (e.key === "Escape") document.getElementById("share-modal").classList.remove("open");
});

// ── Init ─────────────────────────────────────────────────────────────────

restoreSettings();

// Create an empty editor immediately so the shell feels responsive
createEditor("", "");
document.getElementById("word-count").textContent = "0 words";

// Load file list; restore last open file
loadFileList().then(async () => {
  const lastFile = localStorage.getItem("te-file");
  if (lastFile) {
    const res = await fetch(vulosApi.appUrl("/api/files"));
    const files = await res.json();
    if (files.find(f => f.name === lastFile)) {
      openFile(lastFile);
    }
  }
});

// Check for collab join URL
maybeJoinFromUrl();

// Persist settings when leaving
window.addEventListener("beforeunload", persistSettings);
</script>
