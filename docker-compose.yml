# Vulos — Dev Environment
# Usage:
#   docker compose up        → backend on :8080, frontend on :5173
#   docker compose up --build → rebuild everything
#
# Open http://localhost:5173 for dev (hot reload)
# Open http://localhost:8080 for production build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    shm_size: '1g'
    privileged: true
    volumes:
      - vulos-data:/root/.vulos
    environment:
      - PORT=8080

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  vulos-data:
  node_modules:
