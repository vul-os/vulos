<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 280 143"
      role="img"
      aria-labelledby="hi-psync-title hi-psync-desc"
      preserveAspectRatio="xMidYMid meet"
      style="display:block;width:100%;height:auto"
      fill="none"
    >
      <title id="hi-psync-title">One person, many Vulos instances that sync as peers</title>
      <desc id="hi-psync-desc">
        A phone reaches, from anywhere, a group of instances you own — a home box
        and a laptop — that stay in sync with each other as equal peers.
      </desc>
      <g data-tone="secondary" color="#c9c9c9">
        <rect x="15" y="53" width="26" height="46" rx="5.5"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.55" />
        <rect x="18" y="59" width="20" height="32" rx="1.6" fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.32" />
        <rect x="24" y="55.5" width="8" height="1.3" rx="0.65" fill="currentColor" opacity="0.5" />
        <rect x="24" y="95.4" width="8" height="1.4" rx="0.7" fill="currentColor" opacity="0.45" />
        <rect x="20" y="62" width="16" height="3.2" rx="1" fill="currentColor" opacity="0.16" />
        <circle cx="22" cy="63.6" r="0.9" fill="currentColor" opacity="0.42" />
        <rect x="20" y="68.5" width="16" height="1.9" rx="0.95" fill="currentColor" opacity="0.28" />
        <rect x="20" y="73" width="10" height="1.9" rx="0.95" fill="currentColor" opacity="0.2" />
        <rect x="20" y="77.5" width="13" height="1.9" rx="0.95" fill="currentColor" opacity="0.2" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="28" y="114" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="6" letter-spacing="0.06em">Phone</text>
        <text fill="currentColor" x="28" y="123" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.8" opacity="0.75">any browser</text>
      </g>
      <g data-tone="ghost" color="#5a5a5a">
        <line x1="44" y1="78" x2="98" y2="78" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
        <path d="M96 75 L101 78 L96 81 Z" fill="currentColor" opacity="0.6" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="73" y="70" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" letter-spacing="0.04em">reach from anywhere</text>
      </g>
      <g data-tone="ghost" color="#5a5a5a">
        <rect x="104" y="30" width="160" height="94" rx="10"
              stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5 4" fill="none" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="112" y="24" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" letter-spacing="0.14em">INSTANCES YOU OWN</text>
      </g>
      <g data-tone="good" color="#2dd4bf">
        <rect x="118" y="58" width="52" height="34" rx="6"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.6" />
        <rect x="118" y="58" width="52" height="2.4" rx="1" fill="currentColor" opacity="0.6" />
        <circle cx="162" cy="66" r="2" fill="currentColor" />
        <rect x="126" y="70" width="20" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
        <rect x="126" y="76" width="14" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="144" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">home box</text>
        <text fill="currentColor" x="144" y="117" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">always-on</text>
      </g>
      <g data-tone="secondary" color="#c9c9c9">
        <rect x="204" y="60" width="40" height="26" rx="4"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
        <rect x="204" y="60" width="40" height="2.2" rx="1" fill="currentColor" opacity="0.5" />
        <path d="M200 90 L248 90 L244 86 L204 86 Z" fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="224" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">laptop</text>
        <text fill="currentColor" x="224" y="117" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">travels with you</text>
      </g>
      <g data-tone="accent" color="#2dd4bf">
        <line x1="172" y1="74" x2="202" y2="74"
              stroke="currentColor" stroke-width="1.4" stroke-opacity="0.9" />
        <path d="M178 71 L173 74 L178 77 Z" fill="currentColor" />
        <path d="M196 71 L201 74 L196 77 Z" fill="currentColor" />
        <text fill="currentColor" x="187" y="50" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5" font-weight="700" letter-spacing="0.04em">peer sync</text>
      </g>
    </svg>
