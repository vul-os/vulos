<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 280 170"
      role="img"
      aria-labelledby="hi-psync-title hi-psync-desc"
      preserveAspectRatio="xMidYMid meet"
      style="display:block;width:100%;height:auto"
      fill="none"
    >
      <title id="hi-psync-title">One person, many Vulos instances that sync as peers</title>
      <desc id="hi-psync-desc">
        A phone reaches, from anywhere, a group of instances you own — a home box
        and a laptop — that stay in sync with each other as equal peers.
      </desc>
      <g data-tone="secondary" color="#c9c9c9">
        <rect x="18" y="55" width="30" height="52" rx="6"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
        <rect x="18" y="55" width="30" height="2.4" rx="1" fill="currentColor" opacity="0.55" />
        <rect x="24" y="64" width="18" height="3" rx="1.5" fill="currentColor" opacity="0.5" />
        <rect x="24" y="71" width="12" height="3" rx="1.5" fill="currentColor" opacity="0.3" />
        <circle cx="33" cy="99" r="2.4" fill="currentColor" opacity="0.4" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="33" y="122" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="6" letter-spacing="0.06em">Phone</text>
        <text fill="currentColor" x="33" y="131" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5" opacity="0.75">anywhere · any browser</text>
      </g>
      <g data-tone="ghost" color="#5a5a5a">
        <line x1="50" y1="81" x2="92" y2="81" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
        <path d="M90 78 L95 81 L90 84 Z" fill="currentColor" opacity="0.6" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="71" y="75" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5" letter-spacing="0.04em">reach from anywhere</text>
      </g>
      <g data-tone="ghost" color="#5a5a5a">
        <rect x="98" y="34" width="166" height="98" rx="10"
              stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5 4" fill="none" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="108" y="28" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" letter-spacing="0.14em">INSTANCES YOU OWN</text>
      </g>
      <g data-tone="good" color="#2dd4bf">
        <rect x="116" y="66" width="52" height="34" rx="6"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.6" />
        <rect x="116" y="66" width="52" height="2.4" rx="1" fill="currentColor" opacity="0.6" />
        <circle cx="160" cy="74" r="2" fill="currentColor" />
        <rect x="124" y="78" width="20" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
        <rect x="124" y="84" width="14" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="142" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">home box</text>
        <text fill="currentColor" x="142" y="121" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">always-on</text>
      </g>
      <g data-tone="secondary" color="#c9c9c9">
        <rect x="200" y="68" width="40" height="26" rx="4"
              fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
        <rect x="200" y="68" width="40" height="2.2" rx="1" fill="currentColor" opacity="0.5" />
        <path d="M196 98 L244 98 L240 94 L200 94 Z" fill="#161616" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round" />
      </g>
      <g data-tone="faint" color="#7a7a7a">
        <text fill="currentColor" x="220" y="112" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">laptop</text>
        <text fill="currentColor" x="220" y="121" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">travels with you</text>
      </g>
      <g data-tone="accent" color="#2dd4bf">
        <line x1="168" y1="82" x2="200" y2="82"
              stroke="currentColor" stroke-width="1.4" stroke-opacity="0.9" />
        <path d="M174 79 L169 82 L174 85 Z" fill="currentColor" />
        <path d="M194 79 L199 82 L194 85 Z" fill="currentColor" />
        <text fill="currentColor" x="184" y="57" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5" font-weight="700" letter-spacing="0.04em">peer sync</text>
      </g>
    </svg>
