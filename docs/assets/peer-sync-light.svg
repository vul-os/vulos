<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 280 143"
     role="img"
     aria-labelledby="hi-psync-title hi-psync-desc"
     preserveAspectRatio="xMidYMid meet"
     style="display:block;width:100%;height:auto"
     fill="none"
   >
  <title id="hi-psync-title">One person, many Vulos instances that sync as peers</title>
  <desc id="hi-psync-desc">
    A phone reaches, from anywhere, a group of instances you own — an always-on
    home box and a laptop — that stay in sync with each other as equal peers.
    The home box is highlighted as the instance currently serving traffic.
  </desc>

  <defs>
    <!-- Chrome is clipped to its card so a square-cornered title bar cannot
         poke out past the card's rounded corners. -->
    <clipPath id="clip-box"><rect x="118" y="58" width="52" height="34" rx="6" /></clipPath>
    <clipPath id="clip-lap"><rect x="204" y="60" width="40" height="26" rx="4" /></clipPath>
    <clipPath id="clip-phone"><rect x="18" y="58" width="20" height="32" rx="1.6" /></clipPath>
  </defs>

  <!-- ── Phone ── -->
  <g data-tone="secondary" color="#3a352e">
    <rect x="15" y="52" width="26" height="46" rx="5.5"
          fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.55" />
    <rect x="18" y="58" width="20" height="32" rx="1.6"
          fill="none" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.32" />
    <rect x="24" y="54.5" width="8" height="1.3" rx="0.65" fill="currentColor" opacity="0.5" />
    <rect x="24" y="94.4" width="8" height="1.4" rx="0.7" fill="currentColor" opacity="0.45" />
    <g clip-path="url(#clip-phone)">
      <rect x="20" y="62" width="16" height="3.2" rx="1" fill="currentColor" opacity="0.16" />
      <circle cx="22" cy="63.6" r="0.9" fill="currentColor" opacity="0.42" />
      <rect x="20" y="68.5" width="16" height="1.9" rx="0.95" fill="currentColor" opacity="0.28" />
      <rect x="20" y="73" width="10" height="1.9" rx="0.95" fill="currentColor" opacity="0.2" />
      <rect x="20" y="77.5" width="13" height="1.9" rx="0.95" fill="currentColor" opacity="0.2" />
    </g>
  </g>
  <g data-tone="faint" color="#7c7264">
    <text fill="currentColor" x="28" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">Phone</text>
    <text fill="currentColor" x="28" y="117" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">any browser</text>
  </g>

  <!-- ── Reach: phone → the instances you own ── -->
  <g data-tone="ghost" color="#a49a89">
    <line x1="44" y1="75" x2="101" y2="75"
          stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
    <path d="M96 72 L101 75 L96 78 Z" fill="currentColor" opacity="0.6" />
  </g>
  <g data-tone="faint" color="#7c7264">
    <text fill="currentColor" x="72.5" y="68" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" letter-spacing="0.04em">reach from anywhere</text>
  </g>

  <!-- ── Container: instances you own ── -->
  <g data-tone="ghost" color="#a49a89">
    <rect x="104" y="30" width="158" height="94" rx="10"
          stroke="currentColor" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5 4" fill="none" />
  </g>
  <g data-tone="faint" color="#7c7264">
    <text fill="currentColor" x="112" y="24" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" letter-spacing="0.14em">INSTANCES YOU OWN</text>
  </g>

  <!-- ── Home box (the instance currently serving) ── -->
  <g data-tone="good" color="#0d9488">
    <rect x="118" y="58" width="52" height="34" rx="6"
          fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.6" />
    <g clip-path="url(#clip-box)">
      <rect x="118" y="58" width="52" height="3" fill="currentColor" opacity="0.55" />
    </g>
    <circle cx="162" cy="66" r="2" fill="currentColor" />
    <rect x="126" y="70" width="20" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
    <rect x="126" y="76" width="14" height="2.4" rx="1.2" fill="currentColor" opacity="0.4" />
  </g>
  <g data-tone="faint" color="#7c7264">
    <text fill="currentColor" x="144" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">home box</text>
    <text fill="currentColor" x="144" y="117" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">always-on</text>
  </g>

  <!-- ── Laptop ── -->
  <g data-tone="secondary" color="#3a352e">
    <rect x="204" y="60" width="40" height="26" rx="4"
          fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
    <g clip-path="url(#clip-lap)">
      <rect x="204" y="60" width="40" height="2.6" fill="currentColor" opacity="0.45" />
    </g>
    <rect x="210" y="69" width="16" height="2.1" rx="1.05" fill="currentColor" opacity="0.3" />
    <rect x="210" y="74" width="11" height="2.1" rx="1.05" fill="currentColor" opacity="0.22" />
    <path d="M204 86 L244 86 L246.8 88.8 A1.2 1.2 0 0 1 245.6 90 L202.4 90 A1.2 1.2 0 0 1 201.2 88.8 Z"
          fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" stroke-linejoin="round" />
    <rect x="219" y="87.4" width="10" height="1.1" rx="0.55" fill="currentColor" opacity="0.3" />
  </g>
  <g data-tone="faint" color="#7c7264">
    <text fill="currentColor" x="224" y="108" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.5" font-weight="700">laptop</text>
    <text fill="currentColor" x="224" y="117" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.6" opacity="0.8">travels with you</text>
  </g>

  <!-- ── Peer sync: equal, bidirectional ── -->
  <g data-tone="accent" color="#0d9488">
    <line x1="172" y1="75" x2="198" y2="75"
          stroke="currentColor" stroke-width="1.4" stroke-opacity="0.9" />
    <path d="M177 72 L172 75 L177 78 Z" fill="currentColor" />
    <path d="M193 72 L198 75 L193 78 Z" fill="currentColor" />
    <!-- The gap between the two instances is only 30px wide, which is
         narrower than this label. Sitting it in the gap crowds both devices, so
         it rides above them where it has clear air. -->
    <text fill="currentColor" x="185" y="52" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5" font-weight="700" letter-spacing="0.04em">peer sync</text>
  </g>
</svg>
