<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="pl-title pl-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="pl-title">One person, many Vulos instances</title>
  <desc id="pl-desc">Your phone reaches your own Vulos instances from anywhere. A home box and a laptop that you own stay in sync as peers.</desc>

  <!-- reach-from-anywhere connector: phone -> your instances -->
  <line x1="152" y1="169" x2="330" y2="169" stroke="#8b93a7" stroke-width="1.6" stroke-dasharray="1 6" stroke-linecap="round"/>
  <polygon points="340,169 328,163 328,175" fill="#5b6cff"/>
  <g>
    <rect x="182" y="139" width="130" height="23" rx="11.5" fill="#eef0ff" stroke="#5b6cff" stroke-width="1.2"/>
    <text x="247" y="154.5" text-anchor="middle" font-size="12" font-weight="600" fill="#4453d6">reach from anywhere</text>
    <text x="247" y="190" text-anchor="middle" font-size="11" fill="#5b6478">even behind NAT</text>
  </g>

  <!-- Phone -->
  <g>
    <rect x="70" y="94" width="78" height="150" rx="16" fill="#ffffff" stroke="#dbe0ec" stroke-width="1.5"/>
    <rect x="79" y="112" width="60" height="104" rx="7" fill="#eef1f8"/>
    <line x1="99" y1="104" x2="119" y2="104" stroke="#dbe0ec" stroke-width="2" stroke-linecap="round"/>
    <rect x="86" y="122" width="46" height="8" rx="3" fill="#5b6cff"/>
    <rect x="86" y="136" width="30" height="8" rx="3" fill="#cdd4e4"/>
    <rect x="86" y="154" width="46" height="44" rx="6" fill="none" stroke="#5b6cff" stroke-width="1.2" opacity="0.7"/>
    <rect x="99" y="228" width="20" height="4" rx="2" fill="#cdd4e4"/>
    <text x="109" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2230">Phone</text>
    <text x="109" y="282" text-anchor="middle" font-size="11" fill="#5b6478">browser or app</text>
  </g>

  <!-- Your instances group -->
  <rect x="340" y="70" width="520" height="250" rx="22" fill="none" stroke="#5b6cff" stroke-width="1.4" stroke-dasharray="7 6" opacity="0.45"/>
  <text x="362" y="99" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#4453d6">YOUR VULOS &#183; INSTANCES YOU OWN</text>

  <!-- peer-sync connector -->
  <line x1="524" y1="166" x2="664" y2="166" stroke="#8b93a7" stroke-width="1.8"/>
  <polygon points="512,166 524,160 524,172" fill="#8b93a7"/>
  <polygon points="676,166 664,160 664,172" fill="#8b93a7"/>
  <rect x="551" y="145" width="86" height="23" rx="11.5" fill="#eef0ff" stroke="#5b6cff" stroke-width="1.2"/>
  <text x="594" y="160.5" text-anchor="middle" font-size="12" font-weight="600" fill="#4453d6">peer sync</text>
  <text x="594" y="192" text-anchor="middle" font-size="11" fill="#5b6478">CRDT &#183; Ed25519 identity</text>

  <!-- Home box -->
  <g>
    <rect x="372" y="124" width="136" height="84" rx="12" fill="#ffffff" stroke="#dbe0ec" stroke-width="1.5"/>
    <rect x="386" y="138" width="108" height="24" rx="5" fill="#f4f6fb" stroke="#e2e7f0" stroke-width="1"/>
    <rect x="386" y="170" width="108" height="24" rx="5" fill="#f4f6fb" stroke="#e2e7f0" stroke-width="1"/>
    <circle cx="480" cy="150" r="4" fill="#22b07d"/>
    <circle cx="480" cy="182" r="4" fill="#5b6cff"/>
    <rect x="396" y="146" width="26" height="4" rx="2" fill="#cdd4e4"/>
    <rect x="396" y="178" width="26" height="4" rx="2" fill="#cdd4e4"/>
    <text x="440" y="234" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2230">Home box</text>
    <text x="440" y="252" text-anchor="middle" font-size="11" fill="#5b6478">always-on &#183; serves your traffic</text>
  </g>

  <!-- Laptop -->
  <g>
    <rect x="684" y="126" width="120" height="76" rx="9" fill="#ffffff" stroke="#dbe0ec" stroke-width="1.5"/>
    <rect x="692" y="134" width="104" height="54" rx="5" fill="#eef1f8"/>
    <rect x="700" y="142" width="50" height="7" rx="3" fill="#5b6cff"/>
    <rect x="700" y="154" width="34" height="7" rx="3" fill="#cdd4e4"/>
    <rect x="700" y="168" width="88" height="14" rx="4" fill="none" stroke="#e2e7f0" stroke-width="1"/>
    <path d="M676 204 H812 L824 222 Q826 226 820 226 H668 Q662 226 664 222 Z" fill="#ffffff" stroke="#dbe0ec" stroke-width="1.5"/>
    <rect x="726" y="212" width="36" height="4" rx="2" fill="#dbe0ec"/>
    <text x="744" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2230">Laptop</text>
    <text x="744" y="268" text-anchor="middle" font-size="11" fill="#5b6478">travels with you</text>
  </g>
</svg>
