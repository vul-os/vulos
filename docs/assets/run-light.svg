<svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 280 170"
      role="img"
      aria-labelledby="hi-run-title hi-run-desc"
      preserveAspectRatio="xMidYMid meet"
      style="display:block;width:100%;height:auto"
      fill="none"
    >
      <title id="hi-run-title">One signed binary, three ways to run it</title>
      <desc id="hi-run-desc">A single signed Vulos image runs on a mini-PC you flash, a spare laptop you boot, or a rented server you deploy to.</desc>
      <g data-tone="accent" color="#0d9488">
        <rect x="98" y="14" width="84" height="24" rx="7" fill="#efebe3" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.85" />
        <circle cx="112" cy="26" r="3" fill="currentColor" />
        <text fill="currentColor" x="124" y="24" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="6" font-weight="700">one Go binary</text>
        <text fill="currentColor" x="124" y="32.5" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.8" opacity="0.8">one signed image</text>
      </g>
      <g data-tone="ghost" color="#a49a89">
        <path d="M140 38 C140 58 58 52 58 74" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" fill="none" />
        <path d="M140 38 C140 58 140 52 140 74" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" fill="none" />
        <path d="M140 38 C140 58 222 52 222 74" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4" fill="none" />
      </g>
      <g data-tone="secondary" color="#3a352e">
        <rect x="34" y="76" width="48" height="34" rx="6" fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
        <rect x="116" y="76" width="48" height="34" rx="6" fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
        <rect x="198" y="76" width="48" height="34" rx="6" fill="#efebe3" stroke="currentColor" stroke-width="1" stroke-opacity="0.5" />
      </g>
      <g data-tone="ghost" color="#a49a89">
        <rect x="49" y="86" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" fill="none" />
        <line x1="53" y1="90" x2="53" y2="96" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" />
        <line x1="58" y1="90" x2="58" y2="96" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" />
        <rect x="132" y="86" width="16" height="10" rx="1.6" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" fill="none" />
        <path d="M129 100 L151 100 L149 97 L131 97 Z" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" stroke-linejoin="round" fill="none" />
        <rect x="213" y="85" width="18" height="7" rx="1.4" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" fill="none" />
        <rect x="213" y="94" width="18" height="7" rx="1.4" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" fill="none" />
        <circle cx="217" cy="88.5" r="0.9" fill="currentColor" />
        <circle cx="217" cy="97.5" r="0.9" fill="currentColor" />
      </g>
      <g data-tone="primary" color="#1c1a17">
        <text fill="currentColor" x="58" y="124" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.8" font-weight="700">Mini-PC</text>
        <text fill="currentColor" x="140" y="124" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.8" font-weight="700">Spare laptop</text>
        <text fill="currentColor" x="222" y="124" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="5.8" font-weight="700">Rented server</text>
      </g>
      <g data-tone="faint" color="#7c7264">
        <text fill="currentColor" x="58" y="133" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.7" opacity="0.85">flash the image</text>
        <text fill="currentColor" x="140" y="133" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.7" opacity="0.85">boot &amp; keep on</text>
        <text fill="currentColor" x="222" y="133" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace" font-size="4.7" opacity="0.85">deploy in one command</text>
      </g>
    </svg>
